<style>

<script>
// ---------- Constants ----------
const thisYearNum = new Date().getFullYear();
const STORE_KEY = "fiTrackerData_v1";
const DEFAULT_CATEGORIES = {
  income: ["Reddito principale","Interessi","Altro"],
  expenses: ["Palestra","Assicurazione auto","Tasse auto","Caffè ufficio","Bar","Acqua","Luce","Telefono","Riparazioni auto","Tagliando auto","Supermercato","Gite/concerti","Vestiti","Vacanze","Ristoranti/uscite","Arredamento casa","Auto (acquisto)","Altro"],
  portfolio: ["Banca","Cash","Fondo pensione","Obbligazione statale 7Y","Obbligazione statale 10Y","Obbligazione statale 15Y","Obbligazione statale 20Y","Deposito","Fondo azionario","Prestito/Debito","Altro"]
};
const DEFAULT_DATA = {
  settings: { fx: 93.5, fxUsd: 82, savingsRateTarget: 70, expenseGrowth: 75000, incomeGrowth2y: 70000, centralRet: 2, horizon: 20, expenseBase: 1160000, startYear: thisYearNum, pinHash: null, planBaselineYear: null, planBaselineSetDate: null, hfToken: "", hfModel: "Qwen/Qwen3.5-9B", nextSecurityCodeSeq: 1, withdrawalRate: 4, fireExpenseBaseMode: "budget", fireRatesText: "4,3,2", displayCurrency: "ALL" },
  income: [],
  expenses: [],
  portfolio: [],
  categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
  categoryBudgets: { income: {}, expenses: {}, portfolio: {} },
  macroCategories: { income: [], expenses: [], portfolio: [] },
  categoryMacroMap: { income: {}, expenses: {}, portfolio: {} },
  recurring: { income: [], expenses: [], portfolio: [] },
  snapshots: [],
  fxHistory: [],
  paymentTypes: ["Banca", "Cash", "Carta di Credito"],
  creditCardSettings: {},
  creditCardDebts: []
};

// ---------- Storage ----------
function loadData() {
  const base = JSON.parse(JSON.stringify(DEFAULT_DATA));
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return base;
    const parsed = JSON.parse(raw);
    return {
      settings: Object.assign({}, base.settings, parsed.settings || {}),
      income: parsed.income || [],
      expenses: parsed.expenses || [],
      portfolio: parsed.portfolio || [],
      categories: {
        income: (parsed.categories && parsed.categories.income) || base.categories.income,
        expenses: (parsed.categories && parsed.categories.expenses) || base.categories.expenses,
        portfolio: (parsed.categories && parsed.categories.portfolio) || base.categories.portfolio
      },
      categoryBudgets: {
        income: (parsed.categoryBudgets && parsed.categoryBudgets.income) || {},
        expenses: (parsed.categoryBudgets && parsed.categoryBudgets.expenses) || {},
        portfolio: (parsed.categoryBudgets && parsed.categoryBudgets.portfolio) || {}
      },
      macroCategories: {
        income: (parsed.macroCategories && parsed.macroCategories.income) || [],
        expenses: (parsed.macroCategories && parsed.macroCategories.expenses) || [],
        portfolio: (parsed.macroCategories && parsed.macroCategories.portfolio) || []
      },
      categoryMacroMap: {
        income: (parsed.categoryMacroMap && parsed.categoryMacroMap.income) || {},
        expenses: (parsed.categoryMacroMap && parsed.categoryMacroMap.expenses) || {},
        portfolio: (parsed.categoryMacroMap && parsed.categoryMacroMap.portfolio) || {}
      },
      recurring: {
        income: (parsed.recurring && parsed.recurring.income) || [],
        expenses: (parsed.recurring && parsed.recurring.expenses) || [],
        portfolio: (parsed.recurring && parsed.recurring.portfolio) || []
      },
      snapshots: parsed.snapshots || [],
      fxHistory: parsed.fxHistory || [],
      paymentTypes: (parsed.paymentTypes && parsed.paymentTypes.length) ? parsed.paymentTypes : base.paymentTypes,
      creditCardSettings: parsed.creditCardSettings || {},
      creditCardDebts: parsed.creditCardDebts || []
    };
  } catch (e) { return base; }
}
function saveData() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); scheduleAutoUpload(); }
function persistLocalOnly() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
let autoUploadTimer = null;
function scheduleAutoUpload() {
  if (!gDriveToken) return;
  clearTimeout(autoUploadTimer);
  autoUploadTimer = setTimeout(()=> silentUploadToDrive(), 2500);
}
let data = loadData();

const fmt = n => Math.round(n).toLocaleString("it-IT");
function fmtDisplay(nALL) {
  const cur = (data.settings.displayCurrency) || "ALL";
  const symbols = { ALL: "ALL", EUR: "€", USD: "$" };
  let converted = nALL;
  if (cur === "EUR") converted = nALL / data.settings.fx;
  else if (cur === "USD") converted = nALL / data.settings.fxUsd;
  return `${Math.round(converted).toLocaleString("it-IT")} ${symbols[cur]}`;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function localDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function canGenerateOnDate(dateStr) {
  if (dateStr < localDateStr(new Date())) return true;
  if (dateStr > localDateStr(new Date())) return false;
  return new Date().getHours() >= 16;
}
function localMonthStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
const thisYear = thisYearNum;
const now = new Date();
const todayISO = localDateStr(now);
const thisMonth = localMonthStr(now);
const lastMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
const lastMonthStr = localMonthStr(lastMonthDate);
const lastYear = thisYear - 1;

// ---------- Totals ----------
function yearTotal(arr, year) { return arr.filter(e => new Date(e.date).getFullYear() === year).reduce((s,e)=>s+Number(e.amount),0); }
function monthTotal(arr, monthStr) { return arr.filter(e => e.date.slice(0,7) === monthStr).reduce((s,e)=>s+Number(e.amount),0); }
function dayTotal(arr, dayStr) { return arr.filter(e => e.date === dayStr).reduce((s,e)=>s+Number(e.amount),0); }
function toALL(amount, currency) {
  if (currency === "EUR") return amount * data.settings.fx;
  if (currency === "USD") return amount * data.settings.fxUsd;
  return amount;
}
function isCreditCardType(type) {
  if (!type) return false;
  if (data.creditCardSettings && data.creditCardSettings[type]) return true;
  return data.paymentTypes.includes(type) && type !== "Banca" && type !== "Cash";
}
function isDebtType(type, macro) {
  const m = (macro||(data.categoryMacroMap.portfolio && data.categoryMacroMap.portfolio[type])||"").toLowerCase();
  const t = (type||"").toLowerCase();
  return m.includes("debit") || t.includes("debit") || t.includes("prestito");
}
function isExcludedFromNetWorth(p) {
  return isDebtType(p.type, p.macro);
}
function isExcludedFromAllocationChart(p) {
  return isCreditCardType(p.type) || isDebtType(p.type, p.macro);
}
function ccAvailableCredit(cardName) {
  const cc = data.creditCardSettings[cardName];
  if (!cc) return Infinity;
  const netBalance = data.portfolio.filter(p=>p.type===cardName).reduce((s,p)=>s+p.amount,0);
  const used = Math.max(0, -netBalance);
  return (cc.limit||0) - used;
}
function portfolioTotalALL() { return data.portfolio.reduce((s,p)=> isExcludedFromNetWorth(p) ? s : s + toALL((p.marketValue!==undefined && p.marketValue!==null && p.marketValue!=="") ? Number(p.marketValue) : p.amount, p.currency), 0); }
function annualBudgetForYear(y) { const s = data.settings; return s.expenseBase + s.expenseGrowth * (y - s.startYear); }

function normalizedEntries(group, catName) {
  if (group === "portfolio") {
    return data.portfolio.filter(p => p.type === catName && p.date).map(p => ({ date: p.date, amount: toALL(p.amount, p.currency) }));
  }
  return data[group].filter(e => e.category === catName).map(e => ({ date: e.date, amount: Number(e.amount) }));
}
function sumForDate(entries, d) { return entries.filter(e => e.date === d).reduce((s,e)=>s+e.amount,0); }
function sumForMonth(entries, m) { return entries.filter(e => e.date.slice(0,7) === m).reduce((s,e)=>s+e.amount,0); }
function sumForYear(entries, y) { return entries.filter(e => new Date(e.date).getFullYear() === y).reduce((s,e)=>s+e.amount,0); }

function usageCounts(group) {
  const counts = {};
  const arr = group === "portfolio" ? data.portfolio.map(p=>p.type) : data[group].map(e=>e.category);
  arr.forEach(c => counts[c] = (counts[c]||0)+1);
  return counts;
}

const FREQUENCIES = [
  {key:"monthly", label:"Mensile", months:1},
  {key:"quarterly", label:"Trimestrale", months:3},
  {key:"semiannual", label:"Semestrale", months:6},
  {key:"annual", label:"Annuale", months:12},
  {key:"biennial", label:"Biennale", months:24}
];
function freqLabel(key) { return (FREQUENCIES.find(f=>f.key===key)||FREQUENCIES[0]).label; }
function shouldGenerateForMonth(rule, year, month) {
  const freq = FREQUENCIES.find(f=>f.key===(rule.frequency||"monthly")) || FREQUENCIES[0];
  const start = rule.startMonth || thisMonth;
  const [sy, sm] = start.split("-").map(Number);
  const monthsSinceStart = (year - sy)*12 + (month - sm);
  return monthsSinceStart >= 0 && monthsSinceStart % freq.months === 0;
}
function shouldGenerateThisMonth(rule) {
  return shouldGenerateForMonth(rule, thisYearNum, now.getMonth()+1);
}

function createLiquidityAdjustment(paymentType, signedAmountALL, date, note, linkedTxnId) {
  if (!paymentType) return null;
  const id = uid();
  data.portfolio.push({ id, type: paymentType, macro: (data.categoryMacroMap.portfolio && data.categoryMacroMap.portfolio[paymentType]) || null, amount: signedAmountALL, currency: "ALL", marketValue: null, date, maturityDate: null, note: note||"", linkedTxnId });
  return id;
}
function removeLiquidityAdjustment(linkedTxnId) {
  data.portfolio = data.portfolio.filter(p => p.linkedTxnId !== linkedTxnId);
}
function resyncLiquidityAdjustment(txnId, paymentType, signedAmount, date, note) {
  removeLiquidityAdjustment(txnId);
  if (paymentType) createLiquidityAdjustment(paymentType, signedAmount, date, note, txnId);
}

function ensureBondDepositCategories() {
  let changed = false;
  const ensureCat = (group, cat) => { if (!data.categories[group].includes(cat)) { data.categories[group].push(cat); changed = true; } };
  ensureCat("income", "Cedola e le info");
  ensureCat("income", "Capital gain obbligazioni");
  ensureCat("income", "Interesse deposito");
  ensureCat("expenses", "Commissione collocamento titoli");
  ensureCat("expenses", "Commissione disbursement cedola");
  ensureCat("expenses", "Commissione vendita titoli");
  ensureCat("expenses", "Commissione titoli custodia");
  ensureCat("income", "Capital gain fondi");
  ensureCat("expenses", "Tassazione capital gain fondi");
  if (data.categoryMacroMap.income["Capital gain fondi"] !== "Interessi da Titoli - Standard") { data.categoryMacroMap.income["Capital gain fondi"] = "Interessi da Titoli - Standard"; changed = true; }
  if (!data.categoryMacroMap.expenses) data.categoryMacroMap.expenses = {};
  if (data.categoryMacroMap.expenses["Tassazione capital gain fondi"] !== "Tassazione da Titoli - Standard") { data.categoryMacroMap.expenses["Tassazione capital gain fondi"] = "Tassazione da Titoli - Standard"; changed = true; }
  if (!data.macroCategories.income.includes("Interessi da Titoli - Standard")) { data.macroCategories.income.push("Interessi da Titoli - Standard"); changed = true; }
  if (!data.macroCategories.expenses.includes("Tassazione da Titoli - Standard")) { data.macroCategories.expenses.push("Tassazione da Titoli - Standard"); changed = true; }
  if (!data.categoryMacroMap.income) data.categoryMacroMap.income = {};
  ["Cedola e le info","Capital gain obbligazioni","Interesse deposito"].forEach(c=>{

function autoGenerateSecurityIncome() {

    const isBondCoupon = typeLower.includes("obbligazione") && p.bondMode === "cedola";
    const isDepositCoupon = typeLower.includes("deposito") && p.depositMode === "cedola";
    if (!isBondCoupon && !isDepositCoupon) return;
    if (p.maturityDate && new Date(p.maturityDate) < now) return;
    const freqKey = p.couponFrequency || "annual";
    const freqObj = FREQUENCIES.find(f => f.key === freqKey) || FREQUENCIES.find(f => f.key === "annual");
    const scheduleAnchorDate = p.issueDate || p.date;
    const rule = { frequency: freqKey, startMonth: p.startMonth || localMonthStr(new Date(scheduleAnchorDate)), dayOfMonth: new Date(scheduleAnchorDate).getDate() };
    if (!shouldGenerateThisMonth(rule)) return;
    const already = data.income.some(i => i.linkedBondId === p.id && i.date.slice(0,7) === thisMonth);
    if (already) return;

    const day = Math.min(rule.dayOfMonth || 1, daysInMonth);
    const dateStr = `${thisMonth}-${String(day).padStart(2,"0")}`;
    if (dateStr < p.date) return;

    const nominal = p.amount;
    const rate = isBondCoupon ? (Number(p.couponRate)||0) : (Number(p.depositRate)||0);
    const paymentsPerYear = 12 / freqObj.months;
    const grossAmt = nominal * rate/100 / paymentsPerYear;
    const taxRate = isBondCoupon ? (Number(p.bondTaxRate)||15) : (Number(p.depositTaxRate)||15);
    const taxAmt = grossAmt * taxRate/100;
    const commAmt = isBondCoupon ? computeCommissionAmount(p.couponCommissionType, p.couponCommissionValue, grossAmt) : 0;
    const netAmt = grossAmt - taxAmt - commAmt;
    const cat = isBondCoupon ? "Cedola e le info" : "Interesse deposito";
    const taxCat = isBondCoupon ? ensureBondTaxCategory(p.bondYears) : ensureDepositTaxCategory(p.depositYears);
    const code = p.securityCode || "";
    const incId = uid();
    data.income.push({ id: incId, date: dateStr, amount: grossAmt, category: cat, macro: "Interessi da Titoli - Standard", paymentType: null, note: code, linkedBondId: p.id, securityCode: code||null });
    data.expenses.push({ id: uid(), date: dateStr, amount: taxAmt, category: taxCat, macro: "Tassazione da Titoli - Standard", note: code, securityCode: code||null });
    if (commAmt > 0) data.expenses.push({ id: uid(), date: dateStr, amount: commAmt, category: "Commissione disbursement cedola", note: code, securityCode: code||null });
    createLiquidityAdjustment("Banca", netAmt, dateStr, `${cat} netta ${code}`.trim(), incId);
    changed = true;
  });

}

function addMonthsToDate(dateStr, n) {
  const d = new Date(dateStr);
  const targetMonthIdx = d.getMonth() + n;
  const daysInTarget = new Date(d.getFullYear(), targetMonthIdx+1, 0).getDate();
  return localDateStr(new Date(d.getFullYear(), targetMonthIdx, Math.min(d.getDate(), daysInTarget)));
}
function computeLoanSchedule(principal, annualRatePct, termMonths, method, firstDueDate) {
  const r = (annualRatePct||0)/100/12;
  const schedule = [];
  let balance = principal;
  if (method === "italiana") {
    const capitalPerMonth = principal / termMonths;
    for (let i=1; i<=termMonths; i++) {
      const interest = balance * r;
      let capital = (i===termMonths) ? balance : capitalPerMonth;
      balance -= capital;
      schedule.push({ month:i, capital, interest, dueDate: addMonthsToDate(firstDueDate, i-1), processed:false });
    }
  } else {
    const payment = r>0 ? principal*r/(1-Math.pow(1+r,-termMonths)) : principal/termMonths;
    for (let i=1; i<=termMonths; i++) {
      const interest = balance*r;
      let capital = payment-interest;
      if (i===termMonths || capital>balance) capital = balance;
      balance -= capital;
      schedule.push({ month:i, capital, interest, dueDate: addMonthsToDate(firstDueDate, i-1), processed:false });
    }
  }
  return schedule;
}
function processLoanInstallments() {
  let changed = false;
  data.portfolio.forEach(p => {
    if (!p.schedule || isCreditCardType(p.type) || !isDebtType(p.type, p.macro)) return;

}

function processCreditCardBilling() {
  let changed = false;
  Object.keys(data.creditCardSettings||{}).forEach(cardName => {
    const cc = data.creditCardSettings[cardName];
    if (!cc || !cc.dueDay) return;
    const prevMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const billingMonthStr = localMonthStr(prevMonthDate);
    const alreadyBilled = (data.creditCardDebts||[]).some(d => d.paymentType===cardName && d.billingMonth===billingMonthStr);
    if (alreadyBilled) return;
    const daysInThisMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const dueDateThisMonth = new Date(now.getFullYear(), now.getMonth(), Math.min(cc.dueDay, daysInThisMonth));
    if (now < dueDateThisMonth) return;
    const stillOwed = Math.max(0, -data.portfolio.filter(p=>p.type===cardName && p.date && p.date.slice(0,7)===billingMonthStr).reduce((s,p)=>s+p.amount,0));
    if (stillOwed <= 0) return;
    const n = Math.max(1, cc.installments || 1);
    const rMonthly = (cc.interestRate||0)/100/12;
    let payment = rMonthly > 0 ? stillOwed * rMonthly / (1 - Math.pow(1+rMonthly, -n)) : stillOwed/n;
    let balance = stillOwed;
    const schedule = [];
    let totalInterest = 0;
    for (let i=1; i<=n; i++) {
      const interest = balance * rMonthly;
      let capital = payment - interest;
      if (i === n || capital > balance) capital = balance;
      balance -= capital;
      totalInterest += interest;
      const targetMonthIdx = now.getMonth() + i;
      const daysInTarget = new Date(now.getFullYear(), targetMonthIdx+1, 0).getDate();
      const dueDate = new Date(now.getFullYear(), targetMonthIdx, Math.min(cc.dueDay, daysInTarget));
      schedule.push({ dueDate: localDateStr(dueDate), capital, interest });
    }
    const billingDate = localDateStr(dueDateThisMonth);
    if (totalInterest > 0.005) {
      createLiquidityAdjustment(cardName, -totalInterest, billingDate, `Interessi su utilizzo non ripagato (${billingMonthStr})`, uid());
      const interestCat = "Interessi carta di credito";
      if (!data.categories.expenses.includes(interestCat)) data.categories.expenses.push(interestCat);
      data.expenses.push({ id: uid(), date: billingDate, amount: totalInterest, category: interestCat, paymentType: null, note: `${cardName} · utilizzo ${billingMonthStr} non ripagato` });
    }
    data.creditCardDebts = data.creditCardDebts || [];
    data.creditCardDebts.push({ id: uid(), paymentType: cardName, billingMonth: billingMonthStr, principal: stillOwed, totalInterest, schedule });
    changed = true;
  });
  if (changed) saveData();
}

function autoMatureBondsAndDeposits() {

      const redemptionPrice = Number(p.redemptionPrice)||100;
      const valoreTotale = nominal * redemptionPrice/100;
      const costo = nominal * purchasePrice/100;
      const capitalGainLordo = valoreTotale - costo;
      const taxRate = Number(p.bondTaxRate)||15;
      const tassazione = capitalGainLordo>0 ? capitalGainLordo*taxRate/100 : 0;
      const capitalGainNetto = capitalGainLordo - tassazione;
      const saleId = uid();
      data.portfolio.push({ id: uid(), type: p.type, macro: p.macro||null, amount: -nominal, currency: p.currency, marketValue: null, date: p.maturityDate, maturityDate: null, note: `Rimborso a scadenza ${code}`.trim() });

      changed = true;
    }
  });

async function hashPin(pin) {
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ---------- FI projection ----------
function project(wealth0, income0, savingsRate, expense0, expenseGrowth, incomeGrowth2y, ret, horizon, withdrawalRate) {
  const multiplier = 100 / (withdrawalRate || 4);
  const rows = []; let wealth = wealth0; let income = income0; let hitYear = null; let hitYearFrac = null;
  for (let y=1; y<=horizon; y++) {
    if (y>1 && (y-1)%2===0) income += incomeGrowth2y;
    const expense = expense0 + expenseGrowth*(y-1);
    const contribution = income * savingsRate;
    const wealthStart = wealth;
    wealth = wealth*(1+ret) + contribution;
    const target = expense*multiplier;
    if (!hitYear && wealth >= target) {
      hitYear = y;
      const range = wealth - wealthStart;
      const frac = range > 0 ? Math.max(0, Math.min(1, (target - wealthStart) / range)) : 0;
      hitYearFrac = (y - 1) + frac;
    }
    rows.push({year:y, wealth, expense, target});
  }
  return {rows, hitYear, hitYearFrac};
}

const MONTH_LABELS = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
function computeYearlyPeaks() {
  const monthlyBudget = annualBudgetForYear(thisYear)/12;
  const recurringRules = data.recurring.expenses || [];
  const avgRecurring = recurringRules.reduce((sum,r)=> sum + Number(r.amount) / (FREQUENCIES.find(f=>f.key===(r.frequency||"monthly"))||FREQUENCIES[0]).months, 0);
  const baseMonthly = Math.max(0, monthlyBudget - avgRecurring);
  const months = [];
  for (let m=1; m<=12; m++) {
    const hit = recurringRules.filter(r=>shouldGenerateForMonth(r, thisYear, m)).reduce((sum,r)=>sum+Number(r.amount),0);
    const monthStr = `${thisYear}-${String(m).padStart(2,"0")}`;
    const actual = monthTotal(data.expenses, monthStr);
    months.push({ m, label: MONTH_LABELS[m-1], base: baseMonthly, recurring: hit, projected: baseMonthly+hit, actual });
  }
  return months;
}

function budgetBlock(label, spent, budget) {
  const pct = budget > 0 ? (spent/budget*100) : 0;
  return `<div class="budget-block">
    <div class="budget-head"><span class="l">${label}</span><span>${fmtDisplay(spent)} / ${fmtDisplay(budget)}</span></div>
    <div class="bar-bg"><div class="bar-fg" style="width:${Math.min(pct,100)}%; background:${barColor(pct)};"></div></div>
  </div>`;
}

// ---------- Category select ----------
function categorySelect(groupKey, selected, filterFn) {
  const counts = usageCounts(groupKey);
  let cats = [...data.categories[groupKey]].sort((a,b)=> (counts[b]||0)-(counts[a]||0));
  if (filterFn) cats = cats.filter(filterFn);
  const opts = cats.map(c => `<option ${c===selected?'selected':''}>${c}</option>`).join('');
  return `<select class="cat-select" data-group="${groupKey}">${opts}<option value="__new__">+ Nuova categoria...</option></select>`;
}
function bindCategorySelects() {
  document.querySelectorAll(".cat-select").forEach(sel => {
    sel.addEventListener("change", () => {
      if (sel.value === "__new__") {
        const name = window.prompt("Nome nuova categoria:");
        if (name && name.trim()) {
          const g = sel.dataset.group;
          if (!data.categories[g].includes(name.trim())) { data.categories[g].push(name.trim()); saveData(); }
          const opt = document.createElement("option");
          opt.value = name.trim(); opt.textContent = name.trim();
          sel.insertBefore(opt, sel.lastElementChild);
          sel.value = name.trim();
        } else { sel.selectedIndex = 0; }
      }
    });
  });
}

// ---------- Streak ----------
function budgetStreak() {
  let streak = 0;
  let cursor = new Date(now.getFullYear(), now.getMonth()-1, 1); // start from last full month
  while (true) {
    const mStr = localMonthStr(cursor);
    const actual = monthTotal(data.expenses, mStr);
    if (actual === 0) break; // no data that far back, stop counting
    const y = cursor.getFullYear();
    const budget = annualBudgetForYear(y) / 12;
    if (actual <= budget) { streak++; cursor.setMonth(cursor.getMonth()-1); }
    else break;
  }
  return streak;
}

function extractAmountFromText(text) {
  const lines = text.split(/\n/);
  const priceRe = /(\d{1,3}(?:[.\s]\d{3})*|\d+)[,.](\d{2})\b|\b\d{2,7}\b/g;
  let candidates = [];
  lines.forEach(line => {
    const isTotalLine = /total|totale|shuma|paguar/i.test(line);
    const matches = line.match(/[\d.,]{2,}/g) || [];
    matches.forEach(m => {
      const val = parseFlexibleAmount(m);
      if (!isNaN(val) && val > 0) candidates.push({ val, isTotalLine });
    });
  });
  if (candidates.length === 0) return null;
  const totalLineCandidates = candidates.filter(c=>c.isTotalLine);
  const pool = totalLineCandidates.length ? totalLineCandidates : candidates;
  return pool.reduce((max,c)=> c.val > max.val ? c : max, pool[0]).val;
}
function extractDateFromText(text) {
  const m = text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (!m) return null;
  let [_, d, mo, y] = m;
  if (y.length === 2) y = "20"+y;
  const dateStr = `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const parsed = new Date(dateStr);
  if (isNaN(parsed) || parsed > new Date()) return null;
  return dateStr;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function compressImageToBase64(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL("image/jpeg", quality || 0.7);
      resolve(dataUrl.split(",")[1]);
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function callHuggingFaceOnce(file) {
  const s = data.settings;
  const base64 = await compressImageToBase64(file, 1024, 0.7);
  const mimeType = "image/jpeg";
  const prompt = `Leggi questo scontrino/ricevuta. Rispondi SOLO con un oggetto JSON valido, senza testo aggiuntivo, markdown o spiegazioni, in questo formato esatto: {"amount": numero, "date": "YYYY-MM-DD", "category": "una parola tra Supermercato, Ristoranti, Bar, Trasporti, Salute, Abbigliamento, Casa, Altro"}. Se non riesci a leggere un campo, usa null per quel campo.`;
  const res = await fetch("https://router.huggingface.co/v1/chat/completions", {
    method: "POST",
    headers: { Authorization: `Bearer ${s.hfToken}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      model: s.hfModel || "Qwen/Qwen3.5-9B",
      messages: [{
        role: "user",
        content: [
          { type: "text", text: prompt },
          { type: "image_url", image_url: { url: `data:${mimeType};base64,${base64}` } }
        ]
      }],
      max_tokens: 400
    })
  });
  if (!res.ok) { const bodyText = await res.text(); throw new Error(`HTTP ${res.status}: ${bodyText}`); }
  const json = await res.json();
  const message = json.choices && json.choices[0] && json.choices[0].message;
  let text = "";
  if (message) {
    if (typeof message.content === "string") text = message.content;
    else if (Array.isArray(message.content)) {
      text = message.content.map(part => (typeof part === "string" ? part : (part.text || ""))).join("");
    } else if (message.reasoning_content) text = message.reasoning_content;
  }
  text = (text || "").trim();
  if (!text) throw new Error("Risposta vuota dal modello. Dettaglio: " + JSON.stringify(json).slice(0, 900));
  text = text.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if (jsonMatch) text = jsonMatch[0];
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    throw new Error("Il modello non ha risposto in JSON valido: " + text.slice(0, 200));
  }
  return {
    amount: parsed.amount ? Number(parsed.amount) : null,
    date: parsed.date && /^\d{4}-\d{2}-\d{2}$/.test(parsed.date) ? parsed.date : null,
    category: parsed.category || null
  };
}

async function analyzeReceiptWithAI(file, onRetry) {
  const s = data.settings;
  if (!s.hfToken) throw new Error("no token");
  const maxAttempts = 3;
  let lastErr = null;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      return await callHuggingFaceOnce(file);
    } catch (err) {
      lastErr = err;
      const isEmptyOrServerIssue = /Risposta vuota|HTTP 5\d\d|HTTP 429/i.test(err.message || "");
      if (!isEmptyOrServerIssue || attempt === maxAttempts) throw err;
      if (onRetry) onRetry(attempt, maxAttempts);
      await new Promise(r => setTimeout(r, 1200));
    }
  }
  throw lastErr;
}

function categoriesForMacro(group, macro, year) {
  const map = data.categoryMacroMap[group] || {};
  const catsInMacro = Object.keys(map).filter(c => map[c] === macro);
  const totals = {};
  catsInMacro.forEach(c => {
    let sum = 0;
    if (group === "portfolio") {
      data.portfolio.filter(p=>p.type===c && p.date).forEach(p=>{
        if (new Date(p.date).getFullYear()===year) sum += toALL(Number(p.amount), p.currency);
      });
    } else {
      (data[group]||[]).filter(e=>e.category===c).forEach(e=>{
        if (new Date(e.date).getFullYear()===year) sum += Number(e.amount);
      });
    }
    totals[c] = sum;
  });
  return totals;
}

function computeWeightedDuration() {
  const items = data.portfolio.filter(p => p.maturityDate);
  if (items.length === 0) return null;
  let weightSum = 0, weightedYears = 0;
  items.forEach(p => {
    const mv = toALL((p.marketValue!==undefined && p.marketValue!==null && p.marketValue!=="") ? Number(p.marketValue) : p.amount, p.currency);
    const years = Math.max(0,(new Date(p.maturityDate) - now) / (365.25*86400000));
    weightSum += mv; weightedYears += mv*years;
  });
  return weightSum > 0 ? weightedYears/weightSum : null;
}

function registerBondCoupon(bondId) {
  const bond = data.portfolio.find(p=>p.id===bondId);
  if (!bond) return;
  const dateStr = window.prompt("Data di pagamento della cedola (YYYY-MM-DD):", todayISO);
  if (!dateStr) return;
  const nominal = bond.amount;
  const rate = Number(bond.couponRate) || 0;
  const grossCoupon = nominal * rate / 100;
  const taxRate = Number(bond.bondTaxRate) || 15;
  const taxAmt = grossCoupon * taxRate / 100;
  const commAmt = computeCommissionAmount(bond.couponCommissionType, bond.couponCommissionValue, grossCoupon);
  const netCoupon = grossCoupon - taxAmt - commAmt;
  const taxCat = ensureBondTaxCategory(bond.bondYears);
  const msg = `Cedola lorda: ${fmt(grossCoupon)} ALL\nTassazione (${taxRate}%): -${fmt(taxAmt)} ALL\nCommissione: -${fmt(commAmt)} ALL\nNetto accreditato in Banca: ${fmt(netCoupon)} ALL\n\nConfermi?`;
  if (!confirm(msg)) return;
  const incId = uid();
  data.income.push({id:incId, date:dateStr, amount:grossCoupon, category:"Cedola e le info", macro:"Interessi da Titoli - Standard", paymentType:null, note:`Cedola ${bond.type}`, linkedBondId:bond.id});
  data.expenses.push({id:uid(), date:dateStr, amount:taxAmt, category:taxCat, macro:"Tassazione da Titoli - Standard", note:"Tassazione cedola"});
  if (commAmt > 0) data.expenses.push({id:uid(), date:dateStr, amount:commAmt, category:"Commissione disbursement cedola", note:"Commissione cedola"});
  createLiquidityAdjustment("Banca", netCoupon, dateStr, `Cedola netta: ${bond.type}`, incId);
  saveData(); renderPortfolio();
}
function registerDepositInterest(depId) {
  const dep = data.portfolio.find(p=>p.id===depId);

function registerDepositMaturity(depId) {
  const dep = data.portfolio.find(p=>p.id===depId);
  if (!dep) return;
  const dateStr = window.prompt("Data di scadenza/liquidazione (YYYY-MM-DD):", dep.maturityDate || todayISO);
  if (!dateStr) return;
  const nominal = dep.amount;
  const rate = Number(dep.depositRate) || 0;
  const years = Number(dep.depositYears) || 1;
  const grossInterest = nominal * rate / 100 * years;
  const taxRate = Number(dep.depositTaxRate) || 15;
  const taxAmt = grossInterest * taxRate / 100;
  const netInterest = grossInterest - taxAmt;
  const taxCat = ensureDepositTaxCategory(dep.depositYears);
  const msg = `Deposito a pagamento finale — interesse semplice stimato su ${years} anni al ${rate}%.\nInteresse lordo: ${fmt(grossInterest)} ALL\nTassazione (${taxRate}%): -${fmt(taxAmt)} ALL\nNetto accreditato in Banca: ${fmt(netInterest)} ALL\n(Il capitale nominale resta registrato come posizione separata.)\n\nConfermi?`;
  if (!confirm(msg)) return;
  const incId = uid();
  data.income.push({id:incId, date:dateStr, amount:grossInterest, category:"Interesse deposito", macro:"Interessi da Titoli - Standard", paymentType:null, note:`Liquidazione finale ${dep.type}`, linkedBondId:dep.id});
  data.expenses.push({id:uid(), date:dateStr, amount:taxAmt, category:taxCat, macro:"Tassazione da Titoli - Standard", note:"Tassazione liquidazione deposito"});
  createLiquidityAdjustment("Banca", netInterest, dateStr, `Liquidazione netta: ${dep.type}`, incId);
  saveData(); renderPortfolio();
}

async function parseFundHistoryFile(file) {
  const isCSV = file.name.toLowerCase().endsWith(".csv");
  let rows2D;
  if (isCSV) {
    const text = await file.text();
    rows2D = text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/\t|,/));
  } else {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    rows2D = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
  }
  let headerIdx = -1, dateCol = -1, amtCol = -1, priceCol = -1, unitsCol = -1;
  for (let i = 0; i < Math.min(rows2D.length, 10); i++) {
    const row = rows2D[i].map(c => String(c).toUpperCase());
    const dc = row.findIndex(c => c.includes("DAT"));
    const ac = row.findIndex(c => c.includes("AMOUNT") || c.includes("IMPORT"));
    const pc = row.findIndex(c => c.includes("PRICE") || c.includes("PREZZO"));
    const uc = row.findIndex(c => c.includes("UNIT") || c.includes("QUOT"));
    if (dc >= 0 && ac >= 0 && pc >= 0) { headerIdx = i; dateCol = dc; amtCol = ac; priceCol = pc; unitsCol = (uc >= 0 && uc !== pc) ? uc : pc + 1; break; }
  }
  if (headerIdx === -1) throw new Error("Intestazioni non riconosciute (servono colonne Data/Amount/Unit Price/Units).");
  const rows = [], errors = [];
  for (let i = headerIdx + 1; i < rows2D.length; i++) {
    const r = rows2D[i];
    if (!r || r[dateCol] === undefined || r[dateCol] === "") continue;
    let dateStr = null;
    const raw = r[dateCol];
    const m = String(raw).match(/(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{4})/);
    if (m) dateStr = `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    else { const d = new Date(raw); if (!isNaN(d)) dateStr = localDateStr(d); }
    const amount = parseFloat(String(r[amtCol]).replace(/,/g,""));
    const unitPrice = parseFloat(String(r[priceCol]).replace(/,/g,""));
    const units = parseFloat(String(r[unitsCol]).replace(/,/g,""));
    if (!dateStr || isNaN(amount) || isNaN(unitPrice) || isNaN(units)) { errors.push({ line: i+1, text: JSON.stringify(r) }); continue; }
    rows.push({ date: dateStr, amount, unitPrice, units });
  }
  return { rows, errors };
}

function parseFundHistoryText(text) {
  const lines = text.split(/\n/).map(l=>l.trim()).filter(l=>l);
  const rows = [];
  const errors = [];
  const re = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})[^\d\-]*(-?[\d,]+\.?\d*)[^\d\-]+(-?[\d,]+\.?\d*)[^\d\-]+(-?[\d,]+\.?\d*)/;
  lines.forEach((line,idx) => {
    if (/^date/i.test(line)) return; // skip header row
    const m = line.match(re);
    if (!m) { errors.push({line: idx+1, text: line}); return; }
    const [, d, mo, y, amtStr, priceStr, unitsStr] = m;
    rows.push({
      date: `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`,
      amount: parseFloat(amtStr.replace(/,/g,"")),
      unitPrice: parseFloat(priceStr.replace(/,/g,"")),
      units: parseFloat(unitsStr.replace(/,/g,""))
    });
  });
  return { rows, errors };
}

function isFundEntry(p) {
  const t = (p.type||"").toLowerCase();
  const m = (p.macro||"").toLowerCase();
  return t.includes("fond") || m.includes("fond");
}

function computeBondsSummary() {
  const bonds = data.portfolio.filter(p => p.type && p.type.toLowerCase().includes("obbligazione") && p.amount > 0);
  const grouped = {};
  bonds.forEach(p => {
    const key = p.type;
    if (!grouped[key]) grouped[key] = { name:key, totalInvestedALL:0, count:0, couponsReceivedALL:0, nextMaturity:null };
    grouped[key].totalInvestedALL += toALL(p.amount, p.currency);
    grouped[key].count++;
    const coupons = data.income.filter(i=>i.linkedBondId===p.id).reduce((s,i)=>s+Number(i.amount),0);
    grouped[key].couponsReceivedALL += coupons;
    if (p.maturityDate && (!grouped[key].nextMaturity || p.maturityDate < grouped[key].nextMaturity)) grouped[key].nextMaturity = p.maturityDate;
  });
  return Object.values(grouped).map(g => ({...g, rendPct: g.totalInvestedALL>0 ? g.couponsReceivedALL/g.totalInvestedALL*100 : 0}));
}
function computeDepositsSummary() {
  const deposits = data.portfolio.filter(p => p.type && p.type.toLowerCase().includes("deposito") && p.amount > 0);
  const grouped = {};
  deposits.forEach(p => {
    const key = p.type;
    if (!grouped[key]) grouped[key] = { name:key, totalInvestedALL:0, count:0, interestReceivedALL:0, nextMaturity:null };
    grouped[key].totalInvestedALL += toALL(p.amount, p.currency);
    grouped[key].count++;
    const interest = data.income.filter(i=>i.linkedBondId===p.id).reduce((s,i)=>s+Number(i.amount),0);
    grouped[key].interestReceivedALL += interest;
    if (p.maturityDate && (!grouped[key].nextMaturity || p.maturityDate < grouped[key].nextMaturity)) grouped[key].nextMaturity = p.maturityDate;
  });
  return Object.values(grouped).map(g => ({...g, rendPct: g.totalInvestedALL>0 ? g.interestReceivedALL/g.totalInvestedALL*100 : 0}));
}
function computeLiquiditySummary() {
  const items = data.portfolio.filter(p => data.paymentTypes.includes(p.type) && !isCreditCardType(p.type));
  const grouped = {};
  items.forEach(p => {

function computeCreditCardSummary() {

    if (!grouped[key]) grouped[key] = { name:key, balanceALL:0 };

}
function computeDebtsSummary() {
  const debts = data.portfolio.filter(p => p.macro === "Debiti" || (p.type||"").toLowerCase().includes("debit") || (p.type||"").toLowerCase().includes("prestito"));
  const grouped = {};

    if (!grouped[key]) grouped[key] = { name:key, balanceALL:0 };

  });
  return Object.values(grouped);
}

function computeFundsSummary() {
  const funds = data.portfolio.filter(p => isFundEntry(p) && p.amount>0 && p.fundQuotaCount);
  const grouped = {};
  funds.forEach(p => {
    const key = p.fundName || p.type;
    if (!grouped[key]) grouped[key] = { name:key, totalQuote:0, totalInvested:0, latestPrice:0, latestPriceDate:null, currency:p.currency, priceHistory:[], earliestDate:p.date, id:p.id };
    grouped[key].totalQuote += Number(p.fundQuotaCount)||0;
    grouped[key].totalInvested += Number(p.amount)||0;
    if (p.priceHistory) grouped[key].priceHistory.push(...p.priceHistory);
    // Fallback candidate: this lot's own current/purchase price, dated at its priceHistory's latest entry or its own date
    const ownLatestHist = (p.priceHistory||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    const ownPrice = ownLatestHist ? ownLatestHist.price : (Number(p.fundCurrentQuotaPrice)||Number(p.fundPurchaseQuotaPrice)||0);
    const ownDate = ownLatestHist ? ownLatestHist.date : p.date;
    if (!grouped[key].latestPriceDate || ownDate > grouped[key].latestPriceDate) {
      grouped[key].latestPrice = ownPrice;
      grouped[key].latestPriceDate = ownDate;
    }
    if (p.date && p.date < grouped[key].earliestDate) grouped[key].earliestDate = p.date;
  });
  const yearStart = `${thisYear}-01-01`;
  return Object.values(grouped).map(g => {
    g.currentPrice = g.latestPrice;
    const avgPrice = g.totalQuote>0 ? g.totalInvested/g.totalQuote : 0;
    const currentValue = g.totalQuote * g.currentPrice;
    const rendValore = currentValue - g.totalInvested;
    const rendPct = g.totalInvested>0 ? rendValore/g.totalInvested*100 : 0;
    g.priceHistory.sort((a,b)=>a.date.localeCompare(b.date));
    let baselinePrice = null;
    const historyThisYear = g.priceHistory.filter(h=>h.date>=yearStart);
    const historyBefore = g.priceHistory.filter(h=>h.date<yearStart).sort((a,b)=>b.date.localeCompare(a.date));
    if (historyBefore.length>0) baselinePrice = historyBefore[0].price;
    else if (historyThisYear.length>0) baselinePrice = historyThisYear[0].price;
    else if (g.earliestDate >= yearStart) baselinePrice = avgPrice;
    let ytdPct = null, projectedPct = null;
    if (baselinePrice) {
      ytdPct = ((g.currentPrice - baselinePrice) / baselinePrice) * 100;
      const dayOfYear = Math.ceil((now - new Date(thisYear,0,1)) / 86400000) || 1;
      projectedPct = ytdPct * (365/dayOfYear);
    }
    const currentValueALL = toALL(currentValue, g.currency);
    const totalInvestedALL = toALL(g.totalInvested, g.currency);
    return { name:g.name, totalQuote:g.totalQuote, currentPrice:g.currentPrice, currentValue, currentValueALL, totalInvestedALL, avgPrice, rendPct, rendValore, ytdPct, projectedPct, currency:g.currency };
  });
}

  function updatePortFieldsVisibility() {
    const catSel = document.getElementById("portForm").querySelector(".cat-select");
    const macroSel = document.getElementById("portForm").querySelector(".macro-select");
    const val = (catSel.value || "").toLowerCase();
    const macroVal = (macroSel ? macroSel.value : "").toLowerCase();
    const bondFields = document.getElementById("bondFields");
    const depositFields = document.getElementById("depositFields");
    const fundFields = document.getElementById("fundFields");
    const isBond = val.includes("obbligazione");
    const isFund = val.includes("fond") || macroVal.includes("fond");
    const isSecurity = isBond || val.includes("deposito") || isFund;
    bondFields.style.display = isBond ? "block" : "none";
    depositFields.style.display = val.includes("deposito") ? "block" : "none";
    fundFields.style.display = isFund ? "block" : "none";
    document.getElementById("titleCodeField").style.display = isSecurity ? "block" : "none";
    document.getElementById("marketValueField").style.display = isFund ? "none" : "block";
    document.getElementById("maturityDateField").style.display = isFund ? "none" : "block";
    document.getElementById("amountField").style.display = isFund ? "none" : "block";
    document.getElementById("issuerField").style.display = (isFund || isBond) ? "block" : "none";
  }
  function updateFundInvestedPreview() {
    const price = Number(document.getElementById("fundPurchaseQuotaPrice").value) || 0;
    const qty = Number(document.getElementById("fundQuotaCount").value) || 0;
    const invested = price * qty;
    document.getElementById("fundInvestedPreview").value = invested ? invested.toFixed(2) : "";
    const amountInput = document.getElementById("portForm").querySelector('[name="amount"]');
    if (invested) amountInput.value = invested.toFixed(2);
  }
  document.getElementById("fundPurchaseQuotaPrice").addEventListener("input", updateFundInvestedPreview);
  document.getElementById("fundQuotaCount").addEventListener("input", updateFundInvestedPreview);
  function updateBondModeVisibility() {
    const mode = document.getElementById("bondModeSelect").value;
    document.getElementById("bondCouponRow").style.display = mode === "cedola" ? "flex" : "none";
    document.getElementById("bondPriceRow").style.display = mode === "finale" ? "flex" : "none";
  }
  function updateBondDatesSync() {
    const chk = document.getElementById("purchasedAtIssueChk");
    const issueDateInput = document.getElementById("bondIssueDateInput");
    const dateInput = document.getElementById("portForm").querySelector('[name="date"]');
    if (chk.checked) { dateInput.value = issueDateInput.value; dateInput.readOnly = true; dateInput.style.opacity = "0.7"; }
    else { dateInput.readOnly = false; dateInput.style.opacity = "1"; }
    updateBondRemainingYearsPreview();
  }
  function updateBondRemainingYearsPreview() {
    const dateInput = document.getElementById("portForm").querySelector('[name="date"]');
    const maturityInput = document.getElementById("portForm").querySelector('[name="maturityDate"]');
    const preview = document.getElementById("bondRemainingYearsPreview");
    if (!dateInput.value || !maturityInput.value) { preview.value = ""; return; }
    const years = (new Date(maturityInput.value) - new Date(dateInput.value)) / (365.25*86400000);
    preview.value = years > 0 ? years.toFixed(2) + " anni" : "data non valida";
  }
  const portCatSelectForFields = document.getElementById("portForm").querySelector(".cat-select");
  const portMacroSelectForFields = document.getElementById("portForm").querySelector(".macro-select");

  document.getElementById("bondModeSelect").addEventListener("change", updateBondModeVisibility);

      if (idx===0) firstId = id;
      data.portfolio.push({
        id, type, fundName, amount: r.amount, currency: currency || "ALL", marketValue: r.amount,
        date: r.date, maturityDate: null, note: "Importato da storico",
        fundQuotaCount: r.units, fundPurchaseQuotaPrice: r.unitPrice, fundCurrentQuotaPrice: r.unitPrice,
        securityCode: sharedCode, priceHistory: [{date: r.date, price: r.unitPrice}]
      });
      added++;
    });
    if (baselineDate && baselinePrice && firstId) {
      const target = data.portfolio.find(p=>p.id===firstId);
      if (target) {
        if (!target.priceHistory) target.priceHistory = [];
        const hIdx = target.priceHistory.findIndex(h=>h.date===baselineDate);
        if (hIdx>=0) target.priceHistory[hIdx].price = baselinePrice; else target.priceHistory.push({ date: baselineDate, price: baselinePrice });
      }
    }
    fundImportPreview = null;
    saveData();
    alert(`Importazione completata per "${fundName}": ${added} nuove righe, ${updated} righe già esistenti aggiornate.`);
    renderPortfolio();
  });

  document.getElementById("liquidityTransferForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const from = f.get("from");
    const to = f.get("to");
    const amount = Number(f.get("amount"));
    const date = f.get("date") || todayISO;
    const note = f.get("note") || "";
    if (from === to) { alert("Scegli due voci diverse per il trasferimento."); return; }
    if (!amount || amount <= 0) { alert("Inserisci un importo valido."); return; }
    const transferId = uid();
    data.portfolio.push({ id: uid(), type: from, macro: (data.categoryMacroMap.portfolio && data.categoryMacroMap.portfolio[from]) || null, amount: -amount, currency: "ALL", marketValue: null, date, maturityDate: null, note: `Trasferimento a ${to}${note?': '+note:''}`, transferGroup: transferId });
    data.portfolio.push({ id: uid(), type: to, macro: (data.categoryMacroMap.portfolio && data.categoryMacroMap.portfolio[to]) || null, amount: amount, currency: "ALL", marketValue: null, date, maturityDate: null, note: `Trasferimento da ${from}${note?': '+note:''}`, transferGroup: transferId });
    saveData(); renderPortfolio();
  });
}

function renderBudgetGroupCard(groupKey, title) {
  const budgets = data.categoryBudgets[groupKey] || {};
  const cats = Object.keys(budgets).filter(c => budgets[c] > 0 && data.categories[groupKey].includes(c));
  if (cats.length === 0) {
    return `<div class="card"><h3>${title}</h3><div class="empty">Nessun budget impostato. Vai in Assunzioni → Gestisci categorie per assegnarne uno a ciascuna voce.</div></div>`;
  }
  const blocks = cats.map(c => {
    const annual = budgets[c];
    const monthly = annual / 12;
    const daily = annual / 365;
    const entries = normalizedEntries(groupKey, c);
    const actualDay = sumForDate(entries, todayISO);
    const actualMonth = sumForMonth(entries, thisMonth);
    const actualYear = sumForYear(entries, thisYear);
    return `<div style="margin-bottom:18px;">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:13px; color:#EDE6D6; margin-bottom:8px;">${c}</div>
      ${budgetBlock("Oggi", actualDay, daily)}
      ${budgetBlock("Mese", actualMonth, monthly)}
      ${budgetBlock("Anno", actualYear, annual)}
    </div>`;
  }).join('');
  return `<div class="card"><h3>${title}</h3>${blocks}</div>`;
}

function avgStatsFor(entries, dayOfMonth) {
  const total = entries.reduce((s,e)=>s+Number(e.amount),0);
  const distinctDays = new Set(entries.map(e=>e.date)).size;
  return { total, simple: dayOfMonth>0 ? total/dayOfMonth : 0, effective: distinctDays>0 ? total/distinctDays : 0, distinctDays };
}
function avgRowHtml(label, stats) {
  return `<div style="display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px dashed #24374F; gap:10px;">
    <span style="font-family:'Inter',sans-serif; font-size:12.5px; color:#EDE6D6; flex:1;">${label}</span>
    <span style="text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#C9A227; white-space:nowrap;">${fmt(stats.total)} ALL
      <div style="font-size:10px; color:#8FA3BF; font-family:'Inter',sans-serif; margin-top:2px;">semplice: ${fmt(stats.simple)}/gg · reale (${stats.distinctDays}gg): ${fmt(stats.effective)}/gg</div>
    </span>
  </div>`;
}
function renderDailyAveragesCard() {
  const monthEntries = data.expenses.filter(e => e.date.slice(0,7) === thisMonth);
  const dayOfMonth = now.getDate();
  if (monthEntries.length === 0) {
    return `<div class="card"><h3>Medie giornaliere · Spese (${thisMonth})</h3><div class="empty">Nessuna spesa registrata questo mese.</div></div>`;
  }
  const totalStats = avgStatsFor(monthEntries, dayOfMonth);
  const cats = [...new Set(monthEntries.map(e=>e.category))].sort((a,b)=>{
    const ta = monthEntries.filter(e=>e.category===a).reduce((s,e)=>s+Number(e.amount),0);
    const tb = monthEntries.filter(e=>e.category===b).reduce((s,e)=>s+Number(e.amount),0);
    return tb-ta;
  });
  const macros = [...new Set(monthEntries.map(e=>e.macro).filter(Boolean))];
  return `<div class="card">
    <h3>Medie giornaliere · Spese (${thisMonth})</h3>
    <div class="subtle">"Semplice" = totale ÷ ${dayOfMonth} (giorni trascorsi nel mese). "Reale" = totale ÷ giorni in cui hai effettivamente registrato una spesa.</div>
    <div style="margin-top:10px; margin-bottom:4px; font-family:'Fraunces',serif; color:#C9A227; font-size:13px;">Totale</div>
    ${avgRowHtml("Tutte le spese", totalStats)}
    <div style="margin-top:14px; margin-bottom:4px; font-family:'Fraunces',serif; color:#C9A227; font-size:13px;">Per categoria</div>
    ${cats.map(c => avgRowHtml(c, avgStatsFor(monthEntries.filter(e=>e.category===c), dayOfMonth))).join('')}
    ${macros.length>0 ? `
    <div style="margin-top:14px; margin-bottom:4px; font-family:'Fraunces',serif; color:#C9A227; font-size:13px;">Per macro-categoria</div>
    ${macros.map(m => avgRowHtml(m, avgStatsFor(monthEntries.filter(e=>e.macro===m), dayOfMonth))).join('')}` : ''}
  </div>`;
}

function bindCategoryManagement(group, refreshFn) {
  const addBtn = document.querySelector(`[data-catadd="${group}"]`);
  if (addBtn) addBtn.addEventListener("click", ()=>{
    const input = document.querySelector(`[data-catinput="${group}"]`);
    const val = input.value.trim();
    if (val && !data.categories[group].includes(val)) { data.categories[group].push(val); saveData(); refreshFn(); }
  });
  document.querySelectorAll(`[data-catdel]`).forEach(btn=>{
    const [g, name] = btn.dataset.catdel.split("|");
    if (g !== group) return;
    btn.addEventListener("click", ()=>{
      if (!confirm(`Eliminare la categoria "${name}"? Le voci già registrate la manterranno come testo libero.`)) return;
      data.categories[group] = data.categories[group].filter(c=>c!==name);
      if (data.categoryBudgets[group]) delete data.categoryBudgets[group][name];
      saveData(); refreshFn();
    });
  });
  const saveBtn = document.querySelector(`[data-catsave="${group}"]`);
  if (saveBtn) saveBtn.addEventListener("click", ()=>{
    const container = document.getElementById(`cat-block-${group}`);
    let renamedAny = false;
    container.querySelectorAll(".cat-row[data-origname]").forEach(row=>{
      const origName = row.dataset.origname;
      const nameInput = row.querySelector(".cat-name-input");
      const budgetInput = row.querySelector(".cat-budget-input");
      const newName = nameInput.value.trim();
      if (newName && newName !== origName) { renameCategory(group, origName, newName); renamedAny = true; }
      const finalName = data.categories[group].includes(newName) ? newName : origName;
      if (!data.categoryBudgets[group]) data.categoryBudgets[group] = {};
      data.categoryBudgets[group][finalName] = Number(budgetInput.value) || 0;
    });
    saveData();
    alert("Modifiche salvate." + (renamedAny ? " Le voci già registrate sono state aggiornate col nuovo nome." : ""));
    refreshFn();
  });
}

    const isLoan = isDebtType(type, macro) && !isCreditCardType(type);
    const posObj = { id: posId, type, macro, amount, currency, marketValue: null, date, maturityDate: null, note: f.get("note")||"", issuer: f.get("issuer")||null };

    const termMonths = Number(f.get("termMonths"))||0;
    if (isLoan && termMonths > 0) {
      const loanInterestRate = Number(f.get("loanInterestRate"))||0;
      const amortizationType = f.get("amortizationType")||"francese";

      const daysInStartMonth = new Date(new Date(date).getFullYear(), new Date(date).getMonth()+1, 0).getDate();

      }

        createLiquidityAdjustment("Banca", -insuranceValue, date, `Assicurazione prestito: ${type}`, insId);
      }
    } else {
      data.portfolio.push(posObj);
      if (isLoan) createLiquidityAdjustment("Banca", Math.abs(amount), date, `Debito ricevuto: ${type}`, posId);
    }

// ---------- CSV import ----------
let csvImportState = null;

function parseCSV(text) {
  const firstLine = text.split(/\r?\n/)[0] || "";
  const delimiter = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  return lines.map(line => splitCSVLine(line, delimiter));
}
function splitCSVLine(line, delim) {
  const result = []; let cur = ''; let inQuotes = false;
  for (let i=0;i<line.length;i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; continue; }
    if (ch === delim && !inQuotes) { result.push(cur.trim()); cur=''; continue; }
    cur += ch;
  }
  result.push(cur.trim());
  return result;
}
function parseFlexibleDate(str) {
  if (!str) return null;
  str = str.trim();
  let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if (m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  return null;
}
function parseFlexibleAmount(str) {
  if (str===undefined || str===null) return NaN;
  str = String(str).trim().replace(/[^\d,.\-]/g,'');
  if (str.includes(',') && str.includes('.')) {
    if (str.lastIndexOf(',') > str.lastIndexOf('.')) str = str.replace(/\./g,'').replace(',', '.');
    else str = str.replace(/,/g,'');
  } else if (str.includes(',')) {
    str = str.replace(',', '.');
  }
  return Number(str);
}
function handleCsvFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const rows = parseCSV(e.target.result);
    if (rows.length < 2) { alert("File CSV vuoto o non valido."); return; }
    const headers = rows[0];
    const dataRows = rows.slice(1).filter(r => r.some(c=>c && c.trim()!==""));
    csvImportState = { headers, dataRows, group:"expenses", category: data.categories.expenses[0]||"Altro", dateColIdx:0, amountColIdx: headers.length>1?1:0, noteColIdx:-1 };
    renderSettings();
  };
  reader.readAsText(file);
}
function confirmCsvImport() {
  const st = csvImportState;
  if (!st) return;
  let imported = 0, skipped = 0;
  const batchId = uid();
  st.dataRows.forEach(row => {
    const date = parseFlexibleDate(row[st.dateColIdx]);
    const amount = parseFlexibleAmount(row[st.amountColIdx]);
    if (!date || isNaN(amount) || amount===0) { skipped++; return; }
    const note = st.noteColIdx>=0 ? (row[st.noteColIdx]||"") : "";
    data[st.group].push({ id: uid(), date, amount: Math.abs(amount), category: st.category, note, importBatch: batchId });
    imported++;
  });
  saveData();
  csvImportState = null;
  alert(`Importate ${imported} voci. Righe ignorate (data/importo non validi): ${skipped}.`);
  renderSettings();
}
function csvImportBlock() {
  if (!csvImportState) {
    return `<div style="margin-bottom:18px;">
      <label>Importa estratto conto (CSV)</label>
      <div class="subtle">Scarica il CSV dei movimenti dalla tua banca e caricalo qui per inserire più voci in una volta, invece che una a una.</div>
      <input type="file" id="csvFileInput" accept=".csv,text/csv">
    </div>`;
  }
  const st = csvImportState;
  const colOptions = (selectedIdx) => st.headers.map((h,i)=>`<option value="${i}" ${i===selectedIdx?'selected':''}>${h||'Colonna '+(i+1)}</option>`).join('');
  const noteOptions = `<option value="-1" ${st.noteColIdx===-1?'selected':''}>Nessuna</option>` + colOptions(st.noteColIdx>=0?st.noteColIdx:-999);
  return `<div style="margin-bottom:18px;">
    <label>Importa estratto conto (CSV)</label>
    <div class="subtle">${st.dataRows.length} righe trovate. Configura la mappatura, poi conferma.</div>
    <div class="row2">
      <div><label>Tipo</label><select id="csvGroupSelect"><option value="expenses" ${st.group==='expenses'?'selected':''}>Spese</option><option value="income" ${st.group==='income'?'selected':''}>Reddito</option></select></div>
      <div><label>Categoria da assegnare</label><select id="csvCategorySelect">${data.categories[st.group].map(c=>`<option ${c===st.category?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div><label>Colonna data</label><select id="csvDateCol">${colOptions(st.dateColIdx)}</select></div>
      <div><label>Colonna importo</label><select id="csvAmountCol">${colOptions(st.amountColIdx)}</select></div>
    </div>
    <div><label>Colonna nota (opzionale)</label><select id="csvNoteCol">${noteOptions}</select></div>
    <div class="subtle" style="margin-top:8px;">Anteprima prima riga: ${st.dataRows[0] ? st.dataRows[0].join(' | ') : ''}</div>
    <div class="row2" style="margin-top:10px;">
      <button class="primary" type="button" id="csvConfirmBtn">Importa ${st.dataRows.length} righe</button>
      <button class="secondary" type="button" id="csvCancelBtn">Annulla</button>
    </div>
  </div>`;
}

// ---------- Google Drive sync ----------
const GOOGLE_CLIENT_ID = "270840494208-cumofp8s8od3ov1436913811ms7f0nut.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_FILENAME = "fi-tracker-backup.json";
let gDriveToken = null;
let gTokenClient = null;

function saveTokenToSession(token, expiresInSec) {
  try {
    sessionStorage.setItem("gdrive_token", token);
    sessionStorage.setItem("gdrive_token_exp", String(Date.now() + (expiresInSec||3500)*1000));
  } catch(e) {}
}
function loadTokenFromSession() {
  try {
    const token = sessionStorage.getItem("gdrive_token");
    const exp = Number(sessionStorage.getItem("gdrive_token_exp")||0);
    if (token && exp > Date.now()) return token;
  } catch(e) {}
  return null;
}
function clearDriveToken() {
  gDriveToken = null;
  try { sessionStorage.removeItem("gdrive_token"); sessionStorage.removeItem("gdrive_token_exp"); } catch(e) {}
}

function initGoogleClient() {
  if (!window.google || !google.accounts || gTokenClient) return;
  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp && resp.access_token) {
        gDriveToken = resp.access_token;
        saveTokenToSession(resp.access_token, resp.expires_in);
        updateSyncBadge();
        if (document.getElementById("driveStatus")) renderDrive();
      }
    }
  });
}
function connectGoogleDrive() {
  if (!window.google || !google.accounts) { alert("Google non è ancora pronto, riprova tra un secondo."); return; }
  if (!gTokenClient) initGoogleClient();
  gTokenClient.requestAccessToken();
}
async function findDriveFileId() {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name%3D%27${DRIVE_FILENAME}%27+and+trashed%3Dfalse&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${gDriveToken}` }
  });
  if (res.status === 401) { clearDriveToken(); updateSyncBadge(); throw new Error("token expired"); }
  const json = await res.json();
  return (json.files && json.files[0]) ? json.files[0].id : null;
}
async function doDriveUpload() {
  const fileId = await findDriveFileId();
  const metadata = { name: DRIVE_FILENAME, mimeType: "application/json" };
  const content = JSON.stringify(data);
  const boundary = "-------fitracker";
  const multipartBody =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${fileId?"{}":JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const url = fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const res = await fetch(url, {
    method: fileId ? "PATCH" : "POST",
    headers: { Authorization: `Bearer ${gDriveToken}`, "Content-Type": `multipart/related; boundary=${boundary}` },
    body: multipartBody
  });
  if (res.status === 401) { clearDriveToken(); updateSyncBadge(); throw new Error("token expired"); }
  if (!res.ok) throw new Error(await res.text());
}
async function uploadToDrive() {

function renameCategory(group, oldName, newName) {
  if (!newName || newName === oldName) return;
  if (data.categories[group].includes(newName)) {
    alert(`Esiste già una categoria "${newName}" in questo gruppo — rinomina di "${oldName}" annullata.`);
    return;
  }
  const idx = data.categories[group].indexOf(oldName);
  if (idx >= 0) data.categories[group][idx] = newName;
  if (data.categoryBudgets[group] && oldName in data.categoryBudgets[group]) {
    data.categoryBudgets[group][newName] = data.categoryBudgets[group][oldName];
    delete data.categoryBudgets[group][oldName];
  }
  if (data.categoryMacroMap[group] && oldName in data.categoryMacroMap[group]) {
    data.categoryMacroMap[group][newName] = data.categoryMacroMap[group][oldName];
    delete data.categoryMacroMap[group][oldName];
  }
  const field = group === "portfolio" ? "type" : "category";
  (data[group] || []).forEach(e => { if (e[field] === oldName) e[field] = newName; });
  (data.recurring[group] || []).forEach(r => {
    if (group === "portfolio") { if (r.type === oldName) r.type = newName; }
    else { if (r.category === oldName) r.category = newName; }
  });
}
function renameMacroField(group, oldName, newName) {
  if (!newName || newName === oldName) return;
  if ((data.macroCategories[group]||[]).includes(newName)) {
    alert(`Esiste già la macro-categoria "${newName}" — rinomina di "${oldName}" annullata.`);
    return;
  }
  const idx = data.macroCategories[group].indexOf(oldName);
  if (idx >= 0) data.macroCategories[group][idx] = newName;
  (data[group] || []).forEach(e => { if (e.macro === oldName) e.macro = newName; });
}

const RAIFFEISEN_FUNDS = ["Raiffeisen Prestigj","Raiffeisen Vizion","Raiffeisen Invest Euro","Raiffeisen Miks","Raiffeisen Pension","Raiffeisen Solid"];
async function fetchRaiffeisenFundPrice(fundName) {
  const target = "https://www.raiffeisen-invest.al/sq/performanca-e-fondeve.html";
  const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(target);
  const res = await fetch(proxyUrl);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const html = await res.text();
  const nameEscaped = fundName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp(nameEscaped + "[\\s\\S]{1,400}?([\\d,]+\\.\\d{2,4})\\s*(ALL|EUR)", "i");
  const m = html.match(re);
  if (!m) throw new Error(`Non ho trovato "${fundName}" nella pagina (nome diverso o formato cambiato?)`);
  const price = parseFloat(m[1].replace(/,/g, ""));
  const currency = m[2].toUpperCase();
  return { price, currency };
}

async function fetchBoaRate() {
  const target = "https://www.bankofalbania.org/Markets/Official_exchange_rate/";
  const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(target);
  const res = await fetch(proxyUrl);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const html = await res.text();
  const extract = (code) => {
    const re = new RegExp(code + "[^0-9]{1,300}?(\\d{1,3}[.,]\\d{1,4})");
    const m = html.match(re);
    return m ? parseFloat(m[1].replace(",", ".")) : null;
  };
  const eur = extract("EUR");
  const usd = extract("USD");
  if (!eur && !usd) throw new Error("Dati non trovati nella pagina (formato cambiato?)");
  return { eur, usd };
}

function fxDbGet() {
  if (!data.fxDatabase) data.fxDatabase = {};
  return data.fxDatabase;
}
function fxDbSetRate(dateStr, eur, usd) {
  const db = fxDbGet();
  db[dateStr] = { eur: eur||null, usd: usd||null };
}
function fxDbForwardFill() {
  const db = fxDbGet();
  const dates = Object.keys(db).sort();
  if (dates.length < 2) return;
  let last = null;
  const start = new Date(dates[0]);
  const end = new Date(dates[dates.length-1]);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
    const ds = localDateStr(d);
    if (db[ds]) { last = db[ds]; }
    else if (last) { db[ds] = { eur: last.eur, usd: last.usd, filled: true }; }
  }
}
function getFxRateForDate(dateStr, currency) {
  const db = fxDbGet();
  if (db[dateStr]) {
    const v = currency === "USD" ? db[dateStr].usd : db[dateStr].eur;
    if (v) return v;
  }
  const dates = Object.keys(db).filter(d => d <= dateStr).sort();
  if (dates.length) {
    const v = currency === "USD" ? db[dates[dates.length-1]].usd : db[dates[dates.length-1]].eur;
    if (v) return v;
  }
  return currency === "USD" ? data.settings.fxUsd : data.settings.fx;
}

async function importFxHistoryXLSX(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
  let headerRowIdx = -1, dateCol = -1, eurCol = -1, usdCol = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const row = rows[i].map(c => String(c).toUpperCase());
    const dc = row.findIndex(c => c.includes("DAT") || c.includes("DATE"));
    const ec = row.findIndex(c => c === "EUR" || c.includes("EUR"));
    const uc = row.findIndex(c => c === "USD" || c.includes("USD"));
    if (dc >= 0 && (ec >= 0 || uc >= 0)) { headerRowIdx = i; dateCol = dc; eurCol = ec; usdCol = uc; break; }
  }
  if (headerRowIdx === -1) throw new Error("Non ho trovato intestazioni riconoscibili (Data/EUR/USD) nel file.");
  let count = 0;
  for (let i = headerRowIdx+1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row[dateCol]) continue;
    let dateStr = null;
    const raw = row[dateCol];
    const m = String(raw).match(/(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{4})/);
    if (m) dateStr = `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    else { const d = new Date(raw); if (!isNaN(d)) dateStr = localDateStr(d); }
    if (!dateStr) continue;
    const eur = eurCol>=0 ? parseFloat(String(row[eurCol]).replace(",",".")) : null;
    const usd = usdCol>=0 ? parseFloat(String(row[usdCol]).replace(",",".")) : null;
    if (!eur && !usd) continue;
    fxDbSetRate(dateStr, eur||null, usd||null);
    count++;
  }
  fxDbForwardFill();
  saveData();
  return count;
}

        const dates = Object.keys(data.fxDatabase).sort();
