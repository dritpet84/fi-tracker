const GOOGLE_CLIENT_ID = "270840494208-cumofp8s8od3ov1436913811ms7f0nut.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_FILENAME = "fi-tracker-backup.json";
let gDriveToken = null;
let gTokenClient = null;

// Il token va in localStorage, non in sessionStorage: sessionStorage viene svuotato
// quando si chiude la scheda, quindi sul telefono l'app ripartiva sempre
// disconnessa e mostrava i dati locali vecchi senza scaricare da Drive.
function saveTokenToSession(token, expiresInSec) {
  try {
    localStorage.setItem("gdrive_token", token);
    localStorage.setItem("gdrive_token_exp", String(Date.now() + (expiresInSec||3500)*1000));
  } catch(e) {}
}
function loadTokenFromSession() {
  try {
    const token = localStorage.getItem("gdrive_token");
    const exp = Number(localStorage.getItem("gdrive_token_exp")||0);
    if (token && exp > Date.now()) return token;
    // Migrazione dalla vecchia posizione, per chi ha ancora una sessione aperta.
    const legacy = sessionStorage.getItem("gdrive_token");
    const legacyExp = Number(sessionStorage.getItem("gdrive_token_exp")||0);
    if (legacy && legacyExp > Date.now()) {
      localStorage.setItem("gdrive_token", legacy);
      localStorage.setItem("gdrive_token_exp", String(legacyExp));
      return legacy;
    }
  } catch(e) {}
  return null;
}
function clearDriveToken() {
  gDriveToken = null;
  try {
    localStorage.removeItem("gdrive_token"); localStorage.removeItem("gdrive_token_exp");
    sessionStorage.removeItem("gdrive_token"); sessionStorage.removeItem("gdrive_token_exp");
  } catch(e) {}
}

function initGoogleClient() {
  if (!window.google || !google.accounts || gTokenClient) return;
  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp && resp.access_token) {
        gDriveToken = resp.access_token;
        saveTokenToSession(resp.access_token, resp.expires_in);
        updateSyncBadge();
        // Appena connessi, allinea: se Drive è più avanti scarica prima di tutto,
        // altrimenti si rischia di caricare sopra dati più recenti.
        syncFromDriveIfNewer().then(() => {
          if (document.getElementById("driveStatus")) renderDrive();
        });
      }
    }
  });
}
function connectGoogleDrive() {
  if (!window.google || !google.accounts) { alert("Google non è ancora pronto, riprova tra un secondo."); return; }
  if (!gTokenClient) initGoogleClient();
  gTokenClient.requestAccessToken();
}
async function findDriveFile() {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name%3D%27${DRIVE_FILENAME}%27+and+trashed%3Dfalse&spaces=drive&fields=files(id,name,modifiedTime)`, {
    headers: { Authorization: `Bearer ${gDriveToken}` }
  });
  if (res.status === 401) { clearDriveToken(); updateSyncBadge(); throw new Error("token expired"); }
  const json = await res.json();
  return (json.files && json.files[0]) ? json.files[0] : null;
}
async function findDriveFileId() {
  const f = await findDriveFile();
  return f ? f.id : null;
}
// Rileva il caso "due dispositivi": se la copia su Drive è stata modificata dopo
// l'ultima sincronizzazione di QUESTO dispositivo, contiene lavoro fatto altrove
// e sovrascriverla lo cancellerebbe senza preavviso.
function isRemoteNewerThanLocal(remoteModifiedTime) {
  if (!remoteModifiedTime) return false;
  const lastSync = data.settings.lastDriveSync;
  if (!lastSync) return false;               // mai sincronizzato qui: nessun confronto possibile
  const remote = new Date(remoteModifiedTime).getTime();
  const local = new Date(lastSync).getTime();
  if (!isFinite(remote) || !isFinite(local)) return false;
  return remote > local + 5000;              // 5s di tolleranza per lo scarto di orologio
}
async function doDriveUpload(opts) {
  opts = opts || {};
  const remote = await findDriveFile();
  if (remote && !opts.force && isRemoteNewerThanLocal(remote.modifiedTime)) {
    const err = new Error("CONFLITTO_DRIVE");
    err.conflict = true;
    err.remoteModifiedTime = remote.modifiedTime;
    throw err;
  }
  const fileId = remote ? remote.id : null;
  const metadata = { name: DRIVE_FILENAME, mimeType: "application/json" };
  const content = JSON.stringify(data);
  const boundary = "-------fitracker";
  const multipartBody =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${fileId?"{}":JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const url = fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const res = await fetch(url, {
    method: fileId ? "PATCH" : "POST",
    headers: { Authorization: `Bearer ${gDriveToken}`, "Content-Type": `multipart/related; boundary=${boundary}` },
    body: multipartBody
  });
  if (res.status === 401) { clearDriveToken(); updateSyncBadge(); throw new Error("token expired"); }
  if (!res.ok) throw new Error(await res.text());
}
async function uploadToDrive() {
  if (!gDriveToken) { alert("Connetti prima Google Drive."); return; }
  const statusEl = document.getElementById("driveStatus");
  if (statusEl) statusEl.textContent = "Caricamento in corso...";
  try {
    await doDriveUpload();
    data.settings.lastDriveSync = new Date().toISOString();
    persistLocalOnly();
    if (statusEl) statusEl.textContent = "Backup caricato su Google Drive.";
    updateSyncBadge();
  } catch (err) {
    if (err && err.conflict) {
      const when = new Date(err.remoteModifiedTime).toLocaleString("it-IT");
      const proceed = confirm(
        `Attenzione: la copia su Google Drive è più recente di questo dispositivo.\n\n` +
        `Modificata il ${when}, probabilmente da un altro dispositivo.\n\n` +
        `Se carichi adesso, quelle modifiche verranno perse.\n\n` +
        `Premi Annulla (consigliato) e poi "Scarica da Drive" per recuperarle.\n` +
        `Premi OK solo se vuoi davvero sovrascriverle con i dati di questo dispositivo.`);
      if (!proceed) {
        if (statusEl) statusEl.textContent = "Caricamento annullato: su Drive ci sono dati più recenti. Usa \"Scarica da Drive\" per recuperarli.";
        return;
      }
      try {
        await doDriveUpload({ force:true });
        data.settings.lastDriveSync = new Date().toISOString();
        persistLocalOnly();
        if (statusEl) statusEl.textContent = "Backup caricato (copia remota sovrascritta).";
        updateSyncBadge();
      } catch (e2) {
        if (statusEl) statusEl.textContent = "Errore nel caricamento su Drive. Riprova.";
      }
      return;
    }
    if (statusEl) statusEl.textContent = gDriveToken ? "Errore nel caricamento su Drive. Riprova." : "Sessione scaduta, riconnetti.";
  }
}
async function silentUploadToDrive() {
  if (!gDriveToken) return;
  try {
    await doDriveUpload();
    data.settings.lastDriveSync = new Date().toISOString();
    data.settings.driveConflictPending = null;
    persistLocalOnly();
    updateSyncBadge();
  } catch (err) {
    // In automatico non si sovrascrive MAI silenziosamente il lavoro di un altro
    // dispositivo: si segnala e si lascia decidere.
    if (err && err.conflict) {
      data.settings.driveConflictPending = err.remoteModifiedTime;
      persistLocalOnly();
    }
    updateSyncBadge();
  }
}
async function downloadFromDrive(silent) {
  if (!gDriveToken) { if (!silent) alert("Connetti prima Google Drive."); return; }
  const statusEl = document.getElementById("driveStatus");
  if (statusEl) statusEl.textContent = "Scaricamento in corso...";
  try {
    const remoteFile = await findDriveFile();
    const fileId = remoteFile ? remoteFile.id : null;
    if (!fileId) { if (statusEl) statusEl.textContent = "Nessun backup trovato su Drive. Carica prima una volta."; return; }
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { Authorization: `Bearer ${gDriveToken}` }
    });
    if (res.status === 401) { clearDriveToken(); updateSyncBadge(); return; }
    const parsed = await res.json();
    data = {
      settings: Object.assign({}, DEFAULT_DATA.settings, parsed.settings||{}),
      income: parsed.income||[], expenses: parsed.expenses||[], portfolio: parsed.portfolio||[],
      categories: {
        income: (parsed.categories&&parsed.categories.income)||DEFAULT_CATEGORIES.income,
        expenses: (parsed.categories&&parsed.categories.expenses)||DEFAULT_CATEGORIES.expenses,
        portfolio: (parsed.categories&&parsed.categories.portfolio)||DEFAULT_CATEGORIES.portfolio
      },
      categoryBudgets: {
        income: (parsed.categoryBudgets&&parsed.categoryBudgets.income)||{},
        expenses: (parsed.categoryBudgets&&parsed.categoryBudgets.expenses)||{},
        portfolio: (parsed.categoryBudgets&&parsed.categoryBudgets.portfolio)||{}
      },
      macroCategories: {
        income: (parsed.macroCategories&&parsed.macroCategories.income)||[],
        expenses: (parsed.macroCategories&&parsed.macroCategories.expenses)||[],
        portfolio: (parsed.macroCategories&&parsed.macroCategories.portfolio)||[]
      },
      categoryMacroMap: {
        income: (parsed.categoryMacroMap&&parsed.categoryMacroMap.income)||{},
        expenses: (parsed.categoryMacroMap&&parsed.categoryMacroMap.expenses)||{},
        portfolio: (parsed.categoryMacroMap&&parsed.categoryMacroMap.portfolio)||{}
      },
      recurring: {
        income: (parsed.recurring&&parsed.recurring.income)||[],
        expenses: (parsed.recurring&&parsed.recurring.expenses)||[],
        portfolio: (parsed.recurring&&parsed.recurring.portfolio)||[]
      },
      snapshots: parsed.snapshots||[],
      fxHistory: parsed.fxHistory||[],
      fxDatabase: parsed.fxDatabase||{},
      paymentTypes: (parsed.paymentTypes && parsed.paymentTypes.length) ? parsed.paymentTypes : DEFAULT_DATA.paymentTypes.slice(),
      creditCardSettings: parsed.creditCardSettings||{},
      creditCardDebts: parsed.creditCardDebts||[],
      marketYieldCurve: parsed.marketYieldCurve||null,
      taxDeductions: parsed.taxDeductions||[],
      trash: parsed.trash||[],
      deletedGenerated: parsed.deletedGenerated||[]
    };
    // L'orario di sincronizzazione NON va preso dal file: il file viene caricato
    // prima che il mittente aggiorni il proprio orario, quindi contiene sempre un
    // valore vecchio. La verità è l'ora di modifica del file su Drive: senza questa
    // correzione il confronto continuava a vedere Drive come più recente e l'avviso
    // di conflitto si ripresentava all'infinito.
    if (remoteFile && remoteFile.modifiedTime) {
      data.settings.lastDriveSync = remoteFile.modifiedTime;
    } else {
      data.settings.lastDriveSync = new Date().toISOString();
    }
    // Appena scaricato, il locale coincide con il remoto: non c'è nulla in sospeso.
    data.settings.lastLocalChange = null;
    data.settings.driveConflictPending = null;
    ensureLiquidityCategories();
    persistLocalOnly();
    if (statusEl) statusEl.textContent = "Dati aggiornati da Google Drive.";
    updateSyncBadge();
    if (document.getElementById("driveStatus")) renderDrive();
    else if (currentTabId === 'dashboard') renderDashboard();
  } catch (err) {
    if (statusEl) statusEl.textContent = "Errore nello scaricamento da Drive.";
  }
}

  if (s.lastDriveSync) {
    const t = new Date(s.lastDriveSync);
    el.textContent = `· Drive sincronizzato ${t.toLocaleTimeString("it-IT",{hour:'2-digit',minute:'2-digit'})}`;

function renameCategory(group, oldName, newName) {
  if (!newName || newName === oldName) return;
  if (data.categories[group].includes(newName)) {
    alert(`Esiste già una categoria "${newName}" in questo gruppo — rinomina di "${oldName}" annullata.`);
    return;
  }
  const idx = data.categories[group].indexOf(oldName);
  if (idx >= 0) data.categories[group][idx] = newName;
  if (data.categoryBudgets[group] && oldName in data.categoryBudgets[group]) {
    data.categoryBudgets[group][newName] = data.categoryBudgets[group][oldName];
    delete data.categoryBudgets[group][oldName];
  }
  if (data.categoryMacroMap[group] && oldName in data.categoryMacroMap[group]) {
    data.categoryMacroMap[group][newName] = data.categoryMacroMap[group][oldName];
    delete data.categoryMacroMap[group][oldName];
  }
  const field = group === "portfolio" ? "type" : "category";
  (data[group] || []).forEach(e => { if (e[field] === oldName) e[field] = newName; });
  (data.recurring[group] || []).forEach(r => {
    if (group === "portfolio") { if (r.type === oldName) r.type = newName; }
    else { if (r.category === oldName) r.category = newName; }
  });
}
function renameMacroField(group, oldName, newName) {
  if (!newName || newName === oldName) return;
  if ((data.macroCategories[group]||[]).includes(newName)) {
    alert(`Esiste già la macro-categoria "${newName}" — rinomina di "${oldName}" annullata.`);
    return;
  }
  const idx = data.macroCategories[group].indexOf(oldName);
  if (idx >= 0) data.macroCategories[group][idx] = newName;
  (data[group] || []).forEach(e => { if (e.macro === oldName) e.macro = newName; });
}

// Etichette uniche in tutta l'app: la stessa informazione deve chiamarsi allo
// stesso modo in ogni sezione, altrimenti diventa impossibile ritrovarla.
const LABEL_CODICE = "Codice titolo";
const LABEL_ENTE = "Societa/Ente (di proprieta/gestione/emittente)";

const CORS_PROXIES = [
  url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
  url => "https://corsproxy.io/?url=" + encodeURIComponent(url),
  url => "https://r.jina.ai/" + url,
];
async function fetchViaProxies(targetUrl) {
  const errors = [];
  for (const buildUrl of CORS_PROXIES) {
    try {
      const res = await fetch(buildUrl(targetUrl));
      if (!res.ok) { errors.push("HTTP " + res.status); continue; }
      const text = await res.text();
      if (text && text.length > 50) return text;
      errors.push("risposta vuota");
    } catch (e) {
      errors.push(String(e.message||e).slice(0,60));
    }
  }
  throw new Error("Tutti i servizi di recupero hanno fallito (" + errors.join(" · ") + ")");
}

// Il contenuto arriva da proxy diversi che restituiscono formati diversi:
// allorigins/corsproxy danno HTML grezzo, r.jina.ai una conversione testuale.
// Normalizzare qui evita di applicare la stessa regex a strutture diverse.
function normalizeFetchedPage(raw) {
  let t = String(raw || "");
  const looksHtml = /<\s*(table|tr|td|div|html|body)\b/i.test(t);
  if (looksHtml) {
    t = t.replace(/<script[\s\S]*?<\/script>/gi, " ")
         .replace(/<style[\s\S]*?<\/style>/gi, " ")
         .replace(/<[^>]+>/g, " ");           // via i tag, resta il testo delle celle
  } else {
    t = t.replace(/\|/g, " ").replace(/[*_`#]+/g, " "); // markdown di r.jina.ai
  }
  t = t.replace(/&nbsp;/gi, " ").replace(/&amp;/gi, "&");
  return { text: t.replace(/[ \t]+/g, " "), format: looksHtml ? "html" : "testo" };
}

// Un prezzo accettabile deve essere un numero finito e positivo entro limiti sensati.
function isPlausiblePriceValue(v) {
  return isFinite(v) && v > 0 && v < 100000000;
}

// Traccia l'esito di ogni tentativo di aggiornamento, non solo il prezzo:
// serve a sapere da quanto tempo un dato non viene più aggiornato davvero.
function recordPriceFetchOutcome(lots, ok, errorMsg) {
  const stamp = new Date().toISOString();
  lots.forEach(pos => {
    if (ok) { pos.lastPriceFetchOk = stamp; pos.lastPriceFetchError = null; }
    else { pos.lastPriceFetchFail = stamp; pos.lastPriceFetchError = errorMsg || "errore sconosciuto"; }
  });
}
// Giorni trascorsi dall'ultimo aggiornamento riuscito (null se non è mai riuscito).
function daysSincePriceFetch(pos) {
  if (!pos || !pos.lastPriceFetchOk) return null;
  const t = new Date(pos.lastPriceFetchOk).getTime();
  if (!isFinite(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
const PRICE_STALE_DAYS = 30;
// Riga di stato da mostrare accanto al fondo nel riepilogo.
function priceFreshnessLabel(pos) {
  if (!pos) return null;
  const d = daysSincePriceFetch(pos);
  if (pos.lastPriceFetchError && (d === null || (pos.lastPriceFetchFail || "") > (pos.lastPriceFetchOk || ""))) {
    return { cls: "down", text: d === null
      ? `mai aggiornato dal sito — ${pos.lastPriceFetchError}`
      : `ultimo aggiornamento riuscito ${d} giorni fa — ultimo tentativo fallito: ${pos.lastPriceFetchError}` };
  }
  if (d === null) return null;
  const when = d === 0 ? "oggi" : d === 1 ? "ieri" : `${d} giorni fa`;
  return { cls: d >= PRICE_STALE_DAYS ? "down" : "up",
    text: d >= PRICE_STALE_DAYS ? `aggiornato ${when} — verifica manualmente` : `aggiornato ${when}` };
}

const PRICE_CHANGE_ALERT_PCT = 15;
// Confronta il prezzo appena letto con l'ultimo noto. Una variazione enorme non è
// un rendimento: è quasi sempre un numero sbagliato catturato da un layout cambiato.
function assessPriceChange(newPrice, previousPrice) {
  if (!isPlausiblePriceValue(previousPrice)) return { suspicious: false, changePct: null };
  const changePct = (newPrice - previousPrice) / previousPrice * 100;
  return { suspicious: Math.abs(changePct) > PRICE_CHANGE_ALERT_PCT, changePct, previousPrice };
}

// Ritaglia la riga della tabella che appartiene a questo fondo: la riga finisce
// dove comincia quella del fondo successivo. Senza questo taglio una finestra fissa
// sconfina nella riga dopo e fa sembrare ambiguo ciò che ambiguo non è.
function sliceFundRow(text, startIdx, selfName, knownNames, maxLen) {
  let end = startIdx + (maxLen || 400);
  (knownNames || []).forEach(other => {
    if (!other || other.toLowerCase() === String(selfName).toLowerCase()) return;
    const esc = other.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const m = text.slice(startIdx + selfName.length).search(new RegExp(esc, "i"));
    if (m !== -1) {
      const abs = startIdx + selfName.length + m;
      if (abs < end) end = abs;
    }
  });
  return text.slice(startIdx, end);
}

async function fetchRaiffeisenFundPrice(fundName) {
  const target = "https://www.raiffeisen-invest.al/sq/performanca-e-fondeve.html";
  const { text, format } = normalizeFetchedPage(await fetchViaProxies(target));
  const nameEscaped = fundName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // Il nome può comparire più volte (menu, testi descrittivi, legende) prima della
  // riga vera della tabella: si provano tutte le occorrenze e si tiene la prima che
  // porta a un prezzo valido, invece di fermarsi ciecamente alla prima.
  const occorrenze = tutteLeOccorrenze(text, nameEscaped);
  if (!occorrenze.length) throw new Error(`Non ho trovato "${fundName}" nella pagina (nome diverso o formato cambiato?)`);
  let ultimoErrore = null;
  for (const idx of occorrenze) {
    try {
      return estraiPrezzoRaiffeisen(text, idx, fundName, format);
    } catch (e) { ultimoErrore = e; }
  }
  throw ultimoErrore;
}

// Posizioni di tutte le occorrenze di un nome dentro il testo.
function tutteLeOccorrenze(text, nameEscaped) {
  const out = [];
  const re = new RegExp(nameEscaped, "gi");
  let m;
  while ((m = re.exec(text)) !== null) {
    out.push(m.index);
    if (m.index === re.lastIndex) re.lastIndex++;
    if (out.length > 50) break;
  }
  return out;
}

function estraiPrezzoRaiffeisen(text, idx, fundName, format) {
  // Finestra di testo che appartiene a questa riga della tabella.
  const window = sliceFundRow(text, idx, fundName, RAIFFEISEN_FUNDS, 400);

  // Ambiguità: se nella finestra ci sono più candidati prezzo, la struttura non è
  // più quella attesa. Meglio fermarsi che scegliere il primo a caso.
  let candidates = [...window.matchAll(/([\d,]+\.\d{2,4})\s*(ALL|EUR)\b/gi)];
  if (candidates.length === 0) {
    throw new Error(`Trovato "${fundName}" ma nessun prezzo riconoscibile accanto: il layout del sito è probabilmente cambiato.`);
  }
  // Nella riga compare anche il patrimonio del fondo (miliardi di lek), che non è
  // un prezzo per quota. Il prezzo di una quota sta in un ordine di grandezza
  // ragionevole: scartare gli importi enormi elimina l'ambiguità senza indovinare.
  if (candidates.length > 1) {
    const soloPrezzi = candidates.filter(m => {
      const v = parseFloat(m[1].replace(/,/g, ""));
      return isFinite(v) && v > 0 && v < 1000000;
    });
    if (soloPrezzi.length >= 1) candidates = soloPrezzi;
  }
  if (candidates.length > 1) {
    const vals = candidates.slice(0,3).map(x=>x[1]).join(", ");
    throw new Error(`Nella riga di "${fundName}" ci sono più valori possibili (${vals}): il layout del sito è cambiato, non indovino quale sia il prezzo.`);
  }

  const price = parseFloat(candidates[0][1].replace(/,/g, ""));
  const currency = candidates[0][2].toUpperCase();
  if (!isPlausiblePriceValue(price)) throw new Error(`Prezzo non plausibile letto per "${fundName}": ${candidates[0][1]}`);

  // Secondo segnale obbligatorio: la "Data e vlerësimit" sta fra il nome e il prezzo.
  // Se manca, la struttura non è quella che credo di conoscere: non mi fido del prezzo.
  const beforePrice = window.slice(0, candidates[0].index);
  const dm = beforePrice.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if (!dm) {
    throw new Error(`Ho letto un prezzo per "${fundName}" ma non la data di valutazione nella posizione attesa: il layout è cambiato e il prezzo potrebbe essere il numero sbagliato.`);
  }
  const evalDate = `${dm[3]}-${dm[2]}-${dm[1]}`;
  return { price, currency, evalDate, sourceFormat: format };
}

async function fetchAlbsigFundPrice(fundName) {
  const target = "https://www.albsiginvest.al/performanca-e-fondeve/";
  const { text, format } = normalizeFetchedPage(await fetchViaProxies(target));
  const nameEscaped = fundName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const occorrenze = tutteLeOccorrenze(text, nameEscaped);
  if (!occorrenze.length) throw new Error(`Non ho trovato "${fundName}" nella pagina (nome diverso o formato cambiato?)`);
  let ultimoErrore = null;
  for (const idx of occorrenze) {
    try {
      return estraiPrezzoAlbsig(text, idx, fundName, format);
    } catch (e) { ultimoErrore = e; }
  }
  throw ultimoErrore;
}

function estraiPrezzoAlbsig(text, idx, fundName, format) {
  const window = sliceFundRow(text, idx, fundName, ALBSIG_FUNDS, 300);
  // Struttura AlbSig: ... VNA (2 decimali) PREZZO (4 decimali) ... percentuali ... Datë Vlerësim
  const pairs = [...window.matchAll(/([\d,]+\.\d{2})\s+([\d,]+\.\d{4})/g)];
  if (pairs.length === 0) {
    throw new Error(`Trovato "${fundName}" ma nessuna coppia VNA/prezzo riconoscibile: il layout del sito è probabilmente cambiato.`);
  }
  if (pairs.length > 1) {
    throw new Error(`Nella riga di "${fundName}" ci sono più coppie di valori possibili: il layout del sito è cambiato, non indovino quale sia il prezzo.`);
  }

  const price = parseFloat(pairs[0][2].replace(/,/g, ""));
  if (!isPlausiblePriceValue(price)) throw new Error(`Prezzo non plausibile letto per "${fundName}": ${pairs[0][2]}`);

  // "Datë Vlerësim" è l'ultima colonna, DOPO il prezzo e dopo le percentuali di
  // rendimento. Cercare solo dopo il prezzo evita di prendere la "Data fillimi",
  // che invece sta prima.
  const afterPrice = window.slice(pairs[0].index + pairs[0][0].length, pairs[0].index + pairs[0][0].length + 400);
  const dm = afterPrice.match(/(\d{2})[.\/](\d{2})[.\/](\d{4})/);
  const evalDate = dm ? `${dm[3]}-${dm[2]}-${dm[1]}` : null;
  return { price, currency: "ALL", evalDate, sourceFormat: format };
}

async function fetchFundPrice(fundName) {
  if (ALBSIG_FUNDS.includes(fundName)) return fetchAlbsigFundPrice(fundName);
  return fetchRaiffeisenFundPrice(fundName);
}

async function fetchBoaRate() {
  const target = "https://www.bankofalbania.org/Markets/Official_exchange_rate/";
  const html = await fetchViaProxies(target);
  const extract = (code) => {
    const re = new RegExp(code + "[^0-9]{1,300}?(\\d{1,3}[.,]\\d{1,4})");
    const m = html.match(re);
    return m ? parseFloat(m[1].replace(",", ".")) : null;
  };
  const eur = extract("EUR");
  const usd = extract("USD");
  if (!eur && !usd) throw new Error("Dati non trovati nella pagina (formato cambiato?)");
  return { eur, usd };
}

function fxDbGet() {
  if (!data.fxDatabase) data.fxDatabase = {};
  return data.fxDatabase;
}
function fxDbSetRate(dateStr, eur, usd) {
  const db = fxDbGet();
  const existing = db[dateStr] || { eur: null, usd: null };
  db[dateStr] = { eur: (eur!=null ? eur : existing.eur), usd: (usd!=null ? usd : existing.usd) };
}
function retroactiveFxCorrection() {
  let changed = 0;
  data.expenses.forEach(e => {
    if (!e.fxRateApprox || !e.fxTargetDate || !e.fxOrigCurrency || e.fxOrigAmount==null) return;
    const fxInfo = getFxRateForDateDetailed(e.fxTargetDate, e.fxOrigCurrency);
    if (!fxInfo.exact) return;
    const newAmountALL = e.fxOrigAmount * fxInfo.rate;
    e.amount = newAmountALL;
    e.fxRateApprox = false;
    e.fxRateUsedDate = fxInfo.usedDate;
    e.note = `${(e.note||'').split(' (al')[0].split(' (')[0]} (${fmt(e.fxOrigAmount)} ${e.fxOrigCurrency} al cambio ${fxInfo.rate})`.trim();
    removeLiquidityAdjustment(e.id);
    createLiquidityAdjustment("Banca", -newAmountALL, e.date, `Tassazione (corretta) ${e.note}`, e.id);
    changed++;
  });
  data.income.forEach(i => {
    if (!i.fxRateApprox || !i.fxTargetDate || !i.fxOrigCurrency || i.fxOrigAmount==null) return;
    const fxInfo = getFxRateForDateDetailed(i.fxTargetDate, i.fxOrigCurrency);
    if (!fxInfo.exact) return;
    i.amount = i.fxOrigAmount * fxInfo.rate;
    i.fxRateApprox = false;
    i.fxRateUsedDate = fxInfo.usedDate;
    changed++;
  });
  if (changed>0) saveData();
  return changed;
}

function fxDbForwardFill() {
  const db = fxDbGet();
  const dates = Object.keys(db).sort();
  if (dates.length < 2) return;
  let last = null;
  const start = new Date(dates[0]);
  const end = new Date(dates[dates.length-1]);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
    const ds = localDateStr(d);
    if (db[ds]) { last = db[ds]; }
    else if (last) { db[ds] = { eur: last.eur, usd: last.usd, filled: true }; }
  }
}
function getFxRateForDate(dateStr, currency) {
  const db = fxDbGet();
  if (db[dateStr]) {
    const v = currency === "USD" ? db[dateStr].usd : db[dateStr].eur;
    if (v) return v;
  }
  const dates = Object.keys(db).filter(d => d <= dateStr).sort();
  if (dates.length) {
    const v = currency === "USD" ? db[dates[dates.length-1]].usd : db[dates[dates.length-1]].eur;
    if (v) return v;
  }
  return currency === "USD" ? data.settings.fxUsd : data.settings.fx;
}
function getFxRateForDateDetailed(dateStr, currency) {
  const db = fxDbGet();
  if (db[dateStr]) {
    const v = currency === "USD" ? db[dateStr].usd : db[dateStr].eur;
    if (v) return { rate: v, exact: true, usedDate: dateStr };
  }
  const priorDates = Object.keys(db).filter(d => d <= dateStr).sort();
  if (priorDates.length) {
    const dd = priorDates[priorDates.length-1];
    const v = currency === "USD" ? db[dd].usd : db[dd].eur;
    if (v) return { rate: v, exact: false, usedDate: dd };
  }
  const allDates = Object.keys(db).sort();
  if (allDates.length) {
    const dd = allDates[0];
    const v = currency === "USD" ? db[dd].usd : db[dd].eur;
    if (v) return { rate: v, exact: false, usedDate: dd };
  }
  return { rate: currency === "USD" ? data.settings.fxUsd : data.settings.fx, exact: false, usedDate: null };
}

async function importBoaCsv(file) {
  const buf = await file.arrayBuffer();
  let text;
  try { text = new TextDecoder("windows-1252").decode(buf); }
  catch(e) { text = new TextDecoder("utf-8").decode(buf); }
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
  let currency = null;
  const curLine = lines.find(l => /monedha/i.test(l));
  if (curLine) {
    if (/eur/i.test(curLine)) currency = "EUR";
    else if (/usd/i.test(curLine)) currency = "USD";
  }
  if (!currency) throw new Error("Non ho capito quale valuta rappresenta il file (manca la riga 'Monedha e zgjedhur').");
  const dateRe = /^(\d{2})\.(\d{2})\.(\d{4}),\s*([\d.,]+)/;
  let count = 0;
  lines.forEach(l => {
    const m = l.match(dateRe);
    if (!m) return;
    const [, d, mo, y, rateStr] = m;
    const dateStr = `${y}-${mo}-${d}`;
    const rate = parseFloat(rateStr.replace(",", "."));
    if (isNaN(rate)) return;
    fxDbSetRate(dateStr, currency==="EUR"?rate:null, currency==="USD"?rate:null);
    count++;
  });
  if (count === 0) throw new Error("Nessuna riga data/tasso riconosciuta nel file.");
  fxDbForwardFill();
  saveData();
  return { count, currency };
}

async function importFxHistoryXLSX(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
  let headerRowIdx = -1, dateCol = -1, eurCol = -1, usdCol = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const row = rows[i].map(c => String(c).toUpperCase());
    const dc = row.findIndex(c => c.includes("DAT") || c.includes("DATE"));
    const ec = row.findIndex(c => c === "EUR" || c.includes("EUR"));
    const uc = row.findIndex(c => c === "USD" || c.includes("USD"));
    if (dc >= 0 && (ec >= 0 || uc >= 0)) { headerRowIdx = i; dateCol = dc; eurCol = ec; usdCol = uc; break; }
  }
  if (headerRowIdx === -1) throw new Error("Non ho trovato intestazioni riconoscibili (Data/EUR/USD) nel file.");
  let count = 0;
  for (let i = headerRowIdx+1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row[dateCol]) continue;
    let dateStr = null;
    const raw = row[dateCol];
    const m = String(raw).match(/(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{4})/);
    if (m) dateStr = `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    else { const d = new Date(raw); if (!isNaN(d)) dateStr = localDateStr(d); }
    if (!dateStr) continue;
    const eur = eurCol>=0 ? parseFloat(String(row[eurCol]).replace(",",".")) : null;
    const usd = usdCol>=0 ? parseFloat(String(row[usdCol]).replace(",",".")) : null;
    if (!eur && !usd) continue;
    fxDbSetRate(dateStr, eur||null, usd||null);
    count++;
  }
  fxDbForwardFill();
  saveData();
  return count;
}

// Non duplica i dati reali (reddito, spese, patrimonio restano gli stessi) — solo
// le ipotesi con cui li proietti. Attivare un piano sovrascrive questi stessi campi
// in data.settings: Proiezione FI, Monte Carlo, Numero FIRE continuano a leggerli

const CAMPI_PIANO_IPOTESI = ["savingsRateTarget","incomeGrowth2y","centralRet","withdrawalRate",
  "tassoPrivoRischio","rischioObiettivo","inflationPct","horizon","expenseBase","expenseGrowth",

function salvaPianoIpotesi(nome, idEsistente) {
  const s = data.settings;
  const piano = { id: idEsistente || uid(), nome };
  CAMPI_PIANO_IPOTESI.forEach(k => { piano[k] = (k === "targetAllocation") ? Object.assign({}, s[k]||{}) : s[k]; });
  if (!s.pianiIpotesi) s.pianiIpotesi = [];
  const idx = s.pianiIpotesi.findIndex(p => p.id === piano.id);
  if (idx !== -1) s.pianiIpotesi[idx] = piano; else s.pianiIpotesi.push(piano);
  s.pianoIpotesiAttivo = piano.id;
  return piano;
}
function attivaPianoIpotesi(id) {
  const piano = (data.settings.pianiIpotesi||[]).find(p => p.id === id);
  if (!piano) return false;
  CAMPI_PIANO_IPOTESI.forEach(k => { data.settings[k] = (k === "targetAllocation") ? Object.assign({}, piano[k]||{}) : piano[k]; });
  data.settings.pianoIpotesiAttivo = id;
  return true;
}
function eliminaPianoIpotesi(id) {
  data.settings.pianiIpotesi = (data.settings.pianiIpotesi||[]).filter(p => p.id !== id);
  if (data.settings.pianoIpotesiAttivo === id) data.settings.pianoIpotesiAttivo = null;
}

const CAT_RLD = "Reddito da Lavoro Dipendente";
const CAT_DEDUZIONE_FP = "Deduzione Fiscale da Fondo Pensione";
const CAT_CONTR_PENS = "Contributo Pensionistico da RLD";
const CAT_CONTR_SAN = "Contributo Sanitario da RLD";
const CAT_TASSA_RLD = "Tassazione da RLD";
const MACRO_LAVORO = "Lavoro";

function cfgLavoro() {
  const predefinita = JSON.parse(JSON.stringify(DEFAULT_DATA.settings.lavoroDipendente));
  const attuale = data.settings.lavoroDipendente;
  if (!attuale) {
    data.settings.lavoroDipendente = predefinita;
    return data.settings.lavoroDipendente;
  }
  // Una configurazione salvata da una versione precedente può non avere tutte le
  // chiavi: senza questo completamento mancherebbero gli scaglioni e il calcolo
  // dell'imposta manderebbe in errore l'intera Panoramica.
  Object.keys(predefinita).forEach(k => {
    if (attuale[k] === undefined || attuale[k] === null && Array.isArray(predefinita[k])) {
      attuale[k] = predefinita[k];
    }
  });
  if (!Array.isArray(attuale.scaglioni) || !attuale.scaglioni.length) {
    attuale.scaglioni = predefinita.scaglioni;
  }
  return attuale;
}

// Toglie il rumore della virgola mobile prima degli arrotondamenti.
function arrotondaCentesimi(v) { return Math.round((Number(v) || 0) * 100) / 100; }

// Imposta sul reddito secondo gli scaglioni configurati.
function calcolaTassaScaglioni(base, scaglioni) {
  const b = Number(base) || 0;
  const sc = (scaglioni && scaglioni.length) ? scaglioni : cfgLavoro().scaglioni;
  for (const s of sc) {
    const limite = (s.fino === null || s.fino === undefined) ? Infinity : Number(s.fino);
    if (b <= limite) {
      const imponibile = Math.max(0, b - (Number(s.sottrai) || 0));
      return (Number(s.fisso) || 0) + imponibile * (Number(s.aliquota) || 0) / 100;
    }
  }
  return 0;
}

// Tutte le voci della busta paga per un dato lordo.
// Elenco degli stipendi configurati, in ordine di inserimento.
function stipendiLavoro() {
  const c = cfgLavoro();
  if (!Array.isArray(c.stipendi)) c.stipendi = [];
  // Migrazione dal modello a stipendio unico: il vecchio pannello diventa il primo
  // rapporto di lavoro dell'elenco, senza perdere la configurazione.
  if (c.stipendi.length === 0 && Number(c.stipendioLordo) > 0) {
    c.stipendi.push({
      id: "rld-principale", attivo: !!c.attivo,
      issuerName: c.datoreLavoro || "",
      securityCode: (c.codiceRLD || "").trim() || peekNextSecurityCode(),
      riskFactor: 2,
      stipendioLordo: Number(c.stipendioLordo) || 0,
      giornoPaga: Number(c.giornoPaga) || 10,
      startMonth: c.startMonth || thisMonth,
      paymentType: "Banca"
    });
  }
  return c.stipendi;
}
function stipendiAttivi() {
  return stipendiLavoro().filter(s => s.attivo && Number(s.stipendioLordo) > 0);
}

// Busta paga di TUTTI gli stipendi con cumulo fiscale e contributivo.
// Il secondo stipendio non riparte da zero: entra nella fascia raggiunta dal primo,
// e se il massimale contributivo è già esaurito i suoi contributi pensionistici
// sono nulli. È il comportamento reale di chi ha più rapporti di lavoro.
function calcolaBustePagaCumulate(elenco) {
  const c = cfgLavoro();
  const lista = elenco || stipendiAttivi();
  const massimale = Number(c.massimaleContributivo) || 0;
  const pct = (v, d) => (v === null || v === undefined || v === "") ? d : Number(v);
  let cumulLordo = 0, cumulBaseContributiva = 0;
  const righe = lista.map(s => {
    const lordo = Number(s.stipendioLordo) || 0;
    // base contributiva residua fino al massimale
    const residuo = massimale > 0 ? Math.max(0, massimale - cumulBaseContributiva) : lordo;
    const baseContributiva = massimale > 0 ? Math.min(lordo, residuo) : lordo;
    // tassazione marginale sul cumulo
    const tassaPrima = calcolaTassaScaglioni(cumulLordo, c.scaglioni);
    const tassaDopo = calcolaTassaScaglioni(cumulLordo + lordo, c.scaglioni);
    const t1 = arrotondaCentesimi(tassaDopo - tassaPrima);

    const p1 = baseContributiva * pct(c.pctPensioneDatore, 0) / 100;
    const s1 = lordo * pct(c.pctSanitaDatore, 0) / 100;
    const p2 = baseContributiva * pct(c.pctPensioneLavoratore, 0) / 100;
    const s2 = lordo * pct(c.pctSanitaLavoratore, 0) / 100;
    const nettoEsatto = arrotondaCentesimi(lordo - p2 - s2 - t1);

    cumulLordo += lordo;
    cumulBaseContributiva += baseContributiva;
    return { stipendio: s, lordo, baseContributiva, p1, s1, p2, s2, t1,
      nettoEsatto, netto: Math.ceil(nettoEsatto), costoDatore: lordo + p1 + s1 };
  });
  const tot = righe.reduce((a,r) => ({
    lordo: a.lordo + r.lordo, p1: a.p1 + r.p1, s1: a.s1 + r.s1,
    p2: a.p2 + r.p2, s2: a.s2 + r.s2, t1: a.t1 + r.t1, nettoEsatto: a.nettoEsatto + r.nettoEsatto
  }), { lordo:0, p1:0, s1:0, p2:0, s2:0, t1:0, nettoEsatto:0 });
  tot.netto = Math.ceil(tot.nettoEsatto);
  return { righe, totale: tot, cumulLordo };
}

function calcolaBustaPaga(lordoOverride) {
  const c = cfgLavoro();
  const lordo = Number(lordoOverride != null ? lordoOverride : c.stipendioLordo) || 0;
  const massimale = Number(c.massimaleContributivo) || 0;
  const baseCap = massimale > 0 ? Math.min(lordo, massimale) : lordo;
  const b = (impostata, predefinita) =>
    (impostata === null || impostata === undefined || impostata === "") ? predefinita : Number(impostata);

  const basi = {
    pensioneDatore: b(c.basePensioneDatore, baseCap),
    sanitaDatore: b(c.baseSanitaDatore, lordo),
    pensioneLavoratore: b(c.basePensioneLavoratore, baseCap),
    sanitaLavoratore: b(c.baseSanitaLavoratore, lordo),
    tassazione: b(c.baseTassazione, lordo)
  };
  const p1 = basi.pensioneDatore * (Number(c.pctPensioneDatore)||0) / 100;
  const s1 = basi.sanitaDatore * (Number(c.pctSanitaDatore)||0) / 100;
  const p2 = basi.pensioneLavoratore * (Number(c.pctPensioneLavoratore)||0) / 100;
  const s2 = basi.sanitaLavoratore * (Number(c.pctSanitaLavoratore)||0) / 100;
  const t1 = calcolaTassaScaglioni(basi.tassazione, c.scaglioni);
  const nettoEsatto = arrotondaCentesimi(lordo - p2 - s2 - t1);
  return { lordo, basi, p1, s1, p2, s2, t1,
    nettoEsatto, netto: Math.ceil(nettoEsatto),   // per eccesso
    costoDatore: lordo + p1 + s1 };
}

// Versamenti ai soli Fondo pensione nel mese indicato (chiave AAAA-MM).
function versamentiFondoPensione(meseKey) {
  return data.portfolio
    .filter(p => String(p.type||"").toLowerCase() === "fondo pensione"
      && Number(p.amount) > 0 && p.date && p.date.slice(0,7) === meseKey)
    .reduce((s,p) => s + toALL(Number(p.amount), p.currency||"ALL"), 0);
}

// Risparmio fiscale dei versamenti di un mese: differenza fra la tassa sul lordo
// e quella sul lordo ridotto dei versamenti, limitati al tetto mensile.
function calcolaDeduzioneFondoPensione(meseVersamenti) {
  const c = cfgLavoro();
  const versato = versamentiFondoPensione(meseVersamenti);
  const tetto = Number(c.tettoDeduzioneMensile) || 0;
  const ammesso = tetto > 0 ? Math.min(versato, tetto) : versato;
  if (ammesso <= 0) return { versato, ammesso: 0, risparmioEsatto: 0, risparmio: 0 };
  // La base è il CUMULO di tutti gli stipendi attivi: il risparmio dipende dalla
  // fascia complessiva raggiunta, non da un singolo rapporto di lavoro.
  const cumulo = calcolaBustePagaCumulate().cumulLordo;
  if (!(cumulo > 0)) return { versato, ammesso, risparmioEsatto: 0, risparmio: 0 };
  const tassaPiena = calcolaTassaScaglioni(cumulo, c.scaglioni);
  const tassaRidotta = calcolaTassaScaglioni(Math.max(0, cumulo - ammesso), c.scaglioni);
  // La differenza fra due importi calcolati può dare 11499,999999996 invece di 11500:
  // senza questa correzione l'arrotondamento per difetto perderebbe un lek.
  const risparmioEsatto = Math.max(0, arrotondaCentesimi(tassaPiena - tassaRidotta));
  return { versato, ammesso, risparmioEsatto, risparmio: Math.floor(risparmioEsatto) };  // per difetto
}

// Genera stipendio, contributi, tassa e deduzione per i mesi maturati.
// Il controllo anti-duplicati guarda CATEGORIA e MESE, non il marcatore interno:
// così una voce inserita a mano blocca la generazione automatica e non si finisce
// con due stipendi nello stesso mese.
// Migrazione una tantum al Sistema Lavoro Dipendente: rinomina la categoria dello
// stipendio ovunque (compresi budget, macro e regole ricorrenti) e cancella le voci
// registrate col vecchio nome insieme a tutto ciò che ne discendeva.
function migraLavoroDipendente() {
  if (data.settings.migrazioneRLD) return false;
  const vecchia = "Reddito principale";
  let tocc = false;

  // voci da eliminare, con i movimenti bancari collegati
  const daEliminare = data.income.filter(i => i.category === vecchia);
  const idsEliminati = new Set(daEliminare.map(i => i.id));
  if (daEliminare.length) {
    data.income = data.income.filter(i => i.category !== vecchia);
    data.portfolio = data.portfolio.filter(p => !(p.linkedTxnId && idsEliminati.has(p.linkedTxnId)));
    tocc = true;
  }
  // deduzioni generate dal vecchio sistema, con i loro accrediti
  const nomiDeduzioni = new Set((data.taxDeductions||[]).map(d => d.name));
  if (nomiDeduzioni.size) {
    const vecchieDed = data.income.filter(i => nomiDeduzioni.has(i.category));
    const idsDed = new Set(vecchieDed.map(i => i.id));
    if (vecchieDed.length) {
      data.income = data.income.filter(i => !nomiDeduzioni.has(i.category));
      data.portfolio = data.portfolio.filter(p => !(p.linkedTxnId && idsDed.has(p.linkedTxnId)));
      tocc = true;
    }
  }

  // Le vecchie regole di deduzione vanno disattivate: il risparmio fiscale ora lo
  // calcola il pannello dagli scaglioni, e lasciandole attive verrebbe contato due volte.
  if ((data.taxDeductions||[]).length) {
    data.taxDeductions.forEach(r => {
      if (!r.disattivataDaRLD) { r.disattivataDaRLD = true; r.endDate = todayISO; tocc = true; }
    });
  }

  // Assegna il fattore di rischiosità alle posizioni già in portafoglio: senza
  // questo restavano senza valore e ricadevano ogni volta sul predefinito,
  // impedendo di correggerlo una volta per tutte.
  data.portfolio.forEach(p => {
    if (p.riskFactor != null) return;
    if (isDebtType(p.type, p.macro) || isCreditCardType(p.type)) return;
    if (!p.amount || p.amount <= 0) return;
    p.riskFactor = rischioPredefinito(p);
    tocc = true;
  });
  (data.income||[]).forEach(i => {
    if (i.riskFactor == null && Number(i.amount) > 0) { i.riskFactor = 2; tocc = true; }
  });

  // Le voci generate dal vecchio modello a stipendio unico vanno collegate al
  // primo rapporto di lavoro, altrimenti il motore le rigenererebbe.
  (data.income||[]).forEach(i => {
    if (i.category === CAT_RLD && i.generatoDaRLD && !i.rldId) { i.rldId = "rld-principale"; tocc = true; }
  });

  // Il vecchio campo "issuer" è stato sostituito dalla casella unica Societa/Ente:
  // il valore già registrato va travasato, altrimenti andrebbe perso.
  data.portfolio.forEach(p => {
    if (p.issuer && !p.issuerName) { p.issuerName = p.issuer; tocc = true; }
    if (p.issuer !== undefined && !isDebtType(p.type, p.macro)) { delete p.issuer; tocc = true; }
  });

  // rinomina ovunque la categoria residua
  const rinomina = obj => { if (obj && obj[vecchia] !== undefined) { obj[CAT_RLD] = obj[vecchia]; delete obj[vecchia]; return true; } return false; };
  data.categories.income = data.categories.income.map(x => x === vecchia ? CAT_RLD : x);
  if (!data.categories.income.includes(CAT_RLD)) data.categories.income.push(CAT_RLD);
  data.categories.income = [...new Set(data.categories.income)];
  if (rinomina(data.categoryMacroMap.income)) tocc = true;
  if (rinomina(data.categoryBudgets.income)) tocc = true;
  data.categoryMacroMap.income[CAT_RLD] = MACRO_LAVORO;
  // Lo stipendio ora lo genera il pannello Lavoro Dipendente: la vecchia regola
  // ricorrente va rimossa, non solo rinominata, altrimenti verserebbe un secondo
  // stipendio in parallelo ogni mese.
  const primaRic = (data.recurring.income||[]).length;
  data.recurring.income = (data.recurring.income||[]).filter(r => r.category !== vecchia && r.category !== CAT_RLD);
  if ((data.recurring.income||[]).length !== primaRic) tocc = true;
  // e le voci che quella regola aveva già generato, con i relativi accrediti
  const idRegole = new Set();
  (data.income||[]).forEach(i => { if (i.recurringId && (i.category === vecchia || i.category === CAT_RLD)) idRegole.add(i.id); });
  if (idRegole.size) {
    data.income = data.income.filter(i => !idRegole.has(i.id));
    data.portfolio = data.portfolio.filter(x => !idRegole.has(x.linkedTxnId));
    tocc = true;
  }
  (data.income||[]).forEach(i => { if (i.category === vecchia) { i.category = CAT_RLD; i.macro = MACRO_LAVORO; tocc = true; } });

  ensureCategorieLavoro();
  data.settings.migrazioneRLD = true;
  saveData();
  return tocc;
}

function autoGenerateLavoroDipendente() {
  const c = cfgLavoro();
  const attivi = stipendiAttivi();
  if (!c.attivo || attivi.length === 0) return;
  ensureCategorieLavoro();
  let changed = false;

  // Ogni stipendio genera il proprio flusso, ma trattenute e imposta vengono dal
  // calcolo CUMULATO: chi ha due rapporti di lavoro non viene tassato due volte
  // come se ciascuno fosse l'unico.
  const calc = calcolaBustePagaCumulate(attivi);
  const perId = {};
  calc.righe.forEach(r => { perId[r.stipendio.id] = r; });

  attivi.forEach(s => {
    const r = perId[s.id];
    if (!r) return;
    const giorno = Math.min(Math.max(Number(s.giornoPaga) || 10, 1), 28);
    const inizio = s.startMonth || thisMonth;
    const [ay, am] = inizio.split("-").map(Number);
    let cursore = new Date(ay, am - 1, 1);
    const fine = new Date(now.getFullYear(), now.getMonth(), 1);
    let giri = 0;
    while (cursore <= fine && giri++ < 600) {
      const meseKey = `${cursore.getFullYear()}-${String(cursore.getMonth()+1).padStart(2,"0")}`;
      const dataPaga = `${meseKey}-${String(giorno).padStart(2,"0")}`;
      const meseCursore = cursore;
      cursore = new Date(cursore.getFullYear(), cursore.getMonth() + 1, 1);
      if (dataPaga > todayISO) continue;

      const esisteGia = data.income.some(i => i.category === CAT_RLD && i.rldId === s.id
          && i.date && i.date.slice(0,7) === meseKey)
        || eraStataCancellata("rld:" + s.id, meseKey);
      if (esisteGia) continue;

      const idStipendio = uid();
      data.income.push({ id: idStipendio, date: dataPaga, amount: r.lordo, currency: "ALL",
        category: CAT_RLD, macro: MACRO_LAVORO, paymentType: s.paymentType || "Banca",
        note: `Stipendio lordo — ${s.issuerName||""}`.trim(),
        securityCode: s.securityCode || null, issuerName: s.issuerName || "",
        riskFactor: normalizzaRischio(s.riskFactor, { type:"reddito" }),
        generatoDaRLD: true, rldId: s.id });

      const spesa = (cat, importo, nota) => {
        if (!(importo > 0)) return;
        data.expenses.push({ id: uid(), date: dataPaga, amount: importo, category: cat,
          macro: MACRO_LAVORO, note: `${nota} — ${s.issuerName||""}`.trim(),
          securityCode: s.securityCode || null, issuerName: s.issuerName || "",
          generatoDaRLD: true, rldId: s.id });
      };
      spesa(CAT_CONTR_PENS, r.p2, "Trattenuta in busta paga");
      spesa(CAT_CONTR_SAN, r.s2, "Trattenuta in busta paga");
      spesa(CAT_TASSA_RLD, r.t1, "Trattenuta in busta paga");

      createLiquidityAdjustment(s.paymentType || "Banca", r.netto, dataPaga,
        `Stipendio netto — ${s.issuerName||""}`.trim(), idStipendio);
      changed = true;
    }
  });

  // La deduzione da fondo pensione è UNA sola per mese, non una per stipendio:
  // il tetto deducibile vale per l'insieme dei redditi da lavoro.
  const primo = attivi[0];
  if (primo) {
    const giorno = Math.min(Math.max(Number(primo.giornoPaga) || 10, 1), 28);
    const inizio = primo.startMonth || thisMonth;
    const [ay, am] = inizio.split("-").map(Number);
    let cur = new Date(ay, am - 1, 1);
    const fine = new Date(now.getFullYear(), now.getMonth(), 1);
    let giri = 0;
    while (cur <= fine && giri++ < 600) {
      const meseKey = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}`;
      const dataPaga = `${meseKey}-${String(giorno).padStart(2,"0")}`;
      const prec = new Date(cur.getFullYear(), cur.getMonth() - 1, 1);
      const mesePrec = `${prec.getFullYear()}-${String(prec.getMonth()+1).padStart(2,"0")}`;
      cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
      if (dataPaga > todayISO) continue;
      if (eraStataCancellata("dedfp", meseKey)) continue;

      const ded = calcolaDeduzioneFondoPensione(mesePrec);
      const esistente = data.income.find(i => i.category === CAT_DEDUZIONE_FP && i.date && i.date.slice(0,7) === meseKey);

      if (!esistente) {
        if (!(ded.risparmio > 0)) continue;
        const idDed = uid();
        data.income.push({ id: idDed, date: dataPaga, amount: ded.risparmio, currency: "ALL",
          category: CAT_DEDUZIONE_FP, macro: MACRO_LAVORO, paymentType: primo.paymentType || "Banca",
          note: `Su ${fmt(ded.ammesso)} versati nel ${mesePrec}`, meseVersamenti: mesePrec,
          securityCode: primo.securityCode || null, issuerName: primo.issuerName || "",
          riskFactor: normalizzaRischio(primo.riskFactor, { type:"reddito" }),
          generatoDaRLD: true });
        createLiquidityAdjustment(primo.paymentType || "Banca", ded.risparmio, dataPaga,
          "Deduzione fiscale fondo pensione", idDed);
        changed = true;
        continue;
      }

      // Non toccare una voce inserita a mano: l'auto-correzione vale solo per
      // quelle che il motore stesso ha generato.
      if (!esistente.generatoDaRLD) continue;

      if (!(ded.risparmio > 0)) {
        // I versamenti di quel mese non giustificano più una deduzione (es. tolti
        // dopo la generazione): si rimuove la voce e l'accredito collegato.
        removeLiquidityAdjustment(esistente.id);
        data.income = data.income.filter(i => i.id !== esistente.id);
        changed = true;
        continue;
      }

      // Voce già generata ma l'importo corretto oggi è diverso da quello congelato
      // allora: succede quando arriva un versamento retroattivo per un mese già
      // "chiuso" (es. uno storico importato dopo). Si corregge sul posto — stesso
      // id, stesso spirito di retroactiveFxCorrection — non si duplica la voce.
      if (Math.abs(Number(esistente.amount) - ded.risparmio) > 0.5) {
        esistente.amount = ded.risparmio;
        esistente.note = `Su ${fmt(ded.ammesso)} versati nel ${mesePrec}`;
        esistente.meseVersamenti = mesePrec;
        removeLiquidityAdjustment(esistente.id);
        createLiquidityAdjustment(primo.paymentType || "Banca", ded.risparmio, dataPaga,
          "Deduzione fiscale fondo pensione (corretta)", esistente.id);
        changed = true;
      }
    }
  }
  if (changed) saveData();
}
function ensureCategorieLavoro() {
  let ok = false;
  if (!data.macroCategories.income.includes(MACRO_LAVORO)) { data.macroCategories.income.push(MACRO_LAVORO); ok = true; }
  if (!data.macroCategories.expenses.includes(MACRO_LAVORO)) { data.macroCategories.expenses.push(MACRO_LAVORO); ok = true; }
  [[CAT_RLD,"income"],[CAT_DEDUZIONE_FP,"income"],
   [CAT_CONTR_PENS,"expenses"],[CAT_CONTR_SAN,"expenses"],[CAT_TASSA_RLD,"expenses"]].forEach(([cat,gruppo]) => {
    if (!data.categories[gruppo].includes(cat)) { data.categories[gruppo].push(cat); ok = true; }
    if (!data.categoryMacroMap[gruppo]) data.categoryMacroMap[gruppo] = {};
    if (data.categoryMacroMap[gruppo][cat] !== MACRO_LAVORO) { data.categoryMacroMap[gruppo][cat] = MACRO_LAVORO; ok = true; }
  });
  return ok;
}

// Pannello di configurazione del Sistema Lavoro Dipendente.
function pannelloLavoroDipendente() {
  // Diviso in due riquadri distinti, ciascuno con la propria responsabilità:
  // gli scaglioni valgono per TUTTI i redditi da lavoro, le ritenute pure.
  // Il riquadro degli stipendi vive invece nella scheda Reddito.
  return riquadroScaglioni() + riquadroRitenute();
}

// --- Riquadro 1: scaglioni di tassazione, unica fonte per tutti i redditi da lavoro
function riquadroScaglioni() {
  const c = cfgLavoro();
  const sc = Array.isArray(c.scaglioni) ? c.scaglioni : [];
  const righe = sc.map((s, i) => `
    <div class="stat-row" style="display:grid; grid-template-columns:1fr 1fr 1fr .8fr; gap:6px; align-items:center;">
      <input type="number" step="0.01" data-scaglione="${i}" data-campo="fino" value="${s.fino === null || s.fino === undefined ? '' : s.fino}" placeholder="nessun limite" style="font-size:11px; padding:4px;">
      <input type="number" step="0.01" data-scaglione="${i}" data-campo="sottrai" value="${s.sottrai || 0}" style="font-size:11px; padding:4px;">
      <input type="number" step="0.01" data-scaglione="${i}" data-campo="fisso" value="${s.fisso || 0}" style="font-size:11px; padding:4px;">
      <input type="number" step="0.01" data-scaglione="${i}" data-campo="aliquota" value="${s.aliquota || 0}" style="font-size:11px; padding:4px;">
    </div>`).join('');
  return `
    <div class="card">
      <h3>Scaglione Tassazione da Reddito Dipendente</h3>
      <div class="subtle">Unica fonte per il calcolo dell'imposta su tutti i redditi da lavoro dipendente.
        Ogni riga: soglia superiore, importo da sottrarre alla base, imposta fissa, aliquota sull'eccedenza.</div>
      <div class="stat-row" style="display:grid; grid-template-columns:1fr 1fr 1fr .8fr; gap:6px;">
        <span class="subtle" style="font-size:10px;">FINO A</span>
        <span class="subtle" style="font-size:10px;">SOTTRAI</span>
        <span class="subtle" style="font-size:10px;">FISSO</span>
        <span class="subtle" style="font-size:10px;">ALIQUOTA %</span>
      </div>
      ${righe}
      <div class="row2" style="margin-top:8px;">
        <button class="secondary" type="button" id="aggiungiScaglione">+ Scaglione</button>
        <button class="secondary" type="button" id="rimuoviScaglione">− Ultimo</button>
      </div>
      <button class="primary" type="button" id="salvaScaglioni" style="margin-top:8px;">Salva scaglioni</button>
    </div>`;
}

      <h3>Ritenute fiscali per i Redditi da lavoro dipendente</h3>

          <div><label>Tetto mensile deducibile da FP</label><input type="number" step="0.01" min="0" name="tettoDeduzioneMensile" value="${n2(c.tettoDeduzioneMensile)}"></div>

        </div>
        <div class="stat-row" style="display:grid; grid-template-columns:1.6fr .9fr; gap:6px; align-items:center;">
          <span class="label" style="font-size:11px;">Sanità datore</span>${pctIn("pctSanitaDatore", c.pctSanitaDatore)}
        </div>
        <div class="stat-row" style="display:grid; grid-template-columns:1.6fr .9fr; gap:6px; align-items:center;">
          <span class="label" style="font-size:11px;">Pensione lavoratore</span>${pctIn("pctPensioneLavoratore", c.pctPensioneLavoratore)}
        </div>
        <div class="stat-row" style="display:grid; grid-template-columns:1.6fr .9fr; gap:6px; align-items:center;">
          <span class="label" style="font-size:11px;">Sanità lavoratore</span>${pctIn("pctSanitaLavoratore", c.pctSanitaLavoratore)}
        </div>
        <div class="subtle" style="margin-top:6px; font-size:10px;">I contributi del datore sono informativi: non generano movimenti.</div>
        <button class="primary" type="submit" style="margin-top:8px;">Salva ritenute</button>
      </form>
    </div>`;
}

function bindPannelloLavoroDipendente() {
  // --- ritenute e massimali ---
  const fr = document.getElementById("formRitenuteRLD");
  if (fr) fr.addEventListener("submit", ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const c = cfgLavoro();
    const n = k => { const v = f.get(k); return (v === null || v === "") ? 0 : Number(v); };
    c.massimaleContributivo = n("massimaleContributivo");
    c.tettoDeduzioneMensile = n("tettoDeduzioneMensile");
    ["pctPensioneDatore","pctSanitaDatore","pctPensioneLavoratore","pctSanitaLavoratore"]
      .forEach(k => c[k] = n(k));
    saveData();
    alert("Ritenute salvate.");
    renderSettings();
  });

  // --- scaglioni ---
  const salva = document.getElementById("salvaScaglioni");
  if (salva) salva.addEventListener("click", () => {
    const c = cfgLavoro();
    document.querySelectorAll("[data-scaglione]").forEach(el => {
      const idx = Number(el.dataset.scaglione);
      const campo = el.dataset.campo;
      if (!c.scaglioni[idx]) return;
      const v = el.value;
      c.scaglioni[idx][campo] = (campo === "fino" && (v === "" || v === null)) ? null : Number(v) || 0;
    });
    saveData();
    alert("Scaglioni salvati.");
    renderSettings();
  });
  const agg = document.getElementById("aggiungiScaglione");
  if (agg) agg.addEventListener("click", () => {
    const c = cfgLavoro();
    c.scaglioni.push({ fino: null, sottrai: 0, aliquota: 0, fisso: 0 });
    saveData(); renderSettings();
  });
  const rim = document.getElementById("rimuoviScaglione");
  if (rim) rim.addEventListener("click", () => {
    const c = cfgLavoro();
    if (c.scaglioni.length <= 1) { alert("Deve restare almeno uno scaglione."); return; }
    if (!confirm("Rimuovere l'ultimo scaglione?")) return;
    c.scaglioni.pop();
    saveData(); renderSettings();
  });
}

          <div><label>Giorno di accredito</label><input type="number" min="1" max="28" name="giornoPaga" value="${s.giornoPaga||10}"></div>

function bindRiquadriStipendi() {
  const leggi = form => {
    const f = new FormData(form);
    const sel = form.querySelector('[name="riskFactor"]');
    return {
      attivo: f.get("attivo") === "on",
      issuerName: (f.get("issuerName")||"").trim(),
      securityCode: (f.get("securityCode")||"").trim(),
      riskFactor: normalizzaRischio(sel ? sel.value : null, { type:"reddito" }),
      stipendioLordo: Number(f.get("stipendioLordo")) || 0,
      giornoPaga: Math.min(Math.max(Number(f.get("giornoPaga")) || 10, 1), 28),
      startMonth: displayToMonth(f.get("startMonth")) || thisMonth,
      paymentType: f.get("paymentType") || "Banca"
    };
  };
  const nuovo = document.getElementById("formNuovoStipendio");
  if (nuovo) nuovo.addEventListener("submit", ev => {
    ev.preventDefault();
    const dati = leggi(ev.target);
    if (!dati.issuerName || dati.stipendioLordo <= 0) { alert("Servono ente e stipendio lordo."); return; }
    assegnaCodiceTitolo(dati.securityCode, null);
    stipendiLavoro().push(Object.assign({ id: uid() }, dati));
    cfgLavoro().attivo = true;
    saveData();
    autoGenerateLavoroDipendente();
    saveData();
    renderIncome();   // il modulo si ripresenta vuoto
  });
  document.querySelectorAll("[data-stipendioform]").forEach(form => {
    form.addEventListener("submit", ev => {
      ev.preventDefault();
      const s = stipendiLavoro().find(x => x.id === form.dataset.stipendioform);
      if (!s) return;
      Object.assign(s, leggi(ev.target));
      saveData();
      autoGenerateLavoroDipendente();
      saveData();
      renderIncome();
    });
  });
  document.querySelectorAll("[data-delstipendio]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.delstipendio;
      const s = stipendiLavoro().find(x => x.id === id);
      if (!s) return;
      if (!confirm(`Eliminare "${s.issuerName||"questo stipendio"}"?\n\nLe voci già registrate restano; non ne verranno generate altre.`)) return;
      const c = cfgLavoro();
      c.stipendi = c.stipendi.filter(x => x.id !== id);
      dimenticaCancellazioni("rld:" + id);
      saveData(); renderIncome();
    });
  });
}

function riquadroRedditoLavoro(anno) {
  const c = cfgLavoro();
  const voci = (data.income||[]).filter(i => i.date && i.date.slice(0,4) === String(anno));
  const somma = (arr) => arr.reduce((s,e) => s + toALL(Number(e.amount), e.currency||"ALL"), 0);
  const lordo = somma(voci.filter(i => i.category === CAT_RLD));
  if (lordo <= 0 && !c.attivo) return "";
  const spese = (data.expenses||[]).filter(e => e.date && e.date.slice(0,4) === String(anno));
  const sp = cat => spese.filter(e => e.category === cat).reduce((s,e) => s + Number(e.amount), 0);
  const pens = sp(CAT_CONTR_PENS), san = sp(CAT_CONTR_SAN), tassa = sp(CAT_TASSA_RLD);
  const netto = Math.ceil(arrotondaCentesimi(lordo - pens - san - tassa));
  // Una riga di lordo per ogni società: con più rapporti di lavoro serve vedere
  // da dove arriva ciascuna quota, non solo il totale.
  const raggr = {};
  voci.filter(i => i.category === CAT_RLD).forEach(i => {
    const ente = (i.issuerName || "").trim() || "senza ente";
    raggr[ente] = (raggr[ente] || 0) + toALL(Number(i.amount), i.currency || "ALL");
  });
  const perEnte = Object.keys(raggr).sort().map(ente => ({ ente, lordo: raggr[ente] }));
  const deduzione = somma(voci.filter(i => i.category === CAT_DEDUZIONE_FP));
  const totale = netto + Math.floor(deduzione);
  const r = (etichetta, valore, cls, grassetto) =>
    `<div class="stat-row"${grassetto?' style="font-weight:600;"':''}><span class="label">${etichetta}</span><span class="val ${cls||''}">${fmtDisplay(valore)}</span></div>`;
  return `
    <div class="card">
      <h3>Reddito da Lavoro Dipendente ${anno}</h3>
      <div class="subtle">Riepilogo della macro-categoria Lavoro. Il netto è arrotondato per eccesso, la deduzione per difetto.</div>
      ${perEnte.map(x => r(`Stipendio lordo — ${x.ente}`, x.lordo)).join('')}
      ${perEnte.length > 1 ? r("Totale lordo", lordo, "", true) : ''}
      ${r("· contributo pensionistico", -pens, "down")}
      ${r("· contributo sanitario", -san, "down")}
      ${r("· tassazione", -tassa, "down")}
      <div class="section-total"><span>Stipendio netto</span><span style="color:#C9A227;">${fmtDisplay(netto)}</span></div>
      ${r("Deduzione fiscale da fondo pensione", Math.floor(deduzione), "up")}
      <div class="section-total"><span>Entrate totali da RLD</span><span style="font-weight:600; color:#3F6E5E;">${fmtDisplay(totale)}</span></div>
    </div>`;
}

function computeAnnualTaxSummary(year) {
  const isTax = c => c.startsWith("Tassa") || c.startsWith("Tassazione");
  const isCommission = c => c.startsWith("Commissione");
  const isOtherFee = c => ["Interessi carta di credito","Interessi prestiti","Interessi MPC","Assicurazione prestito","Penale chiusura deposito","Contributo Pensionistico da RLD","Contributo Sanitario da RLD"].includes(c);
  const yearExpenses = data.expenses.filter(e => e.date && e.date.slice(0,4) === String(year));
  const byCategory = {};
  yearExpenses.forEach(e => {
    if (isTax(e.category) || isCommission(e.category) || isOtherFee(e.category)) {
      byCategory[e.category] = (byCategory[e.category]||0) + Number(e.amount);
    }
  });
  const cats = Object.keys(byCategory);
  const totalTax = cats.filter(isTax).reduce((s,c)=>s+byCategory[c],0);
  const totalCommission = cats.filter(isCommission).reduce((s,c)=>s+byCategory[c],0);
  const totalOther = cats.filter(isOtherFee).reduce((s,c)=>s+byCategory[c],0);
  return { year, totalTax, totalCommission, totalOther, total: totalTax+totalCommission+totalOther,
    byCategory: cats.map(c=>({category:c, amount:byCategory[c]})).sort((a,b)=>b.amount-a.amount) };
}
function computeMultiYearTaxSummary(maxYears) {
  const all = [...(data.expenses||[]), ...(data.income||[])]
    .map(e => e.date && e.date.slice(0,4)).filter(Boolean);
  if (!all.length) return [];
  const years = [...new Set(all)].map(Number).filter(y => isFinite(y)).sort((a,b)=>b-a);
  const limit = maxYears || 6;
  return years.slice(0, limit).map(y => {
    const s = computeAnnualTaxSummary(y);
    const incomeThatYear = (data.income||[])
      .filter(i => i.date && i.date.slice(0,4) === String(y))
      .reduce((sum,i) => sum + toALL(Number(i.amount), i.currency||"ALL"), 0);
    return { ...s, incomeThatYear,
      pctOfIncome: incomeThatYear > 0 ? (s.total / incomeThatYear * 100) : null };
  }).filter(r => r.total > 0 || r.incomeThatYear > 0);
}
function multiYearTaxCard() {
  const rows = computeMultiYearTaxSummary(6);
  if (rows.length < 2) return "";
  const maxTotal = Math.max(...rows.map(r => r.total)) || 1;
  return `
    <div class="card">
      <h3>Tasse e commissioni per anno</h3>
      <div class="subtle">Confronto fra gli anni registrati. Somma di quanto è stato annotato nell'app, non un calcolo fiscale ufficiale.</div>
      ${rows.map(r => `
        <div style="margin-top:10px;">
          <div class="stat-row" style="border:none; padding-bottom:2px;">
            <span class="label" style="font-weight:600;">${r.year}</span>
            <span class="val down">${fmtDisplay(r.total)}${r.pctOfIncome!=null ? ` <span class="subtle" style="font-size:10px;">(${r.pctOfIncome.toFixed(1)}% del reddito)</span>` : ''}</span>
          </div>
          <div style="height:6px; background:#1E2E47; border-radius:3px; overflow:hidden;">
            <div style="height:100%; width:${Math.round(r.total/maxTotal*100)}%; background:#8B3A2F;"></div>
          </div>
          <div class="subtle" style="font-size:10px; margin-top:3px;">
            tasse ${fmt(r.totalTax)} · commissioni ${fmt(r.totalCommission)}${r.totalOther>0?` · altro ${fmt(r.totalOther)}`:''} ALL
          </div>
        </div>`).join('')}
    </div>`;
}

// ===== Rendiconto annuale esportabile =====
// Solo ciò che ha rilevanza fiscale: le stesse categorie che i motori automatici
// già gestiscono (cedole, dividendi, affitti, plusvalenze, stipendio) più le
// trattenute collegate. Le spese/entrate personali (supermercato, bar...) restano
// fuori: per la dichiarazione non servono, e mischiarle renderebbe il file inutile
// per un commercialista.
function categorieRedditoFiscale() {
  const set = new Set([CAT_RLD, CAT_DEDUZIONE_FP]);
  return { has: cat => set.has(cat) || isAutoManagedIncomeCategory(cat) };
}
function categorieOneriFiscali() {
  const set = new Set([CAT_CONTR_PENS, CAT_CONTR_SAN, CAT_TASSA_RLD]);
  return { has: cat => set.has(cat) || isAutoManagedExpenseCategory(cat) };
}
// Codice/ente di una voce: prima quelli registrati direttamente sulla voce, poi
// quelli della posizione collegata. Per i dati vecchi (prima del collegamento
// diretto) questo è l'unico modo di risalire al titolo.
function risolviTitoloVoce(v) {
  const pos = v.linkedBondId ? data.portfolio.find(p => p.id === v.linkedBondId) : null;
  return {
    codice: v.securityCode || (pos && pos.securityCode) || "",
    ente: v.issuerName || (pos && pos.issuerName) || ""
  };
}

function calcolaRendicontoAnnuale(year) {
  const yStr = String(year);
  const yPrevStr = String(year - 1);
  const catRed = categorieRedditoFiscale();
  const catOneri = categorieOneriFiscali();

  const redditi = data.income.filter(i => i.date && i.date.slice(0,4) === yStr && catRed.has(i.category));
  const oneri = data.expenses.filter(e => e.date && e.date.slice(0,4) === yStr && catOneri.has(e.category));
  const redditiPrec = data.income.filter(i => i.date && i.date.slice(0,4) === yPrevStr && catRed.has(i.category));
  const oneriPrec = data.expenses.filter(e => e.date && e.date.slice(0,4) === yPrevStr && catOneri.has(e.category));

  const sommaPerCategoria = (arr, isIncome) => {
    const out = {};
    arr.forEach(v => {
      const all = isIncome ? toALL(Number(v.amount)||0, v.currency||"ALL") : (Number(v.amount)||0);
      out[v.category] = (out[v.category]||0) + all;
    });
    return out;
  };
  const redPerNatura = sommaPerCategoria(redditi, true);
  const redPerNaturaPrec = sommaPerCategoria(redditiPrec, true);
  const oneriPerTipo = sommaPerCategoria(oneri, false);
  const oneriPerTipoPrec = sommaPerCategoria(oneriPrec, false);

  const totRedditi = Object.values(redPerNatura).reduce((s,v)=>s+v,0);
  const totRedditiPrec = Object.values(redPerNaturaPrec).reduce((s,v)=>s+v,0);
  const totOneri = Object.values(oneriPerTipo).reduce((s,v)=>s+v,0);
  const totOneriPrec = Object.values(oneriPerTipoPrec).reduce((s,v)=>s+v,0);

  // Patrimonio al 31/12: si ricostruisce sommando, per strumento, tutti i movimenti
  // di portafoglio fino a quella data (acquisti e vendite/rimborsi già registrati
  // sono entrambi righe del ledger). È il saldo CONTABILE a quella data, non il
  // valore di mercato: per obbligazioni, depositi e fondi coincide di norma col
  // valore reale; per azioni/ETF/crypto non riflette il prezzo di fine anno, perché
  // l'app non conserva uno storico dei prezzi per data passata.
  const dataLimite = `${yStr}-12-31`;
  const gruppi = {};
  data.portfolio.forEach(p => {
    if (!p.date || p.date > dataLimite || !p.amount) return;
    if (isCreditCardType(p.type)) return;
    const chiave = chiaveIdentitaStrumento(p) || ("singolo:" + (p.linkedTo || p.id));
    if (!gruppi[chiave]) {
      gruppi[chiave] = { chiave, tipo: p.type, macro: p.macro||"", ente: p.issuerName||"",
        codice: p.securityCode||"", nome: nomeStrumento(p), rischio: normalizzaRischio(p.riskFactor, p),
        saldoALL: 0 };
    }
    const g = gruppi[chiave];
    if (!g.codice && p.securityCode) g.codice = p.securityCode;
    if (!g.ente && p.issuerName) g.ente = p.issuerName;
    g.saldoALL += netWorthSign(p) * toALL(Number(p.amount)||0, p.currency);
  });
  const patrimonio = Object.values(gruppi)
    .filter(g => Math.abs(g.saldoALL) > 0.5)
    .sort((a,b) => b.saldoALL - a.saldoALL);
  const totPatrimonio = patrimonio.reduce((s,g)=>s+g.saldoALL, 0);

  return { year, redditi, oneri, redPerNatura, redPerNaturaPrec, oneriPerTipo, oneriPerTipoPrec,
    totRedditi, totRedditiPrec, totOneri, totOneriPrec, patrimonio, totPatrimonio };
}

// Esporta il rendiconto in un file Excel a quattro fogli. La libreria (SheetJS)

    [],
    ["RITENUTE E ONERI PER TIPO (ALL)", r.year, r.year-1],
    ...righeOneri,
    ["Totale ritenute e oneri", Math.round(r.totOneri), Math.round(r.totOneriPrec)],
    [],
    ["Reddito netto (redditi − ritenute/oneri)", Math.round(r.totRedditi-r.totOneri), Math.round(r.totRedditiPrec-r.totOneriPrec)],
    [],
    ["PATRIMONIO AL 31/12 (ALL, saldo contabile)"],
    ["Totale posizioni", Math.round(r.totPatrimonio)]
  ];
  const wsRiepilogo = XLSX.utils.aoa_to_sheet(riepilogoRows);
  wsRiepilogo["!cols"] = [{wch:42},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsRiepilogo, "Riepilogo");

  // --- Foglio 2: Redditi analitici ---
  const redditiRows = [["Data","Natura","Codice titolo","Società/Ente","Importo (valuta orig.)","Valuta","Importo (ALL)","Nota"]];
  r.redditi.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(i => {

  XLSX.utils.book_append_sheet(wb, wsRedditi, "Redditi analitici");

  // --- Foglio 3: Ritenute e oneri ---
  const oneriRows = [["Data","Categoria","Codice titolo","Società/Ente","Importo (ALL)","Reddito collegato","Nota"]];
  r.oneri.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    const t = risolviTitoloVoce(e);
    const redditoLink = e.linkedIncomeId ? data.income.find(i => i.id === e.linkedIncomeId) : null;
    const collegato = redditoLink ? `${redditoLink.category} · ${redditoLink.date}` : (e.linkedBondId ? "solo titolo (dato precedente al collegamento)" : "—");
    oneriRows.push([e.date, e.category, t.codice, t.ente, Math.round(Number(e.amount)||0), collegato, e.note||""]);

  oneriRows.push(["","","","Totale","", Math.round(r.totOneri), ""]);
  const wsOneri = XLSX.utils.aoa_to_sheet(oneriRows);
  wsOneri["!cols"] = [{wch:11},{wch:32},{wch:12},{wch:32},{wch:14},{wch:38},{wch:36}];
  XLSX.utils.book_append_sheet(wb, wsOneri, "Ritenute e oneri");

  // --- Foglio 4: Patrimonio al 31/12 ---
  const patrimonioRows = [["Codice titolo","Strumento","Categoria","Società/Ente","Rischio (1-7)","Valore al 31/12 (ALL)"]];
  r.patrimonio.forEach(g => patrimonioRows.push([g.codice, g.nome, g.macro||g.tipo, g.ente, g.rischio, Math.round(g.saldoALL)]));
  patrimonioRows.push(["","","","Totale","", Math.round(r.totPatrimonio)]);
  const wsPatrimonio = XLSX.utils.aoa_to_sheet(patrimonioRows);
  wsPatrimonio["!cols"] = [{wch:12},{wch:32},{wch:16},{wch:32},{wch:12},{wch:20}];

  XLSX.writeFile(wb, `fi-tracker-rendiconto-${r.year}.xlsx`);
  return true;
}

// Confronta la ripartizione attuale per macro-categoria con i pesi obiettivo
// impostati in Assunzioni, e dice quanto spostare per riallinearsi.
// ===== Punto 13: confronto col benchmark (titolo di Stato a 10 anni) =====
// Usa la curva dei rendimenti già importata (aste del Ministero) e il TWR già
// calcolato: non serve altro dato, solo mettere insieme due cose che esistono già.
function confrontoRendimentoBenchmark() {
  const curva = data.marketYieldCurve && data.marketYieldCurve.points;
  if (!curva || !curva.length) return null;
  const punto10y = curva.slice().sort((a,b) => Math.abs(a.maturity-10) - Math.abs(b.maturity-10))[0];
  if (!punto10y || !isFinite(punto10y.cutoffYield)) return null;
  const twr = computeTWR();
  if (!twr || twr.twrAnnualizzato == null) return null;
  return {
    rendimentoPortafoglio: twr.twrAnnualizzato,
    rendimentoBenchmark: punto10y.cutoffYield,
    scadenzaBenchmark: punto10y.maturity,
    differenza: twr.twrAnnualizzato - punto10y.cutoffYield
  };
}
function benchmarkCard() {
  const c = confrontoRendimentoBenchmark();
  if (!c) return "";
  return `

      <h3>Rendimento vs titolo di Stato</h3>
      <div class="subtle">Il tuo TWR annualizzato confrontato con un'obbligazione governativa a ${c.scadenzaBenchmark} anni — il riferimento "senza rischiare nulla" per il tuo mercato.</div>
      <div class="stat-row"><span class="label">Il tuo portafoglio (TWR)</span><span class="val">${c.rendimentoPortafoglio.toFixed(2)}%/anno</span></div>
      <div class="stat-row"><span class="label">Titolo di Stato ${c.scadenzaBenchmark} anni</span><span class="val">${c.rendimentoBenchmark.toFixed(2)}%/anno</span></div>
      <div class="stat-row"><span class="label">Differenza</span><span class="val ${c.differenza>=0?'up':'down'}">${c.differenza>=0?'+':''}${c.differenza.toFixed(2)} punti</span></div>
      <div class="subtle" style="font-size:10px; margin-top:4px;">${c.differenza>=0?"Il rischio che ti sei preso ha reso più del non rischiare nulla.":"Il rischio che ti sei preso ha reso MENO del non rischiare nulla — vale la pena capire perché."}</div>
    </div>`;
}

// ===== Punto 14: ribilanciamento operativo =====
// computeAllocationDrift() dice già "aggiungi X" o "riduci Y" per ogni categoria
// separatamente — qui si abbinano gli eccessi ai difetti in istruzioni dirette
// ("sposta X da A a B"), invece di lasciare che sia l'utente a ricomporle a mente.
const RIBILANCIAMENTO_SOGLIA_MINIMA = 10000;
function suggerimentiRibilanciamento() {
  const drift = computeAllocationDrift();
  if (!drift) return [];
  const eccessi = drift.rows.filter(r => r.adjust < -RIBILANCIAMENTO_SOGLIA_MINIMA)
    .map(r => ({ macro: r.macro, importo: -r.adjust })).sort((a,b) => b.importo - a.importo);
  const difetti = drift.rows.filter(r => r.adjust > RIBILANCIAMENTO_SOGLIA_MINIMA)
    .map(r => ({ macro: r.macro, importo: r.adjust })).sort((a,b) => b.importo - a.importo);
  const suggerimenti = [];
  let i = 0, j = 0;
  while (i < eccessi.length && j < difetti.length) {
    const sposta = Math.min(eccessi[i].importo, difetti[j].importo);
    if (sposta >= RIBILANCIAMENTO_SOGLIA_MINIMA) {
      suggerimenti.push({ da: eccessi[i].macro, a: difetti[j].macro, importo: sposta });
    }
    eccessi[i].importo -= sposta;
    difetti[j].importo -= sposta;
    if (eccessi[i].importo < RIBILANCIAMENTO_SOGLIA_MINIMA) i++;
    if (difetti[j].importo < RIBILANCIAMENTO_SOGLIA_MINIMA) j++;
  }
  return suggerimenti;
}

function computeAllocationDrift() {
  const targets = data.settings.targetAllocation || {};
  const keys = Object.keys(targets).filter(k => Number(targets[k]) > 0);
  if (keys.length === 0) return null;
  const byMacro = {};
  let total = 0;
  data.portfolio.forEach(p => {
    if (isDebtType(p.type, p.macro) || isCreditCardType(p.type)) return;
    const v = toALL((p.marketValue!==undefined && p.marketValue!==null && p.marketValue!=="")
      ? Number(p.marketValue) : Number(p.amount), p.currency);
    if (!isFinite(v) || v <= 0) return;
    const macro = p.macro || macroForCategory("portfolio", p.type) || "Altro";
    byMacro[macro] = (byMacro[macro] || 0) + v;
    total += v;
  });
  if (total <= 0) return null;
  const rows = keys.map(k => {
    const actual = byMacro[k] || 0;
    const actualPct = actual / total * 100;
    const targetPct = Number(targets[k]);
    const targetValue = total * targetPct / 100;
    return { macro:k, actual, actualPct, targetPct, driftPct: actualPct - targetPct,
      adjust: targetValue - actual };
  }).sort((a,b) => Math.abs(b.driftPct) - Math.abs(a.driftPct));
  const covered = keys.reduce((s,k)=>s+(byMacro[k]||0),0);
  return { rows, total, uncovered: total - covered,
    maxDrift: Math.max(...rows.map(r => Math.abs(r.driftPct))) };
}
function macroForCategory(group, type) {
  const map = data.categoryMacroMap && data.categoryMacroMap[group];
  return map ? map[type] : null;
}
const ALLOCATION_DRIFT_ALERT = 5;
function allocationDriftCard() {
  const a = computeAllocationDrift();
  if (!a) return "";
  const alert = a.maxDrift >= ALLOCATION_DRIFT_ALERT;
  return `
    <div class="card"${alert?' style="border-color:#C9A227;"':''}>
      <h3>Allocazione vs obiettivo</h3>
      <div class="subtle">Scostamento della ripartizione attuale dai pesi che ti sei dato in Assunzioni. Gli importi indicano quanto spostare per riallinearti.</div>
      ${a.rows.map(r => {
        const cls = Math.abs(r.driftPct) >= ALLOCATION_DRIFT_ALERT ? 'down' : 'up';
        const verso = r.adjust > 0 ? 'aggiungi' : 'riduci';
        return `<div style="margin-top:10px;">
          <div class="stat-row" style="border:none; padding-bottom:2px;">
            <span class="label" style="font-weight:600;">${r.macro}</span>
            <span class="val ${cls}">${r.actualPct.toFixed(1)}% <span class="subtle" style="font-size:10px;">obiettivo ${r.targetPct}%</span></span>
          </div>
          <div style="height:6px; background:#1E2E47; border-radius:3px; position:relative; overflow:hidden;">
            <div style="height:100%; width:${Math.min(100, r.actualPct).toFixed(1)}%; background:${Math.abs(r.driftPct)>=ALLOCATION_DRIFT_ALERT?'#8B3A2F':'#3F6E5E'};"></div>
