      <div id="whatIfResultBox"></div>
      <div class="row2" style="margin-top:12px; align-items:center;">
        <input type="text" id="whatIfNomeScenario" placeholder="nome dello scenario, es. 'Vendo casa nel 2030'" style="flex:1.5;">
        <button class="secondary" type="button" id="whatIfSalvaScenarioBtn">Salva come scenario</button>
      </div>
      <div class="subtle" style="font-size:10px; margin-top:4px;">A differenza del calcolo sopra (che si perde chiudendo la scheda), uno scenario salvato resta — fino a 3, per confrontarli fianco a fianco qui sotto. Se hai appena girato la Simulazione Monte Carlo qui sopra, il risultato viene salvato insieme allo scenario.</div>
    </div>
    ${scenariComparativiCard()}
    <div class="card">
      <h3>In termini reali (inflazione ${inflPct}%)</h3>
      <div class="subtle">Il rendimento nominale dice quanto cresce il numero; quello reale dice quanto cresce ciò che puoi comprare. Con l'inflazione attesa impostata in Assunzioni.</div>
      <div class="stat-row"><span class="label">Rendimento nominale</span><span class="val">${s.centralRet.toFixed(1)}%</span></div>
      <div class="stat-row"><span class="label">Rendimento reale</span><span class="val ${realRet>=0?'up':'down'}">${(realRet*100).toFixed(2)}%</span></div>
      <div class="stat-row"><span class="label">Anni a FI · nominale</span><span class="val">${central.hitYearFrac!=null ? central.hitYearFrac.toFixed(1) : '>'+s.horizon}</span></div>
      <div class="stat-row"><span class="label">Anni a FI · reale</span><span class="val ${centralReal.hitYearFrac!=null?'':'down'}">${centralReal.hitYearFrac!=null ? centralReal.hitYearFrac.toFixed(1) : '>'+s.horizon}</span></div>
      <div class="section-total"><span>Patrimonio a ${s.horizon} anni</span><span>${fmtDisplay(wealthNominalEnd)}</span></div>
      <div class="stat-row"><span class="label">· potere d'acquisto di oggi</span><span class="val">${fmtDisplay(purchasingPower)}</span></div>
      ${realRet < 0 ? `<div class="alert-banner" style="margin-top:10px;">⚠ Con un rendimento del ${s.centralRet.toFixed(1)}% e inflazione al ${inflPct}%, il patrimonio investito perde potere d'acquisto nel tempo.</div>` : ''}
    </div>
    ${costoGestioneCard()}
    ${taxSummary.total>0 ? `<div class="card">
      <h3>Riepilogo fiscale ${taxSummary.year}</h3>
      <div class="subtle">Tasse e commissioni pagate quest'anno su tutti gli asset insieme — utile come riferimento per la dichiarazione. Somma di ciò che è già stato registrato nell'app, non un calcolo fiscale ufficiale.</div>
      <div class="stat-row"><span class="label">Totale tasse</span><span class="val down">${fmtDisplay(taxSummary.totalTax)}</span></div>
      <div class="stat-row"><span class="label">Totale commissioni</span><span class="val down">${fmtDisplay(taxSummary.totalCommission)}</span></div>
      ${taxSummary.totalOther>0 ? `<div class="stat-row"><span class="label">Altro (interessi, penali, assicurazioni)</span><span class="val down">${fmtDisplay(taxSummary.totalOther)}</span></div>` : ''}
      <div class="section-total"><span>Totale complessivo</span><span style="font-weight:600; color:#8B3A2F;">${fmtDisplay(taxSummary.total)}</span></div>
      <div style="margin-top:10px;">
        ${taxSummary.byCategory.map(c=>`<div class="stat-row"><span class="label">${c.category}</span><span class="val">${fmt(c.amount)} ALL</span></div>`).join('')}
      </div>
    </div>` : ''}
    ${allocationDriftCard()}
    ${benchmarkCard()}
    ${prezziScadutiCard()}
    ${scadenzeCard()}
    ${cashFlowProjectionCard()}
    ${portfolioReturnCard()}
    ${riquadroRischioPanoramica()}
    ${riquadroRendimentoRischio()}
    ${multiYearTaxCard()}
    ${runwayAndCoverageCard()}
  `;

  const ctx = document.getElementById("fiChart");
  const labels = central.rows.map(r=>r.year);
  if (chartInstance) chartInstance.destroy();
  // Se è stato girato un Monte Carlo con lo stesso orizzonte di accumulo, si
  // sovrappone la fascia p10-p90 anno per anno — il "cono di incertezza" reale,
  // accanto alle 3 linee deterministiche. Non un secondo grafico separato: sullo
  // stesso, per confrontare a colpo d'occhio "quando" (le linee) e "quanto è
  // incerto" (la fascia).
  const mcCono = (ultimoRisultatoMonteCarlo && ultimoRisultatoMonteCarlo.percentiliPerAnno
    && ultimoRisultatoMonteCarlo.percentiliPerAnno.length === central.rows.length) ? ultimoRisultatoMonteCarlo.percentiliPerAnno : null;
  const datasetsFi = [
    ...results.map(r => ({ label: r.label, data: r.rows.map(row=>toDisplay(row.wealth)), borderColor: r.color, backgroundColor:'transparent', tension:0.25, pointRadius:0, borderWidth: r.key==='central'?2.5:1.5 })),
    { label:'Target', data: central.rows.map(row=>toDisplay(row.target)), borderColor:'#5C4A2E', borderDash:[5,4], pointRadius:0, borderWidth:1.5 }
  ];
  if (mcCono) {
    datasetsFi.push(
      { label:'Monte Carlo · 90° percentile', data: mcCono.map(p=>toDisplay(p.p90)), borderColor:'transparent', backgroundColor:'#C9A22715', pointRadius:0, fill:'+1', order:10 },
      { label:'Monte Carlo · 10° percentile', data: mcCono.map(p=>toDisplay(p.p10)), borderColor:'transparent', backgroundColor:'transparent', pointRadius:0, fill:false, order:10 }
    );
  }
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: datasetsFi },
    options: {
      responsive:true,
      plugins: { legend: { labels:{ color:'#8FA3BF', font:{size:10}, filter: item => item.text !== 'Monte Carlo · 10° percentile' } } },
      scales: {
        x: { ticks:{ color:'#6B7E99', font:{size:10} }, grid:{ color:'#1E2E47' } },
        y: { ticks:{ color:'#6B7E99', font:{size:10}, callback:v=>(v/1e6).toFixed(1)+'M '+displaySymbol() }, grid:{ color:'#1E2E47' } }
      }
    }
  });

  const fireCtx = document.getElementById("fireChart");
  if (fireChartInstance) fireChartInstance.destroy();
  const knownYears = fireNumbers.map(f=>f.years).filter(y=>y!=null);
  const neverReachedPlotValue = knownYears.length>0 ? Math.max(...knownYears)*1.15 : s.horizon;
  fireChartInstance = new Chart(fireCtx, {
    data: {
      labels: fireNumbers.map(f=>f.rate+'%'),
      datasets: [
        { type:'bar', label:`Numero FIRE (${displaySymbol()})`, data: fireNumbers.map(f=>toDisplay(f.target)), backgroundColor:'#C9A227', yAxisID:'y' },
        { type:'line', label:'Anni stimati', data: fireNumbers.map(f=>f.years!=null?f.years:neverReachedPlotValue), borderColor:'#3F6E5E', backgroundColor:'transparent', pointRadius:4, borderWidth:2, yAxisID:'y1' }
      ]
    },
    options: {
      responsive:true,
      plugins: { legend: { labels:{ color:'#8FA3BF', font:{size:10} } } },
      scales: {
        x: { ticks:{ color:'#6B7E99', font:{size:10} }, grid:{ color:'#1E2E47' } },
        y: { position:'left', ticks:{ color:'#6B7E99', font:{size:10}, callback:v=>(v/1e6).toFixed(1)+'M' }, grid:{ color:'#1E2E47' } },
        y1: { position:'right', ticks:{ color:'#3F6E5E', font:{size:10} }, grid:{ display:false } }
      }
    }
  });

  const wealthCtx = document.getElementById("wealthHistoryChart");
  if (wealthCtx) {
    if (wealthHistoryChartInstance) wealthHistoryChartInstance.destroy();
    const snapOrdinati = [...data.snapshots].sort((a,b)=>a.date.localeCompare(b.date));
    wealthHistoryChartInstance = new Chart(wealthCtx, {
      type: 'line',
      data: { labels: snapOrdinati.map(sn=>sn.date), datasets: [{ label: `Patrimonio (${displaySymbol()})`,
        data: snapOrdinati.map(sn=>toDisplay(sn.wealth)), borderColor:'#C9A227', backgroundColor:'#C9A22722', fill:true, tension:0.25, pointRadius:3, borderWidth:2 }] },
      options: {
        plugins: { legend: { display:false } },
        scales: {
          x: { ticks:{ color:'#6B7E99', font:{size:9} }, grid:{ color:'#1E2E47' } },
          y: { ticks:{ color:'#6B7E99', font:{size:10}, callback:v=>(v/1e6).toFixed(1)+'M' }, grid:{ color:'#1E2E47' } }
        }
      }
    });
  }

  const cashFlowCtx = document.getElementById("cashFlowChart");
  if (cashFlowCtx) {
    if (cashFlowChartInstance) cashFlowChartInstance.destroy();
    const proiezioneChart = computeCashFlowProjection(12);
    cashFlowChartInstance = new Chart(cashFlowCtx, {
      data: {
        labels: proiezioneChart.map(m=>m.mese),
        datasets: [
          { type: 'bar', label: 'Netto mensile', data: proiezioneChart.map(m=>toDisplay(m.netto)),
            backgroundColor: proiezioneChart.map(m=>m.netto>=0?'#3F6E5E99':'#8B3A2F99'), order: 2 },
          { type: 'line', label: 'Saldo proiettato', data: proiezioneChart.map(m=>toDisplay(m.saldoCumulato)),
            borderColor: '#C9A227', backgroundColor:'transparent', tension:0.2, pointRadius:2, borderWidth:2, order: 1 }
        ]
      },
      options: {
        plugins: { legend: { display:true, labels:{ color:'#8FA3BF', font:{size:10} } } },
        scales: {
          x: { ticks:{ color:'#6B7E99', font:{size:9} }, grid:{ color:'#1E2E47' } },
          y: { ticks:{ color:'#6B7E99', font:{size:10}, callback:v=>(v/1e6).toFixed(1)+'M' }, grid:{ color:'#1E2E47' } }
        }
      }
    });
  }

  bindBackupReminder(renderDashboard);

  document.getElementById("fireModeBudget").addEventListener("click", ()=>{ s.fireExpenseBaseMode = "budget"; saveData(); renderDashboard(); });
  document.getElementById("fireModeProjected").addEventListener("click", ()=>{ s.fireExpenseBaseMode = "projected"; saveData(); renderDashboard(); });
  document.getElementById("savingsRateModeReale").addEventListener("click", ()=>{ s.savingsRateProjectionMode = "reale"; saveData(); renderDashboard(); });
  document.getElementById("savingsRateModeObiettivo").addEventListener("click", ()=>{ s.savingsRateProjectionMode = "obiettivo"; saveData(); renderDashboard(); });
  const monteCarloBtn = document.getElementById("eseguiMonteCarloBtn");
  if (monteCarloBtn) monteCarloBtn.addEventListener("click", ()=>{
    const devStd = Number(document.getElementById("montecarloDevStdInput").value) || 10;
    const anniPrelievo = Number(document.getElementById("montecarloAnniInput").value) || 30;
    const strategiaPrelievo = document.getElementById("montecarloStrategiaSelect").value || "fissa";
    s.montecarloDevStd = devStd; s.montecarloAnniPrelievo = anniPrelievo; s.montecarloStrategiaPrelievo = strategiaPrelievo;
    saveData();
    monteCarloBtn.textContent = "Simulo...";
    monteCarloBtn.disabled = true;
    setTimeout(()=>{
      ultimoRisultatoMonteCarlo = simulazioneMonteCarlo({
        wealth0, income0: projIncome, savingsRate: savingsRateForProjection,
        expense0: fireExpenseBase, expenseGrowth: s.expenseGrowth, incomeGrowth2y: s.incomeGrowth2y,
        meanRet: s.centralRet/100, devStd: devStd/100,
        horizonAccumulo: s.horizon, annidiPrelievo: anniPrelievo, withdrawalRate: s.withdrawalRate||4, nSimulazioni: 1000,
        strategiaPrelievo
      });
      document.getElementById("monteCarloResultBox").innerHTML = renderRisultatoMonteCarlo(ultimoRisultatoMonteCarlo);
      monteCarloBtn.textContent = "Esegui 1.000 simulazioni";
      monteCarloBtn.disabled = false;
    }, 30);
  });

  // Simulatore what-if: eventi una tantum gestiti in memoria (scenarioWhatIfEventi),
  // niente si salva su data/saveData a meno che l'utente non tocchi Assunzioni.
  document.getElementById("whatIfAggiungiEvento").addEventListener("click", ()=>{
    scenarioWhatIfEventi.push({ anno: 1, importo: 0 });
    renderDashboard();
  });
  document.querySelectorAll("[data-evento-rimuovi]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      scenarioWhatIfEventi.splice(Number(btn.dataset.eventoRimuovi), 1);
      renderDashboard();
    });
  });
  document.querySelectorAll("[data-evento-anno]").forEach(inp=>{
    inp.addEventListener("change", ()=>{ scenarioWhatIfEventi[Number(inp.dataset.eventoAnno)].anno = Number(inp.value)||1; });
  });
  document.querySelectorAll("[data-evento-importo]").forEach(inp=>{
    inp.addEventListener("change", ()=>{ scenarioWhatIfEventi[Number(inp.dataset.eventoImporto)].importo = Number(inp.value)||0; });
  });
  const whatIfBtn = document.getElementById("whatIfCalcolaBtn");
  if (whatIfBtn) whatIfBtn.addEventListener("click", ()=>{
    const inIncome = Number(document.getElementById("whatIfIncome").value) || 0;
    const inExpense = Number(document.getElementById("whatIfExpense").value) || 0;
    const inSavingsRate = (Number(document.getElementById("whatIfSavingsRate").value) || 0) / 100;
    const inReturn = (Number(document.getElementById("whatIfReturn").value) || 0) / 100;
    const inHorizon = Number(document.getElementById("whatIfHorizon").value) || s.horizon;
    const inWithdrawal = Number(document.getElementById("whatIfWithdrawal").value) || 4;

    // Piano attuale, stessi parametri reali di sempre, ma passato dallo stesso
    // motore (projectWithEvents senza eventi) per un confronto omogeneo.
    const attuale = projectWithEvents(wealth0, projIncome, savingsRateForProjection, fireExpenseBase,
      s.expenseGrowth, s.incomeGrowth2y, s.centralRet/100, Math.max(inHorizon, s.horizon), s.withdrawalRate||4, []);
    const scenario = projectWithEvents(wealth0, inIncome, inSavingsRate, inExpense,
      s.expenseGrowth, s.incomeGrowth2y, inReturn, inHorizon, inWithdrawal, scenarioWhatIfEventi);

    document.getElementById("whatIfResultBox").innerHTML = renderRisultatoWhatIf(attuale, scenario);

    const ctx = document.getElementById("whatIfChart");
    if (scenarioWhatIfChartInstance) scenarioWhatIfChartInstance.destroy();
    scenarioWhatIfChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: scenario.rows.map(r=>thisYear+r.year),
        datasets: [
          { label: 'Piano attuale', data: attuale.rows.slice(0, scenario.rows.length).map(r=>toDisplay(r.wealth)), borderColor:'#5C7089', borderDash:[5,4], fill:false, pointRadius:0, borderWidth:2 },
          { label: 'Scenario', data: scenario.rows.map(r=>toDisplay(r.wealth)), borderColor:'#C9A227', fill:false, pointRadius:0, borderWidth:2 }
        ]
      },
      options: { plugins: { legend: { display:true, labels:{ color:'#8FA3BF', font:{size:10} } } },
        scales: {
          x: { ticks:{ color:'#6B7E99', font:{size:9} }, grid:{ color:'#1E2E47' } },
          y: { ticks:{ color:'#6B7E99', font:{size:10}, callback:v=>(v/1e6).toFixed(1)+'M' }, grid:{ color:'#1E2E47' } }
        } }
    });
  });

  const salvaScenarioBtn = document.getElementById("whatIfSalvaScenarioBtn");
  if (salvaScenarioBtn) salvaScenarioBtn.addEventListener("click", ()=>{
    const nome = (document.getElementById("whatIfNomeScenario").value || "").trim();
    if (!nome) { alert("Dai un nome allo scenario, per riconoscerlo nel confronto."); return; }
    const attuali = data.settings.scenariComparativi || [];
    if (attuali.length >= SCENARI_COMPARATIVI_MAX) {
      alert(`Puoi salvare al massimo ${SCENARI_COMPARATIVI_MAX} scenari — rimuovine uno prima di aggiungerne un altro.`);
      return;
    }
    const nuovo = {
      id: uid(), nome,
      income: Number(document.getElementById("whatIfIncome").value) || 0,
      expense: Number(document.getElementById("whatIfExpense").value) || 0,
      savingsRate: Number(document.getElementById("whatIfSavingsRate").value) || 0,
      ret: Number(document.getElementById("whatIfReturn").value) || 0,
      horizon: Number(document.getElementById("whatIfHorizon").value) || s.horizon,
      withdrawal: Number(document.getElementById("whatIfWithdrawal").value) || 4,
      eventi: scenarioWhatIfEventi.slice(),
      // Istantanea dell'ultimo Monte Carlo girato in questa sessione, se c'è —
      // è uno scatto fotografico, non un valore fisso: essendo casuale, rilanciarlo
      // dà un numero leggermente diverso ogni volta. Il pulsante "Rilancia" nella
      // card di confronto lo aggiorna quando serve.
      monteCarlo: ultimoRisultatoMonteCarlo ? {
        percentualeSuccesso: ultimoRisultatoMonteCarlo.percentualeSuccesso,
        percentualeMancatoTraguardo: ultimoRisultatoMonteCarlo.percentualeMancatoTraguardo,
        volatilitaSpesa: ultimoRisultatoMonteCarlo.volatilitaSpesa,
        p10: ultimoRisultatoMonteCarlo.p10, p50: ultimoRisultatoMonteCarlo.p50, p90: ultimoRisultatoMonteCarlo.p90,
        strategia: ultimoRisultatoMonteCarlo.strategia,
        devStd: Number(document.getElementById("montecarloDevStdInput").value) || 10,
        anniPrelievo: Number(document.getElementById("montecarloAnniInput").value) || 30,
        timestamp: new Date().toISOString()
      } : null
    };
    if (!data.settings.scenariComparativi) data.settings.scenariComparativi = [];
    data.settings.scenariComparativi.push(nuovo);
    saveData();
    renderDashboard();
  });
  document.querySelectorAll("[data-rimuovi-scenario]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      data.settings.scenariComparativi = (data.settings.scenariComparativi||[]).filter(sc => sc.id !== btn.dataset.rimuoviScenario);
      saveData();
      renderDashboard();
    });
  });
  document.querySelectorAll("[data-rilancia-mc]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const sc = (data.settings.scenariComparativi||[]).find(x => x.id === btn.dataset.rilanciaMc);
      if (!sc || !sc.monteCarlo) return;
      const w0 = portfolioTotalALL();
      const nuovoRisultato = simulazioneMonteCarlo({
        wealth0: w0, income0: sc.income, savingsRate: sc.savingsRate/100, expense0: sc.expense,
        expenseGrowth: s.expenseGrowth, incomeGrowth2y: s.incomeGrowth2y,
        meanRet: sc.ret/100, devStd: sc.monteCarlo.devStd/100,
        horizonAccumulo: sc.horizon, annidiPrelievo: sc.monteCarlo.anniPrelievo, withdrawalRate: sc.withdrawal, nSimulazioni: 1000,
        strategiaPrelievo: sc.monteCarlo.strategia
      });
      sc.monteCarlo = {
        percentualeSuccesso: nuovoRisultato.percentualeSuccesso,
        percentualeMancatoTraguardo: nuovoRisultato.percentualeMancatoTraguardo,
        volatilitaSpesa: nuovoRisultato.volatilitaSpesa,
        p10: nuovoRisultato.p10, p50: nuovoRisultato.p50, p90: nuovoRisultato.p90,
        strategia: nuovoRisultato.strategia,
        devStd: sc.monteCarlo.devStd, anniPrelievo: sc.monteCarlo.anniPrelievo,
        timestamp: new Date().toISOString()
      };
      saveData();
      renderDashboard();
    });
  });

  const scenariChartCtx = document.getElementById("scenariComparativiChart");
  if (scenariChartCtx) {
    if (scenariComparativiChartInstance) scenariComparativiChartInstance.destroy();
    const scenariSalvati = data.settings.scenariComparativi || [];
    const attualeConfronto = projectWithEvents(wealth0, projIncome, savingsRateForProjection, fireExpenseBase,
      s.expenseGrowth, s.incomeGrowth2y, s.centralRet/100, s.horizon, s.withdrawalRate||4, []);
    const maxAnni = Math.max(s.horizon, ...scenariSalvati.map(sc=>sc.horizon));
    const datasets = [{ label: 'Piano attuale', data: attualeConfronto.rows.map(r=>toDisplay(r.wealth)),
      borderColor:'#5C7089', borderDash:[5,4], fill:false, pointRadius:0, borderWidth:2 }];
    scenariSalvati.forEach((sc,i) => {
      const proj = projectWithEvents(wealth0, sc.income, sc.savingsRate/100, sc.expense,
        s.expenseGrowth, s.incomeGrowth2y, sc.ret/100, maxAnni, sc.withdrawal, sc.eventi||[]);
      datasets.push({ label: sc.nome, data: proj.rows.map(r=>toDisplay(r.wealth)),
        borderColor: SCENARI_COMPARATIVI_COLORI[i%3], fill:false, pointRadius:0, borderWidth:2 });
    });
    scenariComparativiChartInstance = new Chart(scenariChartCtx, {
      type: 'line',
      data: { labels: Array.from({length:maxAnni}, (_,i)=>thisYear+i+1), datasets },
      options: { plugins: { legend: { display:true, labels:{ color:'#8FA3BF', font:{size:10} } } },
        scales: {
          x: { ticks:{ color:'#6B7E99', font:{size:9} }, grid:{ color:'#1E2E47' } },
          y: { ticks:{ color:'#6B7E99', font:{size:10}, callback:v=>(v/1e6).toFixed(1)+'M' }, grid:{ color:'#1E2E47' } }
        } }
    });
  }

  document.getElementById("fireRatesSave").addEventListener("click", ()=>{
    const val = document.getElementById("fireRatesInput").value;
    const parsed = val.split(",").map(x=>parseFloat(x.trim())).filter(n=>!isNaN(n) && n>0);
    if (parsed.length===0) { alert("Inserisci almeno una percentuale valida."); return; }
    s.fireRatesText = parsed.join(",");
    saveData(); renderDashboard();
  });

  const peaks = computeYearlyPeaks();
  const peaksCtx = document.getElementById("peaksChart");
  if (peaksChartInstance) peaksChartInstance.destroy();
  peaksChartInstance = new Chart(peaksCtx, {
    data: {
      labels: peaks.map(p=>p.label),
      datasets: [
        { type:'bar', label:'Spesa base', data: peaks.map(p=>toDisplay(p.base)), backgroundColor:'#3F5A72', stack:'s' },
        { type:'bar', label:'Ricorrenze non mensili', data: peaks.map(p=>toDisplay(p.recurring)), backgroundColor:'#C9A227', stack:'s' },
        { type:'line', label:'Effettivo', data: peaks.map(p=>p.actual>0?toDisplay(p.actual):null), borderColor:'#8B3A2F', backgroundColor:'transparent', spanGaps:true, tension:0.2, pointRadius:3, borderWidth:2 }
      ]
    },
    options: {
      responsive:true,
      plugins:{ legend:{ labels:{ color:'#8FA3BF', font:{size:10} } } },
      scales:{
        x:{ stacked:true, ticks:{ color:'#6B7E99', font:{size:10} }, grid:{ color:'#1E2E47' } },
        y:{ stacked:true, ticks:{ color:'#6B7E99', font:{size:10}, callback:v=>(v/1000).toFixed(0)+'k '+displaySymbol() }, grid:{ color:'#1E2E47' } }
      }
    }
  });
}

let incomeCategoryFilter = "all";
let incomeMacroFilter = "all";

function renderIncomeEditForm(e) {
  return `<form class="entry" data-editincomeform="${e.id}" style="border:1px solid #C9A227; border-radius:6px; padding:12px; margin-bottom:8px;">
    <div class="row2">
      <div><label>Data</label><input type="date" name="date" value="${e.date}"></div>
      <div><label>Importo (ALL)</label><input type="number" min="0" step="0.0001" name="amount" value="${e.amount}"></div>
    </div>
    <div><label>Categoria</label>${categorySelect("income", e.category)}</div>
    <div><label>Macro-categoria</label>${macroSelect("income", e.macro)}</div>
    <div><label>${LABEL_ENTE}</label><input type="text" name="issuerName" value="${escAttr(e.issuerName||'')}" placeholder="chi emette/gestisce"></div>
    <div><label>${LABEL_CODICE}</label><input type="text" name="securityCode" maxlength="8" value="${escAttr(e.securityCode||'')}" placeholder="vuoto se non collegato a un titolo"></div>
    <div><label>Ricevuto su</label>${paymentTypeSelect(e.paymentType)}</div>
    <div><label>Nota</label><input type="text" name="note" value="${e.note||''}"></div>
    <div class="row2">
      <button class="primary" type="submit">Salva</button>
      <button class="secondary" type="button" data-editincome-cancel="1">Annulla</button>
    </div>

function extractAmountFromText(text) {
  const lines = text.split(/\n/);
  const priceRe = /(\d{1,3}(?:[.\s]\d{3})*|\d+)[,.](\d{2})\b|\b\d{2,7}\b/g;
  let candidates = [];
  lines.forEach(line => {
    const isTotalLine = /total|totale|shuma|paguar/i.test(line);
    const matches = line.match(/[\d.,]{2,}/g) || [];
    matches.forEach(m => {
      const val = parseFlexibleAmount(m);
      if (!isNaN(val) && val > 0) candidates.push({ val, isTotalLine });
    });
  });
  if (candidates.length === 0) return null;
  const totalLineCandidates = candidates.filter(c=>c.isTotalLine);
  const pool = totalLineCandidates.length ? totalLineCandidates : candidates;
  return pool.reduce((max,c)=> c.val > max.val ? c : max, pool[0]).val;
}
function extractDateFromText(text) {
  const m = text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (!m) return null;
  let [_, d, mo, y] = m;
  if (y.length === 2) y = "20"+y;
  const dateStr = `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const parsed = new Date(dateStr);
  if (isNaN(parsed) || parsed > new Date()) return null;
  return dateStr;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function compressImageToBase64(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL("image/jpeg", quality || 0.7);
      resolve(dataUrl.split(",")[1]);
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function callHuggingFaceOnce(file) {
  const s = data.settings;
  const base64 = await compressImageToBase64(file, 1024, 0.7);
  const mimeType = "image/jpeg";
  const prompt = `Leggi questo scontrino/ricevuta. Rispondi SOLO con un oggetto JSON valido, senza testo aggiuntivo, markdown o spiegazioni, in questo formato esatto: {"amount": numero, "date": "YYYY-MM-DD", "category": "una parola tra Supermercato, Ristoranti, Bar, Trasporti, Salute, Abbigliamento, Casa, Altro"}. Se non riesci a leggere un campo, usa null per quel campo.`;
  const res = await fetch("https://router.huggingface.co/v1/chat/completions", {
    method: "POST",
    headers: { Authorization: `Bearer ${s.hfToken}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      model: s.hfModel || "Qwen/Qwen3.5-9B",
      messages: [{
        role: "user",
        content: [
          { type: "text", text: prompt },
          { type: "image_url", image_url: { url: `data:${mimeType};base64,${base64}` } }
        ]
      }],
      max_tokens: 400
    })
  });
  if (!res.ok) { const bodyText = await res.text(); throw new Error(`HTTP ${res.status}: ${bodyText}`); }
  const json = await res.json();
  const message = json.choices && json.choices[0] && json.choices[0].message;
  let text = "";
  if (message) {
    if (typeof message.content === "string") text = message.content;
    else if (Array.isArray(message.content)) {
      text = message.content.map(part => (typeof part === "string" ? part : (part.text || ""))).join("");
    } else if (message.reasoning_content) text = message.reasoning_content;
  }
  text = (text || "").trim();
  if (!text) throw new Error("Risposta vuota dal modello. Dettaglio: " + JSON.stringify(json).slice(0, 900));
  text = text.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if (jsonMatch) text = jsonMatch[0];
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    throw new Error("Il modello non ha risposto in JSON valido: " + text.slice(0, 200));
  }
  return {
    amount: parsed.amount ? Number(parsed.amount) : null,
    date: parsed.date && /^\d{4}-\d{2}-\d{2}$/.test(parsed.date) ? parsed.date : null,
    category: parsed.category || null
  };
}

async function analyzeReceiptWithAI(file, onRetry) {
  const s = data.settings;
  if (!s.hfToken) throw new Error("no token");
  const maxAttempts = 3;
  let lastErr = null;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      return await callHuggingFaceOnce(file);
    } catch (err) {
      lastErr = err;
      const isEmptyOrServerIssue = /Risposta vuota|HTTP 5\d\d|HTTP 429/i.test(err.message || "");
      if (!isEmptyOrServerIssue || attempt === maxAttempts) throw err;
      if (onRetry) onRetry(attempt, maxAttempts);
      await new Promise(r => setTimeout(r, 1200));
    }
  }
  throw lastErr;
}

// Il gruppo a cui appartiene una voce nel confronto per macro-categoria: prima la
// macro scelta sulla SINGOLA voce (permette a "Fly" di finire ora in "Extra" ora
// in "Vacation", voce per voce), solo se assente ricade sulla macro di default
// della categoria. Prima di questa correzione, ogni voce veniva raggruppata per
// il default della sua categoria, ignorando del tutto una macro scelta a mano.
function categoriesForMacro(group, macro, year) {
  const map = data.categoryMacroMap[group] || {};
  const totals = {};
  const campo = group === "portfolio" ? "type" : "category";
  (data[group]||[]).forEach(e => {
    if (!e.date || new Date(e.date).getFullYear() !== year) return;
    const macroEffettiva = e.macro || map[e[campo]];
    if (macroEffettiva !== macro) return;
    const importo = group === "portfolio" ? toALL(Number(e.amount)||0, e.currency) : Number(e.amount)||0;
    totals[e[campo]] = (totals[e[campo]]||0) + importo;
  });
  return totals;
}
function drawMacroDrilldownChart(group) {
  const canvasId = "macroDrilldownChart";
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (!macroDrilldownSelected[group] && (data.macroCategories[group]||[]).length>0) {
    macroDrilldownSelected[group] = data.macroCategories[group][0];
  }
  const macro = macroDrilldownSelected[group];
  const totals = macro ? categoriesForMacro(group, macro, thisYear) : {};
  // Ordine decrescente e senza le voci a zero: una barra vuota occupa spazio
  // senza dire nulla, e l'ordine casuale rende il grafico difficile da leggere.
  const labels = Object.keys(totals)
    .filter(l => Math.abs(Number(totals[l])||0) > 0)
    .sort((a,b) => (Number(totals[b])||0) - (Number(totals[a])||0));
  if (macroDrilldownChartInstance) macroDrilldownChartInstance.destroy();
  if (labels.length === 0) return;
  macroDrilldownChartInstance = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label: macro, data: labels.map(l=>toDisplay(totals[l])), backgroundColor:'#C9A227' }] },
    options: {
      indexAxis:'y', responsive:true,
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ ticks:{ color:'#6B7E99', font:{size:10}, callback:v=>v+' '+displaySymbol() }, grid:{ color:'#1E2E47' } },
        y:{ ticks:{ color:'#8FA3BF', font:{size:11} }, grid:{ display:false } }
      }
    }
  });
}

// Totali e percentuali dello Storico secondo i filtri attivi.
// Regole: solo categoria -> totale categoria e sua quota sul totale.
// Categoria + la sua macro -> anche totale macro, quota sulla macro, quota macro sul totale.
// Solo macro -> totale macro e sua quota sul totale.
function storicoTotalsBlock(group, catFilter, macroFilter, year) {
  const voci = (data[group]||[]).filter(e => e.date && e.date.slice(0,4) === String(year));
  const somma = arr => arr.reduce((s,e) => s + toALL(Number(e.amount), e.currency||"ALL"), 0);
  const totale = somma(voci);
  const etichetta = group === "income" ? "entrate" : "costi";
  const righe = [];
  const pct = (x, base) => base > 0 ? (x/base*100) : null;
  const riga = (label, valore, cls) =>
    `<div class="stat-row"><span class="label">${label}</span><span class="val ${cls||''}">${valore}</span></div>`;

  const catAttiva = catFilter && catFilter !== "all";
  const macroAttiva = macroFilter && macroFilter !== "all";
  const totCat = catAttiva ? somma(voci.filter(e => e.category === catFilter)) : 0;
  const totMacro = macroAttiva ? somma(voci.filter(e => e.macro === macroFilter)) : 0;

  if (catAttiva) {
    righe.push(riga(`Totale categoria "${catFilter}"`, fmtDisplay(totCat)));
    const p = pct(totCat, totale);
    if (p !== null) righe.push(riga(`· quota sul totale ${etichetta} ${year}`, p.toFixed(1) + "%"));
  }
  if (macroAttiva) {
    righe.push(riga(`Totale macro-categoria "${macroFilter}"`, fmtDisplay(totMacro)));
    if (catAttiva) {
      const pm = pct(totCat, totMacro);
      if (pm !== null) righe.push(riga(`· quota della categoria sulla macro-categoria`, pm.toFixed(1) + "%"));
    }
    const pt = pct(totMacro, totale);
    if (pt !== null) righe.push(riga(`· quota della macro-categoria sul totale`, pt.toFixed(1) + "%"));
  }
  if (!righe.length) return "";
  return `<div style="border:1px solid #2E4159; border-radius:6px; padding:10px; margin-bottom:10px;">
      ${righe.join('')}
    </div>`;
}

// Le categorie mostrate nel filtro dipendono dalla macro scelta: se una macro è
// attiva si vedono solo le sue categorie.
function categorieDelFiltro(group, macroFilter) {
  const tutte = data.categories[group] || [];
  if (!macroFilter || macroFilter === "all") return tutte;
  const map = (data.categoryMacroMap[group]) || {};
  const campo = group === "portfolio" ? "type" : "category";
  // Una categoria appartiene al filtro se il suo default è questa macro, oppure se
  // almeno una voce ha questa macro scelta a mano (anche con un default diverso) —
  // altrimenti una macro assegnata manualmente su una singola voce (es. "Fly"
  // spostata da "Extra" a "Vacation" solo per quella spesa) sparirebbe dal filtro
  // pur avendo dati reali lì sotto. Stesso bug già corretto in categoriesForMacro,
  // qui si applica alla lista delle categorie invece che al totale.
  const daVociEffettive = new Set((data[group]||[]).filter(e => e.macro === macroFilter).map(e => e[campo]));
  return tutte.filter(c => map[c] === macroFilter || daVociEffettive.has(c));
}

function computeWeightedDuration() {
  const items = data.portfolio.filter(p => p.maturityDate);
  if (items.length === 0) return null;
  let weightSum = 0, weightedYears = 0;
  items.forEach(p => {
    const mv = toALL((p.marketValue!==undefined && p.marketValue!==null && p.marketValue!=="") ? Number(p.marketValue) : p.amount, p.currency);
    const years = Math.max(0,(new Date(p.maturityDate) - now) / (365.25*86400000));
    weightSum += mv; weightedYears += mv*years;
  });
  return weightSum > 0 ? weightedYears/weightSum : null;
}

function registerBondCoupon(bondId) {
  const bond = data.portfolio.find(p=>p.id===bondId);
  if (!bond) return;
  const dateStr = window.prompt("Data di pagamento della cedola (YYYY-MM-DD):", todayISO);
  if (!dateStr) return;
  const nominal = bond.amount;
  const rate = Number(bond.couponRate) || 0;
  const grossCoupon = nominal * rate / 100;
  const taxRate = Number(bond.bondTaxRate) || 15;
  const taxAmt = grossCoupon * taxRate / 100;
  const commAmt = computeCommissionAmount(bond.couponCommissionType, bond.couponCommissionValue, grossCoupon);
  const netCoupon = grossCoupon - taxAmt - commAmt;
  const taxCat = ensureBondTaxCategory(bond.bondYears, bond.type);
  const msg = `Cedola lorda: ${fmt(grossCoupon)} ALL\nTassazione (${taxRate}%): -${fmt(taxAmt)} ALL\nCommissione: -${fmt(commAmt)} ALL\nNetto accreditato in Banca: ${fmt(netCoupon)} ALL\n\nConfermi?`;
  if (!confirm(msg)) return;
  const incId = uid();
  data.income.push({id:incId, date:dateStr, amount:grossCoupon, category:"Cedola", macro:"Interessi da Titoli - Standard", paymentType:null, note:`Cedola ${bond.type}`, linkedBondId:bond.id, securityCode: bond.securityCode||null});
  data.expenses.push({id:uid(), date:dateStr, amount:taxAmt, category:taxCat, macro:"Tassazione da Titoli - Standard", note:"Tassazione cedola", linkedBondId:bond.id, securityCode: bond.securityCode||null, linkedIncomeId: incId});
  if (commAmt > 0) data.expenses.push({id:uid(), date:dateStr, amount:commAmt, category:"Commissione disbursement cedola", note:"Commissione cedola", linkedBondId:bond.id, securityCode: bond.securityCode||null, linkedIncomeId: incId});
  createLiquidityAdjustment("Banca", netCoupon, dateStr, `Cedola netta: ${bond.type}`, incId);
  saveData(); renderPortfolio();
}

async function parseFundHistoryFile(file) {
  const isCSV = file.name.toLowerCase().endsWith(".csv");
  let rows2D;
  if (isCSV) {
    const text = await file.text();
    rows2D = text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/\t|,/));
  } else {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    rows2D = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
  }
  let headerIdx = -1, dateCol = -1, amtCol = -1, priceCol = -1, unitsCol = -1;
  for (let i = 0; i < Math.min(rows2D.length, 10); i++) {
    const row = rows2D[i].map(c => String(c).toUpperCase());
    const dc = row.findIndex(c => c.includes("DAT"));
    const ac = row.findIndex(c => c.includes("AMOUNT") || c.includes("IMPORT"));
    const pc = row.findIndex(c => c.includes("PRICE") || c.includes("PREZZO"));
    const uc = row.findIndex(c => c.includes("UNIT") || c.includes("QUOT"));
    if (dc >= 0 && ac >= 0 && pc >= 0) { headerIdx = i; dateCol = dc; amtCol = ac; priceCol = pc; unitsCol = (uc >= 0 && uc !== pc) ? uc : pc + 1; break; }
  }
  if (headerIdx === -1) throw new Error("Intestazioni non riconosciute (servono colonne Data/Amount/Unit Price/Units).");
  const rows = [], errors = [];
  for (let i = headerIdx + 1; i < rows2D.length; i++) {
    const r = rows2D[i];
    if (!r || r[dateCol] === undefined || r[dateCol] === "") continue;
    let dateStr = null;
    const raw = r[dateCol];
    const m = String(raw).match(/(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{4})/);
    if (m) dateStr = `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    else { const d = new Date(raw); if (!isNaN(d)) dateStr = localDateStr(d); }
    const amount = parseFloat(String(r[amtCol]).replace(/,/g,""));
    const unitPrice = parseFloat(String(r[priceCol]).replace(/,/g,""));
    const units = parseFloat(String(r[unitsCol]).replace(/,/g,""));
    if (!dateStr || isNaN(amount) || isNaN(unitPrice) || isNaN(units)) { errors.push({ line: i+1, text: JSON.stringify(r) }); continue; }
    rows.push({ date: dateStr, amount, unitPrice, units });
  }
  return { rows, errors };
}

function parseFundHistoryText(text) {
  const lines = text.split(/\n/).map(l=>l.trim()).filter(l=>l);
  const rows = [];
  const errors = [];
  const re = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})[^\d\-]*(-?[\d,]+\.?\d*)[^\d\-]+(-?[\d,]+\.?\d*)[^\d\-]+(-?[\d,]+\.?\d*)/;
  lines.forEach((line,idx) => {
    if (/^date/i.test(line)) return; // skip header row
    const m = line.match(re);
    if (!m) { errors.push({line: idx+1, text: line}); return; }
    const [, d, mo, y, amtStr, priceStr, unitsStr] = m;
    rows.push({
      date: `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`,
      amount: parseFloat(amtStr.replace(/,/g,"")),
      unitPrice: parseFloat(priceStr.replace(/,/g,"")),
      units: parseFloat(unitsStr.replace(/,/g,""))
    });
  });
  return { rows, errors };
}

function solveLinearSystem(A, b) {
  const n = A.length;
  const M = A.map((row,i)=>[...row, b[i]]);
  for (let i=0;i<n;i++) {
    let maxRow = i;
    for (let k=i+1;k<n;k++) if (Math.abs(M[k][i])>Math.abs(M[maxRow][i])) maxRow=k;
    [M[i],M[maxRow]] = [M[maxRow],M[i]];
    if (Math.abs(M[i][i]) < 1e-12) continue;
    for (let k=i+1;k<n;k++) {
      const factor = M[k][i]/M[i][i];
      for (let j=i;j<=n;j++) M[k][j] -= factor*M[i][j];
    }
  }
  const x = new Array(n).fill(0);
  for (let i=n-1;i>=0;i--) {
    let sum = M[i][n];
    for (let j=i+1;j<n;j++) sum -= M[i][j]*x[j];
    x[i] = Math.abs(M[i][i])<1e-12 ? 0 : sum/M[i][i];
  }
  return x;
}
function olsFit(X, y) {
  const n = X[0].length;
  const XtX = Array.from({length:n}, (_,i)=>Array.from({length:n}, (_,j)=> X.reduce((s,row)=>s+row[i]*row[j],0)));
  const Xty = Array.from({length:n}, (_,i)=> X.reduce((s,row,k)=>s+row[i]*y[k],0));
  return solveLinearSystem(XtX, Xty);
}
function nelsonSiegelBasis(t, tau) {
  const x = t/tau;
  const term1 = x < 1e-6 ? 1 : (1-Math.exp(-x))/x;
  const term2 = term1 - Math.exp(-x);
  return [1, term1, term2];
}
function fitNelsonSiegel(points) {
  if (points.length < 3) return null;
  let best = null;
  for (let tau=0.1; tau<=30; tau+=0.05) {
    const X = points.map(p=>nelsonSiegelBasis(p.t, tau));
    const yv = points.map(p=>p.y);
    const beta = olsFit(X, yv);
    let sse = 0;
    points.forEach((p,i)=>{ const pred = beta[0]*X[i][0]+beta[1]*X[i][1]+beta[2]*X[i][2]; sse += (pred-p.y)**2; });
    if (!best || sse < best.sse) best = { tau, beta, sse };
  }
  return { beta0: best.beta[0], beta1: best.beta[1], beta2: best.beta[2], tau: best.tau,
    predict: (t) => { const b = nelsonSiegelBasis(t, best.tau); return best.beta[0]*b[0]+best.beta[1]*b[1]+best.beta[2]*b[2]; } };
}
function fitCubicLogPoly(points) {
  if (points.length < 4) return null;
  const X = points.map(p => { const l = Math.log(p.t); return [l**3, l**2, l, 1]; });
  const yv = points.map(p=>p.y);
  const beta = olsFit(X, yv);
  return { a: beta[0], b: beta[1], c: beta[2], d: beta[3],
    predict: (t) => { const l = Math.log(t); return beta[0]*l**3+beta[1]*l**2+beta[2]*l+beta[3]; } };
}
function buildYieldCurveModel(points) {
  const sorted = [...points].sort((a,b)=>a.t-b.t);
  const ns = fitNelsonSiegel(points);
  const cubic = fitCubicLogPoly(points);
  function blended(t) {
    if (ns && cubic) return (ns.predict(t)+cubic.predict(t))/2;
    if (ns) return ns.predict(t);
    if (cubic) return cubic.predict(t);
    return null;
  }
  function predict(t) {
    if (sorted.length===0) return null;
    if (t <= sorted[0].t) return sorted.length>1 ? sorted[0].y : sorted[0].y;
    if (t >= sorted[sorted.length-1].t) { const b = blended(t); return b!=null ? b : sorted[sorted.length-1].y; }
    for (let i=0;i<sorted.length-1;i++) {
      if (t>=sorted[i].t && t<=sorted[i+1].t) {
        const frac = (t-sorted[i].t)/(sorted[i+1].t-sorted[i].t);
        return sorted[i].y + frac*(sorted[i+1].y-sorted[i].y);
      }
    }
    return blended(t);
  }
  return { ns, cubic, predict, blended };
}
// ---- Metriche aggregate del portafoglio obbligazionario ----
// Rendimento e duration esistono per singolo titolo; qui si pesano per valore
// investito, perché la domanda utile è quanto rende e quanto rischia l'insieme.
function couponFrequencyPerYear(f) {
  return f === "monthly" ? 12 : f === "quarterly" ? 4 : f === "semiannual" ? 2 : 1;
}

// ---- Copertura delle spese con reddito passivo ----
// Misura flussi già contrattualizzati (cedole, interessi, affitti, dividendi),
// non una proiezione: dice quanta parte della vita corrente è già finanziata.
const PASSIVE_CATEGORIES = ["Cedola","Interesse deposito","Affitto immobile","Dividendo"];
// ---- Mesi di autonomia ----
// Quanto si resiste con la sola liquidità disponibile, senza entrate.
const STANDARD_MATURITIES = [0.25, 0.5, 1, 2, 3, 5, 7, 10, 15, 20];
function parseFlexibleDate(v) {
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v === "number") return new Date(Math.round((v - 25569) * 86400 * 1000));
  const s = String(v||"").trim();
  let m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
async function parseMinistryAuctionsXLSX(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
  if (rows.length < 5) throw new Error("File troppo corto: non ha il formato atteso (header su 3 righe + dati).");
  const dataRows = rows.slice(4);
  const parsed = [];
  dataRows.forEach(row => {
    if (!row || row.length < 18) return;
    const isin = row[0];
    const auctionDate = parseFlexibleDate(row[1]);
    const settlementDate = parseFlexibleDate(row[4]);
    const maturityDate = parseFlexibleDate(row[5]);
    if (!auctionDate || !settlementDate || !maturityDate) return;
    function parsePercentCell(raw) {
      const s = String(raw==null?"":raw).trim();
      if (s === "") return null;
      const hasPercent = s.includes("%");
      const num = parseFloat(s.replace(",", ".").replace("%",""));
      if (isNaN(num)) return null;
      return hasPercent ? num : num*100;
    }
    const cutoffYieldPct = parsePercentCell(row[17]);
    if (cutoffYieldPct === null) return;
    const tenorYears = (maturityDate - settlementDate) / (365.25*86400000);
    if (tenorYears <= 0) return;
    let bucket = STANDARD_MATURITIES[0], bestDist = Infinity;
    STANDARD_MATURITIES.forEach(m => { const d = Math.abs(Math.log(tenorYears/m)); if (d<bestDist) { bestDist=d; bucket=m; } });
    const couponRatePct = parsePercentCell(row[29]);
    parsed.push({ isin, auctionDate, settlementDate, maturityDate, tenorYears, bucket, cutoffYieldPct, couponRatePct });
  });
  if (parsed.length === 0) throw new Error("Nessuna riga valida trovata (controlla che sia il file giusto).");
  const byBucket = {};
  parsed.forEach(p => { if (!byBucket[p.bucket] || p.auctionDate > byBucket[p.bucket].auctionDate) byBucket[p.bucket] = p; });
  const points = Object.values(byBucket).map(p => ({
    maturity: p.bucket, cutoffYield: p.cutoffYieldPct, isin: p.isin, couponRatePct: p.couponRatePct,
    auctionDate: localDateStr(p.auctionDate), maturityDate: localDateStr(p.maturityDate), tenorYears: p.tenorYears
  })).sort((a,b)=>a.maturity-b.maturity);
  return { importedAt: todayISO, points, totalRowsParsed: parsed.length };
}

function bondCleanPrice(faceValue, annualCouponRate, marketYieldPct, semiPeriodsRemaining) {
  const C2 = faceValue * annualCouponRate/100/2;
  const y2 = marketYieldPct/100/2;
  let price = 0;
  for (let t=1; t<=semiPeriodsRemaining; t++) price += C2/Math.pow(1+y2, t);
  price += faceValue/Math.pow(1+y2, semiPeriodsRemaining);
  return price;
}
function accruedInterest(faceValue, annualCouponRate, daysSinceLastCoupon) {
  return faceValue * (annualCouponRate/100) * (daysSinceLastCoupon/365);
}
function bondDuration(faceValue, annualCouponRate, marketYieldPct, semiPeriodsRemaining) {
  const C2 = faceValue*annualCouponRate/100/2;
  const y2 = marketYieldPct/100/2;
  let price = 0, weightedSum = 0;
  for (let t=1;t<=semiPeriodsRemaining;t++) { const pv = C2/Math.pow(1+y2,t); price += pv; weightedSum += (t/2)*pv; }
  const pvFace = faceValue/Math.pow(1+y2,semiPeriodsRemaining);
  price += pvFace; weightedSum += (semiPeriodsRemaining/2)*pvFace;
  const macaulay = weightedSum/price;
  const modified = macaulay/(1+y2);
  return { macaulay, modified, price };
}
function daysSinceLastCoupon(anchorDate, freqMonths, asOf) {
  const start = new Date(anchorDate);
  let last = new Date(start);
  const now2 = asOf || now;
  while (true) {
    const next = new Date(last); next.setMonth(next.getMonth()+freqMonths);
    if (next > now2) break;
    last = next;
  }
  return Math.max(0, Math.round((now2 - last)/86400000));
}

function bondYTM(price, redemption, couponRate, paymentsPerYear, periods) {
  if (periods <= 0) return null;
  const couponPerPeriod = couponRate/paymentsPerYear;
  function priceAtYield(yPerPeriod) {
    if (Math.abs(yPerPeriod) < 1e-9) return couponPerPeriod*periods + redemption;
    return couponPerPeriod * (1-Math.pow(1+yPerPeriod,-periods))/yPerPeriod + redemption*Math.pow(1+yPerPeriod,-periods);
  }
  let lo = -0.5, hi = 2;
  for (let i=0;i<100;i++) {
    const mid = (lo+hi)/2;
    const p = priceAtYield(mid);
    if (p > price) lo = mid; else hi = mid;
  }
  const yPerPeriod = (lo+hi)/2;
  return (Math.pow(1+yPerPeriod, paymentsPerYear) - 1) * 100;
}
function computeYieldCurveData() {
  const bonds = data.portfolio.filter(p => p.type && p.type.toLowerCase().includes("obbligazione") && p.amount > 0 && p.maturityDate);
  const perBond = bonds.map(p => {
    const anchorDate = p.issueDate || p.date;
    if (!anchorDate) return null;
    const years = (new Date(p.maturityDate) - new Date(anchorDate)) / (365.25*86400000);
    if (years <= 0) return null;
    const freqObj = FREQUENCIES.find(f=>f.key===(p.couponFrequency||"annual")) || {months:12};
    const paymentsPerYear = 12/freqObj.months;
    const periods = years * paymentsPerYear;
    const couponRate = Number(p.couponRate)||0;
    const purchasePrice = (p.purchasePrice!=null) ? Number(p.purchasePrice) : 100;
    const redemptionPrice = (p.redemptionPrice!=null) ? Number(p.redemptionPrice) : 100;
    const ytm = bondYTM(purchasePrice, redemptionPrice, couponRate, paymentsPerYear, periods);
    if (ytm==null || !isFinite(ytm)) return null;
    return { id: p.id, name: p.type, note: p.note, years, ytm, issueDate: anchorDate, maturityDate: p.maturityDate, purchasePrice, couponRate, paymentsPerYear, freqMonths: freqObj.months, anchorDate };
  }).filter(Boolean);

  // Bucket: for each standard maturity, prefer the official Ministry auction (if imported), else the most recently issued own bond within 20%
  const officialByMaturity = {};
  if (data.marketYieldCurve && data.marketYieldCurve.points) {
    data.marketYieldCurve.points.forEach(p => { officialByMaturity[p.maturity] = p; });
  }
  const buckets = STANDARD_MATURITIES.map(mat => {
    if (officialByMaturity[mat]) return { maturity: mat, official: officialByMaturity[mat], observed: null };
    let best = null, bestDist = Infinity;
    perBond.forEach(b => {
      const dist = Math.abs(b.years - mat) / mat;
      if (dist <= 0.2 && (!best || new Date(b.issueDate) > new Date(best.issueDate) || (new Date(b.issueDate).getTime()===new Date(best.issueDate).getTime() && dist < bestDist))) {
        best = b; bestDist = dist;
      }
    });
    return { maturity: mat, official: null, observed: best };
  });

  const observedPoints = buckets.filter(b=>b.official||b.observed).map(b=> b.official ? { t: b.maturity, y: b.official.cutoffYield } : { t: b.maturity, y: b.observed.ytm });
  const model = observedPoints.length>=2 ? buildYieldCurveModel(observedPoints) : null;

  const curveTable = buckets.map(b => {
    if (b.official) return { maturity: b.maturity, ytm: b.official.cutoffYield, source: 'ufficiale (asta '+b.official.auctionDate+')', bond: null, official: b.official };
    if (b.observed) return { maturity: b.maturity, ytm: b.observed.ytm, source: 'osservato (tuo titolo)', bond: b.observed };
    const predicted = model ? model.predict(b.maturity) : null;
    return { maturity: b.maturity, ytm: predicted, source: 'previsto (NS+cubico)', bond: null };
  }).filter(r => r.ytm != null);

  return { perBond: perBond.sort((a,b)=>a.years-b.years), observedPoints, model, curveTable };
}
function computeBondsSummary() {
  const bonds = data.portfolio.filter(p => p.type && p.type.toLowerCase().includes("obbligazione") && p.amount > 0);
  const grouped = {};
  bonds.forEach(p => {
    const key = p.type;
    if (!grouped[key]) grouped[key] = { name:key, totalInvestedALL:0, count:0, couponsReceivedALL:0, nextMaturity:null };
    grouped[key].totalInvestedALL += toALL(p.amount, p.currency);
    grouped[key].count++;
    const coupons = data.income.filter(i=>i.linkedBondId===p.id).reduce((s,i)=>s+Number(i.amount),0);
    grouped[key].couponsReceivedALL += coupons;
    if (p.maturityDate && (!grouped[key].nextMaturity || p.maturityDate < grouped[key].nextMaturity)) grouped[key].nextMaturity = p.maturityDate;
  });
  return Object.values(grouped).map(g => ({...g, rendPct: g.totalInvestedALL>0 ? g.couponsReceivedALL/g.totalInvestedALL*100 : 0}));
}

// ===== Punto C: riconciliazione — confronta il saldo calcolato con quello reale
// del conto, come controverifica indipendente dal Controllo integrità dati (che

function computeFundsSummary() {
  const funds = data.portfolio.filter(p => isFundEntry(p) && p.amount>0 && p.fundQuotaCount);
  const grouped = {};
  funds.forEach(p => {
    const key = p.fundName || p.type;
    if (!grouped[key]) grouped[key] = { name:key, totalQuote:0, totalInvested:0, latestPrice:0, latestPriceDate:null, currency:p.currency, priceHistory:[], earliestDate:p.date, id:p.id, lotIds:[], priceDate:null };
    grouped[key].lotIds.push(p.id);
    grouped[key].totalQuote += Number(p.fundQuotaCount)||0;
    grouped[key].totalInvested += Number(p.amount)||0;
    if (p.priceHistory) grouped[key].priceHistory.push(...p.priceHistory);
    if (p.priceValuationDate && (!grouped[key].priceDate || p.priceValuationDate > grouped[key].priceDate)) {
      grouped[key].priceDate = p.priceValuationDate;
    }
    // Fallback candidate: this lot's own current/purchase price, dated at its priceHistory's latest entry or its own date
    const ownLatestHist = (p.priceHistory||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    const ownPrice = ownLatestHist ? ownLatestHist.price : (Number(p.fundCurrentQuotaPrice)||Number(p.fundPurchaseQuotaPrice)||0);
    const ownDate = ownLatestHist ? ownLatestHist.date : p.date;
    if (!grouped[key].latestPriceDate || ownDate > grouped[key].latestPriceDate) {
      grouped[key].latestPrice = ownPrice;
      grouped[key].latestPriceDate = ownDate;
    }
    if (p.date && p.date < grouped[key].earliestDate) grouped[key].earliestDate = p.date;
  });
  const yearStart = `${thisYear}-01-01`;
  return Object.values(grouped).map(g => {
    g.currentPrice = g.latestPrice;
    const avgPrice = g.totalQuote>0 ? g.totalInvested/g.totalQuote : 0;
    const currentValue = g.totalQuote * g.currentPrice;
    const rendValore = currentValue - g.totalInvested;
    const rendPct = g.totalInvested>0 ? rendValore/g.totalInvested*100 : 0;
    g.priceHistory.sort((a,b)=>a.date.localeCompare(b.date));
    let baselinePrice = null;
    const historyThisYear = g.priceHistory.filter(h=>h.date>=yearStart);
    const historyBefore = g.priceHistory.filter(h=>h.date<yearStart).sort((a,b)=>b.date.localeCompare(a.date));
    if (historyBefore.length>0) baselinePrice = historyBefore[0].price;
    else if (historyThisYear.length>0) baselinePrice = historyThisYear[0].price;
    else if (g.earliestDate >= yearStart) baselinePrice = avgPrice;
    let ytdPct = null, projectedPct = null;
    if (baselinePrice) {
      ytdPct = ((g.currentPrice - baselinePrice) / baselinePrice) * 100;
      const dayOfYear = Math.ceil((now - new Date(thisYear,0,1)) / 86400000) || 1;
      projectedPct = ytdPct * (365/dayOfYear);
    }
    const currentValueALL = toALL(currentValue, g.currency);
    const totalInvestedALL = toALL(g.totalInvested, g.currency);
    const divReceived = data.income.filter(i=>i.category==="Dividendo" && g.lotIds.includes(i.linkedBondId)).reduce((s,i)=>s+Number(i.amount),0);
    const anchorPos = data.portfolio.find(p => p.id === g.id);
    const freshness = priceFreshnessLabel(anchorPos);
    return { freshness, id:g.id, name:g.name, totalQuote:g.totalQuote, currentPrice:g.currentPrice, currentValue, currentValueALL, totalInvestedALL, avgPrice, rendPct, rendValore, ytdPct, projectedPct, currency:g.currency, divReceived, priceDate:g.priceDate };
  });
}

      const sub = document.getElementById("editRentalSubFields_"+posId);
      if (sub) sub.style.display = chk.checked ? "block" : "none";
    });
  });
  document.querySelectorAll("[data-del-port]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const hadLinkedRule = deletePortfolioPosition(btn.dataset.delPort);
      saveData(); renderPortfolio();
      if (hadLinkedRule) alert("Eliminato anche il reddito ricorrente collegato a questo titolo.");
    });
  });
  async function updateOneFund(fundName, raiffeisenName, opts) {
    opts = opts || {};
    const lots = data.portfolio.filter(p => (p.fundName||p.type)===fundName && isFundEntry(p));
    if (lots.length===0) return { ok:false, error:"nessun lotto" };
    let price, currency, evalDate;
    try {
      ({ price, currency, evalDate } = await fetchFundPrice(raiffeisenName));
    } catch (err) {
      recordPriceFetchOutcome(lots, false, String(err.message||err));
      saveData();
      throw err;
    }
    // Valuta discordante: il sito quota in una valuta, la posizione è registrata in
    // un'altra. Salvare il numero così com'è lo tratterebbe come se fosse già nella
    // valuta della posizione, sbagliando il valore di decine di volte. Meglio non
    // scrivere nulla e dirlo chiaramente.
    const valutaPos = lots[0].currency || "ALL";
    if (currency && currency !== valutaPos && !opts.forzaValuta) {
      recordPriceFetchOutcome(lots, false, `valuta discordante: sito ${currency}, posizione ${valutaPos}`);
      saveData();
      return { ok:false, currencyMismatch:true, price, currency, valutaPosizione: valutaPos,
        evalDate, fundName, raiffeisenName, lotCount: lots.length };
    }

    // Controllo di plausibilità: una variazione enorme rispetto all'ultimo prezzo
    // noto è quasi sempre un numero sbagliato letto da un layout cambiato,
    // non un rendimento. Non si scrive nulla senza conferma esplicita.
    const previous = Number(lots[0].fundCurrentQuotaPrice) || Number(lots[0].fundPurchaseQuotaPrice) || null;
    const assess = assessPriceChange(price, previous);
    if (assess.suspicious && !opts.force) {
      recordPriceFetchOutcome(lots, false, `variazione sospetta ${assess.changePct.toFixed(1)}%`);
      saveData();
      return { ok:false, needsConfirm:true, price, currency, evalDate, previous: assess.previousPrice,
        changePct: assess.changePct, fundName, raiffeisenName, lotCount: lots.length };
    }
    lots.forEach(pos => {
      pos.fundCurrentQuotaPrice = price;
      pos.marketValue = (pos.fundQuotaCount||0) * price;
      pos.priceValuationDate = evalDate || null;
      if (!pos.priceHistory) pos.priceHistory = [];
      const existingIdx = pos.priceHistory.findIndex(h=>h.date===todayISO);
      if (existingIdx>=0) pos.priceHistory[existingIdx].price = price;
      else pos.priceHistory.push({ date: todayISO, price });
      pos.priceHistory.sort((a,b)=>a.date.localeCompare(b.date));
    });
    recordPriceFetchOutcome(lots, true, null);
    return { ok:true, price, currency, evalDate, changePct: assess.changePct,
      currencyMismatch: currency && currency !== lots[0].currency, lotCount: lots.length };
  }
  document.querySelectorAll(".manual-price-input").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const nome = inp.dataset.fundname;
      const nuovo = Number(inp.value);
      if (!isFinite(nuovo) || nuovo <= 0) { alert("Inserisci un prezzo maggiore di zero."); return; }
      const lotti = data.portfolio.filter(x => isFundEntry(x) && x.amount>0 && (x.fundName||x.type) === nome);
      lotti.forEach(pos => {
        pos.fundCurrentQuotaPrice = nuovo;
        pos.marketValue = (pos.fundQuotaCount||0) * nuovo;
        if (!pos.priceHistory) pos.priceHistory = [];
        const i = pos.priceHistory.findIndex(h=>h.date===todayISO);
        if (i>=0) pos.priceHistory[i].price = nuovo; else pos.priceHistory.push({ date: todayISO, price: nuovo });
        pos.priceHistory.sort((a,b)=>a.date.localeCompare(b.date));
        pos.priceManualDate = todayISO;
      });
      saveData();
      if (currentTabId === "fundsTab") renderFundsTab(); else renderPortfolio();
    });
  });
  document.querySelectorAll(".raif-fund-select").forEach(sel=>{
    sel.addEventListener("change", ()=> setFundSource(sel.dataset.fundname, sel.value));
  });
  document.querySelectorAll("[data-updatefundname]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const fundName = btn.dataset.updatefundname;
      const select = btn.parentElement.querySelector(".raif-fund-select");
      const statusEl = btn.parentElement.nextElementSibling;
      if (!select) return;
      if (!select.value) {
        statusEl.textContent = "Scegli prima da quale fondo del sito prendere il prezzo.";
        return;
      }
      setFundSource(fundName, select.value);
      statusEl.textContent = "Recupero prezzo…";
      try {
        let r = await updateOneFund(fundName, select.value);
        // Variazione fuori scala: chiedo conferma invece di scrivere un numero
        // che con ogni probabilità è stato letto male.
        if (r.needsConfirm) {
          const ok = confirm(
            `Prezzo sospetto per "${fundName}".\n\n` +
            `Ultimo prezzo noto: ${fmt2(r.previous)}\n` +
            `Prezzo letto dal sito: ${fmt2(r.price)}\n` +
            `Variazione: ${r.changePct>0?'+':''}${r.changePct.toFixed(1)}%\n\n` +
            `Una variazione così ampia di solito significa che il sito ha cambiato struttura ` +
            `e il numero letto non è il prezzo.\n\nVuoi comunque salvarlo?`);
          if (!ok) {
            statusEl.textContent = `Aggiornamento annullato: variazione ${r.changePct.toFixed(1)}% ritenuta sospetta. Il prezzo precedente è stato mantenuto.`;
            renderPortfolio();
            return;
          }
          r = await updateOneFund(fundName, select.value, { force:true });
        }
        saveData();
        if (r.currencyMismatch) {
          statusEl.textContent = `Aggiornamento annullato: il fondo quota in ${r.currency} ma la posizione è registrata in ${r.valutaPosizione}. `
            + `Prezzo letto: ${fmt2(r.price)} ${r.currency}. Correggi la valuta della posizione, oppure inserisci il prezzo a mano.`;
          renderPortfolio();
          return;
        }
        statusEl.textContent = `Aggiornato su ${r.lotCount} lotti: ${fmt2(r.price)} ${r.currency}/quota (${select.value})${r.evalDate?' · data e vlerësimit: '+r.evalDate:' · data e vlerësimit non trovata sulla pagina'}.`;
        renderPortfolio();
      } catch (err) {
        statusEl.textContent = "Errore: " + String(err.message||err).slice(0,150);
      }
    });
  });

  const updateAllFundsBtn = document.getElementById("updateAllFundsBtn");
  if (updateAllFundsBtn) updateAllFundsBtn.addEventListener("click", async ()=>{
    const statusEl = document.getElementById("statusUpdateAll");
    const selects = document.querySelectorAll(".raif-fund-select");
    let okCount = 0, errCount = 0, mismatches = [];
    const datesFound = [], suspicious = [], senzaFonte = [], valutaDiversa = [];
    for (const select of selects) {
      const fundName = select.dataset.fundname;
      if (!select.value) { errCount++; senzaFonte.push(fundName); continue; }
      statusEl.textContent = `Aggiorno ${fundName}… (${okCount+errCount+1}/${selects.length})`;
      try {
        const r = await updateOneFund(fundName, select.value);
        if (r.currencyMismatch) {
          valutaDiversa.push(`${fundName} (sito ${r.currency}, posizione ${r.valutaPosizione})`);
          errCount++;
        } else if (r.needsConfirm) {
          suspicious.push(`${fundName} (${r.changePct>0?'+':''}${r.changePct.toFixed(1)}%)`);
          errCount++;
        } else {
          if (r.currencyMismatch) mismatches.push(fundName);
          if (r.evalDate) datesFound.push(`${fundName}: ${r.evalDate}`);
          okCount++;
        }
      } catch (err) {
        errCount++;
      }
    }
    saveData();
    statusEl.textContent = `Fatto: ${okCount} aggiornati${errCount>0?', '+errCount+' falliti':''}${mismatches.length>0?' — attenzione valuta per: '+mismatches.join(', '):''}.${valutaDiversa.length>0?' — valuta discordante, non aggiornati: '+valutaDiversa.join(', '):''}${senzaFonte.length>0?' — senza fonte impostata: '+senzaFonte.join(', '):''}${suspicious.length>0?' — variazione sospetta, non aggiornati: '+suspicious.join(', ')+' (aggiornali singolarmente per confermare)':''}${datesFound.length>0?' Date e vlerësimit — '+datesFound.join('; ')+'.':''}`;
    renderPortfolio();
  });

  async function updateOneCrypto(cryptoId, currency) {
    const price = await fetchCryptoPrice(cryptoId, currency);
    const lots = data.portfolio.filter(p => (p.cryptoId||p.type)===cryptoId && isCryptoType(p.type, p.macro));
    lots.forEach(pos => { pos.cryptoCurrentPrice = price; pos.marketValue = (pos.cryptoQuantity||0)*price; });
    return { price, lotCount: lots.length };
  }
  document.querySelectorAll("[data-updatecryptoname]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const cryptoId = btn.dataset.updatecryptoname;
      const currency = btn.dataset.cryptocurrency;

      statusEl.textContent = "Recupero prezzo da CoinGecko…";
      try {
        const r = await updateOneCrypto(cryptoId, currency);
        saveData();
        statusEl.textContent = `Aggiornato su ${r.lotCount} lotti: ${fmt(r.price)} ${currency}/unità.`;
        renderPortfolio();
      } catch (err) {
        statusEl.textContent = "Errore: " + String(err.message||err).slice(0,150);
      }
    });
  });
  const updateAllCryptoBtn = document.getElementById("updateAllCryptoBtn");
  if (updateAllCryptoBtn) updateAllCryptoBtn.addEventListener("click", async ()=>{
    const statusEl = document.getElementById("statusUpdateAllCrypto");
    const buttons = document.querySelectorAll("[data-updatecryptoname]");
    let okCount = 0, errCount = 0;
    for (const b of buttons) {

      const currency = b.dataset.cryptocurrency;
      statusEl.textContent = `Aggiorno ${cryptoId}… (${okCount+errCount+1}/${buttons.length})`;

function renderBudgetGroupCard(groupKey, title) {
  const budgets = data.categoryBudgets[groupKey] || {};
  const cats = Object.keys(budgets).filter(c => budgets[c] > 0 && data.categories[groupKey].includes(c));
  if (cats.length === 0) {
    return `<div class="card"><h3>${title}</h3><div class="empty">Nessun budget impostato. Vai in Assunzioni → Gestisci categorie per assegnarne uno a ciascuna voce.</div></div>`;
  }
  const blocks = cats.map(c => {
    const annual = budgets[c];
    const monthly = annual / 12;
    const daily = annual / 365;
    const entries = normalizedEntries(groupKey, c);
    const actualDay = sumForDate(entries, todayISO);
    const actualMonth = sumForMonth(entries, thisMonth);
    const actualYear = sumForYear(entries, thisYear);
    return `<div style="margin-bottom:18px;">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:13px; color:#EDE6D6; margin-bottom:8px;">${c}</div>
      ${budgetBlock("Oggi", actualDay, daily)}
      ${budgetBlock("Mese", actualMonth, monthly)}
      ${budgetBlock("Anno", actualYear, annual)}
    </div>`;
  }).join('');
  return `<div class="card"><h3>${title}</h3>${blocks}</div>`;
}

function avgStatsFor(entries, dayOfMonth) {
  const total = entries.reduce((s,e)=>s+Number(e.amount),0);
  const distinctDays = new Set(entries.map(e=>e.date)).size;
  return { total, simple: dayOfMonth>0 ? total/dayOfMonth : 0, effective: distinctDays>0 ? total/distinctDays : 0, distinctDays };
}
function avgRowHtml(label, stats) {
  return `<div style="display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px dashed #24374F; gap:10px;">
    <span style="font-family:'Inter',sans-serif; font-size:12.5px; color:#EDE6D6; flex:1;">${label}</span>
    <span style="text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#C9A227; white-space:nowrap;">${fmtDisplay(stats.total)}
      <div style="font-size:10px; color:#8FA3BF; font-family:'Inter',sans-serif; margin-top:2px;">semplice: ${fmtDisplay(stats.simple)}/gg · reale (${stats.distinctDays}gg): ${fmtDisplay(stats.effective)}/gg</div>
    </span>
  </div>`;
}
function renderDailyAveragesCard() {
  const monthEntries = data.expenses.filter(e => e.date.slice(0,7) === thisMonth);
  const dayOfMonth = now.getDate();
  if (monthEntries.length === 0) {
    return `<div class="card"><h3>Medie giornaliere · Spese (${thisMonth})</h3><div class="empty">Nessuna spesa registrata questo mese.</div></div>`;
  }
  const totalStats = avgStatsFor(monthEntries, dayOfMonth);
  const cats = [...new Set(monthEntries.map(e=>e.category))].sort((a,b)=>{
    const ta = monthEntries.filter(e=>e.category===a).reduce((s,e)=>s+Number(e.amount),0);
    const tb = monthEntries.filter(e=>e.category===b).reduce((s,e)=>s+Number(e.amount),0);
    return tb-ta;
  });
  const macros = [...new Set(monthEntries.map(e=>e.macro).filter(Boolean))];
  return `<div class="card">
    <h3>Medie giornaliere · Spese (${thisMonth})</h3>
    <div class="subtle">"Semplice" = totale ÷ ${dayOfMonth} (giorni trascorsi nel mese). "Reale" = totale ÷ giorni in cui hai effettivamente registrato una spesa.</div>
    <div style="margin-top:10px; margin-bottom:4px; font-family:'Fraunces',serif; color:#C9A227; font-size:13px;">Totale</div>
    ${avgRowHtml("Tutte le spese", totalStats)}
    <div style="margin-top:14px; margin-bottom:4px; font-family:'Fraunces',serif; color:#C9A227; font-size:13px;">Per categoria</div>
    ${cats.map(c => avgRowHtml(c, avgStatsFor(monthEntries.filter(e=>e.category===c), dayOfMonth))).join('')}
    ${macros.length>0 ? `
    <div style="margin-top:14px; margin-bottom:4px; font-family:'Fraunces',serif; color:#C9A227; font-size:13px;">Per macro-categoria</div>
    ${macros.map(m => avgRowHtml(m, avgStatsFor(monthEntries.filter(e=>e.macro===m), dayOfMonth))).join('')}` : ''}
  </div>`;
}

function bindCategoryManagement(group, refreshFn) {
  const addBtn = document.querySelector(`[data-catadd="${group}"]`);
  if (addBtn) addBtn.addEventListener("click", ()=>{
    const input = document.querySelector(`[data-catinput="${group}"]`);
    const val = input.value.trim();
    if (val && !data.categories[group].includes(val)) { data.categories[group].push(val); saveData(); refreshFn(); }
  });
  document.querySelectorAll(`[data-catdel]`).forEach(btn=>{
    const [g, name] = btn.dataset.catdel.split("|");
    if (g !== group) return;
    btn.addEventListener("click", ()=>{
      if (!confirm(`Eliminare la categoria "${name}"? Le voci già registrate la manterranno come testo libero.`)) return;
      data.categories[group] = data.categories[group].filter(c=>c!==name);
      if (data.categoryBudgets[group]) delete data.categoryBudgets[group][name];
      saveData(); refreshFn();
    });
  });
  const saveBtn = document.querySelector(`[data-catsave="${group}"]`);
  if (saveBtn) saveBtn.addEventListener("click", ()=>{
    const container = document.getElementById(`cat-block-${group}`);
    let renamedAny = false;
    container.querySelectorAll(".cat-row[data-origname]").forEach(row=>{
      const origName = row.dataset.origname;
      const nameInput = row.querySelector(".cat-name-input");
      const budgetInput = row.querySelector(".cat-budget-input");
      const newName = nameInput.value.trim();
      if (newName && newName !== origName) { renameCategory(group, origName, newName); renamedAny = true; }
      const finalName = data.categories[group].includes(newName) ? newName : origName;
      if (!data.categoryBudgets[group]) data.categoryBudgets[group] = {};
      data.categoryBudgets[group][finalName] = Number(budgetInput.value) || 0;
    });
    saveData();
    alert("Modifiche salvate." + (renamedAny ? " Le voci già registrate sono state aggiornate col nuovo nome." : ""));
    refreshFn();
  });
}

          <div style="display:flex;align-items:center;">

          </div>
        </div>`;
      }).join(''), cap, '<div class="empty">Nessuna azione o derivato registrati.</div>'); })()}
    </div>
    ${stockSummary.length>0 ? `<div class="card">
      <h3>Vendita azione</h3>
      <div class="subtle">Registra la vendita di azioni: calcola capital gain, tassazione e commissione, e aggiorna Patrimonio, Reddito e Costi.</div>
      <form class="entry" id="stockSaleForm">
        <div><label>Azione</label><select name="stockId" id="stockSaleSelect">${stockSummary.map(g=>`<option value="${g.id}">${g.ticker}${g.name?' · '+g.name:''} — ${g.quantity} azioni</option>`).join('')}</select></div>
        <div class="row2">
          <div><label>Quantità venduta</label><input type="number" min="0" step="0.0001" name="quantity" id="stockSaleQuantity" required></div>
          <div><label>Prezzo medio acquisto/azione</label><input type="number" min="0" step="0.0001" name="purchasePrice" id="stockSalePurchasePrice" required></div>
        </div>
        <div class="row2">
          <div><label>Prezzo di vendita/azione</label><input type="number" min="0" step="0.0001" name="salePrice" required></div>
          <div><label>Data vendita</label><input type="date" name="saleDate" value="${todayISO}"></div>
        </div>
        <div class="row2">
          <div><label>Tassazione (%)</label><input type="number" min="0" max="100" step="0.0001" name="taxRate" value="15"></div>
          <div><label>Commissione</label><input type="number" min="0" step="0.0001" name="commissionValue" placeholder="0"></div>

        <div><label>Tipo commissione</label><select name="commissionType"><option value="percent">%</option><option value="fixed">Fissa</option></select></div>
        <div id="stockSalePreview" style="background:#0F1B2B; border:1px solid #2E4159; border-radius:6px; padding:12px; margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:12.5px;"></div>
        <button class="primary" type="submit">Registra vendita</button>

      <h3>Riepilogo azioni</h3>
      ${stockSummary.map(g=>`
        <div style="border-bottom:1px solid #24374F; padding:10px 0;">
          <div style="font-family:'Fraunces',serif; color:#C9A227; font-size:14px; margin-bottom:6px;">${g.ticker}${g.name?' · '+g.name:''}${g.exchange?' <span class="pill">'+g.exchange+'</span>':''}</div>
          <div class="stat-row"><span class="label">Quantità</span><span class="val">${g.quantity}</span></div>
          <div class="stat-row"><span class="label">Valore acquisto</span><span class="val">${fmt(g.purchaseValue)} ${g.currency}</span></div>
          <div class="stat-row"><span class="label">Valore di mercato attuale</span><span class="val">${fmt(g.marketValue)} ${g.currency}</span></div>
          <div class="stat-row"><span class="label">Plus/minusvalenza non realizzata</span><span class="val ${g.gainPct>=0?'up':'down'}">${g.gainPct>=0?'+':''}${g.gainPct.toFixed(2)}%</span></div>
          ${g.hasDividend ? `<div class="stat-row"><span class="label">Dividendo (${g.dividendFrequency})</span><span class="val">${fmt(g.dividendAmount)} ${g.currency}/azione</span></div>` : '<div class="subtle">Nessun dividendo ricorrente impostato</div>'}
          ${g.divReceived>0 ? `<div class="stat-row"><span class="label">Dividendi incassati finora</span><span class="val up">${fmt(g.divReceived)} ${g.currency}</span></div>` : ''}
        </div>`).join('')}
      <div class="stat-row" style="font-weight:600; padding-top:8px; border-top:1px solid #24374F; margin-top:6px;"><span class="label">Totale azioni</span><span class="val">${fmtDisplay(totalStockValueALL)}</span></div>

      <h3>Riepilogo derivati</h3>
