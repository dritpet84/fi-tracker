          <div style="font-family:'Fraunces',serif; color:#C9A227; font-size:14px; margin-bottom:6px;">${g.derivativeType}${g.underlying?' · '+g.underlying:''}</div>
          <div class="stat-row"><span class="label">Valore acquisto</span><span class="val">${fmt(g.purchaseValue)} ${g.currency}</span></div>
          <div class="stat-row"><span class="label">Valore attuale</span><span class="val">${fmt(g.marketValue)} ${g.currency}</span></div>
          <div class="stat-row"><span class="label">Plus/minusvalenza</span><span class="val ${g.gainPct>=0?'up':'down'}">${g.gainPct>=0?'+':''}${g.gainPct.toFixed(2)}%</span></div>
          ${g.expiryDate ? `<div class="stat-row"><span class="label">Scadenza</span><span class="val">${g.expiryDate}</span></div>` : ''}
        </div>`).join('')}
      <div class="stat-row" style="font-weight:600; padding-top:8px; border-top:1px solid #24374F; margin-top:6px;"><span class="label">Totale derivati</span><span class="val">${fmtDisplay(totalDerivValueALL)}</span></div>
    </div>` : ''}
    ${riquadroRischioScheda(data.portfolio.filter(p => p.amount>0 && (isStockType(p.type,p.macro)||isDerivativeType(p.type,p.macro))), "Rischio di questa sezione")}
  `;
  bindCategorySelects();
  bindMacroSelects();

  const assetCatSelect = document.getElementById("assetForm").querySelector(".cat-select");
  function updateAssetFieldsVisibility() {
    const val = (assetCatSelect.value||"").toLowerCase();
    const isDeriv = val.includes("derivat") || val.includes("opzione") || val.includes("future");
    document.getElementById("stockAssetFields").style.display = isDeriv ? "none" : "block";
    document.getElementById("derivativeAssetFields").style.display = isDeriv ? "block" : "none";
  }
  assetCatSelect.addEventListener("change", updateAssetFieldsVisibility);
  updateAssetFieldsVisibility();
  function updateAssetInvestedPreview() {
    const qty = Number(document.getElementById("assetQuantity").value)||0;
    const price = Number(document.getElementById("assetPurchasePrice").value)||0;
    const invested = qty*price;
    document.getElementById("assetInvestedPreview").value = invested ? invested.toFixed(4) : "";
  }
  document.getElementById("assetQuantity").addEventListener("input", updateAssetInvestedPreview);
  document.getElementById("assetPurchasePrice").addEventListener("input", updateAssetInvestedPreview);

  document.getElementById("assetForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const type = ev.target.querySelector(".cat-select").value;
    const macro = ev.target.querySelector(".macro-select").value || null;
    const typeLower = type.toLowerCase();
    const isDeriv = typeLower.includes("derivat") || typeLower.includes("opzione") || typeLower.includes("future");
    const date = f.get("date") || todayISO;
    const posId = uid();
    let posObj;
    if (isDeriv) {
      posObj = {
        id: posId, type, macro, amount: Number(f.get("amount"))||0, currency: f.get("currencyDeriv")||"USD",
        marketValue: f.get("derivativeCurrentValue") ? Number(f.get("derivativeCurrentValue")) : null,
        date, maturityDate: f.get("maturityDate")||null, note: f.get("note")||"",
        derivativeType: f.get("derivativeType")||"", derivativeUnderlying: f.get("derivativeUnderlying")||""
      };
    } else {
      const qty = Number(f.get("stockQuantity"))||0;
      const pPrice = Number(f.get("stockPurchasePrice"))||0;
      const cPrice = f.get("stockCurrentPrice") ? Number(f.get("stockCurrentPrice")) : pPrice;
      posObj = {
        id: posId, type, macro, amount: qty*pPrice, currency: f.get("currency")||"USD",
        marketValue: qty*cPrice, date, maturityDate: null, note: f.get("note")||"",
        stockTicker: f.get("stockTicker")||"", stockName: f.get("stockName")||"", stockExchange: f.get("stockExchange")||"",
        stockQuantity: qty, stockPurchasePrice: pPrice, stockCurrentPrice: cPrice,
        securityCode: assegnaCodiceTitolo(f.get("securityCode"), datiIdentitaDaForm(f, type, macro)),
      riskFactor: rischioPerNuovaPosizione(Object.assign(datiIdentitaDaForm(f, type, macro), { bondYears: f.get("bondYears"), depositYears: f.get("depositYears") }), f.get("riskFactor")),
        issuerName: (f.get("issuerName")||"").trim()
      };
      const divAmt = f.get("dividendAmount") ? Number(f.get("dividendAmount")) : 0;
      if (divAmt > 0) {
        posObj.dividendAmount = divAmt;
        posObj.dividendFrequency = f.get("dividendFrequency")||"quarterly";
        posObj.dividendStartDate = f.get("dividendStartDate")||date;
        posObj.dividendTaxPct = f.get("dividendTaxPct") ? Number(f.get("dividendTaxPct")) : 15;
      }
    }
    data.portfolio.push(posObj);
    const metodo = f.get("paymentType") || "";
    if (metodo && posObj.amount > 0) {
      createLiquidityAdjustment(metodo, -posObj.amount, posObj.date,
        `Acquisto ${isDeriv?(posObj.derivativeType||type):(posObj.stockTicker||type)} ${posObj.securityCode||''}`.trim(), posObj.id);
    }
    saveData(); renderAssets();
  });
  const stockSaleSelect = document.getElementById("stockSaleSelect");
  if (stockSaleSelect) {
    const fillFromStock = () => {
      const g = stockSummary.find(x=>x.id===stockSaleSelect.value) || stockSummary[0];
      if (!g) return;
      document.getElementById("stockSaleQuantity").value = g.quantity || "";
      document.getElementById("stockSalePurchasePrice").value = g.quantity>0 ? (g.purchaseValue/g.quantity) : "";
      updateStockSalePreview();
    };
    function computeStockSale() {
      return computeQuantitySale("stockSaleForm", { qtyField: "quantity", defaultTaxRate: 15 });
    }
    function updateStockSalePreview() {
      renderSalePreviewInto("stockSalePreview", computeStockSale());
    }
    stockSaleSelect.addEventListener("change", fillFromStock);
    document.getElementById("stockSaleForm").querySelectorAll("input, select").forEach(el=>{
      el.addEventListener("input", updateStockSalePreview);
      el.addEventListener("change", updateStockSalePreview);
    });
    fillFromStock();
    updateStockSalePreview();
    document.getElementById("stockSaleForm").addEventListener("submit", ev=>{
      ev.preventDefault();
      const f = new FormData(ev.target);
      const stock = data.portfolio.find(p=>p.id===f.get("stockId"));
      if (!stock) return;
      const saleDate = f.get("saleDate") || todayISO;
      const c = computeStockSale();
      if (blockedBySaleValidation({ quantity: c.quantity, available: stock.stockQuantity,
        salePrice: c.salePrice, taxRate: c.taxRate, saleDate, purchaseDate: stock.date, unitLabel: "azioni" })) return;
      if (!confirm("Confermi la vendita?")) return;
      bookAssetSale({ calc: c, currency: stock.currency, name: stock.stockTicker||stock.type, saleDate,
        portfolioType: stock.type, macro: stock.macro||"Stocks", macroReddito: "Interessi da Titoli - Azionari", sellLabel: "Vendita azioni",
        incomeCategory: "Capital gain azioni", taxCategory: "Tassazione capital gain azioni",
        commissionLabel: "Commissione vendita azioni", linkedPositionId: stock.id });
      saveData(); renderAssets();
    });
  }
  document.querySelectorAll("[data-editport]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingPortfolioId = btn.dataset.editport; renderAssets(); });
  });
  document.querySelectorAll("[data-editport-cancel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingPortfolioId = null; renderAssets(); });
  });
  document.querySelectorAll("[data-editportform]").forEach(form=>{
    form.addEventListener("submit", ev=>{
      ev.preventDefault();
      const id = form.dataset.editportform;
      const pos = data.portfolio.find(p=>p.id===id);
      if (!pos) return;
      const f = new FormData(ev.target);
      pos.type = ev.target.querySelector(".cat-select").value;
      if (f.has("riskFactor")) pos.riskFactor = normalizzaRischio(f.get("riskFactor"), pos);
      if (f.has("securityCode")) pos.securityCode = (f.get("securityCode")||"").trim() || pos.securityCode || null;
      if (f.has("issuerName")) pos.issuerName = (f.get("issuerName")||"").trim();
      pos.currency = f.get("currency");
      pos.date = f.get("date") || pos.date;
      if (f.has("maturityDate")) pos.maturityDate = f.get("maturityDate") || null;
      pos.note = f.get("note") || "";
      if (f.has("stockQuantity")) {
        pos.stockTicker = f.get("stockTicker")||""; pos.stockName = f.get("stockName")||""; pos.stockExchange = f.get("stockExchange")||"";
        pos.stockQuantity = Number(f.get("stockQuantity"))||0;
        pos.stockPurchasePrice = Number(f.get("stockPurchasePrice"))||0;
        pos.stockCurrentPrice = f.get("stockCurrentPrice") ? Number(f.get("stockCurrentPrice")) : pos.stockPurchasePrice;
        pos.amount = pos.stockQuantity*pos.stockPurchasePrice;
        pos.marketValue = pos.stockQuantity*pos.stockCurrentPrice;
        const divAmt = f.get("dividendAmount") ? Number(f.get("dividendAmount")) : 0;
        if (divAmt > 0) {
          pos.dividendAmount = divAmt;
          pos.dividendFrequency = f.get("dividendFrequency")||"quarterly";
          pos.dividendStartDate = f.get("dividendStartDate")||pos.date;
          pos.dividendTaxPct = f.get("dividendTaxPct") ? Number(f.get("dividendTaxPct")) : 15;
        } else {
          delete pos.dividendAmount; delete pos.dividendFrequency; delete pos.dividendStartDate; delete pos.dividendTaxPct;
        }
      } else if (f.has("derivativeType")) {
        pos.derivativeType = f.get("derivativeType")||""; pos.derivativeUnderlying = f.get("derivativeUnderlying")||"";
        if (f.has("amount")) pos.amount = Number(f.get("amount"));
        if (f.has("marketValue")) pos.marketValue = f.get("marketValue") ? Number(f.get("marketValue")) : null;
      }
      editingPortfolioId = null;
      saveData(); renderAssets();
    });
  });
  document.querySelectorAll("[data-del-port]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      deletePortfolioPosition(btn.dataset.delPort);
      saveData(); renderAssets();
    });
  });
}

    const macro = ev.target.querySelector(".macro-select").value || null;
    const newId = createLiquidityAdjustment(type, Number(f.get("amount")), f.get("date")||todayISO, f.get("note")||"", null);
    const pos = data.portfolio.find(p=>p.id===newId);
    if (pos) {
      pos.macro = macro;
      pos.securityCode = assegnaCodiceTitolo(f.get("securityCode"), datiIdentitaDaForm(f, type, macro));
      pos.riskFactor = rischioPerNuovaPosizione(Object.assign(datiIdentitaDaForm(f, type, macro), { bondYears: f.get("bondYears"), depositYears: f.get("depositYears") }), f.get("riskFactor"));
      pos.issuerName = (f.get("issuerName")||"").trim();
    }
    saveData(); renderLiquidityTab();
  });
  document.getElementById("liquidityTransferForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const from = f.get("from");
    const to = f.get("to");
    const amount = Number(f.get("amount"));
    const date = f.get("date") || todayISO;
    const note = f.get("note") || "";
    const manualRate = f.get("manualFxRate") ? Number(f.get("manualFxRate")) : null;
    if (from === to) { alert("Scegli due voci diverse per il trasferimento."); return; }
    if (!amount || amount <= 0) { alert("Inserisci un importo valido."); return; }
    const fromBalance = data.portfolio.filter(p=>p.type===from).reduce((s,p)=>s+Number(p.amount),0);
    if (amount > fromBalance) { alert(`Non hai abbastanza su "${from}": disponibili ${fmt(fromBalance)} ${currencyOfBankAccount(from)}, richiesti ${fmt(amount)}.`); return; }
    const fromCur = currencyOfBankAccount(from);
    const toCur = currencyOfBankAccount(to);
    let toAmount = amount;
    if (fromCur !== toCur) {
      if (!manualRate || manualRate <= 0) { alert(`"${from}" e "${to}" sono in valute diverse (${fromCur}/${toCur}): inserisci il cambio manuale per questo trasferimento.`); return; }
      if (fromCur === "ALL") toAmount = amount / manualRate;
      else if (toCur === "ALL") toAmount = amount * manualRate;
      else toAmount = amount * manualRate;
    }
    const transferId = uid();
    const rateNote = fromCur!==toCur ? ` (cambio manuale ${manualRate})` : '';
    data.portfolio.push({ id: uid(), type: from, macro: (data.categoryMacroMap.portfolio && data.categoryMacroMap.portfolio[from]) || null, amount: -amount, currency: fromCur, marketValue: null, date, maturityDate: null, note: `Trasferimento a ${to}${rateNote}${note?': '+note:''}`, transferGroup: transferId });
    data.portfolio.push({ id: uid(), type: to, macro: (data.categoryMacroMap.portfolio && data.categoryMacroMap.portfolio[to]) || null, amount: toAmount, currency: toCur, marketValue: null, date, maturityDate: null, note: `Trasferimento da ${from}${rateNote}${note?': '+note:''}`, transferGroup: transferId });
    saveData(); renderLiquidityTab();
  });
  function updateTransferFxVisibility() {
    const from = document.getElementById("transferFromSelect").value;
    const to = document.getElementById("transferToSelect").value;
    const fromCur = currencyOfBankAccount(from), toCur = currencyOfBankAccount(to);
    const row = document.getElementById("transferFxRow");
    const hint = document.getElementById("transferFxHint");
    if (fromCur !== toCur) {
      row.style.display = "block";
      hint.textContent = `"${from}" è in ${fromCur}, "${to}" è in ${toCur} — serve un cambio manuale, valido solo per questo trasferimento.`;
    } else {
      row.style.display = "none";
    }
  }

  updateTransferFxVisibility();

  document.querySelectorAll("[data-riconcilia-verifica]").forEach(btn=>{

      const nomeConto = btn.dataset.riconciliaVerifica;
      const input = document.getElementById(`riconciliaInput-${nomeConto}`);
      const saldoReale = Number(input.value);
      if (!input.value || isNaN(saldoReale)) { alert("Inserisci il saldo reale del conto, dall'estratto conto o dall'app bancaria."); return; }
      const saldoCalcolato = computeSaldiPerRiconciliazione().find(g => g.name === nomeConto);
      const valuta = saldoCalcolato ? saldoCalcolato.valuta : currencyOfBankAccount(nomeConto);
      const differenza = saldoReale - (saldoCalcolato ? saldoCalcolato.saldo : 0);
      const esitoBox = document.getElementById(`riconciliaEsito-${nomeConto}`);
      if (Math.abs(differenza) < 0.01) {
        esitoBox.innerHTML = `<div class="subtle" style="color:#3F6E5E;">✓ Coincide — nessun aggiustamento necessario.</div>`;
        return;
      }
      esitoBox.innerHTML = `
        <div class="alert-banner">Differenza: ${differenza>0?'+':''}${fmt(differenza)} ${valuta} (${differenza>0?"manca nell'app rispetto al reale":"l'app ne ha di più del reale"}).</div>
        <button type="button" class="secondary" data-riconcilia-registra="${nomeConto}" data-riconcilia-importo="${differenza}" style="margin-top:6px;">Registra aggiustamento di ${fmt(differenza)} ${valuta}</button>`;
      esitoBox.querySelector("[data-riconcilia-registra]").addEventListener("click", (ev)=>{
        const importo = Number(ev.target.dataset.riconciliaImporto);
        if (!confirm(`Registrare un aggiustamento di ${fmt(importo)} ${valuta} su "${nomeConto}" per allinearlo al saldo reale? Questo è un movimento indipendente, non collegato a nessuna posizione — solo per la riconciliazione.`)) return;
        createLiquidityAdjustment(nomeConto, importo, todayISO, "Aggiustamento di riconciliazione", null);
        saveData();
        renderLiquidityTab();
      });
    });
  });
  document.querySelectorAll("[data-del-port]").forEach(btn=>{

  async function updateOneFund(fundName, raiffeisenName, opts) {
    opts = opts || {};
    const lots = data.portfolio.filter(p => (p.fundName||p.type)===fundName && isFundEntry(p));
    if (lots.length===0) return { ok:false, error:"nessun lotto" };
    let price, currency, evalDate;
    try {
      ({ price, currency, evalDate } = await fetchFundPrice(raiffeisenName));
    } catch (err) {
      recordPriceFetchOutcome(lots, false, String(err.message||err));
      saveData();
      throw err;
    }
    // Valuta discordante: il sito quota in una valuta, la posizione è registrata in
    // un'altra. Salvare il numero così com'è lo tratterebbe come se fosse già nella
    // valuta della posizione, sbagliando il valore di decine di volte. Meglio non
    // scrivere nulla e dirlo chiaramente.
    const valutaPos = lots[0].currency || "ALL";
    if (currency && currency !== valutaPos && !opts.forzaValuta) {
      recordPriceFetchOutcome(lots, false, `valuta discordante: sito ${currency}, posizione ${valutaPos}`);
      saveData();
      return { ok:false, currencyMismatch:true, price, currency, valutaPosizione: valutaPos,
        evalDate, fundName, raiffeisenName, lotCount: lots.length };
    }

    // Controllo di plausibilità: una variazione enorme rispetto all'ultimo prezzo
    // noto è quasi sempre un numero sbagliato letto da un layout cambiato,
    // non un rendimento. Non si scrive nulla senza conferma esplicita.
    const previous = Number(lots[0].fundCurrentQuotaPrice) || Number(lots[0].fundPurchaseQuotaPrice) || null;
    const assess = assessPriceChange(price, previous);
    if (assess.suspicious && !opts.force) {
      recordPriceFetchOutcome(lots, false, `variazione sospetta ${assess.changePct.toFixed(1)}%`);
      saveData();
      return { ok:false, needsConfirm:true, price, currency, evalDate, previous: assess.previousPrice,
        changePct: assess.changePct, fundName, raiffeisenName, lotCount: lots.length };
    }
    lots.forEach(pos => {
      pos.fundCurrentQuotaPrice = price;
      pos.marketValue = (pos.fundQuotaCount||0) * price;
      pos.priceValuationDate = evalDate || null;
      if (!pos.priceHistory) pos.priceHistory = [];
      const existingIdx = pos.priceHistory.findIndex(h=>h.date===todayISO);
      if (existingIdx>=0) pos.priceHistory[existingIdx].price = price;
      else pos.priceHistory.push({ date: todayISO, price });
      pos.priceHistory.sort((a,b)=>a.date.localeCompare(b.date));
    });
    recordPriceFetchOutcome(lots, true, null);
    return { ok:true, price, currency, evalDate, changePct: assess.changePct,
      currencyMismatch: currency && currency !== lots[0].currency, lotCount: lots.length };
  }
  document.querySelectorAll(".manual-price-input").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const nome = inp.dataset.fundname;
      const nuovo = Number(inp.value);
      if (!isFinite(nuovo) || nuovo <= 0) { alert("Inserisci un prezzo maggiore di zero."); return; }
      const lotti = data.portfolio.filter(x => isFundEntry(x) && x.amount>0 && (x.fundName||x.type) === nome);
      lotti.forEach(pos => {
        pos.fundCurrentQuotaPrice = nuovo;
        pos.marketValue = (pos.fundQuotaCount||0) * nuovo;
        if (!pos.priceHistory) pos.priceHistory = [];
        const i = pos.priceHistory.findIndex(h=>h.date===todayISO);
        if (i>=0) pos.priceHistory[i].price = nuovo; else pos.priceHistory.push({ date: todayISO, price: nuovo });
        pos.priceHistory.sort((a,b)=>a.date.localeCompare(b.date));
        pos.priceManualDate = todayISO;
      });
      saveData();
      if (currentTabId === "fundsTab") renderFundsTab(); else renderPortfolio();
    });
  });
  document.querySelectorAll(".raif-fund-select").forEach(sel=>{
    sel.addEventListener("change", ()=> setFundSource(sel.dataset.fundname, sel.value));
  });
  document.querySelectorAll("[data-updatefundname]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const fundName = btn.dataset.updatefundname;
      const select = btn.parentElement.querySelector(".raif-fund-select");
      const statusEl = btn.parentElement.nextElementSibling;
      if (!select) return;
      if (!select.value) {
        statusEl.textContent = "Scegli prima da quale fondo del sito prendere il prezzo.";
        return;
      }
      setFundSource(fundName, select.value);
      statusEl.textContent = "Recupero prezzo…";
      try {
        let r = await updateOneFund(fundName, select.value);
        if (r.needsConfirm) {
          const ok = confirm(
            `Prezzo sospetto per "${fundName}".\n\n` +
            `Ultimo prezzo noto: ${fmt2(r.previous)}\n` +
            `Prezzo letto dal sito: ${fmt2(r.price)}\n` +
            `Variazione: ${r.changePct>0?'+':''}${r.changePct.toFixed(1)}%\n\n` +
            `Una variazione così ampia di solito significa che il sito ha cambiato struttura ` +
            `e il numero letto non è il prezzo.\n\nVuoi comunque salvarlo?`);
          if (!ok) {
            statusEl.textContent = `Aggiornamento annullato: variazione ${r.changePct.toFixed(1)}% ritenuta sospetta. Il prezzo precedente è stato mantenuto.`;
            renderFundsTab();
            return;
          }
          r = await updateOneFund(fundName, select.value, { force:true });
        }
        saveData();
        if (r.currencyMismatch) {
          statusEl.textContent = `Aggiornamento annullato: il fondo quota in ${r.currency} ma la posizione è registrata in ${r.valutaPosizione}. `
            + `Prezzo letto: ${fmt2(r.price)} ${r.currency}. Correggi la valuta della posizione, oppure inserisci il prezzo a mano.`;
          renderFundsTab();
          return;
        }
        statusEl.textContent = `Aggiornato su ${r.lotCount} lotti: ${fmt2(r.price)} ${r.currency}/quota (${select.value})${r.evalDate?' · data e vlerësimit: '+r.evalDate:' · data e vlerësimit non trovata sulla pagina'}.`;
        renderFundsTab();
      } catch (err) {
        statusEl.textContent = "Errore: " + String(err.message||err).slice(0,150);
      }
    });
  });
  const updateAllFundsBtn = document.getElementById("updateAllFundsBtn");
  if (updateAllFundsBtn) updateAllFundsBtn.addEventListener("click", async ()=>{
    const statusEl = document.getElementById("statusUpdateAll");
    const selects = document.querySelectorAll(".raif-fund-select");
    let okCount = 0, errCount = 0, mismatches = [];
    const datesFound = [], suspicious = [], senzaFonte = [], valutaDiversa = [];
    for (const select of selects) {
      const fundName = select.dataset.fundname;
      if (!select.value) { errCount++; senzaFonte.push(fundName); continue; }
      statusEl.textContent = `Aggiorno ${fundName}… (${okCount+errCount+1}/${selects.length})`;
      try {
        const r = await updateOneFund(fundName, select.value);
        if (r.currencyMismatch) {
          valutaDiversa.push(`${fundName} (sito ${r.currency}, posizione ${r.valutaPosizione})`);
          errCount++;
        } else if (r.needsConfirm) {
          suspicious.push(`${fundName} (${r.changePct>0?'+':''}${r.changePct.toFixed(1)}%)`);
          errCount++;
        } else {
          if (r.currencyMismatch) mismatches.push(fundName);
          if (r.evalDate) datesFound.push(`${fundName}: ${r.evalDate}`);
          okCount++;
        }
      } catch (err) {
        errCount++;
      }
    }
    saveData();
    statusEl.textContent = `Fatto: ${okCount} aggiornati${errCount>0?', '+errCount+' falliti':''}${mismatches.length>0?' — attenzione valuta per: '+mismatches.join(', '):''}.${valutaDiversa.length>0?' — valuta discordante, non aggiornati: '+valutaDiversa.join(', '):''}${senzaFonte.length>0?' — senza fonte impostata: '+senzaFonte.join(', '):''}${suspicious.length>0?' — variazione sospetta, non aggiornati: '+suspicious.join(', ')+' (aggiornali singolarmente per confermare)':''}${datesFound.length>0?' Date e vlerësimit — '+datesFound.join('; ')+'.':''}`;
    renderFundsTab();
  });

  const fundHistoryFileInputEl = document.getElementById("fundHistoryFileInput");
  if (fundHistoryFileInputEl) fundHistoryFileInputEl.addEventListener("change", async ev=>{
    const file = ev.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById("fundHistoryFileStatus");
    statusEl.textContent = "Lettura del file in corso…";
    try {
      const { rows, errors } = await parseFundHistoryFile(file);
      if (rows.length === 0) { statusEl.textContent = "Nessuna riga riconosciuta nel file."; return; }
      const lines = rows.map(r => {
        const [y,m,d] = r.date.split("-");
        return `${d}/${m}/${y}\t${r.amount}\t${r.unitPrice}\t${r.units}`;
      });
      document.getElementById("fundHistoryTextarea").value = lines.join("\n");
      statusEl.textContent = `${rows.length} righe lette dal file${errors.length?` (${errors.length} righe ignorate, formato non riconosciuto)`:''}. Controlla il testo sopra, poi premi "Genera anteprima".`;
    } catch (err) {
      statusEl.textContent = "Errore nella lettura del file: " + String(err.message||err).slice(0,150);
    }
  });
  const fundImportFormEl = document.getElementById("fundImportForm");
  if (fundImportFormEl) fundImportFormEl.addEventListener("submit", ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const type = ev.target.querySelector(".cat-select").value;
    const currency = f.get("currency") || "ALL";
    const fundName = (f.get("fundName")||"").trim();
    const baselineDate = f.get("baselineDate");
    const baselinePrice = f.get("baselinePrice");
    const { rows, errors } = parseFundHistoryText(f.get("historyText")||"");
    if (rows.length === 0) { alert("Nessuna riga riconosciuta. Controlla il formato (Data, Importo, Prezzo, Quote)."); return; }
    rows.forEach(r => {
      const existing = data.portfolio.find(p => p.fundName === fundName && p.date === r.date && p.fundQuotaCount !== undefined);
      r.matchId = existing ? existing.id : null;
    });
    const macroSel = ev.target.querySelector(".macro-select");
    fundImportPreview = { type, currency, fundName, rows, errors,
      macro: macroSel ? (macroSel.value || null) : null,
      securityCode: (f.get("securityCode")||"").trim(),
      issuerName: (f.get("issuerName")||"").trim(),
      paymentType: f.get("paymentType") || "Banca",
      riskFactor: normalizzaRischio(f.get("riskFactor"), { type, macro: null }),
      baselineDate: baselineDate||null, baselinePrice: baselinePrice?Number(baselinePrice):null };
    renderFundsTab();
  });
  const fundImportCancelBtn = document.getElementById("fundImportCancel");
  if (fundImportCancelBtn) fundImportCancelBtn.addEventListener("click", ()=>{ fundImportPreview = null; renderFundsTab(); });
  const fundImportConfirmBtn = document.getElementById("fundImportConfirm");
  if (fundImportConfirmBtn) fundImportConfirmBtn.addEventListener("click", ()=>{
    const { type, currency, fundName, rows, baselineDate, baselinePrice, macro, issuerName, paymentType, riskFactor } = fundImportPreview;
    const existingFundCode = (() => {
      const anyLot = data.portfolio.find(p => (p.fundName===fundName) && p.securityCode);
      return anyLot ? anyLot.securityCode : null;
    })();
    // Il codice indicato a mano ha la precedenza; altrimenti si riusa quello già
    // assegnato al fondo, e solo in ultima istanza se ne genera uno nuovo.
    const sharedCode = (fundImportPreview.securityCode || "").trim() || existingFundCode || consumeNextSecurityCode();
    let firstId = null;
    let updated = 0, added = 0;
    const idPerRiga = new Array(rows.length).fill(null);
    rows.forEach((r,idx) => {
      if (r.matchId) {
        const existing = data.portfolio.find(p=>p.id===r.matchId);
        if (existing) {
          existing.amount = r.amount;
          existing.marketValue = r.amount;
          existing.fundPurchaseQuotaPrice = r.unitPrice;
          existing.fundQuotaCount = r.units;
          existing.type = type;
          existing.macro = macro || existing.macro || null;
          if (issuerName) existing.issuerName = issuerName;
          existing.currency = currency || existing.currency;
          if (!existing.securityCode) existing.securityCode = sharedCode;
          if (!existing.priceHistory) existing.priceHistory = [];
          const hIdx = existing.priceHistory.findIndex(h=>h.date===r.date);
          if (hIdx>=0) existing.priceHistory[hIdx].price = r.unitPrice; else existing.priceHistory.push({date:r.date, price:r.unitPrice});
          if (idx===0) firstId = existing.id;
          idPerRiga[idx] = existing.id;
          updated++;
          return;
        }
      }
      const id = uid();
      if (idx===0) firstId = id;
      idPerRiga[idx] = id;
      data.portfolio.push({
        id, type, macro: macro || null, fundName, issuerName: issuerName || "",
        riskFactor: normalizzaRischio(riskFactor, { type, macro }),
        amount: r.amount, currency: currency || "ALL", marketValue: r.amount,
        date: r.date, maturityDate: null, note: "Importato da storico",
        fundQuotaCount: r.units, fundPurchaseQuotaPrice: r.unitPrice, fundCurrentQuotaPrice: r.unitPrice,
        securityCode: sharedCode, priceHistory: [{date: r.date, price: r.unitPrice}]
      });
      added++;
    });
    // Ogni versamento è un'uscita dal conto: senza questo il denaro risultava
    // investito senza essere mai uscito da nessuna parte. Collegato tramite
    // linkedTxnId alla riga specifica che lo ha generato (bug corretto in v2.46:
    // prima passava null, quindi cancellare una riga importata non ripuliva mai
    // il movimento di liquidità collegato — restava orfano per sempre).
    let uscite = 0, uscitegia = 0;
    if (paymentType) {
      rows.forEach((r, idx) => {
        const nota = `Acquisto quote ${fundName} ${sharedCode}`.trim();
        if (esisteGiaMovimento(paymentType, -r.amount, r.date, sharedCode)) { uscitegia++; return; }
        createLiquidityAdjustment(paymentType, -r.amount, r.date, nota, idPerRiga[idx]);
        uscite++;
      });
    }
    if (baselineDate && baselinePrice && firstId) {
      const target = data.portfolio.find(p=>p.id===firstId);
      if (target) {
        if (!target.priceHistory) target.priceHistory = [];
        const hIdx = target.priceHistory.findIndex(h=>h.date===baselineDate);
        if (hIdx>=0) target.priceHistory[hIdx].price = baselinePrice; else target.priceHistory.push({ date: baselineDate, price: baselinePrice });
      }
    }
    fundImportPreview = null;
    saveData();
    alert(`Importazione completata per "${fundName}": ${added} nuove righe, ${updated} righe già esistenti aggiornate.` +
      (paymentType ? `

Uscite di cassa da "${paymentType}": ${uscite} registrate` + (uscitegia ? `, ${uscitegia} già presenti e saltate.` : ".") : ""));
    renderFundsTab();
  });
}

      document.getElementById("bondSalePreview").innerHTML = `
        <div style="color:#C9A227; font-family:'Fraunces',serif; font-size:13px; margin-bottom:6px;">Anteprima calcolo</div>

        <div style="display:flex; justify-content:space-between; padding:3px 0;"><span style="color:#8FA3BF;">Costo di acquisto</span><span>${fmt(c.costoAcquisto)} ALL</span></div>
        <div style="display:flex; justify-content:space-between; padding:3px 0; color:${gainColor};"><span>Capital gain lordo</span><span>${fmt(c.capitalGainLordo)} ALL</span></div>
        <div style="display:flex; justify-content:space-between; padding:3px 0;"><span style="color:#8FA3BF;">Tassazione (${c.taxRate}%)</span><span>-${fmt(c.tassazione)} ALL</span></div>
        <div style="display:flex; justify-content:space-between; padding:3px 0;"><span style="color:#8FA3BF;">Commissione</span><span>-${fmt(c.commissione)} ALL</span></div>
        <div style="display:flex; justify-content:space-between; padding:5px 0 0; border-top:1px solid #2E4159; margin-top:4px; font-weight:600; color:${gainColor};"><span>Capital gain netto</span><span>${fmt(c.capitalGainNetto)} ALL</span></div>
        <div style="margin-top:8px; color:#8FA3BF; font-size:11px;">Banca riceverà: ${fmt(c.nominal)} ALL (capitale) + ${fmt(c.capitalGainNetto)} ALL (plusvalenza netta)</div>
      `;
    }
    const fillBondInfo = () => {
      const b = data.portfolio.find(x => x.id === bondSaleSelectEl.value) || {};
      const codeEl = document.getElementById("bondSaleCode");
      const issEl = document.getElementById("bondSaleIssuer");
      if (codeEl) codeEl.value = b.securityCode || "";
      if (issEl) issEl.value = b.issuerName || "";
    };
    bondSaleSelectEl.addEventListener("change", fillBondInfo);
    fillBondInfo();
    bondSaleSelectEl.addEventListener("change", fillFromBond);
    document.getElementById("bondSaleForm").querySelectorAll("input, select").forEach(el=>{
      el.addEventListener("input", updateBondSalePreview);
      el.addEventListener("change", updateBondSalePreview);
    });
    fillFromBond();
    updateBondSalePreview();
    document.getElementById("bondSaleForm").addEventListener("submit", ev=>{
      ev.preventDefault();
      const f = new FormData(ev.target);
      const bond = data.portfolio.find(p=>p.id===f.get("bondId"));
      if (!bond) return;
      const saleDate = f.get("saleDate") || todayISO;
      const c = computeBondSale();
      const { nominal, capitalGainLordo, tassazione, commissione, capitalGainNetto } = c;
      if (blockedBySaleValidation({ quantity: nominal, available: bond.amount,
        salePrice: c.salePrice, taxRate: c.taxRate, saleDate, purchaseDate: bond.date, unitLabel: "di nominale" })) return;
      if (!confirm(`Confermi la vendita? Vedi l'anteprima sopra per i dettagli del calcolo.`)) return;
      const saleId = uid();
      data.portfolio.push({ id: uid(), type: bond.type, macro: bond.macro||null, amount: -nominal, currency: bond.currency, marketValue: null, date: saleDate, maturityDate: null, note: `Vendita/rimborso obbligazione` });
      createLiquidityAdjustment("Banca", nominal, saleDate, `Rimborso capitale: ${bond.type}`, saleId);
      data.income.push({ id: saleId, date: saleDate, amount: capitalGainLordo, category: "Capital gain obbligazioni", macro: "Interessi da Titoli - Standard", paymentType: null, note: `Vendita ${bond.type}`, linkedBondId: bond.id, securityCode: bond.securityCode||null });
      if (tassazione > 0) {
        const taxCat = ensureBondTaxCategory(bond.bondYears, bond.type);
        data.expenses.push({ id: uid(), date: saleDate, amount: tassazione, category: taxCat, macro: "Tassazione da Titoli - Standard", note: "Tassazione capital gain", linkedBondId: bond.id, securityCode: bond.securityCode||null, linkedIncomeId: saleId });
      }
      if (commissione > 0) data.expenses.push({ id: uid(), date: saleDate, amount: commissione, category: "Commissione vendita titoli", note: "Commissione vendita", linkedBondId: bond.id, securityCode: bond.securityCode||null, linkedIncomeId: saleId });
      createLiquidityAdjustment("Banca", capitalGainNetto, saleDate, `Plusvalenza netta vendita: ${bond.type}`, saleId+"-gain");
      saveData(); renderBondsTab();
    });
  }

  if (yieldCurveData.observedPoints.length>0) {
    const ycCtx = document.getElementById("yieldCurveChart");
    if (window.yieldCurveChartInstance) window.yieldCurveChartInstance.destroy();
    const modelLine = [];
    if (yieldCurveData.model) {
      for (let t=0.25; t<=20; t+=0.25) modelLine.push({x:t, y:yieldCurveData.model.predict(t)});
    }
    window.yieldCurveChartInstance = new Chart(ycCtx, {
      data:{ datasets:[
        ...(modelLine.length>0 ? [{ type:'line', label:'Curva stimata (NS+cubico)', data: modelLine, borderColor:'#3F6E5E', backgroundColor:'transparent', pointRadius:0, borderWidth:2, tension:0.3 }] : []),
        { type:'scatter', label:'Punti osservati', data: yieldCurveData.observedPoints.map(p=>({x:p.t, y:p.y})), backgroundColor:'#C9A227', pointRadius:6 }
      ] },
      options:{
        plugins:{ legend:{ labels:{ color:'#8FA3BF', font:{size:10} } } },
        scales:{
          x:{ title:{ display:true, text:'Anni alla scadenza', color:'#6B7E99' }, ticks:{ color:'#6B7E99', font:{size:10} }, grid:{ color:'#1E2E47' } },
          y:{ title:{ display:true, text:'Rendimento a scadenza (%)', color:'#6B7E99' }, ticks:{ color:'#6B7E99', font:{size:10} }, grid:{ color:'#1E2E47' } }
        }
      }
    });
  }

  const ministryAuctionsInput = document.getElementById("ministryAuctionsInput");
  if (ministryAuctionsInput) ministryAuctionsInput.addEventListener("change", async ev=>{

  const clearMinistryDataBtn = document.getElementById("clearMinistryData");
  if (clearMinistryDataBtn) clearMinistryDataBtn.addEventListener("click", ()=>{
    data.marketYieldCurve = null;
    saveData();
    renderBondsTab();
  });

    ev.preventDefault();

    const propertyId = f.get("propertyId");

    if (!property) return;
    const saleValue = Number(f.get("saleValue"));
    const saleDate = f.get("saleDate") || todayISO;
    if (!isFinite(saleValue) || saleValue <= 0) { alert("Vendita non registrata.\n\nInserisci un valore di vendita maggiore di zero."); return; }
    if (property.date && saleDate < property.date) { alert(`Vendita non registrata.\n\nLa data di vendita (${saleDate}) è precedente all'acquisto (${property.date}).`); return; }
    if (saleDate > todayISO) { alert(`Vendita non registrata.\n\nLa data di vendita (${saleDate}) è nel futuro.`); return; }
    const saleTaxPct = Number(f.get("saleTaxPct"))||0;
    const saleAgencyFeePct = Number(f.get("saleAgencyFeePct"))||0;
    const capitalGain = Math.max(0, saleValue - property.amount);
    const taxAmt = capitalGain * saleTaxPct/100;
    // Invariata: sempre sul valore di vendita, mai sulla plusvalenza. Non tocco
    // questo calcolo — la commissione d'agenzia non deve dipendere da come
    // registro il reddito.
    const agencyFeeAmt = saleValue * saleAgencyFeePct/100;
    const netProceeds = saleValue - taxAmt - agencyFeeAmt;
    const code = property.securityCode || "";
    const bankAccount = bankAccountForCurrency(property.currency);
    const saleId = uid();
    // Reddito registrato = SOLA plusvalenza lorda, come per ogni altro titolo
    // (bond, fondi, azioni, ETF, commodity, crypto passano tutti da bookAssetSale
    // con lo stesso principio). Il capitale che rientra non è reddito: prima veniva
    // contato l'intero valore di vendita, gonfiando qualunque KPI che somma redditi.
    data.income.push({ id: saleId, date: saleDate, amount: capitalGain, currency: property.currency, category: "Capital gain immobile", macro: "Real Estate", note: `${code} · vendita a ${fmt(saleValue)} (costo ${fmt(property.amount)})`, linkedBondId: property.id, securityCode: code||null });
    if (taxAmt > 0) {
      if (!data.categories.expenses.includes("Tassazione plusvalenza immobile")) data.categories.expenses.push("Tassazione plusvalenza immobile");
      data.expenses.push({ id: uid(), date: saleDate, amount: taxAmt, category: "Tassazione plusvalenza immobile", macro: "Real Estate", note: code, linkedBondId: property.id, securityCode: code||null, linkedIncomeId: saleId });
    }
    if (agencyFeeAmt > 0) {
      data.expenses.push({ id: uid(), date: saleDate, amount: agencyFeeAmt, category: "Commissione agenzia affitto", macro: "Real Estate", note: `${code} · vendita`, linkedBondId: property.id, securityCode: code||null, linkedIncomeId: saleId });
    }
    // Liquidità in due movimenti separati, come per gli altri titoli: capitale
    // rientrato (non reddito) + plusvalenza netta (dopo tasse e commissione). La
    // somma dei due resta ESATTAMENTE netProceeds di prima: stesso totale in banca,
    // cambia solo come viene raccontato nei due bucket. Con min() invece di usare
    // sempre property.amount, funziona anche se vendi in perdita (capitale rientrato
    // non può superare quanto hai davvero incassato).
    const capitaleRimborsato = Math.min(saleValue, property.amount);
    const plusvalenzaNetta = netProceeds - capitaleRimborsato;
    createLiquidityAdjustment(bankAccount, capitaleRimborsato, saleDate, `Rimborso capitale: ${property.propertyType||'immobile'} ${code}`.trim(), saleId);
    createLiquidityAdjustment(bankAccount, plusvalenzaNetta, saleDate, `Plusvalenza netta vendita: ${property.propertyType||'immobile'} ${code}`.trim(), saleId+"-gain");
    deletePortfolioPosition(propertyId);
    saveData(); renderRealEstateTab();
    alert(`Vendita registrata: ${fmt(netProceeds)} ${property.currency} netti accreditati su ${bankAccount}.`);
  });
}

  async function updateOneCrypto(cryptoId, currency) {
    const price = await fetchCryptoPrice(cryptoId, currency);
    const lots = data.portfolio.filter(p => (p.cryptoId||p.type)===cryptoId && isCryptoType(p.type, p.macro));
    lots.forEach(pos => { pos.cryptoCurrentPrice = price; pos.marketValue = (pos.cryptoQuantity||0)*price; });
    return { price, lotCount: lots.length };
  }

    renderCryptoTab();
  });
}

      ${(() => { const cap = capListaVoci(positions); return scrollableListaWrap(cap.shown.map(p=>{
        if (editingPortfolioId === p.id) return renderPortfolioEditForm(p);
        const mv = (p.marketValue!=null && p.marketValue!=="") ? p.marketValue : p.amount;
        return `<div class="list-item">
          <div class="li-main"><span class="li-cat">${pallinoRischio(p)} ${p.type}${p.securityCode?' <span class="pill">'+p.securityCode+'</span>':''}${p.note?' · '+p.note:''}</span><span class="li-date">${p.date||''}${p.maturityDate?' · scad. '+p.maturityDate:''}${p.macro?' · '+p.macro:''}${p.issuerName?' · '+p.issuerName:''}</span></div>
          <div style="display:flex;align-items:center;">
            <span class="li-amt">${fmt(mv)} ${p.currency}</span>
            ${listEditMode["depositi"] ? `<button data-editport="${p.id}" style="background:none;border:none;color:#C9A227;cursor:pointer;font-size:14px;padding:0 6px;">✎</button>
            <button class="li-del" data-del-port="${p.id}">✕</button>` : ''}
          </div>
        </div>`;
      }).join(''), cap, '<div class="empty">Nessun deposito registrato.</div>'); })()}
      <div class="section-total"><span>Totale (mercato)</span><span style="font-weight:600; color:#C9A227;">${fmtDisplay(totalALL)}</span></div>
    </div>
    ${positions.length>0 ? `<div class="card">
      <h3>Chiusura anticipata</h3>
      <div class="subtle">Chiude un deposito prima della scadenza naturale: restituisce il capitale (meno un'eventuale penale) e rimuove la posizione. Se il deposito arriva a scadenza naturale, si chiude già da solo — usa questo solo per chiusure anticipate.</div>
      <form class="entry" id="depositCloseForm">
        <div><label>Deposito</label><select name="depositId">${positions.map(p=>`<option value="${p.id}">${p.type}${p.securityCode?' ['+p.securityCode+']':''}${p.note?' · '+p.note:''} — ${fmt(p.amount)} ${p.currency}</option>`).join('')}</select></div>
        <div class="row2">
          <div><label>${LABEL_CODICE}</label><input type="text" id="depositCloseCode" readonly style="opacity:0.7;"></div>
          <div><label>${LABEL_ENTE}</label><input type="text" id="depositCloseIssuer" readonly style="opacity:0.7;"></div>
        </div>
        <div class="row2">
          <div><label>Capitale rimborsato</label><input type="number" step="0.0001" name="refundAmount" required></div>
          <div><label>Data chiusura</label><input type="date" name="closeDate" value="${todayISO}"></div>
        </div>
        <div><label>Penale (opzionale)</label><input type="number" step="0.0001" name="penaltyAmount" placeholder="0"></div>
        <button class="secondary" type="submit">Registra chiusura</button>
      </form>
    </div>` : ''}
    ${depositsSummary.length>0 ? `<div class="card">
      <h3>Riepilogo depositi</h3>
      ${depositsSummary.map(g=>`
        <div style="border-bottom:1px solid #24374F; padding:10px 0;">
          <div style="font-family:'Fraunces',serif; color:#C9A227; font-size:14px; margin-bottom:6px;">${g.name} <span class="pill">${g.count} posizion${g.count===1?'e':'i'}</span></div>
          <div class="stat-row"><span class="label">Capitale depositato</span><span class="val">${fmt(g.totalInvestedALL)} ALL</span></div>
          <div class="stat-row"><span class="label">Interessi ricevuti</span><span class="val ${g.interestReceivedALL>=0?'up':'down'}">${fmt(g.interestReceivedALL)} ALL (${g.rendPct.toFixed(2)}%)</span></div>
          ${g.nextMaturity ? `<div class="stat-row"><span class="label">Prossima scadenza</span><span class="val">${g.nextMaturity}</span></div>` : ''}
        </div>`).join('')}
    </div>` : ''}
    ${riquadroRischioScheda(data.portfolio.filter(p => p.amount>0 && ((p.type||"").toLowerCase().includes("deposito"))), "Rischio di questa sezione")}
  `;
  bindCategorySelects();
  bindMacroSelects();
  document.getElementById("depositForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const type = ev.target.querySelector(".cat-select").value;
    const macro = ev.target.querySelector(".macro-select").value || null;
    const date = f.get("date") || todayISO;
    const nominal = Number(f.get("amount"))||0;
    const years = Number(f.get("depositYears"))||null;
    let maturityDate = null;
    if (years) { const md = new Date(date); md.setFullYear(md.getFullYear()+years); maturityDate = localDateStr(md); }
    const posObj = {
      id: uid(), type, macro, amount: nominal, currency: f.get("currency")||"ALL", marketValue: null,
      date, maturityDate, note: f.get("note")||"", issuerName: (f.get("issuerName")||"").trim(),
      depositMode: f.get("depositMode")||"cedola", depositRate: f.get("depositRate")?Number(f.get("depositRate")):null,
      couponFrequency: f.get("couponFrequency")||"annual", depositTaxRate: f.get("depositTaxRate")?Number(f.get("depositTaxRate")):15,
      depositYears: years, securityCode: assegnaCodiceTitolo(f.get("securityCode"), datiIdentitaDaForm(f, type, macro)),
      riskFactor: rischioPerNuovaPosizione(Object.assign(datiIdentitaDaForm(f, type, macro), { bondYears: f.get("bondYears"), depositYears: f.get("depositYears") }), f.get("riskFactor"))
    };
    data.portfolio.push(posObj);
    const metodo = f.get("paymentType") || "";
    if (metodo && posObj.amount > 0) {
      createLiquidityAdjustment(metodo, -posObj.amount, posObj.date, `Apertura deposito ${type} ${posObj.securityCode||''}`.trim(), posObj.id);
    }
    saveData(); renderDepositsTab();
  });
  const depositCloseForm = document.getElementById("depositCloseForm");
  if (depositCloseForm) {
    const depositIdSelect = depositCloseForm.querySelector('[name="depositId"]');
    const fillDepositInfo = () => {
      const dep = data.portfolio.find(x => x.id === depositIdSelect.value) || {};
      const codeEl = document.getElementById("depositCloseCode");
      const issEl = document.getElementById("depositCloseIssuer");
      if (codeEl) codeEl.value = dep.securityCode || "";
      if (issEl) issEl.value = dep.issuerName || "";
    };
    depositIdSelect.addEventListener("change", fillDepositInfo);
    fillDepositInfo();
    const refundInput = depositCloseForm.querySelector('[name="refundAmount"]');
    const fillRefund = () => {
      const dep = data.portfolio.find(p=>p.id===depositIdSelect.value);
      if (dep) refundInput.value = dep.amount;
    };
    depositIdSelect.addEventListener("change", fillRefund);
    fillRefund();
    depositCloseForm.addEventListener("submit", ev=>{
      ev.preventDefault();
      const f = new FormData(ev.target);
      const dep = data.portfolio.find(p=>p.id===f.get("depositId"));
      if (!dep) return;
      const closeDate = f.get("closeDate") || todayISO;
      const refundAmount = Number(f.get("refundAmount"))||0;
      const penalty = Number(f.get("penaltyAmount"))||0;
      const netAmount = refundAmount - penalty;
      if (!confirm(`Confermi la chiusura? Verranno accreditati ${fmt(netAmount)} ${dep.currency} netti su Banca.`)) return;
      const closeId = uid();
      const bankAccount = bankAccountForCurrency(dep.currency);
      createLiquidityAdjustment(bankAccount, netAmount, closeDate, `Chiusura anticipata deposito ${dep.type}`, closeId);
      if (penalty > 0) {
        if (!data.categories.expenses.includes("Penale chiusura deposito")) data.categories.expenses.push("Penale chiusura deposito");
        data.expenses.push({ id: uid(), date: closeDate, amount: penalty, category: "Penale chiusura deposito", note: dep.type });
      }
      deletePortfolioPosition(dep.id);
      saveData(); renderDepositsTab();
    });
  }
  document.querySelectorAll("[data-editport]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingPortfolioId = btn.dataset.editport; renderDepositsTab(); });
  });
  document.querySelectorAll("[data-editport-cancel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingPortfolioId = null; renderDepositsTab(); });
  });
  document.querySelectorAll("[data-editportform]").forEach(form=>{
    form.addEventListener("submit", ev=>{
      ev.preventDefault();
      const id = form.dataset.editportform;
      const pos = data.portfolio.find(p=>p.id===id);
      if (!pos) return;
      const f = new FormData(ev.target);
      pos.type = ev.target.querySelector(".cat-select").value;
      if (f.has("riskFactor")) pos.riskFactor = normalizzaRischio(f.get("riskFactor"), pos);
      if (f.has("securityCode")) pos.securityCode = (f.get("securityCode")||"").trim() || pos.securityCode || null;
      if (f.has("issuerName")) pos.issuerName = (f.get("issuerName")||"").trim();
      if (f.has("amount")) pos.amount = Number(f.get("amount"));
      pos.currency = f.get("currency");
      pos.date = f.get("date") || pos.date;
      if (f.has("maturityDate")) pos.maturityDate = f.get("maturityDate") || null;
      if (f.has("marketValue")) pos.marketValue = f.get("marketValue") ? Number(f.get("marketValue")) : null;
      if (f.has("securityCode")) pos.securityCode = f.get("securityCode") || pos.securityCode;
      if (f.has("depositRate")) { pos.depositRate = f.get("depositRate")?Number(f.get("depositRate")):null; pos.depositTaxRate = Number(f.get("depositTaxRate"))||15; pos.depositYears = f.get("depositYears")||null; }
      pos.note = f.get("note") || "";
      editingPortfolioId = null;
      saveData(); renderDepositsTab();
    });
  });
  document.querySelectorAll("[data-del-port]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ deletePortfolioPosition(btn.dataset.delPort); saveData(); renderDepositsTab(); });
  });
}

function renderDebts() {
  document.getElementById("headerTitle").textContent = "Debiti";
  const debtsSummary = computeDebtsSummary();
  const ccSummary = computeCreditCardSummary();
  const debtOrCcFilter = c => isDebtType(c) || isCreditCardType(c);
  const debtPositions = data.portfolio.filter(p => (isDebtType(p.type, p.macro) || isCreditCardType(p.type)) && p.date);
  const propertyOptions = data.portfolio.filter(p => isRealEstateType(p.type, p.macro) && p.amount>0);

  document.getElementById("main").innerHTML = `
    <div class="card">
      <h3>Nuova voce (debito o carta di credito)</h3>
      <div class="subtle">Solo passività: debiti/prestiti e carte di credito. Per asset (fondi, obbligazioni, depositi, Banca/Cash) usa la scheda Patrimonio.</div>
      <form class="entry" id="debtForm">
        <div><label>Tipo</label>${categorySelect("portfolio", null, debtOrCcFilter)}</div>
        <div><label>Macro-categoria</label>${macroSelect("portfolio", "Debiti")}</div>
        <div><label>${LABEL_ENTE}</label><input type="text" name="issuerName" required placeholder="chi emette/gestisce"></div>
        <div><label>${LABEL_CODICE}</label><input type="text" name="securityCode" maxlength="8" value="${peekNextSecurityCode()}" required placeholder="precompilato, puoi cambiarlo"></div>
        <div class="row2">
          <div><label>Importo del debito</label><input type="number" min="0" step="0.0001" name="amount" placeholder="es. 100000" required></div>
          <div><label>Valuta</label><select name="currency"><option>ALL</option><option>EUR</option><option>USD</option></select></div>
        </div>
        <div><label>Data di partenza</label><input type="date" name="date" value="${todayISO}"></div>
        ${propertyOptions.length>0 ? `<div><label>Immobile collegato (opzionale, solo per report)</label><select name="linkedPropertyId"><option value="">— nessuno —</option>${propertyOptions.map(p=>`<option value="${p.id}">${p.propertyType||p.type} ${p.securityCode||''}</option>`).join('')}</select></div>` : ''}
        <div class="row2" style="align-items:center;"><label style="display:flex; align-items:center; gap:6px; margin:0;"><input type="checkbox" name="primaCasa" style="width:auto;"> Mutuo prima casa (vantaggi fiscali)</label></div>
        <div><label>Nota</label><input type="text" name="note" placeholder="es. prestito auto"></div>
        <div style="border:1px solid #2E4159; border-radius:6px; padding:10px;">
          <label style="color:#C9A227;">Piano di ammortamento (se è un prestito/mutuo, non una carta)</label>
          <div class="row2">
            <div><label>Tipo pagamento</label><select name="amortizationType"><option value="francese">Alla francese (rata costante)</option><option value="italiana">All'italiana (capitale costante)</option></select></div>
          </div>
          <div class="row2">
            <div><label>Mesi totali</label><input type="number" name="termMonths" placeholder="es. 60"></div>
            <div><label>Interesse annuo (%)</label><input type="number" step="0.0001" name="loanInterestRate" placeholder="es. 7"></div>
          </div>
          <div><label>Giorno del mese pagamento rate</label><input type="number" min="1" max="31" name="paymentDay" value="1"></div>
          <div class="row2">
            <div><label>Commissione</label><input type="number" min="0" step="0.0001" name="commissionValue" placeholder="0"></div>
            <div><label>Tipo commissione</label><select name="commissionType"><option value="percent">%</option><option value="fixed">Fissa</option></select></div>
          </div>
          <div class="row2">
            <div><label>Assicurazione richiesta (valore)</label><input type="number" step="0.0001" name="insuranceValue" placeholder="0"></div>
            <div><label>% del disborso</label><input type="number" step="0.0001" name="disbursementPct" value="100" placeholder="es. 95"></div>
          </div>
          <div><label>Fee pagamento anticipato (%)</label><input type="number" step="0.0001" name="earlyRepaymentFeePct" placeholder="0"></div>
        </div>
        <button class="primary" type="submit">Aggiungi</button>
      </form>
    </div>
    <div class="card">
      ${listEditHeader("Voci registrate", "debiti")}
      ${(() => { const cap = capListaVoci(debtPositions); return scrollableListaWrap(cap.shown.map(p=>{
        if (editingPortfolioId === p.id) return renderPortfolioEditForm(p);
        const nextInst = p.schedule ? p.schedule.find(i=>!i.processed) : null;
        const remaining = p.schedule ? p.schedule.filter(i=>!i.processed).reduce((s,i)=>s+i.capital,0) : null;
        const linkedProp = p.linkedPropertyId ? data.portfolio.find(x=>x.id===p.linkedPropertyId) : null;
        return `<div class="list-item" style="flex-direction:column; align-items:stretch;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="li-main"><span class="li-cat">${p.type}${p.primaCasa?' <span class="pill" style="background:#3F6E5E22;color:#3F6E5E;border-color:#3F6E5E;">prima casa</span>':''}${p.issuer?' · '+p.issuer:''}${linkedProp?' · immobile: '+(linkedProp.propertyType||linkedProp.type):''}${p.note?' · '+p.note:''}</span><span class="li-date">${p.date}${p.maturityDate?' · scad. '+p.maturityDate:''}</span></div>
            <div style="display:flex;align-items:center;">
              <span class="li-amt ${p.amount<0?'down':''}">${fmt(p.amount)} ${p.currency}</span>
              ${listEditMode["debiti"] ? `<button data-editport="${p.id}" style="background:none;border:none;color:#C9A227;cursor:pointer;font-size:14px;padding:0 6px;">✎</button>
              <button class="li-del" data-del-port="${p.id}">✕</button>` : ''}
            </div>
          </div>
          ${p.schedule ? `<div class="subtle" style="margin-top:4px;">${p.amortizationType==='italiana'?"All'italiana":'Alla francese'} · ${p.termMonths} mesi · capitale residuo: ${fmt(remaining)} ${p.currency}${nextInst?' · prossima rata '+nextInst.dueDate+': '+fmt(nextInst.capital+nextInst.interest)+' '+p.currency:' · piano completato'}</div>` : ''}
        </div>`;
      }).join(''), cap, '<div class="empty">Nessun debito o carta registrati.</div>'); })()}
    </div>
    ${debtsSummary.length>0 ? `<div class="card">
      <h3>Riepilogo debiti</h3>
      <div class="subtle">Il debito residuo riduce il totale del Patrimonio (è una passività reale). Registrando un debito, Banca si accredita del disborso effettivo; il saldo del debito e Banca si compensano a vicenda, e solo gli interessi pagati riducono davvero il patrimonio nel tempo.</div>
      ${debtsSummary.map(g=>`<div class="stat-row"><span class="label">${g.name}</span><span class="val down">${fmt(g.balanceALL)} ALL</span></div>`).join('')}
      <div class="stat-row" style="font-weight:600; padding-top:6px; border-top:1px solid #24374F; margin-top:6px;"><span class="label">Totale debiti</span><span class="val down">${fmtDisplay(debtsSummary.reduce((s,g)=>s+g.balanceALL,0))}</span></div>
    </div>` : ''}
    ${ccSummary.length>0 ? `<div class="card">
      <h3>Carte di credito — saldo</h3>
      <div class="subtle">Il saldo usato riduce il patrimonio totale (è debito reale). Paga con "Trasferimento liquidità" in Patrimonio (Banca → carta).</div>
      ${ccSummary.map(g=>`<div class="stat-row"><span class="label">${g.name}</span><span class="val ${g.balanceALL>=0?'':'down'}">${fmt(g.balanceALL)} ALL</span></div>`).join('')}
      ${(data.creditCardDebts||[]).length>0 ? `<div style="margin-top:10px; padding-top:10px; border-top:1px solid #24374F;">
        <div class="subtle" style="margin-bottom:6px;">Piano rate suggerito (non pagate in automatico)</div>
        ${[...data.creditCardDebts].sort((a,b)=>b.billingMonth.localeCompare(a.billingMonth)).slice(0,3).map(d=>`
          <div class="subtle" style="margin:6px 0 2px;">${d.paymentType} · utilizzo di ${d.billingMonth} non ripagato: ${fmt(d.principal)} ALL + ${fmt(d.totalInterest)} ALL interessi = ${fmt(d.principal+d.totalInterest)} ALL</div>
          ${d.schedule.map(i=>`<div class="stat-row"><span class="label">Rata sugg. entro ${i.dueDate}</span><span class="val">${fmt(i.capital+i.interest)} ALL (capitale ${fmt(i.capital)}, interessi ${fmt(i.interest)})</span></div>`).join('')}
        `).join('')}
      </div>` : ''}
    </div>` : ''}
    <div class="card">
      <h3>Carte di credito — impostazioni</h3>
      <div class="subtle">Configura un metodo di pagamento come carta di credito. Ogni mese, se non ripaghi entro il giorno indicato, l'app calcola le rate (capitale + interessi) e somma gli interessi al saldo usato.</div>
      ${creditCardSettingsBlock()}
    </div>
  `;
  bindCategorySelects();

  document.getElementById("debtForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const type = ev.target.querySelector(".cat-select").value;
    const macro = (data.categoryMacroMap.portfolio && data.categoryMacroMap.portfolio[type]) || null;
    const amount = Number(f.get("amount"));
    const currency = f.get("currency")||"ALL";
    const date = f.get("date") || todayISO;
    const posId = uid();
    const isLoan = isDebtType(type, macro) && !isCreditCardType(type);
    const posObj = { id: posId, type, macro, amount, currency, marketValue: null, date, maturityDate: null, note: f.get("note")||"", issuer: (f.get("issuerName")||"").trim() || null, linkedPropertyId: f.get("linkedPropertyId")||null,
      primaCasa: isLoan ? (f.get("primaCasa")==="on") : false,
      securityCode: assegnaCodiceTitolo(f.get("securityCode"), datiIdentitaDaForm(f, type, macro)),
      riskFactor: rischioPerNuovaPosizione(Object.assign(datiIdentitaDaForm(f, type, macro), { bondYears: f.get("bondYears"), depositYears: f.get("depositYears") }), f.get("riskFactor")),
      issuerName: (f.get("issuerName")||"").trim() };

    const termMonths = Number(f.get("termMonths"))||0;
    if (isLoan && termMonths > 0) {
      const loanInterestRate = Number(f.get("loanInterestRate"))||0;
      const amortizationType = f.get("amortizationType")||"francese";
      const paymentDay = Number(f.get("paymentDay"))||1;
      const commissionType = f.get("commissionType")||"percent";
      const commissionValue = Number(f.get("commissionValue"))||0;
      const insuranceValue = Number(f.get("insuranceValue"))||0;
      const disbursementPct = Number(f.get("disbursementPct"))||100;
      const earlyRepaymentFeePct = Number(f.get("earlyRepaymentFeePct"))||0;

      posObj.loanInterestRate = loanInterestRate;
      posObj.amortizationType = amortizationType;
      posObj.paymentDay = paymentDay;
      posObj.commissionType = commissionType;
      posObj.commissionValue = commissionValue;
      posObj.insuranceValue = insuranceValue;
      posObj.disbursementPct = disbursementPct;
      posObj.earlyRepaymentFeePct = earlyRepaymentFeePct;
      posObj.termMonths = termMonths;

      const daysInStartMonth = new Date(new Date(date).getFullYear(), new Date(date).getMonth()+1, 0).getDate();
      const firstDueDate = localDateStr(new Date(new Date(date).getFullYear(), new Date(date).getMonth() + (new Date(date).getDate()>paymentDay?1:0), Math.min(paymentDay, daysInStartMonth)));
      posObj.schedule = computeLoanSchedule(amount, loanInterestRate, termMonths, amortizationType, firstDueDate);
      posObj.maturityDate = posObj.schedule[posObj.schedule.length-1].dueDate;

      const commissionAmt = computeCommissionAmount(commissionType, commissionValue, amount);
      const disbursed = amount * disbursementPct/100;
      data.portfolio.push(posObj);
      createLiquidityAdjustment("Banca", disbursed, date, `Debito ricevuto: ${type}`, posId);
      if (commissionAmt > 0) {
        const commId = uid();
        if (!data.categories.expenses.includes("Commissione prestito")) data.categories.expenses.push("Commissione prestito");
        data.expenses.push({ id: commId, date, amount: commissionAmt, category: "Commissione prestito", paymentType: null, note: type, linkedBondId: posObj.id, securityCode: posObj.securityCode||null, issuerName: posObj.issuerName||"" });
        createLiquidityAdjustment("Banca", -commissionAmt, date, `Commissione prestito: ${type}`, commId);
      }
      if (insuranceValue > 0) {
        const insId = uid();
        if (!data.categories.expenses.includes("Assicurazione prestito")) data.categories.expenses.push("Assicurazione prestito");
        data.expenses.push({ id: insId, date, amount: insuranceValue, category: "Assicurazione prestito", paymentType: null, note: type, linkedBondId: posObj.id, securityCode: posObj.securityCode||null, issuerName: posObj.issuerName||"" });
        createLiquidityAdjustment("Banca", -insuranceValue, date, `Assicurazione prestito: ${type}`, insId);
      }
    } else {
      data.portfolio.push(posObj);
      if (isLoan) createLiquidityAdjustment("Banca", Math.abs(amount), date, `Debito ricevuto: ${type}`, posId);
    }
    saveData(); renderDebts();
  });
  document.querySelectorAll("[data-editport]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingPortfolioId = btn.dataset.editport; renderDebts(); });
  });
  document.querySelectorAll("[data-editport-cancel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingPortfolioId = null; renderDebts(); });
  });
  document.querySelectorAll("[data-editportform]").forEach(form=>{
    form.addEventListener("submit", ev=>{
      ev.preventDefault();
      const id = form.dataset.editportform;
      const pos = data.portfolio.find(p=>p.id===id);
      if (!pos) return;
      const f = new FormData(ev.target);
      pos.type = ev.target.querySelector(".cat-select").value;
      if (f.has("riskFactor")) pos.riskFactor = normalizzaRischio(f.get("riskFactor"), pos);
      if (f.has("securityCode")) pos.securityCode = (f.get("securityCode")||"").trim() || pos.securityCode || null;
      if (f.has("issuerName")) pos.issuerName = (f.get("issuerName")||"").trim();
      if (f.has("amount")) pos.amount = Number(f.get("amount"));
      pos.currency = f.get("currency");
      pos.date = f.get("date") || pos.date;

      const t = form.dataset.ccform;
      const f = new FormData(ev.target);

        securityCode: codiceCarta,
        bank: f.get("bank")||"", currency: f.get("currency")||"ALL", limit: Number(f.get("limit"))||0,
        expiryDate: f.get("expiryDate")||null, interestRate: Number(f.get("interestRate"))||0,

        cashFeeType: f.get("cashFeeType")||"percent", cashFeeValue: Number(f.get("cashFeeValue"))||0
      };
      saveData();
      alert(`Impostazioni "${t}" salvate.`);
      renderDebts();
    });
  });
}

// ---------- CSV import ----------
let csvImportState = null;

function parseCSV(text) {
  const firstLine = text.split(/\r?\n/)[0] || "";
  const delimiter = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  return lines.map(line => splitCSVLine(line, delimiter));
}
function splitCSVLine(line, delim) {
  const result = []; let cur = ''; let inQuotes = false;
  for (let i=0;i<line.length;i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; continue; }
    if (ch === delim && !inQuotes) { result.push(cur.trim()); cur=''; continue; }
    cur += ch;
  }
  result.push(cur.trim());
  return result;
}
function parseFundHistoryDate(str) {
  if (!str) return null;
  str = str.trim();
  let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if (m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  return null;
}
function parseFlexibleAmount(str) {
  if (str===undefined || str===null) return NaN;
  str = String(str).trim().replace(/[^\d,.\-]/g,'');
  if (str.includes(',') && str.includes('.')) {
    if (str.lastIndexOf(',') > str.lastIndexOf('.')) str = str.replace(/\./g,'').replace(',', '.');
    else str = str.replace(/,/g,'');
  } else if (str.includes(',')) {
    str = str.replace(',', '.');
  }
  return Number(str);
}
// Riconosce se il CSV caricato è esattamente quello che l'app stessa esporta
// (stessi header, nello stesso ordine) — in quel caso ogni riga porta già la
// propria categoria/macro/codice/ente/pagamento, non serve configurare nulla a
// mano come per un estratto conto generico.
const HEADER_SPESE_NATIVO = ["Data","Categoria","Macro-categoria","Importo (ALL)","Codice titolo","Società/Ente","Pagato con","Nota"];
const HEADER_REDDITO_NATIVO = ["Data","Categoria","Macro-categoria","Importo","Valuta","Codice titolo","Società/Ente","Pagato su","Nota"];
function rilevaFormatoNativo(headers) {
  const norm = headers.map(h => String(h||"").trim().toLowerCase());
  const matchSpese = HEADER_SPESE_NATIVO.every((h,i) => norm[i] === h.toLowerCase());
  if (matchSpese) return "expenses";
  const matchReddito = HEADER_REDDITO_NATIVO.every((h,i) => norm[i] === h.toLowerCase());
  if (matchReddito) return "income";
  return null;
}
function handleCsvFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const rows = parseCSV(e.target.result);
    if (rows.length < 2) { alert("File CSV vuoto o non valido."); return; }
    const headers = rows[0];
    const dataRows = rows.slice(1).filter(r => r.some(c=>c && c.trim()!==""));
    const formatoNativo = rilevaFormatoNativo(headers);
    csvImportState = { headers, dataRows, group: formatoNativo || "expenses", category: data.categories.expenses[0]||"Altro", dateColIdx:0, amountColIdx: headers.length>1?1:0, noteColIdx:-1, formatoNativo };
    renderSettings();
  };
  reader.readAsText(file);
}
function confirmCsvImport() {
  const st = csvImportState;
  if (!st) return;
  let imported = 0, skipped = 0;
  const batchId = uid();
  if (st.formatoNativo) {
    // Colonne fisse, nello stesso ordine generato da esportaSpeseCSV/esportaRedditoCSV.
    const isSpese = st.formatoNativo === "expenses";
    st.dataRows.forEach(row => {
      const date = row[0];
      const category = (row[1]||"").trim() || "Altro";
      const macro = (row[2]||"").trim() || null;
      const amount = parseFlexibleAmount(isSpese ? row[3] : row[3]);
      const currency = isSpese ? "ALL" : ((row[4]||"").trim() || "ALL");
      const securityCode = (isSpese ? row[4] : row[5] || "").trim() || undefined;
      const issuerName = (isSpese ? row[5] : row[6] || "").trim() || undefined;
      const paymentType = (isSpese ? row[6] : row[7] || "").trim() || undefined;
      const note = (isSpese ? row[7] : row[8] || "").trim();
      if (!date || isNaN(amount) || amount===0) { skipped++; return; }
      const id = uid();
      const voce = { id, date, amount: Math.abs(amount), category, macro, note, importBatch: batchId };
      if (!isSpese) voce.currency = currency;
      if (securityCode) voce.securityCode = securityCode;
      if (issuerName) voce.issuerName = issuerName;
      if (paymentType && data.paymentTypes.includes(paymentType)) {
        voce.paymentType = paymentType;
        data[st.formatoNativo].push(voce);
        createLiquidityAdjustment(paymentType, (isSpese?-1:1) * Math.abs(amount), date,
          isSpese ? `Spesa: ${category}` : `Reddito: ${category}`, id);
      } else {
        data[st.formatoNativo].push(voce);
      }
      imported++;
    });
  } else {
    st.dataRows.forEach(row => {
      const date = parseFundHistoryDate(row[st.dateColIdx]);
      const amount = parseFlexibleAmount(row[st.amountColIdx]);
      if (!date || isNaN(amount) || amount===0) { skipped++; return; }
      const note = st.noteColIdx>=0 ? (row[st.noteColIdx]||"") : "";
      data[st.group].push({ id: uid(), date, amount: Math.abs(amount), category: st.category, note, importBatch: batchId });
      imported++;
    });
  }
  saveData();
  csvImportState = null;
  alert(`Importate ${imported} voci. Righe ignorate (data/importo non validi): ${skipped}.`);
  renderSettings();
}
