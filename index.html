<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body { margin:0; padding:0; background:#0F1B2B; color:#EDE6D6; font-family:'Inter',sans-serif; overscroll-behavior:none; }
#app { max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:84px; position:relative; }

form.entry { display:flex; flex-direction:column; gap:10px; }
.row2 { display:flex; gap:10px; }
.row2 > * { flex:1; }
label { font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#8FA3BF; display:block; margin-bottom:5px; }
input, select { width:100%; background:#0F1B2B; border:1px solid #2E4159; color:#EDE6D6; padding:10px; font-family:'IBM Plex Mono',monospace; font-size:14px; border-radius:5px; }

button.primary { background:#C9A227; color:#0F1B2B; border:none; padding:12px; font-weight:600; border-radius:5px; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; width:100%; }

nav.tabs { position:fixed; bottom:0; left:0; right:0; background:#0F1B2B; border-top:1px solid #2E4159; display:flex; max-width:520px; margin:0 auto; z-index:10;

  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; -ms-overflow-style:none; scroll-behavior:smooth; }

/* Sfumature ai bordi: suggeriscono che c'è altro da scorrere. */

.tabs-fade.left { left:0; background:linear-gradient(to right,#0F1B2B,rgba(15,27,43,0)); }
.tabs-fade.right { right:0; background:linear-gradient(to left,#0F1B2B,rgba(15,27,43,0)); }
nav.tabs button { flex:0 0 auto; min-width:62px; background:none; border:none; color:#6B7E99; padding:9px 6px 8px; font-family:'Inter',sans-serif; font-size:9px; letter-spacing:.01em; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; white-space:nowrap; }

nav.tabs button.active { color:#C9A227; }

.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

.bar-fg { height:100%; border-radius:20px; }
.cat-rows { display:flex; flex-direction:column; }
.cat-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #24374F; }

#lockScreen.active { display:flex !important; }
.recurring-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #24374F; font-size:12.5px; }
.recurring-row:last-child { border-bottom:none; }
.recurring-row span.rn { flex:1; }
@media (min-width: 900px) {

  nav.tabs { order:2; position:static; max-width:none; margin:0; border-top:none; border-bottom:1px solid #2E4159; padding:0 24px; justify-content:flex-start; gap:4px; overflow-x:auto; }
  .tabs-wrap { display:none; }
  nav.tabs button { flex:none; flex-direction:row; gap:8px; font-size:13px; padding:14px 16px; }
  nav.tabs button .ic { font-size:16px; }
  main { order:3; padding:28px 40px 40px; display:grid; grid-template-columns: repeat(2, 1fr); gap:20px; align-content:start; }
  main .card { margin-bottom:0; }
  .seal, .progress-wrap, .empty, .alert-banner, .alert-banner.ok { grid-column: 1 / -1; }
}
@media (min-width: 1300px) {
  main { grid-template-columns: repeat(3, 1fr); }
}
</style>

<div id="lockScreen" style="display:none; position:fixed; inset:0; background:#0F1B2B; z-index:100; flex-direction:column; align-items:center; justify-content:center; padding:24px; font-family:'Inter',sans-serif;">
  <div style="font-family:'Fraunces',serif;font-size:20px;color:#C9A227;margin-bottom:16px;">Inserisci il PIN</div>
  <input type="password" inputmode="numeric" pattern="[0-9]*" id="lockPinInput" maxlength="6" style="width:160px;text-align:center;font-size:22px;letter-spacing:8px;background:#16233B;border:1px solid #2E4159;color:#EDE6D6;padding:12px;border-radius:6px;">

<div id="app">

    <div class="eyebrow">Regjistri i Pavarësisë Financiare <span style="color:#5C7089;">· v2.49</span></div>

<script>
/* ==========================================================================
 * REGJISTRI FI — INDICE DEL FILE
 * ==========================================================================
 *
 * Come usarlo: cerca il nome della funzione-ancora (colonna "ancora") con la
 * ricerca del tuo editor. I numeri di riga sono indicativi e invecchiano a ogni
 * modifica; le ancore no. La suite di test verifica che ancore e ordine restino
 * corretti, quindi questo indice non può diventare silenziosamente falso.
 *
 * riga~  sezione                              ancora
 * -----  -----------------------------------  -----------------------------
 *   211  Costanti e dati predefiniti          DEFAULT_DATA
 *   231  Persistenza, salvataggio, backup     loadData / writeStore
 *   343  Formattazione, date, cambi valuta    fmtDisplay / toALL
 *   394  Tipi di asset e totali patrimonio    isDebtType / portfolioTotalALL
 *   487  Liquidità e categorie automatiche    createLiquidityAdjustment
 *   558  VENDITE: logica condivisa            computeSaleTail
 *        (la formula di ogni vendita vive qui, non nelle singole schede)
 *   605  Validazione delle vendite            validateSale
 *   644  Promemoria di backup                 computeBackupStatus
 *   705  Registrazione di una vendita         bookAssetSale
 *   735  Generazione automatica               autoGenerateSecurityIncome
 *        (cedole, dividendi, affitti, tasse, rate prestiti, carte)
 *  1162  Migrazioni e utilità sui dati        ensureLiquidityCategories
 *  1260  Ricorrenze e proiezione FI           generateRecurring / project
 *  1444  Stato interfaccia e componenti       categorySelect / macroSelect
 *  1514  SCHEDA Panoramica                    renderDashboard
 *  1837  SCHEDA Reddito                       renderIncome
 *  2170  SCHEDA Spese (con OCR scontrini)     renderExpenses
 *  2950  Calcoli obbligazioni e curva tassi   buildYieldCurveModel / bondYTM
 *  3184  Riepiloghi per tipo di asset         computeFundsSummary
 *  3234  SCHEDA Patrimonio (riepiloghi)       renderPortfolio
 *  4165  Budget e gestione categorie          renderBudget / categoryManageBlock
 *  4275  SCHEDA Stocks                        renderAssets
 *  4549  SCHEDA Liquidità                     renderLiquidityTab
 *  4669  SCHEDA Fondi                         renderFundsTab
 *  5062  SCHEDA Bonds                         renderBondsTab
 *  5432  SCHEDA Real Estate                   renderRealEstateTab
 *  5658  SCHEDA Commodities                   renderCommoditiesTab
 *  5842  SCHEDA Crypto                        renderCryptoTab
 *  6068  SCHEDA ETF                           renderETFTab
 *  6282  SCHEDA Depositi                      renderDepositsTab
 *  6442  SCHEDA Debiti                        renderDebts
 *  6720  Regole ricorrenti (in Assunzioni)    recurringBlockPortfolio
 *  6935  Import CSV movimenti                 handleCsvFile
 *  7083  Sincronizzazione Google Drive        silentUploadToDrive / renderDrive
 *  7286  Rinomina categorie e macro           renameCategory
 *  7461  Prezzi fondi Raiffeisen e AlbSig     fetchFundPrice
 *  7530  Tassi di cambio (Banca d'Albania)    getFxRateForDate
 *  7630  SCHEDA Assunzioni                    renderSettings
 *  8012  Mappa delle schede                   TAB_DEFS
 *  8047  Ricerca trasversale                  searchPositions
 *  8055  Riepilogo fiscale annuale            computeAnnualTaxSummary
 *  8129  Andamento nel tempo per asset        renderAssetPerformance
 *  8272  Navigazione fra schede               switchTab
 *  8287  Avvio dell'app                       tryUnlock / tryAutoResumeDrive
 *
 * NOTE DI ORIENTAMENTO
 * - Le 9 schede asset (righe 4275-6441) sono volutamente separate, ma la
 *   matematica delle vendite è condivisa: modifica computeSaleTail e cambia
 *   ovunque, obbligazioni comprese.
 * - Le funzioni "auto*" girano in sequenza all'avvio della Panoramica.
 * - Prima di modificare: node test-fi-tracker.js
 * ========================================================================== */

// ---------- Constants ----------
const thisYearNum = new Date().getFullYear();
const STORE_KEY = "fiTrackerData_v1";
const AUTO_MANAGED_INCOME_CATEGORIES = ["Cedola", "Interesse deposito", "Capital gain obbligazioni", "Capital gain fondi", "Affitto immobile", "Capital gain immobile", "Dividendo", "Capital gain azioni", "Capital gain materie prime", "Capital gain crypto"];
const AUTO_MANAGED_EXPENSE_CATEGORIES = ["Commissione collocamento titoli", "Commissione disbursement cedola", "Commissione vendita titoli", "Commissione titoli custodia", "Tassa immobile", "Commissione agenzia affitto", "Tassazione plusvalenza immobile", "Interessi carta di credito", "Interessi prestiti", "Interessi MPC", "Commissione prestito", "Assicurazione prestito", "Tassazione capital gain fondi", "Tassazione dividendi", "Penale chiusura deposito", "Tassazione capital gain azioni", "Tassazione capital gain materie prime", "Tassazione capital gain crypto", "Contributo Pensionistico da RLD", "Contributo Sanitario da RLD", "Tassazione da RLD"];
function isAutoManagedIncomeCategory(cat) {
  return AUTO_MANAGED_INCOME_CATEGORIES.includes(cat) || (data.taxDeductions||[]).some(d=>d.name===cat);
}
function isAutoManagedExpenseCategory(cat) {
  return AUTO_MANAGED_EXPENSE_CATEGORIES.includes(cat) || cat.startsWith("Tassa titoli obbligazioni") || cat.startsWith("Tassa depositi");
}
// Spese "di vita" vs oneri automatici (tasse, contributi, commissioni, interessi):
// una decisione di spesa che prendi ogni mese è cosa diversa da una trattenuta che
// non scegli. Usato sia per i KPI di ritmo di spesa in Panoramica sia per i totali
// della scheda Spese quando gli oneri automatici sono nascosti.
function spesePersonali(arr) { return arr.filter(e => !isAutoManagedExpenseCategory(e.category)); }
function speseAutoGestite(arr) { return arr.filter(e => isAutoManagedExpenseCategory(e.category)); }
const DEFAULT_CATEGORIES = {
  income: ["Reddito principale","Interessi","Altro"],
  expenses: ["Palestra","Assicurazione auto","Tasse auto","Caffè ufficio","Bar","Acqua","Luce","Telefono","Riparazioni auto","Tagliando auto","Supermercato","Gite/concerti","Vestiti","Vacanze","Ristoranti/uscite","Arredamento casa","Auto (acquisto)","Altro"],
  portfolio: ["Banca","Cash","Fondo pensione","Obbligazione Governativa","Obbligazione Societa","Deposito","Fondo azionario","Prestito/Debito","Immobile","Commodity","Crypto","Azione","Derivato","ETF","Altro"]
};
const DEFAULT_DATA = {
  settings: { fx: 93.5, fxUsd: 82, savingsRateTarget: 70, expenseGrowth: 75000, incomeGrowth2y: 70000, centralRet: 2, horizon: 20, expenseBase: 1160000, startYear: thisYearNum, pinHash: null, planBaselineYear: null, planBaselineSetDate: null, hfToken: "", hfModel: "Qwen/Qwen3.5-9B", nextSecurityCodeSeq: 1, withdrawalRate: 4, inflationPct: 3,
    lavoroDipendente: {
      // Più stipendi: ognuno con i propri dati, le trattenute e la tassazione
      // calcolate sul CUMULO, non isolatamente.
      stipendi: [],
      attivo: false, startMonth: null, giornoPaga: 10,
      stipendioLordo: 0, massimaleContributivo: 186416, tettoDeduzioneMensile: 50000,
      // percentuali contributive
      pctPensioneDatore: 15, pctSanitaDatore: 1.7, pctPensioneLavoratore: 9.5, pctSanitaLavoratore: 1.7,
      // basi imponibili: null = calcolate dal lordo, un numero = valore imposto a mano
      basePensioneDatore: null, baseSanitaDatore: null, basePensioneLavoratore: null, baseSanitaLavoratore: null, baseTassazione: null,
      // scaglioni: soglia superiore, sottrazione dalla base, aliquota
      scaglioni: [
        { fino: 40000,  sottrai: 0,      aliquota: 0,    fisso: 0 },
        { fino: 50000,  sottrai: 30000,  aliquota: 6.5,  fisso: 0 },
        { fino: 200000, sottrai: 30000,  aliquota: 13,   fisso: 0 },
        { fino: null,   sottrai: 200000, aliquota: 23,   fisso: 22100 }
      ]
    }, targetAllocation: {}, fireExpenseBaseMode: "budget", fireRatesText: "4,3,2", displayCurrency: "ALL", tabOrder: null, hiddenTabs: [], speseMostraAutoGestite: false, savingsRateProjectionMode: "reale", montecarloDevStd: 10, montecarloAnniPrelievo: 30, montecarloStrategiaPrelievo: "fissa", scenariComparativi: [] },
  income: [],
  expenses: [],
  portfolio: [],
  categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
  categoryBudgets: { income: {}, expenses: {}, portfolio: {} },
  macroCategories: { income: [], expenses: [], portfolio: [] },
  categoryMacroMap: { income: {}, expenses: {}, portfolio: {} },
  recurring: { income: [], expenses: [], portfolio: [] },
  snapshots: [],
  fxHistory: [],
  paymentTypes: ["Banca", "Cash", "Carta di Credito"],
  creditCardSettings: {},
  creditCardDebts: [],
  marketYieldCurve: null,
  taxDeductions: [],
  trash: [],
  deletedGenerated: []
};

// ---------- Storage ----------
// Dà forma ai dati grezzi (da localStorage o da IndexedDB) applicando i default:
// stessa logica, qualunque sia la fonte, così le due strade restano coerenti.
function normalizeLoadedData(parsed) {
  const base = JSON.parse(JSON.stringify(DEFAULT_DATA));
  if (!parsed) return base;
  return {
    settings: Object.assign({}, base.settings, parsed.settings || {}),
    income: parsed.income || [],
    expenses: parsed.expenses || [],
    portfolio: parsed.portfolio || [],
    categories: {
      income: (parsed.categories && parsed.categories.income) || base.categories.income,
      expenses: (parsed.categories && parsed.categories.expenses) || base.categories.expenses,
      portfolio: (parsed.categories && parsed.categories.portfolio) || base.categories.portfolio
    },
    categoryBudgets: {
      income: (parsed.categoryBudgets && parsed.categoryBudgets.income) || {},
      expenses: (parsed.categoryBudgets && parsed.categoryBudgets.expenses) || {},
      portfolio: (parsed.categoryBudgets && parsed.categoryBudgets.portfolio) || {}
    },
    macroCategories: {
      income: (parsed.macroCategories && parsed.macroCategories.income) || [],
      expenses: (parsed.macroCategories && parsed.macroCategories.expenses) || [],
      portfolio: (parsed.macroCategories && parsed.macroCategories.portfolio) || []
    },
    categoryMacroMap: {
      income: (parsed.categoryMacroMap && parsed.categoryMacroMap.income) || {},
      expenses: (parsed.categoryMacroMap && parsed.categoryMacroMap.expenses) || {},
      portfolio: (parsed.categoryMacroMap && parsed.categoryMacroMap.portfolio) || {}
    },
    recurring: {

const IDB_DB_NAME = "fiTrackerDB", IDB_DB_VERSION = 2, IDB_STORE_NAME = "kv", IDB_DATA_KEY = "data", IDB_BACKUP_STORE = "backupHistory";

function idbOpen() {

    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(IDB_STORE_NAME)) req.result.createObjectStore(IDB_STORE_NAME);
      if (!req.result.objectStoreNames.contains(IDB_BACKUP_STORE)) req.result.createObjectStore(IDB_BACKUP_STORE);
    };

  });

function idbGet(key) {

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("Lettura IndexedDB fallita"));
  }));

    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error("Scrittura IndexedDB fallita"));
  }));
}
function idbBackupPut(key, value) {

    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error("Scrittura backup automatico fallita"));

}
function idbBackupGetAll() {
  return idbOpen().then(db => new Promise((resolve, reject) => {

    const store = tx.objectStore(IDB_BACKUP_STORE);
    const keysReq = store.getAllKeys();
    keysReq.onsuccess = () => {
      const keys = keysReq.result;
      const valsReq = store.getAll();
      valsReq.onsuccess = () => resolve(keys.map((k, i) => ({ key: k, value: valsReq.result[i] })));
      valsReq.onerror = () => reject(valsReq.error);
    };
    keysReq.onerror = () => reject(keysReq.error);

}
function idbBackupDelete(key) {

// Istantanea automatica periodica, silenziosa: se sono passati abbastanza giorni
// dall'ultima (e ci sono abbastanza dati da valere la pena), ne salva una nuova e
// tiene solo le ultime AUTO_BACKUP_MAX_SNAPSHOTS, eliminando le più vecchie.
// Nessuna interazione richiesta — a differenza del promemoria di backup manuale,
// questo non chiede nulla all'utente.
const AUTO_BACKUP_INTERVAL_DAYS = 7;
const AUTO_BACKUP_MAX_SNAPSHOTS = 8;
async function autoLocalBackupCheck() {
  if (!idbAvailable) return;
  const entries = (data.income||[]).length + (data.expenses||[]).length + (data.portfolio||[]).length;
  if (entries < 5) return;
  const last = data.settings.lastAutoBackupSnapshot;
  const daysSince = last ? Math.floor((Date.now() - new Date(last).getTime()) / 86400000) : Infinity;
  if (daysSince < AUTO_BACKUP_INTERVAL_DAYS) return;
  try {
    const key = new Date().toISOString();
    await idbBackupPut(key, data);
    data.settings.lastAutoBackupSnapshot = key;
    saveData();
    const all = await idbBackupGetAll();
    const ordinati = all.sort((a,b) => a.key.localeCompare(b.key));
    const daEliminare = ordinati.slice(0, Math.max(0, ordinati.length - AUTO_BACKUP_MAX_SNAPSHOTS));
    for (const s of daEliminare) await idbBackupDelete(s.key);

function writeStore() {

  if (idbAvailable) {

      if (saveFailureNotified) { saveFailureNotified = false; showSaveBanner(false); }
    }).catch(err => {

      // salvato: è il momento di avvisare, con lo stesso banner di prima.
      if (!localOk) segnalaErroreSalvataggio(localErr || err);
    });
  } else if (!localOk) {
    segnalaErroreSalvataggio(localErr);
  } else if (saveFailureNotified) {
    saveFailureNotified = false; showSaveBanner(false);
  }

const FREQUENCIES = [
  {key:"monthly", label:"Mensile", months:1},
  {key:"quarterly", label:"Trimestrale", months:3},
  {key:"semiannual", label:"Semestrale", months:6},

// ===== Analisi di portafoglio: flussi futuri, rischio tassi, autonomia =====

// Calendario dei flussi già contrattualizzati nei prossimi mesi: cedole attese
// e capitali in scadenza. Risponde a "quando avrò liquidità da reinvestire".
function computeFutureCashflows(monthsAhead) {
  const months = monthsAhead || 12;
  const today = new Date();
  const horizon = new Date(today.getFullYear(), today.getMonth() + months, today.getDate());
  const out = [];
  data.portfolio.forEach(p => {
    if (!p.amount || p.amount <= 0 || !p.type) return;
    const t = p.type.toLowerCase();
    const isBond = t.includes("obbligazione");
    const isDeposit = t.includes("deposito");
    if (!isBond && !isDeposit) return;
    const code = p.securityCode || p.type;
    const rate = Number(isBond ? p.couponRate : p.depositRate) || 0;
    const mode = isBond ? p.bondMode : p.depositMode;
    const maturity = p.maturityDate ? new Date(p.maturityDate) : null;

    // Cedole/interessi periodici
    if (mode !== "finale" && rate > 0 && p.issueDate) {
      const freq = FREQUENCIES.find(f => f.key === (p.couponFrequency || "annual")) || FREQUENCIES[3];
      const perYear = 12 / freq.months;
      const gross = p.amount * rate / 100 / perYear;
      const taxPct = Number(isBond ? p.bondTaxRate : p.depositTaxRate);
      const net = gross * (1 - (isFinite(taxPct) ? taxPct : 15) / 100);
      let d = new Date(p.issueDate);
      // porta la data al primo pagamento futuro
      let guard = 0;
      while (d <= today && guard++ < 600) d.setMonth(d.getMonth() + freq.months);
      while (d <= horizon && (!maturity || d <= maturity) && guard++ < 600) {
        out.push({ date: localDateStr(d), kind: isBond ? "Cedola" : "Interesse",
          label: code, gross: toALL(gross, p.currency), net: toALL(net, p.currency),
          currency: p.currency, positionId: p.id });
        d = new Date(d); d.setMonth(d.getMonth() + freq.months);
      }
    }
    // Rimborso del capitale a scadenza
    if (maturity && maturity > today && maturity <= horizon) {
      out.push({ date: p.maturityDate, kind: "Rimborso capitale", label: code,
        gross: toALL(p.amount, p.currency), net: toALL(p.amount, p.currency),
        currency: p.currency, positionId: p.id, isPrincipal: true });
    }
  });
  out.sort((a,b) => a.date.localeCompare(b.date));
  const totalNet = out.reduce((s,x) => s + x.net, 0);
  const totalCoupons = out.filter(x => !x.isPrincipal).reduce((s,x) => s + x.net, 0);
  const totalPrincipal = out.filter(x => x.isPrincipal).reduce((s,x) => s + x.net, 0);
  return { rows: out, totalNet, totalCoupons, totalPrincipal, months };
}


// Quanta parte delle spese è già coperta da flussi ricorrenti (cedole, affitti,
// interessi). Misura progresso reale, non proiettato.
function computePassiveIncomeCoverage() {
  const flows = computeFutureCashflows(12);
  const couponsYear = flows.totalCoupons;
  const rentYear = data.income
    .filter(i => i.category === "Affitto immobile" && i.date >= `${thisYear-1}-01-01`)
    .reduce((s,i) => s + toALL(Number(i.amount), i.currency||"ALL"), 0);
  const passive = couponsYear + rentYear;
  const expensesYear = data.expenses
    .filter(e => e.date && e.date.slice(0,4) === String(thisYear))
    .reduce((s,e) => s + Number(e.amount), 0);
  const base = expensesYear > 0 ? expensesYear : (Number(data.settings.expenseBase) || 0);
  return { passive, couponsYear, rentYear, expenses: base,
    pct: base > 0 ? passive / base * 100 : null };
}

// Mesi di autonomia: per quanto reggeresti con la sola liquidità disponibile.
function computeRunwayMonths() {
  const liquid = computeLiquiditySummary().reduce((s,g) => s + g.balanceALL, 0);
  const yearExp = data.expenses
    .filter(e => e.date && e.date.slice(0,4) === String(thisYear))
    .reduce((s,e) => s + Number(e.amount), 0);
  const monthly = yearExp > 0
    ? yearExp / Math.max(1, new Date().getMonth() + 1)
    : (Number(data.settings.expenseBase) || 0) / 12;
  return { liquid, monthly, months: monthly > 0 ? liquid / monthly : null };
}

// TWR (rendimento ponderato nel tempo) tra snapshot consecutivi, metodo Modified
// Dietz: isola il rendimento vero dai versamenti/prelievi esterni (stipendio,
// spese di vita), che altrimenti farebbero sembrare "rendimento" un capitale che
// hai solo spostato dentro o fuori dal patrimonio tracciato.
// Flusso esterno = reddito NON da investimento (stipendio, regali...) meno spese
// personali (non tasse/commissioni/interessi: quelle riducono il rendimento vero,
// restano nel calcolo, non sono un prelievo). Ogni flusso pesato per i giorni
// rimanenti nel sotto-periodo (Modified Dietz), non solo sommato in blocco.
// Le categorie auto-gestite (cedole, dividendi, capital gain, affitti, tasse,
// commissioni, interessi) sono già isolate dal lavoro fatto per il punto 1(b) —
// qui si riusano, non si reinventano. Un bonifico da un conto che l'app non
// traccia verso uno che traccia non è distinguibile da un rendimento: è il
// limite onesto del metodo.
function computeTWR(dataInizio) {
  const snap = [...data.snapshots].filter(s => !dataInizio || s.date >= dataInizio).sort((a,b) => a.date.localeCompare(b.date));
  if (snap.length < 2) return null;
  let prodotto = 1;
  const dettaglio = [];
  for (let i = 1; i < snap.length; i++) {
    const inizio = snap[i-1], fine = snap[i];
    const bmv = inizio.wealth, emv = fine.wealth;
    if (!(bmv > 0)) continue;
    const giorniTotali = (new Date(fine.date) - new Date(inizio.date)) / 86400000;
    if (giorniTotali <= 0) continue;
    const flussi = [];
    data.income.forEach(e => {
      if (!e.date || e.date <= inizio.date || e.date > fine.date) return;
      if (isAutoManagedIncomeCategory(e.category)) return;
      flussi.push({ date: e.date, importo: toALL(Number(e.amount)||0, e.currency||"ALL") });
    });
    data.expenses.forEach(e => {
      if (!e.date || e.date <= inizio.date || e.date > fine.date) return;
      if (isAutoManagedExpenseCategory(e.category)) return;
      flussi.push({ date: e.date, importo: -(Number(e.amount)||0) });
    });
    let cfTotale = 0, sommaPesata = 0;
    flussi.forEach(f => {
      const giorniRimanenti = (new Date(fine.date) - new Date(f.date)) / 86400000;
      const peso = Math.max(0, Math.min(1, giorniRimanenti / giorniTotali));
      cfTotale += f.importo;
      sommaPesata += f.importo * peso;
    });
    const denom = bmv + sommaPesata;
    if (!(denom > 0)) continue;
    const rendimentoPeriodo = (emv - bmv - cfTotale) / denom;
    prodotto *= (1 + rendimentoPeriodo);
    dettaglio.push({ da: inizio.date, a: fine.date, BMV: bmv, EMV: emv, CF: cfTotale, rendimento: rendimentoPeriodo*100 });
  }
  if (!dettaglio.length) return null;
  const anni = (new Date(snap[snap.length-1].date) - new Date(snap[0].date)) / (365.25*86400000);
  const twrAnnualizzato = anni > 0.08 ? (Math.pow(prodotto, 1/anni) - 1)*100 : null;
  return { twrTotale: (prodotto-1)*100, twrAnnualizzato, periodi: dettaglio.length, dettaglio,
    dataInizio: snap[0].date, dataFine: snap[snap.length-1].date, anni };
}

function computeConcentration() {
  const total = portfolioTotalALL();
  if (total <= 0) return null;
  const assets = data.portfolio.filter(p => p.amount > 0 &&
    !isDebtType(p.type, p.macro) && !isCreditCardType(p.type));
  const byCurrency = {}, byMacro = {};
  let govBonds = 0, largest = { label: "", value: 0 };
  assets.forEach(p => {
    const v = toALL((p.marketValue!=null && p.marketValue!=="") ? Number(p.marketValue) : Number(p.amount), p.currency);
    byCurrency[p.currency] = (byCurrency[p.currency] || 0) + v;
    const m = p.macro || p.type;
    byMacro[m] = (byMacro[m] || 0) + v;
    if ((p.type||"").toLowerCase().includes("obbligazione governativa")) govBonds += v;
    if (v > largest.value) largest = { label: p.securityCode || p.fundName || p.stockTicker || p.type, value: v };
  });
  const topCurrency = Object.entries(byCurrency).sort((a,b)=>b[1]-a[1])[0] || ["—",0];
  const topMacro = Object.entries(byMacro).sort((a,b)=>b[1]-a[1])[0] || ["—",0];
  return { total,
    topCurrency: { name: topCurrency[0], value: topCurrency[1], pct: topCurrency[1]/total*100 },
    topMacro: { name: topMacro[0], value: topMacro[1], pct: topMacro[1]/total*100 },
    govBonds: { value: govBonds, pct: govBonds/total*100 },
    largest: { ...largest, pct: largest.value/total*100 } };
}

// Costo totale annuo di GESTIONE del patrimonio — commissioni e interessi, non
// tasse e non contributi da stipendio (concettualmente un'altra cosa: qui
// interessa solo quanto costa avere e muovere gli investimenti, non quanto se ne
// va in imposte). Punto 10 della lista di suggerimenti.
const CATEGORIE_COSTO_GESTIONE = ["Commissione collocamento titoli", "Commissione disbursement cedola",
  "Commissione vendita titoli", "Commissione titoli custodia", "Commissione agenzia affitto",
  "Interessi carta di credito", "Interessi prestiti", "Interessi MPC", "Commissione prestito",
  "Assicurazione prestito", "Penale chiusura deposito"];
function costoGestioneAnnuo(year) {
  const y = String(year);
  const voci = data.expenses.filter(e => e.date && e.date.slice(0,4) === y && CATEGORIE_COSTO_GESTIONE.includes(e.category));
  const totale = voci.reduce((s,e) => s + (Number(e.amount)||0), 0);
  const perCategoria = {};
  voci.forEach(e => { perCategoria[e.category] = (perCategoria[e.category]||0) + Number(e.amount); });
  const patrimonio = portfolioTotalALL();
  return { totale, perCategoria, patrimonio, pctSuPatrimonio: patrimonio>0 ? totale/patrimonio*100 : null };
}
function costoGestioneCard() {
  const c = costoGestioneAnnuo(thisYear);
  if (c.totale <= 0) return "";
  const righe = Object.entries(c.perCategoria).sort((a,b)=>b[1]-a[1]);
  return `
    <div class="card">
      <h3>Costo di gestione ${thisYear}</h3>
      <div class="subtle">Commissioni e interessi pagati per avere e muovere gli investimenti — non le tasse, quelle sono nel Riepilogo fiscale qui sotto.</div>
      <div class="stat-row"><span class="label">Totale</span><span class="val down">${fmt(c.totale)} ALL</span></div>
      ${c.pctSuPatrimonio!=null ? `<div class="stat-row"><span class="label">· sul patrimonio attuale</span><span class="val">${c.pctSuPatrimonio.toFixed(2)}%</span></div>` : ''}
      ${righe.map(([cat,val])=>`<div class="stat-row"><span class="label" style="font-size:11px;">· ${cat}</span><span class="val" style="font-size:11px;">${fmt(val)} ALL</span></div>`).join('')}
    </div>`;
}

function freqLabel(key) { return (FREQUENCIES.find(f=>f.key===key)||FREQUENCIES[0]).label; }
function shouldGenerateForMonth(rule, year, month) {
  const freq = FREQUENCIES.find(f=>f.key===(rule.frequency||"monthly")) || FREQUENCIES[0];
  const start = rule.startMonth || thisMonth;
  const [sy, sm] = start.split("-").map(Number);
  const monthsSinceStart = (year - sy)*12 + (month - sm);
  return monthsSinceStart >= 0 && monthsSinceStart % freq.months === 0;
}
function shouldGenerateThisMonth(rule) {
  return shouldGenerateForMonth(rule, thisYearNum, now.getMonth()+1);
}

// Regola anti-duplicati per i carichi: se esiste già un movimento con la stessa
// data, lo stesso importo e lo stesso codice, quella riga non va ricaricata.
function esisteGiaMovimento(paymentType, signedAmount, date, code) {
  return data.portfolio.some(p =>
    p.type === paymentType &&
    p.date === date &&
    Math.abs(Number(p.amount) - signedAmount) < 0.005 &&
    (code ? String(p.note||"").includes(code) : true));
}

function createLiquidityAdjustment(paymentType, signedAmount, date, note, linkedTxnId) {
  if (!paymentType) return null;
  const id = uid();
  const cur = currencyOfBankAccount(paymentType);
  data.portfolio.push({ id, type: paymentType, macro: (data.categoryMacroMap.portfolio && data.categoryMacroMap.portfolio[paymentType]) || null, amount: signedAmount, currency: cur, marketValue: null, date, maturityDate: null, note: note||"", linkedTxnId });
  return id;
}
function removeLiquidityAdjustment(linkedTxnId) {
  data.portfolio = data.portfolio.filter(p => p.linkedTxnId !== linkedTxnId);
}
// ===== Registro delle cancellazioni =====
// I motori automatici rigenerano una voce se non la trovano più: senza memoria di
// ciò che è stato cancellato, eliminare lo stipendio di un mese non serve a nulla
// perché ricompare alla riapertura. Qui si tiene traccia di quali generazioni sono
// state annullate deliberatamente, così non tornano.
function registroCancellazioni() {
  if (!data.deletedGenerated) data.deletedGenerated = [];
  return data.deletedGenerated;
}
// Chiave stabile di una generazione: fonte + mese di competenza.
function chiaveGenerazione(fonte, mese) {
  return String(fonte || "") + "|" + String(mese || "");
}
function segnaCancellazione(fonte, mese) {
  if (!fonte || !mese) return;
  const reg = registroCancellazioni();
  const k = chiaveGenerazione(fonte, mese);
  if (!reg.includes(k)) reg.push(k);
}
function eraStataCancellata(fonte, mese) {
  return registroCancellazioni().includes(chiaveGenerazione(fonte, mese));
}
// Riattiva le generazioni di una fonte (usato quando si ricrea o riattiva la fonte).
function dimenticaCancellazioni(fonte) {
  data.deletedGenerated = registroCancellazioni().filter(k => !k.startsWith(String(fonte) + "|"));
}
// Da una voce generata ricava la fonte, qualunque motore l'abbia prodotta.
function fonteDiGenerazione(voce) {
  if (!voce) return null;
  if (voce.recurringId) return "rec:" + voce.recurringId;
  if (voce.rldId) return "rld:" + voce.rldId;
  if (voce.category === CAT_RLD) return "rld:" + (voce.rldId || "principale");
  if (voce.category === CAT_DEDUZIONE_FP) return "dedfp";
  if (voce.deductionRuleId) return "ded:" + voce.deductionRuleId;
  return null;
}
// Registra la cancellazione di una voce generata, se lo è.
function registraCancellazioneVoce(voce) {
  const fonte = fonteDiGenerazione(voce);
  if (fonte && voce.date) segnaCancellazione(fonte, voce.date.slice(0,7));
}

const TRASH_MAX = 30;
// Cestino: prima di eliminare qualcosa se ne conserva una copia, così una conferma
// data per sbaglio non è più definitiva. Tiene le ultime TRASH_MAX eliminazioni.
function trashPush(kind, label, payload) {
  if (!data.trash) data.trash = [];
  data.trash.unshift({ id: uid(), at: new Date().toISOString(), kind, label,
    payload: JSON.parse(JSON.stringify(payload)) });
  if (data.trash.length > TRASH_MAX) data.trash.length = TRASH_MAX;
}
function trashRestore(entryId) {
  if (!data.trash) return false;
  const idx = data.trash.findIndex(t => t.id === entryId);
  if (idx === -1) return false;
  const t = data.trash[idx];
  const p = t.payload;
  if (t.kind === "income" && !data.income.some(x=>x.id===p.entry.id)) data.income.push(p.entry);
  else if (t.kind === "expense" && !data.expenses.some(x=>x.id===p.entry.id)) data.expenses.push(p.entry);
  else if (t.kind === "portfolio") {
    (p.positions||[]).forEach(pos => { if (!data.portfolio.some(x=>x.id===pos.id)) data.portfolio.push(pos); });
    (p.recurring||[]).forEach(r => { if (!data.recurring.income.some(x=>x.id===r.id)) data.recurring.income.push(r); });
  } else return false;
  data.trash.splice(idx, 1);
  return true;
}
function trashLabelFor(kind, entry) {
  const amt = entry && entry.amount != null ? `${fmt(Math.abs(Number(entry.amount)))} ${entry.currency||"ALL"}` : "";
  const what = entry && (entry.category || entry.type || "voce");
  const when = entry && entry.date ? ` · ${entry.date}` : "";
  return `${what} ${amt}${when}`.trim();
}

function deletePortfolioPosition(id, opts) {
  opts = opts || {};
  const pos = data.portfolio.find(p => p.id === id);
  const linkedAdj = data.portfolio.filter(p => p.linkedTo === id);
  const linkedRec = data.recurring.income.filter(r => r.linkedBondId === id);
  if (pos && !opts.noTrash) {
    trashPush("portfolio", trashLabelFor("portfolio", pos),
      { positions: [pos, ...linkedAdj], recurring: linkedRec });
  }
  data.portfolio = data.portfolio.filter(p => p.id !== id);
  removeLiquidityAdjustment(id);
  // Un debito collegato a questo immobile (linkedPropertyId) non deve restare a
  // puntare su un id che non esiste più — si scollega, non si cancella il debito.
  data.portfolio.forEach(p => { if (p.linkedPropertyId === id) p.linkedPropertyId = null; });
  const before = data.recurring.income.length;
  data.recurring.income = data.recurring.income.filter(r => r.linkedBondId !== id);
  return before !== data.recurring.income.length;
}
function resyncLiquidityAdjustment(txnId, paymentType, signedAmount, date, note) {
  removeLiquidityAdjustment(txnId);
  if (paymentType) createLiquidityAdjustment(paymentType, signedAmount, date, note, txnId);
}

function ensureBondDepositCategories() {
  let changed = false;
  const ensureCat = (group, cat) => { if (!data.categories[group].includes(cat)) { data.categories[group].push(cat); changed = true; } };
  ensureCat("income", "Cedola");
  ensureCat("income", "Capital gain obbligazioni");
  ensureCat("income", "Interesse deposito");
  ensureCat("expenses", "Commissione collocamento titoli");
  ensureCat("expenses", "Commissione disbursement cedola");
  ensureCat("expenses", "Commissione vendita titoli");
  ensureCat("expenses", "Commissione titoli custodia");
  ensureCat("income", "Capital gain fondi");
  ensureCat("expenses", "Tassazione capital gain fondi");
  if (data.categoryMacroMap.income["Capital gain fondi"] !== "Interessi da Titoli - Standard") { data.categoryMacroMap.income["Capital gain fondi"] = "Interessi da Titoli - Standard"; changed = true; }
  if (!data.categoryMacroMap.expenses) data.categoryMacroMap.expenses = {};
  if (data.categoryMacroMap.expenses["Tassazione capital gain fondi"] !== "Tassazione da Titoli - Standard") { data.categoryMacroMap.expenses["Tassazione capital gain fondi"] = "Tassazione da Titoli - Standard"; changed = true; }
  if (!data.macroCategories.income.includes("Interessi da Titoli - Standard")) { data.macroCategories.income.push("Interessi da Titoli - Standard"); changed = true; }
  if (!data.macroCategories.expenses.includes("Tassazione da Titoli - Standard")) { data.macroCategories.expenses.push("Tassazione da Titoli - Standard"); changed = true; }
  // Azionari/Altri: stesso schema del livello Standard, ma per azioni/dividendi
  // (Azionari) e per ETF/commodity/crypto (Altri) — prima condividevano il macro
  // generico della classe di asset (es. "Stocks"), non distinguibile dalle spese
  // ordinarie di portafoglio nei filtri fiscali.
  ["Interessi da Titoli - Azionari","Interessi da Titoli - Altri"].forEach(m=>{
    if (!data.macroCategories.income.includes(m)) { data.macroCategories.income.push(m); changed = true; }
  });
  ["Tassazione da Titoli - Azionari","Tassazione da Titoli - Altri","Interessi da Debiti"].forEach(m=>{
    if (!data.macroCategories.expenses.includes(m)) { data.macroCategories.expenses.push(m); changed = true; }
  });
  if (data.categoryMacroMap.income["Dividendo"] !== "Interessi da Titoli - Azionari") { data.categoryMacroMap.income["Dividendo"] = "Interessi da Titoli - Azionari"; changed = true; }
  if (!data.categoryMacroMap.expenses) data.categoryMacroMap.expenses = {};
  if (data.categoryMacroMap.expenses["Tassazione dividendi"] !== "Tassazione da Titoli - Azionari") { data.categoryMacroMap.expenses["Tassazione dividendi"] = "Tassazione da Titoli - Azionari"; changed = true; }
  if (data.categoryMacroMap.expenses["Interessi prestiti"] !== "Interessi da Debiti") { data.categoryMacroMap.expenses["Interessi prestiti"] = "Interessi da Debiti"; changed = true; }
  if (data.categoryMacroMap.expenses["Interessi carta di credito"] !== "Interessi da Debiti") { data.categoryMacroMap.expenses["Interessi carta di credito"] = "Interessi da Debiti"; changed = true; }
  // Mutuo prima casa: categoria e macro proprie, separate dai prestiti generici
  // (vantaggi fiscali tipicamente riservati alla prima casa, non a un investimento).
  ensureCat("expenses", "Interessi MPC");
  if (!data.macroCategories.expenses.includes("Interessi da Mutuo Prima Casa")) { data.macroCategories.expenses.push("Interessi da Mutuo Prima Casa"); changed = true; }
  if (data.categoryMacroMap.expenses["Interessi MPC"] !== "Interessi da Mutuo Prima Casa") { data.categoryMacroMap.expenses["Interessi MPC"] = "Interessi da Mutuo Prima Casa"; changed = true; }
  if (!data.categoryMacroMap.income) data.categoryMacroMap.income = {};
  ["Cedola","Capital gain obbligazioni","Interesse deposito"].forEach(c=>{
    if (data.categoryMacroMap.income[c] !== "Interessi da Titoli - Standard") { data.categoryMacroMap.income[c] = "Interessi da Titoli - Standard"; changed = true; }
  });
  if (changed) saveData();
}

function isCorporateBondType(type) {

function computeCommissionAmount(type, value, base) {
  value = Number(value) || 0;
  if (type === "percent") return base * value / 100;
  return value;
}

// ---- Shared sale logic (single source of truth for all asset-type sale forms) ----
// Change a sale formula HERE and every asset tab picks it up.

// The tax/commission/net tail, shared by every sale type including bonds and real estate.
function computeSaleTail(capitalGainLordo, commissionBase, taxRate, commType, commValue) {
  const commissione = computeCommissionAmount(commType, commValue, commissionBase);
  const tassazione = capitalGainLordo > 0 ? capitalGainLordo * taxRate/100 : 0;
  const capitalGainNetto = capitalGainLordo - tassazione - commissione;
  return { commissione, tassazione, capitalGainNetto };
}

// Quantity x price sales: stocks, ETF, commodities, crypto, funds.
function computeQuantitySale(formId, opts) {
  opts = opts || {};
  const qtyField = opts.qtyField || "quantity";
  const defaultTaxRate = opts.defaultTaxRate != null ? opts.defaultTaxRate : 15;
  const el = document.getElementById(formId);
  if (!el) return null;
  const f = new FormData(el);
  const quantity = Number(f.get(qtyField)) || 0;
  const purchasePrice = Number(f.get("purchasePrice")) || 0;
  const salePrice = Number(f.get("salePrice")) || 0;
  const taxRateRaw = f.get("taxRate");
  const taxRate = (taxRateRaw === null || taxRateRaw === "") ? defaultTaxRate : (Number(taxRateRaw) || 0);
  const commType = f.get("commissionType") || "percent";
  const commValue = Number(f.get("commissionValue")) || 0;
  const valoreInvestito = quantity * purchasePrice;
  const valoreVendita = quantity * salePrice;
  const capitalGainLordo = valoreVendita - valoreInvestito;
  const tail = computeSaleTail(capitalGainLordo, valoreVendita, taxRate, commType, commValue);
  return { quantity, [qtyField]: quantity, purchasePrice, salePrice, taxRate, valoreInvestito, valoreVendita, capitalGainLordo, ...tail };
}

// Validates a sale before it is booked. Returns an error message, or null if the sale is sound.
// One place to change the rules for every asset tab.
function validateSale(o) {
  const qty = Number(o.quantity);
  const unit = o.unitLabel || "unità";
  if (!isFinite(qty) || qty <= 0) {
    return `Inserisci una quantità maggiore di zero (${unit}).`;
  }
  if (o.available != null && isFinite(Number(o.available))) {
    const avail = Number(o.available);
    // small tolerance for fractional quota/crypto rounding
    if (qty > avail + 0.00001) {
      return `Non puoi vendere ${fmt2(qty)} ${unit}: ne possiedi ${fmt2(avail)}.`;
    }
  }
  const sPrice = Number(o.salePrice);
  if (o.salePrice != null && (!isFinite(sPrice) || sPrice <= 0)) {
    return "Inserisci un prezzo di vendita maggiore di zero.";
  }
  if (o.saleDate && o.purchaseDate && o.saleDate < o.purchaseDate) {
    return `La data di vendita (${o.saleDate}) è precedente all'acquisto (${o.purchaseDate}).`;
  }
  if (o.saleDate && o.saleDate > todayISO) {
    return `La data di vendita (${o.saleDate}) è nel futuro.`;
  }
  const tax = Number(o.taxRate);
  if (o.taxRate != null && (!isFinite(tax) || tax < 0 || tax > 100)) {
    return "L'aliquota di tassazione deve essere tra 0 e 100.";
  }
  return null;
}
// Shows the validation error and returns true when the sale must be blocked.
function blockedBySaleValidation(o) {
  const err = validateSale(o);
  if (err) { alert("Vendita non registrata.\n\n" + err); return true; }
  return false;
}

// Riassume un insieme di dati in una riga leggibile, per far vedere all'utente
// cosa sta per perdere e cosa sta per caricare.
function describeDataset(d) {
  if (!d) return "niente";
  const inc = (d.income||[]).length, exp = (d.expenses||[]).length, pos = (d.portfolio||[]).length;
  if (inc + exp + pos === 0) return "nessun movimento";
  const dates = [...(d.income||[]), ...(d.expenses||[])].map(e=>e.date).filter(Boolean).sort();
  const span = dates.length ? ` · dal ${dates[0]} al ${dates[dates.length-1]}` : "";
  return `${inc} redditi, ${exp} spese, ${pos} posizioni${span}`;
}
// Verifica che il file scelto sia davvero un backup di questa app, prima di
// sostituire l'intero archivio. Un file JSON qualunque non deve poter cancellare
// anni di dati solo perché è JSON sintatticamente valido.
function validateBackupFile(parsed) {
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
    return { ok:false, error:"Il file non contiene un backup (struttura non riconosciuta)." };
  }
  const hasArray = k => Array.isArray(parsed[k]);
  const known = ["income","expenses","portfolio"].filter(hasArray);
  if (known.length === 0) {
    return { ok:false, error:"Questo file non sembra un backup di Regjistri FI: non contiene né movimenti né posizioni.\nControlla di aver scelto il file giusto (fi-tracker-backup-....json)." };
  }
  const badRow = ["income","expenses"].some(k =>
    hasArray(k) && parsed[k].length > 0 &&
    !parsed[k].every(e => e && typeof e === "object" && "amount" in e && "date" in e));
  if (badRow) {
    return { ok:false, error:"Il file ha la forma di un backup ma i movimenti non hanno data e importo: potrebbe essere danneggiato o appartenere a un'altra applicazione." };
  }
  const summary = describeDataset(parsed);
  const total = (parsed.income||[]).length + (parsed.expenses||[]).length + (parsed.portfolio||[]).length;
  const currentTotal = (data.income||[]).length + (data.expenses||[]).length + (data.portfolio||[]).length;
  let warning = null;
  if (total === 0) warning = "Il file è vuoto: importandolo cancelleresti tutto senza recuperare nulla.";
  else if (currentTotal > 0 && total < currentTotal / 2) {
    warning = `Il file contiene molti meno dati di quelli attuali (${total} contro ${currentTotal}): potrebbe essere un backup vecchio.`;
  }
  return { ok:true, summary, warning };
}

const BACKUP_REMINDER_DAYS = 14;
// Works out how protected the data currently is. A working Drive sync counts as a backup,
// so people who sync never get nagged.
function computeBackupStatus() {
  const s = data.settings || {};
  const entries = (data.income||[]).length + (data.expenses||[]).length + (data.portfolio||[]).length;
  const daysSince = iso => {
    if (!iso) return null;
    const t = new Date(iso).getTime();
    if (!isFinite(t)) return null;
    return Math.floor((Date.now() - t) / 86400000);
  };
  const driveDays = daysSince(s.lastDriveSync);
  const manualDays = daysSince(s.lastManualBackup);
  const candidates = [driveDays, manualDays].filter(d => d !== null);
  const daysSinceAnyBackup = candidates.length ? Math.min(...candidates) : null;
  const dismissedDays = daysSince(s.backupReminderDismissedOn);
  const snoozed = dismissedDays !== null && dismissedDays < 7;
  const worthProtecting = entries >= 5;
  const overdue = worthProtecting && (daysSinceAnyBackup === null || daysSinceAnyBackup >= BACKUP_REMINDER_DAYS);
  return {
    entries, driveDays, manualDays, daysSinceAnyBackup,
    neverBackedUp: daysSinceAnyBackup === null,
    shouldRemind: overdue && !snoozed,
    lastDriveSync: s.lastDriveSync || null,
    lastManualBackup: s.lastManualBackup || null
  };
}
function backupReminderCard() {
  const b = computeBackupStatus();
  if (!b.shouldRemind) return "";
  const detail = b.neverBackedUp
    ? `Hai ${b.entries} voci registrate e nessun backup. Se svuoti la cache del browser o cambi dispositivo, perdi tutto.`
    : `L'ultimo backup risale a ${b.daysSinceAnyBackup} giorni fa. I dati vivono solo in questo browser.`;
  return `
    <div class="card" style="border-color:#C9A227;">
      <h3>Backup consigliato</h3>
      <div class="subtle">${detail}</div>
      <div class="row2" style="margin-top:10px;">
        <button class="primary" type="button" id="backupNowBtn">Scarica backup ora</button>
        <button class="secondary" type="button" id="backupLaterBtn">Ricordamelo tra una settimana</button>
      </div>
    </div>`;
}
function bindBackupReminder(rerender) {
  const now = document.getElementById("backupNowBtn");
  if (now) now.addEventListener("click", ()=>{
    if (emergencyBackupDownload()) {
      data.settings.lastManualBackup = new Date().toISOString();
      data.settings.backupReminderDismissedOn = null;
      saveData();
      if (rerender) rerender();
    }
  });
  const later = document.getElementById("backupLaterBtn");
  if (later) later.addEventListener("click", ()=>{
    data.settings.backupReminderDismissedOn = new Date().toISOString();
    saveData();
    if (rerender) rerender();
  });
}

// Books a completed sale: portfolio offset, capital return, gain income, tax + commission
// expenses (always converted to ALL), and the net-gain liquidity credit.
function bookAssetSale(o) {
  const c = o.calc;
  const currency = o.currency;
  const bankAccount = bankAccountForCurrency(currency);
  const saleId = uid();
  // Codice titolo dalla posizione venduta, se disponibile: serve a collegare la
  // ritenuta al titolo che l'ha generata (non solo al reddito), per il rendiconto.
  const posVenduta = o.linkedPositionId ? data.portfolio.find(p => p.id === o.linkedPositionId) : null;
  const codiceTitolo = (posVenduta && posVenduta.securityCode) || o.securityCode || null;
  // o.macro resta il macro della POSIZIONE in portafoglio (es. "Stocks"), namespace
  // diverso dal macro di reddito/spesa. o.macroReddito è il macro fiscale del flusso
  // (es. "Interessi da Titoli - Azionari"): se non specificato, ricade sul vecchio
  // comportamento (stesso valore di o.macro) per non rompere chiamate esistenti.
  // Il macro della tassa si deriva da quello del reddito con la stessa convenzione
  // già in uso per bond/fondi (Interessi↔Tassazione, stesso suffisso).
  const macroReddito = o.macroReddito || o.macro || null;
  const macroTassazione = o.macroTassazione || (macroReddito ? macroReddito.replace("Interessi da Titoli", "Tassazione da Titoli") : macroReddito);
  data.portfolio.push({ id: uid(), type: o.portfolioType, macro: o.macro||null, amount: -c.valoreInvestito, currency, marketValue: null, date: o.saleDate, maturityDate: null, note: `${o.sellLabel}: ${o.name}` });
  createLiquidityAdjustment(bankAccount, c.valoreInvestito, o.saleDate, `Rimborso capitale: ${o.name}`, saleId);
  const incomeEntry = { id: saleId, date: o.saleDate, amount: c.capitalGainLordo, currency, category: o.incomeCategory, macro: macroReddito, paymentType: null, note: `Vendita ${o.name}`, securityCode: codiceTitolo };
  if (o.linkedPositionId) incomeEntry.linkedBondId = o.linkedPositionId;
  data.income.push(incomeEntry);
  if (c.tassazione > 0) {
    if (!data.categories.expenses.includes(o.taxCategory)) data.categories.expenses.push(o.taxCategory);
    // linkedIncomeId punta esattamente alla riga di reddito che ha generato questa
    // ritenuta: un abbinamento certo, non per euristica (stessa data/importo).
    data.expenses.push({ id: uid(), date: o.saleDate, amount: toALL(c.tassazione, currency), category: o.taxCategory, macro: macroTassazione, note: `Tassazione capital gain (${fmt(c.tassazione)} ${currency})`, linkedBondId: o.linkedPositionId||null, securityCode: codiceTitolo, linkedIncomeId: saleId });
  }
  if (c.commissione > 0) {
    data.expenses.push({ id: uid(), date: o.saleDate, amount: toALL(c.commissione, currency), category: "Commissione vendita titoli", note: `${o.commissionLabel||'Commissione vendita'} (${fmt(c.commissione)} ${currency})`, linkedBondId: o.linkedPositionId||null, securityCode: codiceTitolo, linkedIncomeId: saleId });
  }
  createLiquidityAdjustment(bankAccount, c.capitalGainNetto, o.saleDate, `Plusvalenza netta vendita: ${o.name}`, saleId+"-gain");
  return saleId;
}
// Assegna il codice a una nuova voce. La casella è precompilata col prossimo
// codice: se l'utente lo accetta, il contatore deve avanzare, altrimenti ogni
// nuova posizione riceverebbe sempre lo stesso codice.
// Costruisce dal modulo i dati che identificano lo strumento.
function datiIdentitaDaForm(f, tipo, macro) {
  const g = k => (f && typeof f.get === "function") ? (f.get(k) || "") : "";
  return { type: tipo || g("type"), macro: macro || null, issuerName: g("issuerName"),
    fundName: g("fundName"), stockTicker: g("stockTicker"), cryptoSymbol: g("cryptoSymbol"),
    cryptoId: g("cryptoId"), commodityName: g("commodityName"), issueDate: g("issueDate"),
    bondYears: g("bondYears"), depositYears: g("depositYears") };
}

function assegnaCodiceTitolo(valore, dati) {
  // Se lo strumento esiste già in portafoglio (stesso nome/ticker ed ente, e per
  // obbligazioni e depositi anche la stessa data di collocamento) si riusa il codice
  // assegnato al primo acquisto, invece di crearne un altro per lo stesso titolo.
  if (dati) {
    const esistente = codiceEsistentePerStrumento(dati);
    if (esistente) return esistente;
  }
  const v = String(valore == null ? "" : valore).trim();
  if (!v) return consumeNextSecurityCode();
  if (v === peekNextSecurityCode()) return consumeNextSecurityCode();
  const m = /^T(\d{7})$/.exec(v);
  if (m) {
    const n = Number(m[1]);
    if (n >= (data.settings.nextSecurityCodeSeq || 1)) data.settings.nextSecurityCodeSeq = n + 1;
  }
  return v;
}
// Lo scostamento serve quando più moduli sono mostrati insieme (le carte):
// ciascuno deve proporre un codice diverso.
// Chiave d'identità di uno strumento: due posizioni con la stessa chiave sono lo
// stesso titolo e devono condividere il codice, assegnato al primo acquisto.
// Per obbligazioni e depositi entra anche la data di collocamento: due emissioni
// dello stesso ente con la stessa durata sono titoli diversi.
function chiaveIdentitaStrumento(dati) {
  const norm = v => String(v || "").trim().toLowerCase();
  const tipo = norm(dati.type);
  const ente = norm(dati.issuerName);
  if (tipo.includes("fond") || (typeof isFundEntry === "function" && isFundEntry(dati))) {
    return dati.fundName ? "fondo|" + norm(dati.fundName) + "|" + ente : null;
  }
  if (tipo.includes("obbligazione") || tipo.includes("deposito")) {
    const collocamento = norm(dati.issueDate);
    if (!ente && !collocamento) return null;
    return "titolo|" + tipo + "|" + ente + "|" + norm(dati.bondYears || dati.depositYears) + "|" + collocamento;
  }
  if (isCryptoType(dati.type, dati.macro)) {
    const s = norm(dati.cryptoSymbol) || norm(dati.cryptoId);
    return s ? "crypto|" + s + "|" + ente : null;
  }
  if (isCommodityType(dati.type, dati.macro)) {
    return dati.commodityName ? "commodity|" + norm(dati.commodityName) + "|" + ente : null;
  }
  if (isStockType(dati.type, dati.macro) || isETFType(dati.type, dati.macro)) {
    return dati.stockTicker ? "titoloquotato|" + norm(dati.stockTicker) + "|" + ente : null;
  }
  // Immobili e tutto il resto: ogni posizione è unica, nessun riuso di codice.
  return null;
}

// ===== Controllo di integrità dei dati (su richiesta, da Assunzioni) =====
// Non risolve nulla da solo — dice cosa guardare, invece di scoprirlo per caso
// mesi dopo (com'è successo con il riferimento pendente linkedPropertyId e col
// registro cancellazioni perso nell'import, entrambi trovati solo con controlli
// manuali mirati).
function controllaIntegritaDati() {
  const problemi = [];
  const portfolioIds = new Set(data.portfolio.map(p => p.id));
  const incomeIds = new Set(data.income.map(i => i.id));
  const expenseIds = new Set(data.expenses.map(e => e.id));

  // 1) Riferimenti pendenti: puntano a un id che non esiste più in portafoglio/reddito.
  data.income.forEach(i => {
    if (i.linkedBondId && !portfolioIds.has(i.linkedBondId)) {
      problemi.push({ tipo: "Riferimento pendente", gravita: "media",
        msg: `Reddito "${i.category}" del ${i.date} (${fmt(i.amount)} ${i.currency||'ALL'}) è collegato a una posizione che non esiste più.` });
    }
  });
  data.expenses.forEach(e => {
    if (e.linkedBondId && !portfolioIds.has(e.linkedBondId)) {
      problemi.push({ tipo: "Riferimento pendente", gravita: "media",
        msg: `Spesa "${e.category}" del ${e.date} (${fmt(e.amount)} ALL) è collegata a una posizione che non esiste più.` });
    }
    if (e.linkedIncomeId && !incomeIds.has(e.linkedIncomeId)) {
      problemi.push({ tipo: "Riferimento pendente", gravita: "bassa",
        msg: `Spesa "${e.category}" del ${e.date} punta a un reddito collegato che non esiste più (l'abbinamento certo si è perso, resta solo il collegamento al titolo se presente).` });
    }
  });
  data.portfolio.forEach(p => {
    if (p.linkedPropertyId && !portfolioIds.has(p.linkedPropertyId)) {
      problemi.push({ tipo: "Riferimento pendente", gravita: "bassa",
        msg: `"${p.type}" del ${p.date} è collegato a un immobile che non esiste più.` });
    }
  });

  // 2) Saldo netto negativo per strumenti che non dovrebbero mai poterlo avere
  // (debiti e carte hanno una convenzione di segno propria, qui escluse apposta).
  const saldiPerStrumento = {};
  data.portfolio.forEach(p => {
    if (isDebtType(p.type, p.macro) || isCreditCardType(p.type) || data.paymentTypes.includes(p.type)) return;
    const chiave = chiaveIdentitaStrumento(p) || ("singolo:" + p.id);
    saldiPerStrumento[chiave] = (saldiPerStrumento[chiave] || { nome: nomeStrumento(p), saldo: 0 });
    saldiPerStrumento[chiave].saldo += toALL(Number(p.amount) || 0, p.currency);
  });
  Object.values(saldiPerStrumento).forEach(g => {
    if (g.saldo < -0.5) {
      problemi.push({ tipo: "Saldo anomalo", gravita: "alta",
        msg: `"${g.nome}" ha un saldo netto negativo (${fmt(g.saldo)} ALL) — non dovrebbe essere possibile per questo tipo di strumento.` });
    }
  });

  // 3) Posizioni senza codice titolo, per i tipi che normalmente ne hanno uno.
  data.portfolio.forEach(p => {
    if (data.paymentTypes.includes(p.type)) return;
    if (!p.securityCode) {
      problemi.push({ tipo: "Dati incompleti", gravita: "bassa",
        msg: `"${p.type}" del ${p.date} (${fmt(p.amount)} ${p.currency}) non ha un codice titolo assegnato.` });
    }
  });

  // 4) Duplicati sospetti: stessa data, stesso importo, stessa categoria.
  function trovaDuplicati(arr, nomeGruppo) {
    const visti = {};
    arr.forEach(e => {
      const chiave = `${e.date}|${Number(e.amount)}|${e.category}`;
      (visti[chiave] = visti[chiave] || []).push(e);
    });
    Object.values(visti).filter(g => g.length > 1).forEach(g => {
      problemi.push({ tipo: "Possibile duplicato", gravita: "media",
        msg: `${g.length} voci identiche in ${nomeGruppo}: "${g[0].category}", ${fmt(g[0].amount)} ALL, ${g[0].date}.` });
    });
  }
  trovaDuplicati(data.income, "Reddito");
  trovaDuplicati(data.expenses, "Spese");

  // 5) Movimenti di liquidità orfani: un aggiustamento su un conto (Banca/Cash),
  // creato in automatico al momento di un acquisto/vendita e collegato tramite
  // linkedTxnId, la cui posizione collegata è stata cancellata senza ripulire
  // questo movimento — resta a ridurre il saldo per sempre, senza modo di trovarlo
  // se non da qui. A differenza degli altri problemi di questa lista, questo si
  // può rimuovere direttamente dal pannello: cancellarlo è sicuro, ripristina solo
  // il saldo a quello che era prima di quel movimento mai completato.
  data.portfolio.forEach(p => {
    if (!p.linkedTxnId || !data.paymentTypes.includes(p.type)) return;
    // Il collegamento può puntare a una posizione (acquisto/vendita titolo), a
    // una voce di reddito (es. cedola con ritenuta) o a una voce di spesa (es.
    // supermercato pagato da un conto tracciato) — bisogna escludere tutte e tre
    // prima di dichiararlo orfano. Un bug qui (controllare solo il portafoglio)
    // segnalava come "orfana" quasi ogni spesa/reddito normale, con centinaia di
    // falsi positivi — trovato dall'utente e corretto in v2.48.
    if (portfolioIds.has(p.linkedTxnId) || incomeIds.has(p.linkedTxnId) || expenseIds.has(p.linkedTxnId)) return;
    problemi.push({ tipo: "Movimento di liquidità orfano", gravita: "alta", id: p.id,
      msg: `Movimento su "${p.type}" del ${p.date} (${fmt(p.amount)} ${p.currency}${p.note?' · '+p.note:''}) era collegato a una posizione ormai cancellata. Rimuoverlo ripristina il saldo di ${fmt(-p.amount)} ${p.currency}.` });
  });

  // 5bis) Stesso problema, ma per movimenti generati dall'importazione storico
  // fondi PRIMA che venisse corretto un bug (v2.46): quei movimenti non avevano
  // affatto un linkedTxnId (era passato null), quindi il controllo sopra non li
  // vede — restavano orfani fin dall'origine, non solo dopo una cancellazione.
  // Li si riconosce dal codice titolo alla fine della nota ("Acquisto quote ... T0000123"):
  // se nessuna posizione ha ancora quel codice, il fondo è stato cancellato.
  const codiciEsistenti = new Set(data.portfolio.map(p => p.securityCode).filter(Boolean));
  data.portfolio.forEach(p => {
    if (p.linkedTxnId || !data.paymentTypes.includes(p.type)) return;
    if (!p.note || !p.note.startsWith("Acquisto quote ")) return;
    const match = p.note.match(/T\d{7}$/);
    if (!match) return;
    if (codiciEsistenti.has(match[0])) return;
    problemi.push({ tipo: "Movimento di liquidità orfano", gravita: "alta", id: p.id,
      msg: `Movimento su "${p.type}" del ${p.date} (${fmt(p.amount)} ${p.currency} · ${p.note}) — il fondo con codice ${match[0]} non esiste più nel portafoglio (probabile residuo dell'importazione storico fondi). Rimuoverlo ripristina il saldo di ${fmt(-p.amount)} ${p.currency}.` });
  });

  // 6) Il verso OPPOSTO del controllo 5: una spesa o un reddito che dichiara un
  // metodo di pagamento (quindi ci si aspetta un movimento di liquidità
  // collegato), ma nessun movimento del genere esiste — il saldo di quel conto
  // non riflette questa voce. Può capitare se il movimento è stato cancellato a
  // parte (es. dalla scheda Liquidità) lasciando la spesa/reddito intatti.
  const linkedTxnIdsEsistenti = new Set(data.portfolio.filter(p => p.linkedTxnId).map(p => p.linkedTxnId));
  data.expenses.forEach(e => {
    if (!e.paymentType || !data.paymentTypes.includes(e.paymentType)) return;
    if (linkedTxnIdsEsistenti.has(e.id)) return;
    problemi.push({ tipo: "Spesa senza movimento collegato", gravita: "media", id: e.id, fonte: "expenses",
      msg: `La spesa "${e.category}" del ${e.date} (${fmt(e.amount)} ALL) dichiara di essere pagata con "${e.paymentType}", ma non esiste nessun movimento di liquidità collegato — il saldo di quel conto potrebbe non rifletterla.` });
  });
  data.income.forEach(i => {
    if (!i.paymentType || !data.paymentTypes.includes(i.paymentType)) return;
    if (linkedTxnIdsEsistenti.has(i.id)) return;
    problemi.push({ tipo: "Reddito senza movimento collegato", gravita: "media", id: i.id, fonte: "income",
      msg: `Il reddito "${i.category}" del ${i.date} (${fmt(i.amount)} ${i.currency||'ALL'}) dichiara di essere accreditato su "${i.paymentType}", ma non esiste nessun movimento di liquidità collegato — il saldo di quel conto potrebbe non rifletterlo.` });
  });

  const ordineGravita = { alta: 0, media: 1, bassa: 2 };
  problemi.sort((a, b) => ordineGravita[a.gravita] - ordineGravita[b.gravita]);
  return problemi;
}

// Codice già assegnato a uno strumento con la stessa identità, se esiste.
function codiceEsistentePerStrumento(dati) {
  const chiave = chiaveIdentitaStrumento(dati);
  if (!chiave) return null;
  const trovato = data.portfolio.find(p => p.securityCode && chiaveIdentitaStrumento(p) === chiave);
  return trovato ? trovato.securityCode : null;
}

// Codice da usare al salvataggio: quello dello strumento se già esiste, altrimenti
// quello scritto a mano (se diverso dal precompilato), altrimenti uno nuovo.
function codicePerNuovaPosizione(dati, codiceScritto) {
  const esistente = codiceEsistentePerStrumento(dati);
  if (esistente) return esistente;
  const scritto = String(codiceScritto || "").trim();
  if (scritto && scritto !== peekNextSecurityCode()) return scritto;
  return consumeNextSecurityCode();
}

function peekNextSecurityCode(scostamento) {
  const seq = (data.settings.nextSecurityCodeSeq || 1) + (Number(scostamento) || 0);
  return "T" + String(seq).padStart(7, "0");
}
function consumeNextSecurityCode() {
  const code = peekNextSecurityCode();
  data.settings.nextSecurityCodeSeq = (data.settings.nextSecurityCodeSeq || 1) + 1;
  return code;
}

function autoGenerateSecurityIncome() {
  let changed = false;
  data.portfolio.forEach(p => {
    if (!p.amount || p.amount <= 0 || !p.type) return;
    const typeLower = p.type.toLowerCase();
    const isBondCoupon = typeLower.includes("obbligazione") && p.bondMode === "cedola";
    const isDepositCoupon = typeLower.includes("deposito") && p.depositMode === "cedola";
    if (!isBondCoupon && !isDepositCoupon) return;
    if (p.maturityDate && new Date(p.maturityDate) < now) return;
    const freqKey = p.couponFrequency || "annual";
    const freqObj = FREQUENCIES.find(f => f.key === freqKey) || FREQUENCIES.find(f => f.key === "annual");
    const scheduleAnchorDate = p.issueDate || p.date;
    // Tutte le scadenze cedolari maturate finora, non solo quella del mese in cui
    // si apre l'app: prima, se l'anniversario cadeva in un mese in cui non aprivi,
    // quella cedola non veniva generata mai più, e gli arretrati degli anni
    // precedenti non venivano mai recuperati.
    const scadenze = scadenzeCedolariMaturate(scheduleAnchorDate, freqObj.months, p.maturityDate, p.date);
    scadenze.forEach(dateStr => {
      if (data.income.some(i => i.linkedBondId === p.id && i.date === dateStr)) return;
      if (!canGenerateOnDate(dateStr)) return;
      emettiCedola(p, dateStr, isBondCoupon, freqObj);
      changed = true;
    });
  });
  if (changed) saveData();
}

// Elenca le date in cui una cedola è già maturata: anniversari successivi
// all'emissione, fino a oggi e non oltre la scadenza del titolo.
function scadenzeCedolariMaturate(anchorDate, mesiPasso, maturityDate, minDate) {
  const out = [];
  if (!anchorDate || !mesiPasso) return out;
  const start = new Date(anchorDate);
  if (isNaN(start)) return out;
  const giorno = start.getDate();
  const limite = maturityDate ? new Date(Math.min(new Date(maturityDate).getTime(), now.getTime())) : now;
  for (let k = 1; k <= 600; k++) {
    const d = new Date(start.getFullYear(), start.getMonth() + k*mesiPasso, 1);
    const ultimoGiorno = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(giorno, ultimoGiorno));
    if (d > limite) break;
    const s = localDateStr(d);
    if (minDate && s < minDate) continue;
    out.push(s);
  }
  return out;
}

// ===== Punto 16: rateo d'interesse maturato =====
// Quanto interesse hai già "guadagnato" dall'ultima cedola pagata (o dall'emissione,
// se non ne è mai stata pagata una) fino a oggi — utile se compri/vendi sul mercato
// secondario, dove il prezzo si scambia di solito "corso secco" e il rateo si regola
// a parte tra le due parti.
function calcolaRateoInteresse(p) {
  const typeLower = String(p.type||"").toLowerCase();
  const isBond = typeLower.includes("obbligazione") && p.bondMode === "cedola";
  const isDeposit = typeLower.includes("deposito") && p.depositMode === "cedola";
  if (!isBond && !isDeposit) return null;
  const rate = Number(isBond ? p.couponRate : p.depositRate) || 0;
  if (rate <= 0) return null;
  const freqObj = FREQUENCIES.find(f => f.key === (p.couponFrequency||"annual")) || FREQUENCIES.find(f=>f.key==="annual");
  const anchorDate = p.issueDate || p.date;
  if (!anchorDate) return null;
  const scadute = scadenzeCedolariMaturate(anchorDate, freqObj.months, p.maturityDate, null);
  const ultimaCedola = scadute.length ? scadute[scadute.length-1] : anchorDate;
  const prossimaCedolaDate = new Date(ultimaCedola);
  prossimaCedolaDate.setMonth(prossimaCedolaDate.getMonth() + freqObj.months);
  const inizioPeriodo = new Date(ultimaCedola);
  const giorniPeriodo = (prossimaCedolaDate - inizioPeriodo) / 86400000;
  const giorniTrascorsi = (now - inizioPeriodo) / 86400000;
  if (!(giorniPeriodo > 0) || giorniTrascorsi < 0) return null;
  const cedolaPeriodo = p.amount * rate/100 * freqObj.months/12;
  const rateo = cedolaPeriodo * Math.min(1, giorniTrascorsi/giorniPeriodo);
  return { rateo, valuta: p.currency, dataUltimaCedola: ultimaCedola, dataProssimaCedola: localDateStr(prossimaCedolaDate),
    giorniTrascorsi: Math.floor(giorniTrascorsi), giorniPeriodo: Math.round(giorniPeriodo) };
}
// Registra una singola cedola/interesse alla data indicata.
function emettiCedola(p, dateStr, isBondCoupon, freqObj) {
    const nominal = p.amount;
    const rate = isBondCoupon ? (Number(p.couponRate)||0) : (Number(p.depositRate)||0);
    const paymentsPerYear = 12 / freqObj.months;
    const grossAmt = nominal * rate/100 / paymentsPerYear;
    const taxRate = isBondCoupon ? (Number(p.bondTaxRate)||15) : (Number(p.depositTaxRate)||15);
    const taxAmt = grossAmt * taxRate/100;
    const commAmt = isBondCoupon ? computeCommissionAmount(p.couponCommissionType, p.couponCommissionValue, grossAmt) : 0;
    const cat = isBondCoupon ? "Cedola" : "Interesse deposito";
    const taxCat = isBondCoupon ? ensureBondTaxCategory(p.bondYears, p.type) : ensureDepositTaxCategory(p.depositYears);
    const code = p.securityCode || "";
    const incId = uid();
    data.income.push({ id: incId, date: dateStr, amount: grossAmt, currency: p.currency, category: cat, macro: "Interessi da Titoli - Standard", paymentType: null, note: code, linkedBondId: p.id, securityCode: code||null });

    const bankAccount = bankAccountForCurrency(p.currency);
    const netToCurrencyBank = grossAmt - commAmt;
    createLiquidityAdjustment(bankAccount, netToCurrencyBank, dateStr, `${cat} netta ${code}`.trim(), incId);

    if (p.currency === "ALL") {
      const taxExpId = uid();
      data.expenses.push({ id: taxExpId, date: dateStr, amount: taxAmt, category: taxCat, macro: "Tassazione da Titoli - Standard", note: code, linkedBondId: p.id, securityCode: code||null, linkedIncomeId: incId });
      // La ritenuta esce davvero dal conto: senza questo la liquidità risulta
      // gonfiata dell'importo della tassa a ogni cedola.
      createLiquidityAdjustment(bankAccount, -taxAmt, dateStr, `Tassazione ${cat} ${code}`.trim(), taxExpId);
    } else {
      const fxInfo = getFxRateForDateDetailed(dateStr, p.currency);
      const taxAmtALL = taxAmt * fxInfo.rate;
      const taxExpId = uid();
      data.expenses.push({ id: taxExpId, date: dateStr, amount: taxAmtALL, category: taxCat, macro: "Tassazione da Titoli - Standard", note: `${code} (${fmt(taxAmt)} ${p.currency} al cambio ${fxInfo.rate})`.trim(),
        linkedBondId: p.id, securityCode: code||null, linkedIncomeId: incId, fxRateApprox: !fxInfo.exact, fxRateUsedDate: fxInfo.usedDate, fxOrigCurrency: p.currency, fxOrigAmount: taxAmt, fxTargetDate: dateStr });
      createLiquidityAdjustment("Banca", -taxAmtALL, dateStr, `Tassazione ${cat} ${code}`.trim(), taxExpId);
    }
    if (commAmt > 0) data.expenses.push({ id: uid(), date: dateStr, amount: commAmt, currency: p.currency, category: "Commissione disbursement cedola", note: code, linkedBondId: p.id, securityCode: code||null, linkedIncomeId: incId });
}

function addMonthsToDate(dateStr, n) {
  const d = new Date(dateStr);
  const targetMonthIdx = d.getMonth() + n;
  const daysInTarget = new Date(d.getFullYear(), targetMonthIdx+1, 0).getDate();
  return localDateStr(new Date(d.getFullYear(), targetMonthIdx, Math.min(d.getDate(), daysInTarget)));
}
function computeLoanSchedule(principal, annualRatePct, termMonths, method, firstDueDate) {
  const r = (annualRatePct||0)/100/12;
  const schedule = [];
  let balance = principal;
  if (method === "italiana") {
    const capitalPerMonth = principal / termMonths;
    for (let i=1; i<=termMonths; i++) {
      const interest = balance * r;
      let capital = (i===termMonths) ? balance : capitalPerMonth;
      balance -= capital;
      schedule.push({ month:i, capital, interest, dueDate: addMonthsToDate(firstDueDate, i-1), processed:false });
    }
  } else {
    const payment = r>0 ? principal*r/(1-Math.pow(1+r,-termMonths)) : principal/termMonths;
    for (let i=1; i<=termMonths; i++) {
      const interest = balance*r;
      let capital = payment-interest;
      if (i===termMonths || capital>balance) capital = balance;
      balance -= capital;
      schedule.push({ month:i, capital, interest, dueDate: addMonthsToDate(firstDueDate, i-1), processed:false });
    }
  }
  return schedule;
}
function processLoanInstallments() {
  let changed = false;
  data.portfolio.forEach(p => {
    if (!p.schedule || isCreditCardType(p.type) || !isDebtType(p.type, p.macro)) return;
    p.schedule.forEach(inst => {
      if (inst.processed) return;
      if (!canGenerateOnDate(inst.dueDate)) return;
      const payId = uid();
      createLiquidityAdjustment(p.type, inst.capital, inst.dueDate, `Rata prestito: capitale`, payId);
      createLiquidityAdjustment("Banca", -(inst.capital+inst.interest), inst.dueDate, `Rata prestito ${p.type}`, payId+"-bank");
      if (inst.interest > 0.005) {
        const cat = p.primaCasa ? "Interessi MPC" : "Interessi prestiti";
        const macroInteresse = p.primaCasa ? "Interessi da Mutuo Prima Casa" : "Interessi da Debiti";
        if (!data.categories.expenses.includes(cat)) data.categories.expenses.push(cat);
        data.expenses.push({ id: uid(), date: inst.dueDate, amount: inst.interest, category: cat, macro: macroInteresse, paymentType: null, note: `${p.type} · rata`, linkedBondId: p.id, securityCode: p.securityCode||null, issuerName: p.issuerName||"" });
      }
      inst.processed = true;
      changed = true;
    });
  });
  if (changed) saveData();
}

function processCreditCardBilling() {
  let changed = false;
  Object.keys(data.creditCardSettings||{}).forEach(cardName => {
    const cc = data.creditCardSettings[cardName];
    if (!cc || !cc.dueDay) return;
    const prevMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const billingMonthStr = localMonthStr(prevMonthDate);
    const alreadyBilled = (data.creditCardDebts||[]).some(d => d.paymentType===cardName && d.billingMonth===billingMonthStr);
    if (alreadyBilled) return;
    const daysInThisMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const dueDateThisMonth = new Date(now.getFullYear(), now.getMonth(), Math.min(cc.dueDay, daysInThisMonth));
    if (now < dueDateThisMonth) return;
    const stillOwed = Math.max(0, -data.portfolio.filter(p=>p.type===cardName && p.date && p.date.slice(0,7)===billingMonthStr).reduce((s,p)=>s+p.amount,0));
    if (stillOwed <= 0) return;
    const n = Math.max(1, cc.installments || 1);
    const rMonthly = (cc.interestRate||0)/100/12;
    let payment = rMonthly > 0 ? stillOwed * rMonthly / (1 - Math.pow(1+rMonthly, -n)) : stillOwed/n;
    let balance = stillOwed;
    const schedule = [];
    let totalInterest = 0;
    for (let i=1; i<=n; i++) {
      const interest = balance * rMonthly;
      let capital = payment - interest;
      if (i === n || capital > balance) capital = balance;
      balance -= capital;
      totalInterest += interest;
      const targetMonthIdx = now.getMonth() + i;
      const daysInTarget = new Date(now.getFullYear(), targetMonthIdx+1, 0).getDate();
      const dueDate = new Date(now.getFullYear(), targetMonthIdx, Math.min(cc.dueDay, daysInTarget));
      schedule.push({ dueDate: localDateStr(dueDate), capital, interest });
    }
    const billingDate = localDateStr(dueDateThisMonth);
    if (totalInterest > 0.005) {
      createLiquidityAdjustment(cardName, -totalInterest, billingDate, `Interessi su utilizzo non ripagato (${billingMonthStr})`, uid());
      const interestCat = "Interessi carta di credito";
      if (!data.categories.expenses.includes(interestCat)) data.categories.expenses.push(interestCat);
      data.expenses.push({ id: uid(), date: billingDate, amount: totalInterest, category: interestCat, macro: "Interessi da Debiti", paymentType: null, note: `${cardName} · utilizzo ${billingMonthStr} non ripagato`, securityCode: cc.securityCode||null, issuerName: cc.bank||"" });
    }
    data.creditCardDebts = data.creditCardDebts || [];
    data.creditCardDebts.push({ id: uid(), paymentType: cardName, billingMonth: billingMonthStr, principal: stillOwed, totalInterest, schedule });
    changed = true;
  });
  if (changed) saveData();
}
