<script>
// ---------- Constants ----------
const thisYearNum = new Date().getFullYear();
const STORE_KEY = "fiTrackerData_v1";
const DEFAULT_CATEGORIES = {
  income: ["Reddito principale","Interessi","Altro"],
  expenses: ["Palestra","Assicurazione auto","Tasse auto","Caffè ufficio","Bar","Acqua","Luce","Telefono","Riparazioni auto","Tagliando auto","Supermercato","Gite/concerti","Vestiti","Vacanze","Ristoranti/uscite","Arredamento casa","Auto (acquisto)","Altro"],
  portfolio: ["Fondo pensione","Obbligazione statale 7Y","Obbligazione statale 10Y","Obbligazione statale 15Y","Obbligazione statale 20Y","Deposito","Fondo azionario","Altro"]
};
const DEFAULT_DATA = {
  settings: { fx: 93.5, savingsRateTarget: 70, expenseGrowth: 75000, incomeGrowth2y: 70000, centralRet: 2, horizon: 20, expenseBase: 1160000, startYear: thisYearNum, pinHash: null, planBaselineYear: null, planBaselineSetDate: null, hfToken: "", hfModel: "Qwen/Qwen2-VL-7B-Instruct" },
  income: [],
  expenses: [],
  portfolio: [],
  categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
  categoryBudgets: { income: {}, expenses: {}, portfolio: {} },
  recurring: { income: [], expenses: [], portfolio: [] },
  snapshots: [],
  fxHistory: []
};

// ---------- Storage ----------
function loadData() {
  const base = JSON.parse(JSON.stringify(DEFAULT_DATA));
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return base;
    const parsed = JSON.parse(raw);
    return {
      settings: Object.assign({}, base.settings, parsed.settings || {}),
      income: parsed.income || [],
      expenses: parsed.expenses || [],
      portfolio: parsed.portfolio || [],
      categories: {
        income: (parsed.categories && parsed.categories.income) || base.categories.income,
        expenses: (parsed.categories && parsed.categories.expenses) || base.categories.expenses,
        portfolio: (parsed.categories && parsed.categories.portfolio) || base.categories.portfolio
      },
      categoryBudgets: {
        income: (parsed.categoryBudgets && parsed.categoryBudgets.income) || {},
        expenses: (parsed.categoryBudgets && parsed.categoryBudgets.expenses) || {},
        portfolio: (parsed.categoryBudgets && parsed.categoryBudgets.portfolio) || {}
      },
      recurring: {
        income: (parsed.recurring && parsed.recurring.income) || [],
        expenses: (parsed.recurring && parsed.recurring.expenses) || [],
        portfolio: (parsed.recurring && parsed.recurring.portfolio) || []
      },
      snapshots: parsed.snapshots || [],
      fxHistory: parsed.fxHistory || []
    };
  } catch (e) { return base; }
}
function saveData() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); scheduleAutoUpload(); }
function persistLocalOnly() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
let autoUploadTimer = null;
function scheduleAutoUpload() {
  if (!gDriveToken) return;
  clearTimeout(autoUploadTimer);
  autoUploadTimer = setTimeout(()=> silentUploadToDrive(), 2500);
}
let data = loadData();

const fmt = n => Math.round(n).toLocaleString("it-IT");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const thisYear = thisYearNum;
const todayISO = new Date().toISOString().slice(0,10);
const thisMonth = todayISO.slice(0,7);
const now = new Date();
const lastMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
const lastMonthStr = lastMonthDate.toISOString().slice(0,7);
const lastYear = thisYear - 1;

// ---------- Totals ----------
function yearTotal(arr, year) { return arr.filter(e => new Date(e.date).getFullYear() === year).reduce((s,e)=>s+Number(e.amount),0); }
function monthTotal(arr, monthStr) { return arr.filter(e => e.date.slice(0,7) === monthStr).reduce((s,e)=>s+Number(e.amount),0); }
function dayTotal(arr, dayStr) { return arr.filter(e => e.date === dayStr).reduce((s,e)=>s+Number(e.amount),0); }
function portfolioTotalALL() { return data.portfolio.reduce((s,p)=> s + ((p.marketValue!==undefined && p.marketValue!==null && p.marketValue!=="") ? Number(p.marketValue) : p.amount) * (p.currency === "EUR" ? data.settings.fx : 1), 0); }
function annualBudgetForYear(y) { const s = data.settings; return s.expenseBase + s.expenseGrowth * (y - s.startYear); }

function normalizedEntries(group, catName) {
  if (group === "portfolio") {
    return data.portfolio.filter(p => p.type === catName && p.date).map(p => ({ date: p.date, amount: p.amount * (p.currency === "EUR" ? data.settings.fx : 1) }));
  }
  return data[group].filter(e => e.category === catName).map(e => ({ date: e.date, amount: Number(e.amount) }));
}
function sumForDate(entries, d) { return entries.filter(e => e.date === d).reduce((s,e)=>s+e.amount,0); }
function sumForMonth(entries, m) { return entries.filter(e => e.date.slice(0,7) === m).reduce((s,e)=>s+e.amount,0); }
function sumForYear(entries, y) { return entries.filter(e => new Date(e.date).getFullYear() === y).reduce((s,e)=>s+e.amount,0); }

function usageCounts(group) {
  const counts = {};
  const arr = group === "portfolio" ? data.portfolio.map(p=>p.type) : data[group].map(e=>e.category);
  arr.forEach(c => counts[c] = (counts[c]||0)+1);
  return counts;
}

const FREQUENCIES = [
  {key:"monthly", label:"Mensile", months:1},
  {key:"quarterly", label:"Trimestrale", months:3},
  {key:"semiannual", label:"Semestrale", months:6},
  {key:"annual", label:"Annuale", months:12},
  {key:"biennial", label:"Biennale", months:24}
];
function freqLabel(key) { return (FREQUENCIES.find(f=>f.key===key)||FREQUENCIES[0]).label; }
function shouldGenerateForMonth(rule, year, month) {
  const freq = FREQUENCIES.find(f=>f.key===(rule.frequency||"monthly")) || FREQUENCIES[0];
  const start = rule.startMonth || thisMonth;
  const [sy, sm] = start.split("-").map(Number);
  const monthsSinceStart = (year - sy)*12 + (month - sm);
  return monthsSinceStart >= 0 && monthsSinceStart % freq.months === 0;
}
function shouldGenerateThisMonth(rule) {
  return shouldGenerateForMonth(rule, thisYearNum, now.getMonth()+1);
}

function generateSnapshot() {
  const exists = data.snapshots.some(s => s.date.slice(0,7) === thisMonth);
  if (!exists) {
    data.snapshots.push({ id: uid(), date: todayISO, wealth: portfolioTotalALL() });
    saveData();
  }
}

async function hashPin(pin) {
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function lastEntryDate() {
  const dates = [
    ...data.income.map(e=>e.date),
    ...data.expenses.map(e=>e.date),
    ...data.portfolio.filter(p=>p.date).map(p=>p.date)
  ].filter(Boolean).sort();
  return dates.length ? dates[dates.length-1] : null;
}

// ---------- Recurring ----------
function generateRecurring() {
  let changed = false;
  ["income","expenses"].forEach(group => {
    (data.recurring[group]||[]).forEach(rule => {
      if (!shouldGenerateThisMonth(rule)) return;
      const already = data[group].some(e => e.recurringId === rule.id && e.date.slice(0,7) === thisMonth);
      if (!already) {
        const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
        const day = Math.min(rule.dayOfMonth || 1, daysInMonth);
        const dateStr = `${thisMonth}-${String(day).padStart(2,"0")}`;
        if (new Date(dateStr) <= now) {
          data[group].push({ id: uid(), date: dateStr, amount: rule.amount, category: rule.category, note: rule.note||"", recurringId: rule.id });
          changed = true;
        }
      }
    });
  });
  (data.recurring.portfolio||[]).forEach(rule => {
    if (!shouldGenerateThisMonth(rule)) return;
    const already = data.portfolio.some(p => p.recurringId === rule.id && p.date && p.date.slice(0,7) === thisMonth);
    if (!already) {
      const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      const day = Math.min(rule.dayOfMonth || 1, daysInMonth);
      const dateStr = `${thisMonth}-${String(day).padStart(2,"0")}`;
      if (new Date(dateStr) <= now) {
        data.portfolio.push({ id: uid(), type: rule.type, amount: rule.amount, currency: rule.currency||"ALL", marketValue: null, date: dateStr, maturityDate: null, note: rule.note||"", recurringId: rule.id });
        changed = true;
      }
    }
  });
  if (changed) saveData();
}

// ---------- FI projection ----------
function project(wealth0, income0, savingsRate, expense0, expenseGrowth, incomeGrowth2y, ret, horizon) {
  const rows = []; let wealth = wealth0; let income = income0; let hitYear = null;
  for (let y=1; y<=horizon; y++) {
    if (y>1 && (y-1)%2===0) income += incomeGrowth2y;
    const expense = expense0 + expenseGrowth*(y-1);
    const contribution = income * savingsRate;
    wealth = wealth*(1+ret) + contribution;
    const target = expense*25;
    if (!hitYear && wealth >= target) hitYear = y;
    rows.push({year:y, wealth, expense, target});
  }
  return {rows, hitYear};
}

let chartInstance = null;
let categoryChartInstance = null;
let peaksChartInstance = null;
let editingRecurring = null; // {group, id}

function freqSelect(selected) {
  return `<select name="frequency">${FREQUENCIES.map(f=>`<option value="${f.key}" ${f.key===(selected||"monthly")?'selected':''}>${f.label}</option>`).join('')}</select>`;
}

const MONTH_LABELS = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
function computeYearlyPeaks() {
  const monthlyBudget = annualBudgetForYear(thisYear)/12;
  const recurringRules = data.recurring.expenses || [];
  const avgRecurring = recurringRules.reduce((sum,r)=> sum + Number(r.amount) / (FREQUENCIES.find(f=>f.key===(r.frequency||"monthly"))||FREQUENCIES[0]).months, 0);
  const baseMonthly = Math.max(0, monthlyBudget - avgRecurring);
  const months = [];
  for (let m=1; m<=12; m++) {
    const hit = recurringRules.filter(r=>shouldGenerateForMonth(r, thisYear, m)).reduce((sum,r)=>sum+Number(r.amount),0);
    const monthStr = `${thisYear}-${String(m).padStart(2,"0")}`;
    const actual = monthTotal(data.expenses, monthStr);
    months.push({ m, label: MONTH_LABELS[m-1], base: baseMonthly, recurring: hit, projected: baseMonthly+hit, actual });
  }
  return months;
}

function barColor(pct) { return pct <= 80 ? "#3F6E5E" : pct <= 100 ? "#C9A227" : "#8B3A2F"; }
function budgetBlock(label, spent, budget) {
  const pct = budget > 0 ? (spent/budget*100) : 0;
  return `<div class="budget-block">
    <div class="budget-head"><span class="l">${label}</span><span>${fmt(spent)} / ${fmt(budget)} ALL</span></div>
    <div class="bar-bg"><div class="bar-fg" style="width:${Math.min(pct,100)}%; background:${barColor(pct)};"></div></div>
  </div>`;
}

// ---------- Category select ----------
function categorySelect(groupKey, selected) {
  const counts = usageCounts(groupKey);
  const cats = [...data.categories[groupKey]].sort((a,b)=> (counts[b]||0)-(counts[a]||0));
  const opts = cats.map(c => `<option ${c===selected?'selected':''}>${c}</option>`).join('');
  return `<select class="cat-select" data-group="${groupKey}">${opts}<option value="__new__">+ Nuova categoria...</option></select>`;
}
function bindCategorySelects() {
  document.querySelectorAll(".cat-select").forEach(sel => {
    sel.addEventListener("change", () => {
      if (sel.value === "__new__") {
        const name = window.prompt("Nome nuova categoria:");
        if (name && name.trim()) {
          const g = sel.dataset.group;
          if (!data.categories[g].includes(name.trim())) { data.categories[g].push(name.trim()); saveData(); }
          const opt = document.createElement("option");
          opt.value = name.trim(); opt.textContent = name.trim();
          sel.insertBefore(opt, sel.lastElementChild);
          sel.value = name.trim();
        } else { sel.selectedIndex = 0; }
      }
    });
  });
}

// ---------- Streak ----------
function budgetStreak() {
  let streak = 0;
  let cursor = new Date(now.getFullYear(), now.getMonth()-1, 1); // start from last full month
  while (true) {
    const mStr = cursor.toISOString().slice(0,7);
    const actual = monthTotal(data.expenses, mStr);
    if (actual === 0) break; // no data that far back, stop counting
    const y = cursor.getFullYear();
    const budget = annualBudgetForYear(y) / 12;
    if (actual <= budget) { streak++; cursor.setMonth(cursor.getMonth()-1); }
    else break;
  }
  return streak;
}

function extractAmountFromText(text) {
  const lines = text.split(/\n/);
  const priceRe = /(\d{1,3}(?:[.\s]\d{3})*|\d+)[,.](\d{2})\b|\b\d{2,7}\b/g;
  let candidates = [];
  lines.forEach(line => {
    const isTotalLine = /total|totale|shuma|paguar/i.test(line);
    const matches = line.match(/[\d.,]{2,}/g) || [];
    matches.forEach(m => {
      const val = parseFlexibleAmount(m);
      if (!isNaN(val) && val > 0) candidates.push({ val, isTotalLine });
    });
  });
  if (candidates.length === 0) return null;
  const totalLineCandidates = candidates.filter(c=>c.isTotalLine);
  const pool = totalLineCandidates.length ? totalLineCandidates : candidates;
  return pool.reduce((max,c)=> c.val > max.val ? c : max, pool[0]).val;
}
function extractDateFromText(text) {
  const m = text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (!m) return null;
  let [_, d, mo, y] = m;
  if (y.length === 2) y = "20"+y;
  const dateStr = `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const parsed = new Date(dateStr);
  if (isNaN(parsed) || parsed > new Date()) return null;
  return dateStr;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function compressImageToBase64(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL("image/jpeg", quality || 0.7);
      resolve(dataUrl.split(",")[1]);
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function analyzeReceiptWithAI(file) {
  const s = data.settings;
  if (!s.hfToken) throw new Error("no token");
  const base64 = await compressImageToBase64(file, 1024, 0.7);
  const mimeType = "image/jpeg";
  const prompt = `Leggi questo scontrino/ricevuta. Rispondi SOLO con un oggetto JSON valido, senza testo aggiuntivo, markdown o spiegazioni, in questo formato esatto: {"amount": numero, "date": "YYYY-MM-DD", "category": "una parola tra Supermercato, Ristoranti, Bar, Trasporti, Salute, Abbigliamento, Casa, Altro"}. Se non riesci a leggere un campo, usa null per quel campo.`;
  const res = await fetch("https://router.huggingface.co/v1/chat/completions", {
    method: "POST",
    headers: { Authorization: `Bearer ${s.hfToken}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      model: s.hfModel || "Qwen/Qwen2-VL-7B-Instruct",
      messages: [{
        role: "user",
        content: [
          { type: "text", text: prompt },
          { type: "image_url", image_url: { url: `data:${mimeType};base64,${base64}` } }
        ]
      }],
      max_tokens: 200
    })
  });
  if (!res.ok) { const bodyText = await res.text(); throw new Error(`HTTP ${res.status}: ${bodyText}`); }
  const json = await res.json();
  let text = json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
  if (!text) throw new Error("empty response");
  text = text.trim().replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
  const parsed = JSON.parse(text);
  return {
    amount: parsed.amount ? Number(parsed.amount) : null,
    date: parsed.date && /^\d{4}-\d{2}-\d{2}$/.test(parsed.date) ? parsed.date : null,
    category: parsed.category || null
  };
}

    lastReceiptFile = file;
    const statusEl = document.getElementById("ocrStatus");
    const form = document.getElementById("expenseForm");

    if (data.settings.hfToken) {
      statusEl.textContent = "Lettura scontrino con AI in corso… (può metterci 20-30 secondi se il modello era in stand-by)";
      try {
        const suggestion = await analyzeReceiptWithAI(file);
        if (suggestion.amount) form.querySelector('[name="amount"]').value = suggestion.amount;
        if (suggestion.date) form.querySelector('[name="date"]').value = suggestion.date;
        if (suggestion.category) {
          const catSelect = form.querySelector(".cat-select");
          const match = [...catSelect.options].find(o => o.value.toLowerCase() === suggestion.category.toLowerCase());
          if (match) catSelect.value = match.value;
        }
        if (suggestion.amount || suggestion.date) {
          statusEl.textContent = `AI: importo ${suggestion.amount?fmt(suggestion.amount)+' ALL':'?'} · data ${suggestion.date||'?'} · categoria "${suggestion.category||'?'}" — controlla prima di salvare.`;
          const aiBtn = document.getElementById("aiRetryBtn");
          if (aiBtn) aiBtn.style.display = "none";
          return;
        }
        statusEl.textContent = "L'AI non ha trovato importo/data. Provo con l'OCR di riserva…";
      } catch (err) {
        statusEl.textContent = "AI non disponibile (" + String(err.message||err).slice(0,80) + "), provo con l'OCR di riserva…";
      }
    }

    statusEl.textContent = "Lettura scontrino in corso… (la prima volta scarica il motore OCR, può richiedere qualche secondo)";
    try {
      const result = await Tesseract.recognize(file, "ita+eng", {
        logger: m => { if (m.status === "recognizing text") statusEl.textContent = `Lettura in corso… ${Math.round(m.progress*100)}%`; }
      });
      const text = result.data.text;
      const amount = extractAmountFromText(text);
      const dateFound = extractDateFromText(text);
      if (amount) form.querySelector('[name="amount"]').value = amount;
      if (dateFound) form.querySelector('[name="date"]').value = dateFound;
      statusEl.textContent = amount || dateFound
        ? `Rilevato${amount?' importo: '+fmt(amount)+' ALL':''}${dateFound?' · data: '+dateFound:''} — controlla e correggi prima di salvare.`
        : "Non sono riuscito a leggere importo/data automaticamente. Inseriscili manualmente.";
      const aiBtn = document.getElementById("aiRetryBtn");
      if (aiBtn) aiBtn.style.display = "inline-block";
    } catch (err) {
      statusEl.textContent = "Errore nella lettura dello scontrino. Inserisci manualmente.";
    }
  });

  const aiRetryBtn = document.getElementById("aiRetryBtn");
  if (aiRetryBtn) aiRetryBtn.addEventListener("click", async ()=>{
    if (!lastReceiptFile) return;
    const statusEl = document.getElementById("ocrStatus");
    statusEl.textContent = "Analisi con AI in corso… (il modello gratuito può metterci 20-30 secondi se era in stand-by)";
    try {
      const suggestion = await analyzeReceiptWithAI(lastReceiptFile);
      const form = document.getElementById("expenseForm");

    btn.addEventListener("click", ()=>{ data.expenses = data.expenses.filter(e=>e.id!==btn.dataset.delExpense); saveData(); renderExpenses(); });

  if (allCats.length>0) {

          { label:'Questo mese', data: allCats.map(c=>catsThisMonth[c]||0), backgroundColor:'#C9A227' }

function computeWeightedDuration() {
  const items = data.portfolio.filter(p => p.maturityDate);
  if (items.length === 0) return null;
  let weightSum = 0, weightedYears = 0;
  items.forEach(p => {
    const mv = ((p.marketValue!==undefined && p.marketValue!==null && p.marketValue!=="") ? Number(p.marketValue) : p.amount) * (p.currency==="EUR"?data.settings.fx:1);
    const years = Math.max(0,(new Date(p.maturityDate) - now) / (365.25*86400000));
    weightSum += mv; weightedYears += mv*years;
  });
  return weightSum > 0 ? weightedYears/weightSum : null;
}

function renderBudgetGroupCard(groupKey, title) {
  const budgets = data.categoryBudgets[groupKey] || {};
  const cats = Object.keys(budgets).filter(c => budgets[c] > 0 && data.categories[groupKey].includes(c));
  if (cats.length === 0) {
    return `<div class="card"><h3>${title}</h3><div class="empty">Nessun budget impostato. Vai in Assunzioni → Gestisci categorie per assegnarne uno a ciascuna voce.</div></div>`;
  }
  const blocks = cats.map(c => {
    const annual = budgets[c];
    const monthly = annual / 12;
    const daily = annual / 365;
    const entries = normalizedEntries(groupKey, c);
    const actualDay = sumForDate(entries, todayISO);
    const actualMonth = sumForMonth(entries, thisMonth);
    const actualYear = sumForYear(entries, thisYear);
    return `<div style="margin-bottom:18px;">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:13px; color:#EDE6D6; margin-bottom:8px;">${c}</div>
      ${budgetBlock("Oggi", actualDay, daily)}
      ${budgetBlock("Mese", actualMonth, monthly)}
      ${budgetBlock("Anno", actualYear, annual)}
    </div>`;
  }).join('');
  return `<div class="card"><h3>${title}</h3>${blocks}</div>`;
}

let csvImportState = null;

function parseCSV(text) {
  const firstLine = text.split(/\r?\n/)[0] || "";
  const delimiter = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  return lines.map(line => splitCSVLine(line, delimiter));
}
function splitCSVLine(line, delim) {
  const result = []; let cur = ''; let inQuotes = false;
  for (let i=0;i<line.length;i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; continue; }
    if (ch === delim && !inQuotes) { result.push(cur.trim()); cur=''; continue; }
    cur += ch;
  }
  result.push(cur.trim());
  return result;
}
function parseFlexibleDate(str) {
  if (!str) return null;
  str = str.trim();
  let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if (m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  return null;
}
function parseFlexibleAmount(str) {
  if (str===undefined || str===null) return NaN;
  str = String(str).trim().replace(/[^\d,.\-]/g,'');
  if (str.includes(',') && str.includes('.')) {
    if (str.lastIndexOf(',') > str.lastIndexOf('.')) str = str.replace(/\./g,'').replace(',', '.');
    else str = str.replace(/,/g,'');
  } else if (str.includes(',')) {
    str = str.replace(',', '.');
  }
  return Number(str);
}
function handleCsvFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const rows = parseCSV(e.target.result);
    if (rows.length < 2) { alert("File CSV vuoto o non valido."); return; }
    const headers = rows[0];
    const dataRows = rows.slice(1).filter(r => r.some(c=>c && c.trim()!==""));
    csvImportState = { headers, dataRows, group:"expenses", category: data.categories.expenses[0]||"Altro", dateColIdx:0, amountColIdx: headers.length>1?1:0, noteColIdx:-1 };
    renderSettings();
  };
  reader.readAsText(file);
}
function confirmCsvImport() {
  const st = csvImportState;
  if (!st) return;
  let imported = 0, skipped = 0;
  const batchId = uid();
  st.dataRows.forEach(row => {
    const date = parseFlexibleDate(row[st.dateColIdx]);
    const amount = parseFlexibleAmount(row[st.amountColIdx]);
    if (!date || isNaN(amount) || amount===0) { skipped++; return; }
    const note = st.noteColIdx>=0 ? (row[st.noteColIdx]||"") : "";
    data[st.group].push({ id: uid(), date, amount: Math.abs(amount), category: st.category, note, importBatch: batchId });
    imported++;
  });
  saveData();
  csvImportState = null;
  alert(`Importate ${imported} voci. Righe ignorate (data/importo non validi): ${skipped}.`);
  renderSettings();
}
function csvImportBlock() {
  if (!csvImportState) {
    return `<div style="margin-bottom:18px;">
      <label>Importa estratto conto (CSV)</label>
      <div class="subtle">Scarica il CSV dei movimenti dalla tua banca e caricalo qui per inserire più voci in una volta, invece che una a una.</div>
      <input type="file" id="csvFileInput" accept=".csv,text/csv">
    </div>`;
  }
  const st = csvImportState;
  const colOptions = (selectedIdx) => st.headers.map((h,i)=>`<option value="${i}" ${i===selectedIdx?'selected':''}>${h||'Colonna '+(i+1)}</option>`).join('');
  const noteOptions = `<option value="-1" ${st.noteColIdx===-1?'selected':''}>Nessuna</option>` + colOptions(st.noteColIdx>=0?st.noteColIdx:-999);
  return `<div style="margin-bottom:18px;">
    <label>Importa estratto conto (CSV)</label>
    <div class="subtle">${st.dataRows.length} righe trovate. Configura la mappatura, poi conferma.</div>
    <div class="row2">
      <div><label>Tipo</label><select id="csvGroupSelect"><option value="expenses" ${st.group==='expenses'?'selected':''}>Spese</option><option value="income" ${st.group==='income'?'selected':''}>Reddito</option></select></div>
      <div><label>Categoria da assegnare</label><select id="csvCategorySelect">${data.categories[st.group].map(c=>`<option ${c===st.category?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div><label>Colonna data</label><select id="csvDateCol">${colOptions(st.dateColIdx)}</select></div>
      <div><label>Colonna importo</label><select id="csvAmountCol">${colOptions(st.amountColIdx)}</select></div>
    </div>
    <div><label>Colonna nota (opzionale)</label><select id="csvNoteCol">${noteOptions}</select></div>
    <div class="subtle" style="margin-top:8px;">Anteprima prima riga: ${st.dataRows[0] ? st.dataRows[0].join(' | ') : ''}</div>
    <div class="row2" style="margin-top:10px;">
      <button class="primary" type="button" id="csvConfirmBtn">Importa ${st.dataRows.length} righe</button>
      <button class="secondary" type="button" id="csvCancelBtn">Annulla</button>
    </div>
  </div>`;
}

// ---------- Google Drive sync ----------
const GOOGLE_CLIENT_ID = "270840494208-cumofp8s8od3ov1436913811ms7f0nut.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_FILENAME = "fi-tracker-backup.json";
let gDriveToken = null;
let gTokenClient = null;

function saveTokenToSession(token, expiresInSec) {
  try {
    sessionStorage.setItem("gdrive_token", token);
    sessionStorage.setItem("gdrive_token_exp", String(Date.now() + (expiresInSec||3500)*1000));
  } catch(e) {}
}
function loadTokenFromSession() {
  try {
    const token = sessionStorage.getItem("gdrive_token");
    const exp = Number(sessionStorage.getItem("gdrive_token_exp")||0);
    if (token && exp > Date.now()) return token;
  } catch(e) {}
  return null;
}
function clearDriveToken() {
  gDriveToken = null;
  try { sessionStorage.removeItem("gdrive_token"); sessionStorage.removeItem("gdrive_token_exp"); } catch(e) {}
}

function initGoogleClient() {
  if (!window.google || !google.accounts || gTokenClient) return;
  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp && resp.access_token) {
        gDriveToken = resp.access_token;
        saveTokenToSession(resp.access_token, resp.expires_in);
        updateSyncBadge();
        if (document.getElementById("driveStatus")) renderDrive();
      }
    }
  });
}
function connectGoogleDrive() {
  if (!window.google || !google.accounts) { alert("Google non è ancora pronto, riprova tra un secondo."); return; }
  if (!gTokenClient) initGoogleClient();
  gTokenClient.requestAccessToken();
}
async function findDriveFileId() {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name%3D%27${DRIVE_FILENAME}%27+and+trashed%3Dfalse&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${gDriveToken}` }
  });
  if (res.status === 401) { clearDriveToken(); updateSyncBadge(); throw new Error("token expired"); }
  const json = await res.json();
  return (json.files && json.files[0]) ? json.files[0].id : null;
}
async function doDriveUpload() {
  const fileId = await findDriveFileId();
  const metadata = { name: DRIVE_FILENAME, mimeType: "application/json" };
  const content = JSON.stringify(data);
  const boundary = "-------fitracker";
  const multipartBody =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${fileId?"{}":JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const url = fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const res = await fetch(url, {
    method: fileId ? "PATCH" : "POST",
    headers: { Authorization: `Bearer ${gDriveToken}`, "Content-Type": `multipart/related; boundary=${boundary}` },
    body: multipartBody
  });
  if (res.status === 401) { clearDriveToken(); updateSyncBadge(); throw new Error("token expired"); }
  if (!res.ok) throw new Error(await res.text());
}
async function uploadToDrive() {
  if (!gDriveToken) { alert("Connetti prima Google Drive."); return; }
  const statusEl = document.getElementById("driveStatus");
  if (statusEl) statusEl.textContent = "Caricamento in corso...";
  try {
    await doDriveUpload();
    data.settings.lastDriveSync = new Date().toISOString();
    persistLocalOnly();
    if (statusEl) statusEl.textContent = "Backup caricato su Google Drive.";
    updateSyncBadge();
  } catch (err) {
    if (statusEl) statusEl.textContent = gDriveToken ? "Errore nel caricamento su Drive. Riprova." : "Sessione scaduta, riconnetti.";
  }
}
async function silentUploadToDrive() {
  if (!gDriveToken) return;
  try {
    await doDriveUpload();
    data.settings.lastDriveSync = new Date().toISOString();
    persistLocalOnly();
    updateSyncBadge();
  } catch (err) { updateSyncBadge(); }
}
async function downloadFromDrive(silent) {
  if (!gDriveToken) { if (!silent) alert("Connetti prima Google Drive."); return; }
  const statusEl = document.getElementById("driveStatus");
  if (statusEl) statusEl.textContent = "Scaricamento in corso...";
  try {
    const fileId = await findDriveFileId();
    if (!fileId) { if (statusEl) statusEl.textContent = "Nessun backup trovato su Drive. Carica prima una volta."; return; }
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { Authorization: `Bearer ${gDriveToken}` }
    });
    if (res.status === 401) { clearDriveToken(); updateSyncBadge(); return; }
    const parsed = await res.json();
    data = {
      settings: Object.assign({}, DEFAULT_DATA.settings, parsed.settings||{}),
      income: parsed.income||[], expenses: parsed.expenses||[], portfolio: parsed.portfolio||[],
      categories: {
        income: (parsed.categories&&parsed.categories.income)||DEFAULT_CATEGORIES.income,
        expenses: (parsed.categories&&parsed.categories.expenses)||DEFAULT_CATEGORIES.expenses,
        portfolio: (parsed.categories&&parsed.categories.portfolio)||DEFAULT_CATEGORIES.portfolio
      },
      categoryBudgets: {
        income: (parsed.categoryBudgets&&parsed.categoryBudgets.income)||{},
        expenses: (parsed.categoryBudgets&&parsed.categoryBudgets.expenses)||{},
        portfolio: (parsed.categoryBudgets&&parsed.categoryBudgets.portfolio)||{}
      },
      recurring: {
        income: (parsed.recurring&&parsed.recurring.income)||[],
        expenses: (parsed.recurring&&parsed.recurring.expenses)||[],
        portfolio: (parsed.recurring&&parsed.recurring.portfolio)||[]
      },
      snapshots: parsed.snapshots||[],
      fxHistory: parsed.fxHistory||[]
    };
    persistLocalOnly();
    if (statusEl) statusEl.textContent = "Dati aggiornati da Google Drive.";
    updateSyncBadge();
    if (document.getElementById("driveStatus")) renderDrive();
    else if (document.querySelector("nav.tabs button.active[data-tab='dashboard']")) renderDashboard();
  } catch (err) {
    if (statusEl) statusEl.textContent = "Errore nello scaricamento da Drive.";
  }
}

function updateSyncBadge() {
  const el = document.getElementById("syncBadge");
  if (!el) return;
  if (!gDriveToken) { el.textContent = ""; return; }
  const s = data.settings;
  if (s.lastDriveSync) {
    const t = new Date(s.lastDriveSync);
    el.textContent = `· Drive sincronizzato ${t.toLocaleTimeString("it-IT",{hour:'2-digit',minute:'2-digit'})}`;
  } else {
    el.textContent = "· Drive connesso";
  }
}

    btn.addEventListener("click", ()=>{
      const [group, name] = btn.dataset.catdel.split("|");
      data.categories[group] = data.categories[group].filter(c=>c!==name);
      saveData(); renderSettings();
    });
  });
  document.querySelectorAll("[data-catbudget]").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const [group, name] = inp.dataset.catbudget.split("|");
      if (!data.categoryBudgets[group]) data.categoryBudgets[group] = {};
      data.categoryBudgets[group][name] = Number(inp.value) || 0;
      saveData();
    });
  });

  document.querySelectorAll("[data-recform]").forEach(form=>{
    form.addEventListener("submit", ev=>{
      ev.preventDefault();
      const group = form.dataset.recform;
      const f = new FormData(ev.target);
      const catValue = form.querySelector(".cat-select").value;
      let rule;
      if (group === "portfolio") {
        rule = { id: uid(), type: catValue, amount: Number(f.get("amount")), currency: f.get("currency")||"ALL", frequency: f.get("frequency")||"monthly", startMonth: f.get("startMonth")||thisMonth, dayOfMonth: Number(f.get("dayOfMonth"))||1, note: f.get("note")||"" };
      } else {
        rule = { id: uid(), category: catValue, amount: Number(f.get("amount")), frequency: f.get("frequency")||"monthly", startMonth: f.get("startMonth")||thisMonth, dayOfMonth: Number(f.get("dayOfMonth"))||1, note: f.get("note")||"" };
      }
      data.recurring[group].push(rule);
      saveData(); renderSettings();
    });
  });
  document.querySelectorAll("[data-recdel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [group, id] = btn.dataset.recdel.split("|");
      data.recurring[group] = data.recurring[group].filter(r=>r.id!==id);
      saveData(); renderSettings();
    });
  });

  document.querySelectorAll("[data-recedit-open]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [group, id] = btn.dataset.receditOpen.split("|");
      editingRecurring = { group, id };
      renderSettings();
    });
  });
  document.querySelectorAll("[data-recedit-cancel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingRecurring = null; renderSettings(); });
  });
  document.querySelectorAll("[data-recedit]").forEach(form=>{
    form.addEventListener("submit", ev=>{
      ev.preventDefault();
      const [group, id] = form.getAttribute("data-recedit").split("|");
      const f = new FormData(ev.target);
      const catValue = form.querySelector(".cat-select").value;
      const rule = data.recurring[group].find(r=>r.id===id);
      if (rule) {
        rule.amount = Number(f.get("amount"));
        rule.frequency = f.get("frequency")||"monthly";
        rule.dayOfMonth = Number(f.get("dayOfMonth"))||1;
        rule.startMonth = f.get("startMonth")||thisMonth;
        rule.note = f.get("note")||"";
        if (group === "portfolio") { rule.type = catValue; rule.currency = f.get("currency")||"ALL"; }
        else { rule.category = catValue; }
      }
      editingRecurring = null;
      saveData(); renderSettings();
    });
  });
}

const RENDERERS = { dashboard: renderDashboard, income: renderIncome, expenses: renderExpenses, portfolio: renderPortfolio, budget: renderBudget, drive: renderDrive, settings: renderSettings };
function switchTab(tab) {
  document.querySelectorAll("nav.tabs button").forEach(b=> b.classList.toggle("active", b.dataset.tab===tab));
  RENDERERS[tab]();
}
document.querySelectorAll("nav.tabs button").forEach(btn=>{ btn.addEventListener("click", ()=> switchTab(btn.dataset.tab)); });

async function tryUnlock() {
  const input = document.getElementById("lockPinInput");
  const val = input.value;
  const hash = await hashPin(val);
  if (hash === data.settings.pinHash) {
    document.getElementById("lockScreen").classList.remove("active");
    document.getElementById("app").style.display = "";
    switchTab("dashboard");
  } else {
    document.getElementById("lockError").textContent = "PIN errato, riprova.";
    input.value = "";
    input.focus();
  }
}

async function tryAutoResumeDrive() {
  const token = loadTokenFromSession();
  if (token) {
    gDriveToken = token;
    updateSyncBadge();
    await downloadFromDrive(true);
  }
}

window.addEventListener("load", ()=> setTimeout(initGoogleClient, 800));

if (data.settings.pinHash) {
  document.getElementById("app").style.display = "none";
  document.getElementById("lockScreen").classList.add("active");
  document.getElementById("lockSubmitBtn").addEventListener("click", async ()=>{ await tryUnlock(); tryAutoResumeDrive(); });
  document.getElementById("lockPinInput").addEventListener("keydown", e=>{ if (e.key==="Enter") document.getElementById("lockSubmitBtn").click(); });
} else {
  switchTab("dashboard");
  tryAutoResumeDrive();
}
</script>
