// --- Rendimento effettivo del portafoglio ----------------------------------
// Rendimento ponderato per il denaro (IRR annualizzato), calcolato sui flussi di
// cassa reali. Risponde a "quanto sto rendendo davvero", che con versamenti
// irregolari NON è la media dei rendimenti dei singoli strumenti.
function computePortfolioIRR() {
  const flows = [];
  data.portfolio.forEach(p => {
    if (isDebtType(p.type, p.macro) || isCreditCardType(p.type)) return;
    if (data.paymentTypes.includes(p.type)) return;
    if (!p.date) return;
    const invested = toALL(Number(p.amount), p.currency);
    if (!isFinite(invested) || invested === 0) return;
    flows.push({ date: p.date, amount: -invested });   // esborso
  });
  if (flows.length < 1) return null;
  const currentValue = data.portfolio.reduce((s,p) => {
    if (isDebtType(p.type, p.macro) || isCreditCardType(p.type)) return s;
    if (data.paymentTypes.includes(p.type)) return s;
    const v = toALL((p.marketValue!==undefined && p.marketValue!==null && p.marketValue!=="")
      ? Number(p.marketValue) : Number(p.amount), p.currency);
    return s + (isFinite(v) ? v : 0);
  }, 0);
  if (currentValue <= 0) return null;
  flows.push({ date: todayISO, amount: currentValue });

  const t0 = new Date(flows[0].date).getTime();
  const years = f => (new Date(f.date).getTime() - t0) / (365.25 * 86400000);
  const npv = rate => flows.reduce((s,f) => s + f.amount / Math.pow(1 + rate, years(f)), 0);

  // bisezione: robusta e sufficiente, evita la divergenza di Newton su flussi irregolari
  let lo = -0.95, hi = 5;
  if (npv(lo) * npv(hi) > 0) return null;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    if (npv(lo) * npv(mid) <= 0) hi = mid; else lo = mid;
  }
  const irr = (lo + hi) / 2;
  const totalInvested = flows.filter(f=>f.amount<0).reduce((s,f)=>s-f.amount,0);
  const spanYears = years(flows[flows.length-1]);
  return { irr, irrPct: irr*100, totalInvested, currentValue,
    gain: currentValue - totalInvested, spanYears,
    realIrrPct: ((1+irr)/(1+(data.settings.inflationPct!=null?data.settings.inflationPct:3)/100)-1)*100 };
}
function portfolioReturnCard() {
  const r = computePortfolioIRR();

  return `

      <div class="subtle">Rendimento annualizzato ponderato per il denaro (IRR): tiene conto di quanto hai versato e quando. Con versamenti irregolari è diverso dalla media dei singoli strumenti.</div>

const SCADENZE_ORIZZONTE_GIORNI = 90;

  const scadenze = [];
  const limite = new Date(now.getTime() + SCADENZE_ORIZZONTE_GIORNI*86400000);
  data.portfolio.forEach(p => {
    if (p.amount > 0 && p.maturityDate) {
      const d = new Date(p.maturityDate);
      if (d >= now && d <= limite) {
        const giorni = Math.round((d - now) / 86400000);
        scadenze.push({ tipo: p.type, nome: nomeStrumento(p), data: p.maturityDate, giorni,
          importo: toALL(Number(p.amount)||0, p.currency), categoria: "Scadenza" });

    if (isDebtType(p.type, p.macro) && !isCreditCardType(p.type) && Array.isArray(p.schedule)) {
      const prossima = p.schedule.find(i => !i.processed);
      if (prossima) {

// ---- Scadenzario dei flussi futuri e metriche di portafoglio obbligazionario ----

// Elenca cedole attese e capitali in scadenza nei prossimi mesi. Risponde alla
// domanda operativa "quando avrò liquidità da reinvestire e quanta".
function computeCashflowCalendar(monthsAhead) {
  const horizon = monthsAhead || 12;
  const today = new Date();
  const limit = new Date(today.getFullYear(), today.getMonth() + horizon, today.getDate());
  const flows = [];

  data.portfolio.forEach(p => {
    if (!p.amount || p.amount <= 0 || !p.type) return;
    const t = p.type.toLowerCase();
    const isBond = t.includes("obbligazione");
    const isDeposit = t.includes("deposito");
    if (!isBond && !isDeposit) return;

    const code = p.securityCode || p.note || p.type;
    const rate = Number(isBond ? p.couponRate : p.depositRate) || 0;
    const mode = isBond ? (p.bondMode || "cedola") : (p.depositMode || "cedola");
    const taxRate = Number(isBond ? p.bondTaxRate : p.depositTaxRate);
    const tax = isFinite(taxRate) ? taxRate : 15;

    // Cedole/interessi periodici, solo per i titoli che li pagano lungo la vita.
    if (mode !== "finale" && rate > 0) {
      const freqObj = FREQUENCIES.find(f => f.key === (p.couponFrequency || "annual")) || { months: 12 };
      const perYear = 12 / freqObj.months;
      const gross = p.amount * rate / 100 / perYear;
      const anchor = new Date(p.issueDate || p.date);
      const maturity = p.maturityDate ? new Date(p.maturityDate) : null;
      let d = new Date(anchor);
      // avanza fino al primo pagamento futuro
      let guard = 0;
      while (d <= today && guard++ < 600) d.setMonth(d.getMonth() + freqObj.months);
      while (d <= limit && guard++ < 600) {
        if (maturity && d > maturity) break;
        flows.push({ date: localDateStr(d), kind: "cedola",
          label: `${isBond ? "Cedola" : "Interesse"} ${code}`.trim(),
          gross, net: gross * (1 - tax/100), currency: p.currency, positionId: p.id });
        d = new Date(d); d.setMonth(d.getMonth() + freqObj.months);
      }
    }

    // Rimborso del capitale a scadenza.
    if (p.maturityDate) {
      const m = new Date(p.maturityDate);
      if (m > today && m <= limit) {
        let extraGross = 0;
        if (mode === "finale" && rate > 0) {
          const years = Number(isBond ? p.bondYears : p.depositYears) || 1;
          extraGross = p.amount * rate / 100 * years;
        }
        flows.push({ date: p.maturityDate, kind: "rimborso",
          label: `Rimborso ${code}`.trim(),
          gross: p.amount + extraGross,
          net: p.amount + extraGross * (1 - tax/100),
          currency: p.currency, positionId: p.id, isPrincipal: true });
      }
    }
  });

  flows.sort((a,b) => a.date.localeCompare(b.date));
  const totalNetALL = flows.reduce((s,f) => s + toALL(f.net, f.currency||"ALL"), 0);
  const principalALL = flows.filter(f => f.isPrincipal)
    .reduce((s,f) => s + toALL(f.net, f.currency||"ALL"), 0);
  const couponALL = totalNetALL - principalALL;

  // Raggruppa per mese, così la card resta leggibile.
  const byMonth = {};
  flows.forEach(f => {
    const k = f.date.slice(0,7);
    if (!byMonth[k]) byMonth[k] = { month: k, netALL: 0, items: [] };
    byMonth[k].netALL += toALL(f.net, f.currency||"ALL");
    byMonth[k].items.push(f);
  });
  return { flows, byMonth: Object.values(byMonth).sort((a,b)=>a.month.localeCompare(b.month)),
    totalNetALL, principalALL, couponALL, horizon };
}

// Rendimento e rischio dell'intero portafoglio obbligazionario, non del singolo titolo.
// La duration è la misura chiave: dice quanto perde il portafoglio se i tassi salgono.
function computeBondPortfolioMetrics() {
  const bonds = data.portfolio.filter(p =>
    p.type && p.type.toLowerCase().includes("obbligazione") && p.amount > 0 && p.maturityDate);
  if (!bonds.length) return null;
  const today = new Date();
  let totWeight = 0, wYtm = 0, wDur = 0, wLife = 0;
  const rows = [];

  bonds.forEach(p => {
    const residualYears = (new Date(p.maturityDate) - today) / (365.25*86400000);
    if (residualYears <= 0) return;
    const freqObj = FREQUENCIES.find(f => f.key === (p.couponFrequency||"annual")) || { months: 12 };
    const perYear = 12 / freqObj.months;
    const periods = residualYears * perYear;
    const couponRate = Number(p.couponRate) || 0;
    const purchasePrice = (p.purchasePrice != null) ? Number(p.purchasePrice) : 100;
    const redemptionPrice = (p.redemptionPrice != null) ? Number(p.redemptionPrice) : 100;
    const ytm = bondYTM(purchasePrice, redemptionPrice, couponRate, perYear, periods);
    if (ytm == null || !isFinite(ytm)) return;
    // bondDuration lavora su periodi semestrali e restituisce {macaulay, modified}.
    const durObj = bondDuration(100, couponRate, ytm, Math.max(1, Math.round(residualYears*2)));
    const dur = durObj && isFinite(durObj.modified) ? durObj.modified : null;
    const weight = toALL(p.amount, p.currency);
    totWeight += weight;
    wYtm += ytm * weight;
    if (dur != null) wDur += dur * weight;
    wLife += residualYears * weight;
    rows.push({ id: p.id, name: p.securityCode || p.type, ytm, duration: dur,
      residualYears, weight, currency: p.currency });
  });

  if (totWeight <= 0) return null;
  const duration = wDur / totWeight;
  return {
    count: rows.length, totalALL: totWeight,
    ytm: wYtm / totWeight,
    duration,
    avgLife: wLife / totWeight,
    // Stima di prima approssimazione: variazione % di valore per +1% di tassi.
    lossOn1pctRise: -duration * 1,
    lossAmountOn1pctRise: totWeight * (-duration/100),
    rows: rows.sort((a,b) => b.weight - a.weight)
  };
}

    const results = searchPositions(input.value);
    if (results.length === 0) { resultsEl.innerHTML = '<div class="empty">Nessun risultato.</div>'; return; }
    resultsEl.innerHTML = results.map(p => {
      const mv = (p.marketValue!=null && p.marketValue!=="") ? p.marketValue : p.amount;
      const label = p.fundName || p.stockTicker || p.cryptoSymbol || p.commodityName || p.propertyType || p.derivativeType || p.type;
      const tabId = tabForPosition(p);
      const tabDef = TAB_DEFS.find(t=>t.id===tabId);
      return `<div class="list-item">
        <div class="li-main"><span class="li-cat">${label}${p.securityCode?' <span class="pill">'+p.securityCode+'</span>':''}${p.note?' · '+p.note:''}</span><span class="li-date">${p.date||''} · ${tabDef?tabDef.icon+' '+tabDef.label:''}</span></div>
        <div style="display:flex;align-items:center;">
          <span class="li-amt">${fmt(mv)} ${p.currency}</span>
          <button data-searchgoto="${tabId}" class="secondary" style="width:auto; padding:5px 10px; font-size:11px; margin-left:8px;">Vai →</button>
        </div>
      </div>`;
    }).join('');
    resultsEl.querySelectorAll("[data-searchgoto]").forEach(btn=>{
      btn.addEventListener("click", ()=> switchTab(btn.dataset.searchgoto));
    });
  }
  input.addEventListener("input", renderResults);
  input.focus();
  renderResults();
}

function positionDisplayLabel(p) {
  return p.fundName || p.stockTicker || p.cryptoSymbol || p.commodityName || p.propertyType || p.derivativeType || p.type;
}
function computePositionValueHistory(p) {
  if (isFundEntry(p)) {
    // Somma tutti i versamenti dello stesso fondo: a ogni data valgono le quote
    // possedute FINO a quel momento, moltiplicate per il prezzo di allora.
    const nome = p.fundName || p.type;
    const lotti = data.portfolio.filter(x => isFundEntry(x) && x.amount>0 && (x.fundName||x.type) === nome);
    const prezzi = {};
    lotti.forEach(l => (l.priceHistory||[]).forEach(h => { prezzi[h.date] = Number(h.price); }));
    const date = Object.keys(prezzi).sort();
    if (date.length) {
      const points = date.map(d => {
        const quote = lotti.filter(l => l.date <= d)
          .reduce((s,l) => s + (Number(l.fundQuotaCount)||0), 0);
        return { date: d, value: quote * prezzi[d] };
      });
      const primaData = lotti.map(l=>l.date).sort()[0];
      if (!points.some(pt => pt.date === primaData)) {
        const investito = lotti.filter(l => l.date <= primaData).reduce((s,l)=>s+Number(l.amount),0);
        points.push({ date: primaData, value: investito });
      }
      return points.sort((a,b)=>a.date.localeCompare(b.date));
    }
  }
  const current = (p.marketValue!=null && p.marketValue!=="") ? Number(p.marketValue) : Number(p.amount);
  const manual = (p.valueHistory||[]).slice();
  const points = [{date:p.date, value:Number(p.amount)}, ...manual, {date:todayISO, value:current}];
  const dedup = {};
  points.forEach(pt=>{ dedup[pt.date] = pt.value; });
  return Object.keys(dedup).sort().map(d=>({date:d, value:dedup[d]}));
}
let performanceViewPositionId = null;
function renderAssetPerformance(positionId) {
  if (positionId) performanceViewPositionId = positionId;
  document.getElementById("headerTitle").textContent = "Andamento";
  // Un fondo comprato in più versamenti è UNA posizione dal punto di vista
  // dell'andamento: l'elenco mostrava invece ogni singolo versamento.
  const candidate = data.portfolio.filter(p => p.amount>0 && !isDebtType(p.type,p.macro) && !isCreditCardType(p.type) && !data.paymentTypes.includes(p.type));
  const visti = new Set();
  const allPositions = candidate.filter(p => {
    if (!isFundEntry(p)) return true;
    const chiave = "fondo:" + (p.fundName || p.type);
    if (visti.has(chiave)) return false;
    visti.add(chiave);
    return true;
  });
  if (allPositions.length===0) {
    document.getElementById("main").innerHTML = `<div class="card"><h3>Andamento nel tempo</h3><div class="empty">Nessun asset registrato ancora.</div></div>`;
    return;
  }
  if (!performanceViewPositionId || !allPositions.some(p=>p.id===performanceViewPositionId)) performanceViewPositionId = allPositions[0].id;
  const selected = allPositions.find(p=>p.id===performanceViewPositionId);
  const history = computePositionValueHistory(selected);
  const tabId = tabForPosition(selected);
  const tabDef = TAB_DEFS.find(t=>t.id===tabId);

  document.getElementById("main").innerHTML = `
    <div class="card">
      <h3>Andamento nel tempo</h3>
      <div class="subtle">Per i fondi lo storico si costruisce da solo (dagli aggiornamenti prezzo). Per gli altri asset, usa "Salva valore di oggi" ogni tanto per costruire lo storico nel tempo.</div>
      <select id="perfPositionSelect">${allPositions.map(p=>`<option value="${p.id}" ${p.id===selected.id?'selected':''}>${positionDisplayLabel(p)} (${TAB_DEFS.find(t=>t.id===tabForPosition(p)).label})</option>`).join('')}</select>
      <div class="chart-wrap" style="margin-top:10px;"><canvas id="perfChart" height="220"></canvas></div>
      <div class="stat-row"><span class="label">Valore di partenza (${history[0]?.date||''})</span><span class="val">${fmt(history[0]?.value||0)} ${selected.currency}</span></div>
      <div class="stat-row"><span class="label">Valore attuale (${history[history.length-1]?.date||''})</span><span class="val">${fmt(history[history.length-1]?.value||0)} ${selected.currency}</span></div>
      ${history.length>=2 && history[0].value>0 ? `<div class="stat-row"><span class="label">Variazione totale</span><span class="val ${history[history.length-1].value>=history[0].value?'up':'down'}">${((history[history.length-1].value/history[0].value-1)*100).toFixed(2)}%</span></div>` : ''}
      ${(() => {
        // Rendimento annualizzato: la variazione totale da sola non dice se è tanto
        // o poco — dipende da quanto tempo ci è voluto. Serve almeno un mese di
        // storico perché il calcolo non dia numeri assurdi (una piccola variazione
        // su pochi giorni, annualizzata, sembrerebbe un rendimento enorme).
        if (history.length < 2 || !(history[0].value > 0)) return '';
        const anni = (new Date(history[history.length-1].date) - new Date(history[0].date)) / (365.25*86400000);
        if (anni < 0.08) return '';
        const rendAnnuo = (Math.pow(history[history.length-1].value / history[0].value, 1/anni) - 1) * 100;
        return `<div class="stat-row"><span class="label">Rendimento annualizzato</span><span class="val ${rendAnnuo>=0?'up':'down'}">${rendAnnuo.toFixed(2)}%/anno</span></div>`;
      })()}
      ${history.length < 3 ? `<div class="subtle" style="margin-top:6px; color:#C9A227;">Solo ${history.length} punto${history.length===1?'':'i'} nello storico — troppo poco per essere un andamento significativo. ${isFundEntry(selected)?'Si costruisce da solo con i prossimi aggiornamenti prezzo.':'Usa "Salva valore di oggi" periodicamente per costruirlo.'}</div>` : ''}
      <div class="row2" style="margin-top:10px;">
        <button class="secondary" type="button" id="perfSnapshotBtn">📸 Salva valore di oggi</button>
        <button class="secondary" type="button" id="perfGotoTabBtn">Vai a ${tabDef.icon} ${tabDef.label} →</button>
      </div>
    </div>
  `;
  document.getElementById("perfPositionSelect").addEventListener("change", ev=>{
    renderAssetPerformance(ev.target.value);
  });
  document.getElementById("perfSnapshotBtn").addEventListener("click", ()=>{
    const pos = data.portfolio.find(p=>p.id===selected.id);
    if (!pos) return;
    const currentVal = (pos.marketValue!=null && pos.marketValue!=="") ? Number(pos.marketValue) : Number(pos.amount);
    if (!pos.valueHistory) pos.valueHistory = [];
    const existingIdx = pos.valueHistory.findIndex(h=>h.date===todayISO);
    if (existingIdx>=0) pos.valueHistory[existingIdx].value = currentVal;
    else pos.valueHistory.push({date: todayISO, value: currentVal});
    saveData();
    renderAssetPerformance(selected.id);
  });
  document.getElementById("perfGotoTabBtn").addEventListener("click", ()=> switchTab(tabId));

  const ctx = document.getElementById("perfChart");
  if (window.perfChartInstance) window.perfChartInstance.destroy();
  window.perfChartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: history.map(h=>h.date), datasets: [{ label: positionDisplayLabel(selected), data: history.map(h=>h.value), borderColor:'#C9A227', backgroundColor:'transparent', tension:0.25, pointRadius:3, borderWidth:2 }] },
    options: {
      plugins: { legend: { labels:{ color:'#8FA3BF', font:{size:10} } } },
      scales: {
        x: { ticks:{ color:'#6B7E99', font:{size:9} }, grid:{ color:'#1E2E47' } },
        y: { ticks:{ color:'#6B7E99', font:{size:10} }, grid:{ color:'#1E2E47' } }
      }
    }
  });
}

function getOrderedTabDefs() {
  const savedOrder = (data.settings.tabOrder && data.settings.tabOrder.length) ? data.settings.tabOrder : TAB_DEFS.map(t=>t.id);
  const known = new Set(savedOrder);
  const extra = TAB_DEFS.filter(t=>!known.has(t.id)).map(t=>t.id);
  const fullOrder = [...savedOrder.filter(id=>TAB_DEFS.some(t=>t.id===id)), ...extra];
  return fullOrder.map(id => TAB_DEFS.find(t=>t.id===id)).filter(Boolean);
}

// Porta la scheda attiva dentro la parte visibile della barra e aggiorna le
// sfumature laterali, che indicano se c'è altro da scorrere a destra o a sinistra.
function aggiornaBarraSchede() {
  const nav = document.getElementById("navTabs");
  if (!nav || nav.classList.contains("nav-edit-mode")) return;
  const attivo = nav.querySelector("button.active");
  if (attivo && nav.scrollWidth > nav.clientWidth) {
    const centro = attivo.offsetLeft - (nav.clientWidth / 2) + (attivo.offsetWidth / 2);
    nav.scrollLeft = Math.max(0, centro);
  }
  const aggiornaSfumature = () => {
    const l = document.getElementById("tabsFadeL");
    const r = document.getElementById("tabsFadeR");
    if (!l || !r) return;
    const scorrevole = nav.scrollWidth - nav.clientWidth;
    l.style.opacity = nav.scrollLeft > 4 ? "1" : "0";
    r.style.opacity = nav.scrollLeft < scorrevole - 4 ? "1" : "0";
  };
  aggiornaSfumature();
  if (!nav.dataset.scrollBound) {
    nav.addEventListener("scroll", aggiornaSfumature);
    window.addEventListener("resize", aggiornaSfumature);
    nav.dataset.scrollBound = "1";
  }
}

function renderNavTabs() {
  const nav = document.getElementById("navTabs");
  const ordered = getOrderedTabDefs();
  const hidden = new Set(data.settings.hiddenTabs||[]);
  if (!navEditMode) {
    nav.classList.remove("nav-edit-mode");
    const visible = ordered.filter(t=>!hidden.has(t.id));
    nav.innerHTML = visible.map(t=>
      `<button data-tab="${t.id}" class="${t.id===currentTabId?'active':''}"><span class="ic">${t.icon}</span>${t.label}</button>`
    ).join('');
    nav.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=> switchTab(btn.dataset.tab));
    });
  } else {
    nav.classList.add("nav-edit-mode");
    nav.innerHTML = `<div style="display:flex; flex-direction:column; width:100%; max-height:65vh; overflow-y:auto; background:#0F1B2B; padding:10px;">
      <div class="subtle" style="margin-bottom:8px;">Sposta con le frecce, nascondi/mostra con il pulsante. Le modifiche si salvano da sole.</div>
      ${ordered.map((t,i)=>`
        <div style="display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid #1E2E47; ${hidden.has(t.id)?'opacity:0.4;':''}">
          <span style="font-size:16px; width:22px;">${t.icon}</span>
          <span style="flex:1; font-size:13px; color:#EDE6D6; font-family:'Inter',sans-serif;">${t.label}</span>
          <button data-navup="${t.id}" ${i===0?'disabled':''} style="background:none;border:1px solid #2E4159;color:#8FA3BF;border-radius:4px;padding:4px 9px;cursor:pointer;">↑</button>
          <button data-navdown="${t.id}" ${i===ordered.length-1?'disabled':''} style="background:none;border:1px solid #2E4159;color:#8FA3BF;border-radius:4px;padding:4px 9px;cursor:pointer;">↓</button>
          <button data-navtoggle="${t.id}" style="background:none;border:1px solid #2E4159;color:${hidden.has(t.id)?'#6B7E99':'#C9A227'};border-radius:4px;padding:4px 9px;cursor:pointer;min-width:74px;">${hidden.has(t.id)?'Mostra':'Nascondi'}</button>
        </div>`).join('')}
      <button id="navEditDoneBtn" class="primary" style="margin-top:12px;">Fatto</button>
    </div>`;
    nav.querySelectorAll("[data-navup]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.navup;
        const ord = ordered.map(t=>t.id);
        const idx = ord.indexOf(id);
        if (idx>0) { [ord[idx-1],ord[idx]] = [ord[idx],ord[idx-1]]; data.settings.tabOrder = ord; saveData(); renderNavTabs(); }
      });
    });
    nav.querySelectorAll("[data-navdown]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.navdown;
        const ord = ordered.map(t=>t.id);
        const idx = ord.indexOf(id);
        if (idx<ord.length-1) { [ord[idx+1],ord[idx]] = [ord[idx],ord[idx+1]]; data.settings.tabOrder = ord; saveData(); renderNavTabs(); }
      });
    });
    nav.querySelectorAll("[data-navtoggle]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.navtoggle;
        const h = new Set(data.settings.hiddenTabs||[]);
        if (h.has(id)) h.delete(id); else h.add(id);
        data.settings.hiddenTabs = [...h];
        saveData(); renderNavTabs();
      });
    });
    document.getElementById("navEditDoneBtn").addEventListener("click", ()=>{
      navEditMode = false;
      const stillVisible = getOrderedTabDefs().filter(t=>!(data.settings.hiddenTabs||[]).includes(t.id));
      if (!stillVisible.some(t=>t.id===currentTabId)) {
        currentTabId = stillVisible.length ? stillVisible[0].id : "dashboard";
        renderNavTabs();
        RENDERERS[currentTabId]();
      } else {
        renderNavTabs();
      }
    });
  }
  try { aggiornaBarraSchede(); } catch (e) {}
}
document.getElementById("navEditBtn").addEventListener("click", ()=>{
  navEditMode = !navEditMode;
  renderNavTabs();
});
document.getElementById("globalSearchBtn").addEventListener("click", ()=>{
  renderGlobalSearch();
});
document.getElementById("cardOrderBtn").addEventListener("click", ()=>{
  cardOrderMode = !cardOrderMode;
  if (RENDERERS[currentTabId]) RENDERERS[currentTabId]();
});
document.getElementById("assetPerfBtn").addEventListener("click", ()=>{
  renderAssetPerformance();
});
// Un solo gestore per tutte le sezioni con matita master.
document.addEventListener("click", ev => {
  const btn = ev.target.closest && ev.target.closest("[data-listedit]");
  if (!btn) return;
  toggleListEdit(btn.dataset.listedit);
  if (RENDERERS[currentTabId]) RENDERERS[currentTabId]();
});
// Riordino dei riquadri di una scheda. Funziona su qualsiasi scheda senza
// modificarne il template: dopo il disegno legge i riquadri presenti, li identifica
// dal titolo e li rimette nell'ordine salvato.
let cardOrderMode = false;
function cardKeyOf(card) {
  const h = card.querySelector("h3");
  return h ? h.textContent.trim() : null;
}
function applyCardOrder(tabId) {
  const main = document.getElementById("main");
  if (!main) return;
  const cards = [...main.querySelectorAll(":scope > .card")];
  if (cards.length < 2) return;
  const saved = ((data.settings.cardOrder||{})[tabId]) || [];
  if (saved.length) {
    const posizione = k => { const i = saved.indexOf(k); return i === -1 ? 9999 : i; };
    cards.slice()
      .sort((a,b) => posizione(cardKeyOf(a)) - posizione(cardKeyOf(b)))
      .forEach(card => main.appendChild(card));
  }
  if (!cardOrderMode) return;
  [...main.querySelectorAll(":scope > .card")].forEach((card, idx, arr) => {
    const barra = document.createElement("div");
    barra.style.cssText = "display:flex; gap:6px; margin-bottom:6px;";
    barra.innerHTML = `<button class="secondary" type="button" data-cardup style="width:auto;padding:3px 10px;font-size:12px;" ${idx===0?'disabled':''}>↑</button>
      <button class="secondary" type="button" data-carddown style="width:auto;padding:3px 10px;font-size:12px;" ${idx===arr.length-1?'disabled':''}>↓</button>
      <span class="subtle" style="align-self:center;font-size:11px;">${cardKeyOf(card)||''}</span>`;
    card.prepend(barra);
    const sposta = delta => {
      const tutte = [...main.querySelectorAll(":scope > .card")].map(cardKeyOf);
      const i = tutte.indexOf(cardKeyOf(card));
      const j = i + delta;
      if (i < 0 || j < 0 || j >= tutte.length) return;
      [tutte[i], tutte[j]] = [tutte[j], tutte[i]];
      if (!data.settings.cardOrder) data.settings.cardOrder = {};
      data.settings.cardOrder[currentTabId] = tutte;
      saveData();
      if (RENDERERS[currentTabId]) RENDERERS[currentTabId]();
    };
    barra.querySelector("[data-cardup]").addEventListener("click", ()=>sposta(-1));
    barra.querySelector("[data-carddown]").addEventListener("click", ()=>sposta(1));
  });
}

function switchTab(tab) {
  currentTabId = tab;
  renderNavTabs();
  RENDERERS[tab]();
}

const displayCurrencySelectEl = document.getElementById("displayCurrencySelect");

async function tryUnlock() {
  const input = document.getElementById("lockPinInput");
  const val = input.value;
  const hash = await hashPin(val);
  if (hash === data.settings.pinHash) {
    document.getElementById("lockScreen").classList.remove("active");
    document.getElementById("app").style.display = "";
    switchTab("dashboard");
  } else {
    document.getElementById("lockError").textContent = "PIN errato, riprova.";
    input.value = "";
    input.focus();
  }
}

async function tryAutoResumeDrive() {
  const token = loadTokenFromSession();
  if (!token) return { done:false, reason:"non connesso" };
  gDriveToken = token;
  updateSyncBadge();
  await syncFromDriveIfNewer();
}

// All'apertura confronta la copia su Drive con l'ultima sincronizzazione di questo
// dispositivo. Se quella remota è più recente la scarica, così aprendo l'app da un
// altro dispositivo si vedono subito i dati aggiornati invece di una versione vecchia.
// Se invece è questo dispositivo ad avere modifiche non ancora caricate, non tocca
// nulla: sovrascrivere in automatico farebbe perdere lavoro.
async function syncFromDriveIfNewer(opts) {
  opts = opts || {};
  if (!gDriveToken) return { done:false, reason:"non connesso" };
  let remote = null;
  try { remote = await findDriveFile(); } catch(e) { return { done:false, reason:"errore rete" }; }
  if (!remote) return { done:false, reason:"nessun backup su Drive" };

  const remoteNewer = isRemoteNewerThanLocal(remote.modifiedTime);
  if (!remoteNewer) return { done:false, reason:"locale già aggiornato" };

  const localPending = hasUnsyncedLocalChanges();
  if (localPending && !opts.force) {
    const ok = confirm(
      `La copia su Google Drive è più recente di questo dispositivo.\n\n` +
      `Modificata il ${new Date(remote.modifiedTime).toLocaleString("it-IT")}, probabilmente da un altro dispositivo.\n\n` +
      `Su questo dispositivo però ci sono modifiche non ancora caricate.\n\n` +
      `Premi OK per scaricare la versione di Drive (le modifiche locali non caricate andranno perse).\n` +
      `Premi Annulla per tenere i dati locali e decidere dalla scheda Google Drive.`);
    if (!ok) return { done:false, reason:"annullato dall'utente" };
  }
  await downloadFromDrive(true);
  return { done:true, remoteModifiedTime: remote.modifiedTime };
}

// Vero se questo dispositivo ha modifiche successive all'ultimo caricamento riuscito.
function hasUnsyncedLocalChanges() {
  const s = data.settings || {};
  if (!s.lastDriveSync) return true;
  if (!s.lastLocalChange) return false;
  return new Date(s.lastLocalChange).getTime() > new Date(s.lastDriveSync).getTime() + 5000;
}

window.addEventListener("load", ()=> setTimeout(initGoogleClient, 800));

// Avvio: aspetta che i dati siano pronti (IndexedDB, con eventuale migrazione una
// tantum da localStorage) prima di fare qualunque rendering. Fino a qui nessuna
// funzione ha letto `data` per davvero — solo dichiarazioni ed event listener
// registrati, che scattano più avanti, mai prima di questo punto.
(async function boot() {
  data = await loadDataAsync();
  autoLocalBackupCheck();

  renderNavTabs();
  displayCurrencySelectEl.value = data.settings.displayCurrency || "ALL";
  displayCurrencySelectEl.addEventListener("change", ()=>{
    data.settings.displayCurrency = displayCurrencySelectEl.value;
    saveData();
    RENDERERS[currentTabId]();
  });

  if (data.settings.pinHash) {
    document.getElementById("app").style.display = "none";
    document.getElementById("lockScreen").classList.add("active");
    document.getElementById("lockSubmitBtn").addEventListener("click", async ()=>{ await tryUnlock(); await tryAutoResumeDrive(); appBootCompleted = true; });
    document.getElementById("lockPinInput").addEventListener("keydown", e=>{ if (e.key==="Enter") document.getElementById("lockSubmitBtn").click(); });
  } else {
    switchTab("dashboard");
    tryAutoResumeDrive().finally(() => { appBootCompleted = true; });
  }
})();
</script>
