function autoGenerateTaxDeductions() {
  let changed = false;
  data.taxDeductions.forEach(rule => {
    // Regole sostituite dal Sistema Lavoro Dipendente: non devono più generare nulla.
    if (rule.disattivataDaRLD) return;
    if (!rule.linkedMacro || !rule.globalLimit) return;
    if (rule.startDate && todayISO < rule.startDate) return;
    if (rule.endDate && todayISO > rule.endDate) return;
    if (!data.categories.income.includes(rule.name)) { data.categories.income.push(rule.name); changed = true; }
    if (!data.macroCategories.income.includes("Deduzioni Fiscali")) { data.macroCategories.income.push("Deduzioni Fiscali"); changed = true; }

    function periodKeyFor(dateStr) {
      const d = new Date(dateStr);
      if (rule.frequency === "monthly") return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      if (rule.frequency === "quarterly") return `${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`;
      if (rule.frequency === "annual") return `${d.getFullYear()}`;
      return "once";
    }

    const qualifying = data.portfolio.filter(p => p.macro === rule.linkedMacro && p.amount > 0 && p.date && p.date >= rule.startDate)
      .sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));

    const byPeriod = {};
    qualifying.forEach(p => {
      const pk = periodKeyFor(p.date);
      if (!byPeriod[pk]) byPeriod[pk] = [];
      byPeriod[pk].push(p);
    });

    Object.keys(byPeriod).forEach(periodKey => {
      const positions = byPeriod[periodKey];
      let remainingALL = toALL(rule.globalLimit, rule.limitCurrency);
      positions.forEach(p => {
        const existing = data.income.find(i => i.linkedBondId === p.id && i.deductionRuleId === rule.id);
        if (existing) { remainingALL -= toALL(existing.deductionBaseAmount||0, p.currency); return; }
        if (remainingALL <= 0.01) return;
        const posAmountALL = toALL(p.amount, p.currency);
        const allocatableALL = Math.min(remainingALL, posAmountALL);
        if (allocatableALL <= 0.01) return;
        const fxDiv = p.currency==="EUR" ? data.settings.fx : p.currency==="USD" ? data.settings.fxUsd : 1;
        const allocatableNative = allocatableALL / fxDiv;
        const deductionAmt = allocatableNative * rule.taxSavingsPct/100;

        let payDate;
        if (rule.paymentTiming === "posticipato") {
          const nextMonth = new Date(p.date);
          nextMonth.setMonth(nextMonth.getMonth()+1);
          const nextMonthKey = `${nextMonth.getFullYear()}-${String(nextMonth.getMonth()+1).padStart(2,"0")}`;
          const principaleEntry = data.income.filter(i => (i.category === CAT_RLD || i.category === "Reddito principale") && i.date.slice(0,7) === nextMonthKey).sort((a,b)=>a.date.localeCompare(b.date))[0];
          if (principaleEntry) payDate = principaleEntry.date;
          else { const fb = new Date(p.date); fb.setDate(fb.getDate()+1); payDate = localDateStr(fb); }
        } else {
          const fb = new Date(p.date); fb.setDate(fb.getDate()+1); payDate = localDateStr(fb);
        }
        if (payDate > todayISO) return;
        if (!canGenerateOnDate(payDate)) return;

        const incId = uid();
        data.income.push({
          id: incId, date: payDate, amount: deductionAmt, currency: p.currency,
          category: rule.name, macro: "Deduzioni Fiscali", paymentType: null,
          note: `${rule.code||rule.name} · base ${fmt(allocatableNative)} ${p.currency}`,
          linkedBondId: p.id, deductionRuleId: rule.id, deductionBaseAmount: allocatableNative
        });
        createLiquidityAdjustment(rule.paymentAccount||"Banca", deductionAmt, payDate, `Deduzione fiscale: ${rule.name}`, incId);
        remainingALL -= allocatableALL;
        changed = true;
      });
    });
  });
  if (changed) saveData();
}

function autoMatureBondsAndDeposits() {
  let changed = false;
  data.portfolio.forEach(p => {
    if (!p.amount || p.amount <= 0 || !p.type || !p.maturityDate) return;
    if (!canGenerateOnDate(p.maturityDate)) return;
    const typeLower = p.type.toLowerCase();
    const code = p.securityCode || "";

    if (typeLower.includes("deposito") && p.depositMode === "finale") {
      const already = data.income.some(i => i.linkedBondId === p.id && i.note && i.note.includes("Liquidazione finale"));
      if (already) return;
      const nominal = p.amount;
      const rate = Number(p.depositRate)||0;
      const years = Number(p.depositYears)||1;
      const grossInterest = nominal * rate/100 * years;
      const taxRate = Number(p.depositTaxRate)||15;
      const taxAmt = grossInterest * taxRate/100;
      const netInterest = grossInterest - taxAmt;
      const taxCat = ensureDepositTaxCategory(p.depositYears);
      const incId = uid();
      data.income.push({ id: incId, date: p.maturityDate, amount: grossInterest, category: "Interesse deposito", macro: "Interessi da Titoli - Standard", paymentType: null, note: `Liquidazione finale ${code}`.trim(), linkedBondId: p.id, securityCode: code||null });
      data.expenses.push({ id: uid(), date: p.maturityDate, amount: taxAmt, category: taxCat, macro: "Tassazione da Titoli - Standard", note: `Liquidazione ${code}`.trim(), linkedBondId: p.id, securityCode: code||null, linkedIncomeId: incId });
      createLiquidityAdjustment("Banca", netInterest, p.maturityDate, `Liquidazione netta ${code}`.trim(), incId);
      // A scadenza il capitale torna disponibile e il deposito si chiude, come già
      // avviene per le obbligazioni. Senza questo il deposito restava aperto per
      // sempre e la liquidità non rifletteva il rimborso.
      data.portfolio.push({ id: uid(), type: p.type, macro: p.macro||null, amount: -nominal,
        currency: p.currency, marketValue: null, date: p.maturityDate, maturityDate: null,
        note: `Rimborso a scadenza ${code}`.trim(), linkedTo: p.id });
      createLiquidityAdjustment(bankAccountForCurrency(p.currency), nominal, p.maturityDate,
        `Rimborso capitale deposito ${code}`.trim(), incId + "-cap");
      changed = true;
    }

    if (typeLower.includes("obbligazione") && p.bondMode === "finale") {
      const already = data.income.some(i => i.linkedBondId === p.id && i.category === "Capital gain obbligazioni" && i.note && i.note.includes("Rimborso a scadenza"));
      if (already) return;
      const nominal = p.amount;
      const purchasePrice = Number(p.purchasePrice)||100;
      const redemptionPrice = Number(p.redemptionPrice)||100;
      const valoreTotale = nominal * redemptionPrice/100;
      const costo = nominal * purchasePrice/100;
      const capitalGainLordo = valoreTotale - costo;
      const taxRate = Number(p.bondTaxRate)||15;
      const tassazione = capitalGainLordo>0 ? capitalGainLordo*taxRate/100 : 0;
      const capitalGainNetto = capitalGainLordo - tassazione;
      const saleId = uid();
      data.portfolio.push({ id: uid(), type: p.type, macro: p.macro||null, amount: -nominal, currency: p.currency, marketValue: null, date: p.maturityDate, maturityDate: null, note: `Rimborso a scadenza ${code}`.trim() });
      createLiquidityAdjustment("Banca", nominal, p.maturityDate, `Rimborso capitale ${code}`.trim(), saleId);
      data.income.push({ id: saleId, date: p.maturityDate, amount: capitalGainLordo, category: "Capital gain obbligazioni", macro: "Interessi da Titoli - Standard", paymentType: null, note: `Rimborso a scadenza ${code}`.trim(), linkedBondId: p.id, securityCode: code||null });
      if (tassazione > 0) {
        const taxCat = ensureBondTaxCategory(p.bondYears, p.type);
        data.expenses.push({ id: uid(), date: p.maturityDate, amount: tassazione, category: taxCat, macro: "Tassazione da Titoli - Standard", note: `Rimborso ${code}`.trim(), linkedBondId: p.id, securityCode: code||null, linkedIncomeId: saleId });
      }
      createLiquidityAdjustment("Banca", capitalGainNetto, p.maturityDate, `Plusvalenza netta rimborso ${code}`.trim(), saleId+"-gain");
      changed = true;
    }

    // Titoli e depositi CON CEDOLA: gli interessi sono già stati incassati lungo la
    // vita del titolo, ma a scadenza il capitale deve comunque tornare disponibile.
    // Senza questo la posizione restava aperta per sempre e il denaro non rientrava
    // mai in banca.
    const giaRimborsato = () => data.portfolio.some(x => x.linkedTo === p.id && /rimborso/i.test(x.note||""));

    if (typeLower.includes("deposito") && p.depositMode !== "finale" && !giaRimborsato()) {
      const nominal = p.amount;
      const refId = uid();
      data.portfolio.push({ id: refId, type: p.type, macro: p.macro||null, amount: -nominal,
        currency: p.currency, marketValue: null, date: p.maturityDate, maturityDate: null,
        note: `Rimborso a scadenza ${code}`.trim(), linkedTo: p.id });
      createLiquidityAdjustment(bankAccountForCurrency(p.currency), nominal, p.maturityDate,
        `Rimborso capitale deposito ${code}`.trim(), refId + "-cap");
      changed = true;
    }

    if (typeLower.includes("obbligazione") && p.bondMode !== "finale" && !giaRimborsato()) {
      const nominal = p.amount;
      const purchasePrice = Number(p.purchasePrice)||100;
      const redemptionPrice = Number(p.redemptionPrice)||100;
      const capitalGainLordo = nominal * (redemptionPrice - purchasePrice) / 100;
      const taxRate = Number(p.bondTaxRate)||15;
      const tassazione = capitalGainLordo > 0 ? capitalGainLordo * taxRate/100 : 0;
      const refId = uid();
      data.portfolio.push({ id: refId, type: p.type, macro: p.macro||null, amount: -nominal,
        currency: p.currency, marketValue: null, date: p.maturityDate, maturityDate: null,
        note: `Rimborso a scadenza ${code}`.trim(), linkedTo: p.id });
      createLiquidityAdjustment(bankAccountForCurrency(p.currency), nominal, p.maturityDate,
        `Rimborso capitale ${code}`.trim(), refId + "-cap");
      if (capitalGainLordo !== 0) {
        data.income.push({ id: refId, date: p.maturityDate, amount: capitalGainLordo,
          category: "Capital gain obbligazioni", macro: "Interessi da Titoli - Standard",
          paymentType: null, note: `Rimborso a scadenza ${code}`.trim(),
          linkedBondId: p.id, securityCode: code||null });
        if (tassazione > 0) {
          data.expenses.push({ id: uid(), date: p.maturityDate, amount: tassazione,
            category: ensureBondTaxCategory(p.bondYears, p.type), macro: "Tassazione da Titoli - Standard",
            note: `Rimborso ${code}`.trim(), linkedBondId: p.id, securityCode: code||null, linkedIncomeId: refId });
        }
        createLiquidityAdjustment(bankAccountForCurrency(p.currency), capitalGainLordo - tassazione,
          p.maturityDate, `Plusvalenza netta rimborso ${code}`.trim(), refId + "-gain");
      }
      changed = true;
    }
  });
  if (changed) saveData();
}

// Registra una volta al mese il valore di ogni posizione, così l'andamento per
// singolo asset si costruisce da solo invece di dipendere dal pulsante manuale.
// I fondi sono esclusi: il loro storico arriva già dagli aggiornamenti di prezzo.
// ===== Fattore di Rischiosità (scala SRRI 1-7) =====
// Indicatore di rischio per una singola scheda: media ponderata e ripartizione.
function riquadroRischioScheda(posizioni, titolo) {
  const r = computeRischioPortafoglio({ posizioni });
  if (!r.totale || r.media === null) return "";
  const barre = r.distribuzione.filter(d => d.quota > 0).map(d =>
    `<div style="display:flex;align-items:center;gap:6px;margin-top:3px;">
       <span style="width:22px;font-size:10px;color:${RISCHIO_COLORI[d.livello]};">R${d.livello}</span>
       <div style="flex:1;height:6px;background:#1E2E47;border-radius:3px;overflow:hidden;">
         <div style="height:100%;width:${d.quota.toFixed(1)}%;background:${RISCHIO_COLORI[d.livello]};"></div>
       </div>
       <span style="width:44px;text-align:right;font-size:10px;color:#8FA3BF;">${d.quota.toFixed(1)}%</span>
     </div>`).join('');
  const m = r.media;
  // Rendimento della sezione, per unità di rischio: dice se il rischio di questa
  // categoria di strumenti sta producendo qualcosa in più del non rischiare.
  const rf = tassoPrivoDiRischio();
  let peso = 0, somma = 0;
  posizioni.forEach(p => {
    const r = rendimentoAnnuoPosizione(p);
    const v = valoreDiRischio(p);
    if (r === null || v <= 0) return;
    peso += v; somma += v * r;
  });
  const rendSez = peso > 0 ? somma / peso : null;
  const perUnita = rendSez !== null ? (rendSez - rf) / m : null;

  return `<div class="card">
      <h3>${titolo || "Rischio della sezione"}</h3>
      <div class="stat-row"><span class="label">Rischio medio ponderato</span><span class="val" style="color:${RISCHIO_COLORI[Math.round(m)]};">${m.toFixed(2)} — ${RISCHIO_ETICHETTE[Math.round(m)]}</span></div>
      ${rendSez !== null ? `<div class="stat-row"><span class="label">Rendimento medio della sezione</span><span class="val ${rendSez>=0?'up':'down'}">${rendSez.toFixed(2)}%</span></div>
      <div class="stat-row"><span class="label">· per unità di rischio</span><span class="val ${perUnita>=0?'up':'down'}">${perUnita.toFixed(2)}</span></div>` : ''}
      <div class="subtle" style="margin-top:8px;">Ripartizione del valore per livello di rischio</div>
      ${barre}
    </div>`;
}

// Riquadro complessivo in Panoramica: le due letture, la ripartizione, lo scostamento
// dall'obiettivo, l'andamento nel tempo e gli strumenti che non ripagano il rischio.
// Riquadro del rendimento corretto per il rischio.
// ===== Master del fattore di rischiosità =====
// Raggruppa le posizioni per STRUMENTO, non per singolo acquisto: tre versamenti
// sullo stesso fondo sono una riga sola. Obbligazioni, depositi e immobili restano
// separati anche a parità di emittente, perché sono titoli distinti per costruzione.
function strumentiPerRischio() {
  const gruppi = {};
  posizioniRischiose(false).forEach(p => {
    const chiave = chiaveIdentitaStrumento(p) || ("singolo:" + p.id);
    if (!gruppi[chiave]) {
      gruppi[chiave] = {
        chiave, ids: [], nome: nomeStrumento(p), tipo: p.type, macro: p.macro || null,
        ente: p.issuerName || "", codice: p.securityCode || "",
        rischio: normalizzaRischio(p.riskFactor, p), valore: 0, quante: 0
      };
    }
    const g = gruppi[chiave];
    g.ids.push(p.id);
    g.valore += valoreDiRischio(p);
    g.quante++;
  });
  const risultato = Object.values(gruppi);
  // Lo stipendio non è una posizione in portafoglio (è un flusso, non uno stock),
  // ma è comunque una fonte esposta a rischio: qui, e SOLO qui, entra come previsione
  // di quanto manca da incassare entro fine anno. Non deve mai toccare il patrimonio.
  risultato.push(...stipendioAttesoResiduoAnno());
  return risultato.sort((a,b) => b.valore - a.valore);
}
// Netto atteso da qui a fine anno per ogni stipendio attivo, contando solo i
// mesi il cui giorno di paga non è ancora passato oggi. Se sono in agosto e il
// giorno paga (es. 10) è già passato, il conteggio parte da settembre.
function stipendioAttesoResiduoAnno() {
  const attivi = stipendiAttivi();
  if (!attivi.length) return [];
  const calc = calcolaBustePagaCumulate(attivi);
  const perId = {};
  calc.righe.forEach(r => { perId[r.stipendio.id] = r; });
  const anno = now.getFullYear();
  return attivi.map(s => {
    const r = perId[s.id];
    if (!r) return null;
    const giorno = Math.min(Math.max(Number(s.giornoPaga) || 10, 1), 28);
    let mesiResidui = 0;
    for (let m = now.getMonth() + 1; m <= 12; m++) {
      const dataPaga = `${anno}-${String(m).padStart(2,"0")}-${String(giorno).padStart(2,"0")}`;
      if (dataPaga > todayISO) mesiResidui++;
    }
    if (mesiResidui === 0 || !(r.netto > 0)) return null;
    return {
      chiave: "stipendio:" + s.id, ids: [], isForecast: true, mesiResidui,
      nome: `Stipendio atteso (resto ${anno})`, tipo: "Reddito da lavoro", macro: MACRO_LAVORO,
      ente: s.issuerName || "", codice: s.securityCode || "",
      rischio: normalizzaRischio(s.riskFactor, { type: "reddito" }),
      valore: mesiResidui * r.netto, quante: mesiResidui
    };
  }).filter(Boolean);
}
function nomeStrumento(p) {
  return p.fundName || p.stockTicker || p.commodityName || p.cryptoSymbol
    || p.propertyType || p.type || "senza nome";
}
// Applica un fattore a tutte le posizioni dello stesso strumento. Per la riga
// sintetica dello stipendio atteso, aggiorna invece il rischio del rapporto di
// lavoro stesso: si riflette anche nei prossimi flussi generati da RLD.
function applicaRischioAStrumento(chiave, valore) {
  if (String(chiave).startsWith("stipendio:")) {
    const id = chiave.slice("stipendio:".length);
    const s = stipendiLavoro().find(x => x.id === id);
    if (!s) return 0;
    s.riskFactor = normalizzaRischio(valore, { type: "reddito" });
    return 1;
  }
  let tocc = 0;
  data.portfolio.forEach(p => {
    const k = chiaveIdentitaStrumento(p) || ("singolo:" + p.id);
    if (k !== chiave) return;
    p.riskFactor = normalizzaRischio(valore, p);
    tocc++;
  });
  return tocc;
}

  const senzaLiq = computeRischioPortafoglio({ includiLiquidita: false });
  if (!conLiq.totale) return "";
  const obiettivo = Number(data.settings.rischioObiettivo) || null;
  const m = senzaLiq.media;
  const barre = senzaLiq.distribuzione.filter(d => d.quota > 0).map(d =>
    `<div style="display:flex;align-items:center;gap:6px;margin-top:3px;">
       <span style="width:22px;font-size:10px;color:${RISCHIO_COLORI[d.livello]};">R${d.livello}</span>
       <div style="flex:1;height:7px;background:#1E2E47;border-radius:3px;overflow:hidden;">
         <div style="height:100%;width:${d.quota.toFixed(1)}%;background:${RISCHIO_COLORI[d.livello]};"></div>
       </div>
       <span style="width:78px;text-align:right;font-size:10px;color:#8FA3BF;">${d.quota.toFixed(1)}% · ${fmt(d.valore)}</span>
     </div>`).join('');

  // andamento: rischio medio salvato nelle istantanee mensili
  const storico = (data.snapshots||[]).filter(s => s.rischioMedio != null).slice(-6);
  const andamento = storico.length >= 2
    ? `<div class="stat-row"><span class="label">Andamento (ultime ${storico.length} istantanee)</span><span class="val">${storico.map(s=>s.rischioMedio.toFixed(1)).join(" → ")}</span></div>`

  const nonRipagati = strumentiRischioNonRipagato(5, 3).slice(0, 4);
  const avviso = nonRipagati.length
    ? `<div class="subtle" style="margin-top:10px; color:#C08432;">Rischio alto non ripagato dal rendimento:</div>` +
      nonRipagati.map(x => `<div class="stat-row"><span class="label">${pallinoRischio(x.pos)} ${x.pos.fundName||x.pos.stockTicker||x.pos.commodityName||x.pos.cryptoSymbol||x.pos.type}</span><span class="val down">${x.rendPct.toFixed(1)}%</span></div>`).join('')
    : "";

  const scostamento = obiettivo
    ? `<div class="stat-row"><span class="label">Obiettivo</span><span class="val">${obiettivo.toFixed(1)}</span></div>
       <div class="stat-row"><span class="label">· scostamento</span><span class="val ${Math.abs(m-obiettivo)<=0.3?'up':'down'}">${(m-obiettivo>=0?'+':'')}${(m-obiettivo).toFixed(2)}</span></div>`

      <div class="stat-row"><span class="label">Solo investimenti</span><span class="val" style="color:${RISCHIO_COLORI[Math.round(m||1)]};">${m!==null?m.toFixed(2)+" — "+RISCHIO_ETICHETTE[Math.round(m)]:"n/d"}</span></div>
      <div class="stat-row"><span class="label">Compresa la liquidità</span><span class="val">${conLiq.media!==null?conLiq.media.toFixed(2):"n/d"}</span></div>
      ${scostamento}
      ${andamento}
      <div class="subtle" style="margin-top:10px;">Ripartizione del valore investito</div>
      ${barre}
      ${avviso}
    </div>`;
}

// Selettore del fattore di rischiosità, con il valore proposto in base al tipo.
function selettoreRischio(valore, dati) {
  const v = normalizzaRischio(valore, dati || {});
  const opz = [];
  for (let i = RISCHIO_MIN; i <= RISCHIO_MAX; i++) {
    opz.push(`<option value="${i}" ${i===v?'selected':''}>${i} — ${RISCHIO_ETICHETTE[i]}</option>`);
  }
  return `<select name="riskFactor" class="risk-select" required>${opz.join('')}</select>`;
}
// Pallino colorato con il livello, per le liste.
function pallinoRischio(p) {
  const r = normalizzaRischio(p && p.riskFactor, p || {});
  return `<span class="pill" style="background:${RISCHIO_COLORI[r]}22; color:${RISCHIO_COLORI[r]}; border-color:${RISCHIO_COLORI[r]};" title="Rischio ${r} — ${RISCHIO_ETICHETTE[r]}">R${r}</span>`;
}

// ===== Rendimento corretto per il rischio =====
// Mette insieme due dati che l'app calcola già ma teneva separati: quanto rende una
// posizione e quanto rischia. Serve a confrontare strumenti diversi con onestà — un
// deposito al 4% può battere un'obbligazione al 6,5% una volta pesato il rischio.

// Rendimento annualizzato di una posizione, dai flussi che la riguardano.
function rendimentoAnnuoPosizione(p) {
  const investito = toALL(Number(p.amount) || 0, p.currency);
  if (investito <= 0) return null;
  const valore = valoreDiRischio(p);
  // proventi già incassati e collegati a questa posizione (cedole, dividendi, affitti)
  const proventi = (data.income || [])
    .filter(i => i.linkedBondId === p.id)
    .reduce((s,i) => s + toALL(Number(i.amount) || 0, i.currency || "ALL"), 0);
  const totale = valore + proventi;
  const anni = p.date ? Math.max((Date.now() - new Date(p.date).getTime()) / (365.25*86400000), 0.08) : null;
  if (!anni || !isFinite(totale) || totale <= 0) return null;
  const complessivo = totale / investito;
  if (complessivo <= 0) return null;
  return (Math.pow(complessivo, 1/anni) - 1) * 100;
}

// Rendimento per unità di rischio: il numero che rende confrontabili gli strumenti.
// Si sottrae il rendimento privo di rischio, così si misura solo ciò che il rischio
// ha davvero prodotto in più.
function rendimentoCorrettoPerRischio(p, rendimentoPrivoRischio) {
  const rend = rendimentoAnnuoPosizione(p);
  if (rend === null) return null;
  const rischio = normalizzaRischio(p.riskFactor, p);
  const rf = rendimentoPrivoRischio == null ? tassoPrivoDiRischio() : rendimentoPrivoRischio;
  return { rendimento: rend, rischio, extra: rend - rf, perUnita: (rend - rf) / rischio };
}

// Rendimento privo di rischio: si usa il rendimento di un titolo di Stato breve,
// preso dalla curva importata se disponibile, altrimenti dai depositi in essere.
function tassoPrivoDiRischio() {
  const impostato = Number(data.settings.tassoPrivoRischio);
  if (isFinite(impostato) && impostato > 0) return impostato;
  const curva = data.marketYieldCurve && data.marketYieldCurve.points;
  if (curva && curva.length) {
    const breve = curva.slice().sort((a,b) => a.maturity - b.maturity)[0];
    if (breve && isFinite(breve.cutoffYield)) return breve.cutoffYield;
  }
  const dep = data.portfolio.filter(p => String(p.type||"").toLowerCase().includes("deposito") && p.depositRate > 0);
  if (dep.length) return dep.reduce((s,p) => s + Number(p.depositRate), 0) / dep.length;
  return 2;
}

// Classifica per rendimento per unità di rischio, aggregata per STRUMENTO — la
// stessa chiave d'identità del Master Rischio. Tre acquisti dello stesso fondo
// devono essere una riga sola: altrimenti lo stesso strumento affolla la classifica
// e il confronto fra strumenti diversi (non fra acquisti dello stesso strumento)
// diventa illeggibile.
function classificaRendimentoRischio() {
  const rf = tassoPrivoDiRischio();
  const gruppi = {};
  posizioniRischiose(false).forEach(p => {
    const chiave = chiaveIdentitaStrumento(p) || ("singolo:" + p.id);
    if (!gruppi[chiave]) gruppi[chiave] = { chiave, ids: [], nome: nomeStrumento(p), rischio: normalizzaRischio(p.riskFactor, p) };
    gruppi[chiave].ids.push(p.id);
  });
  return Object.values(gruppi).map(g => {
    const lots = g.ids.map(id => data.portfolio.find(p => p.id === id)).filter(Boolean);
    const investito = lots.reduce((s,p) => s + toALL(Number(p.amount)||0, p.currency), 0);
    if (investito <= 0) return null;
    const valore = lots.reduce((s,p) => s + valoreDiRischio(p), 0);
    const proventi = (data.income || [])
      .filter(i => g.ids.includes(i.linkedBondId))
      .reduce((s,i) => s + toALL(Number(i.amount) || 0, i.currency || "ALL"), 0);
    const totale = valore + proventi;
    // Età media ponderata sull'importo investito di ciascun acquisto: un acquisto
    // grande e recente pesa di più di uno piccolo e vecchio, invece di prendere
    // arbitrariamente la data di un solo lotto.
    let pesoAnni = 0;
    lots.forEach(p => {
      if (!p.date) return;
      const anni = Math.max((Date.now() - new Date(p.date).getTime()) / (365.25*86400000), 0.08);
      pesoAnni += anni * toALL(Number(p.amount)||0, p.currency);
    });
    const anni = investito > 0 ? pesoAnni / investito : null;
    if (!anni || !isFinite(totale) || totale <= 0) return null;
    const complessivo = totale / investito;
    if (complessivo <= 0) return null;
    const rendimento = (Math.pow(complessivo, 1/anni) - 1) * 100;
    const rischio = g.rischio;
    return { pos: lots[0], nome: g.nome, quante: lots.length, valore,
      rendimento, rischio, extra: rendimento - rf, perUnita: (rendimento - rf) / rischio };
  }).filter(Boolean).sort((a,b) => b.perUnita - a.perUnita);
}

// Lo stesso indicatore per l'intero portafoglio.
function rendimentoCorrettoPortafoglio() {
  const res = computePortfolioIRR();
  const rischio = computeRischioPortafoglio({ includiLiquidita:false });
  // computePortfolioIRR restituisce un oggetto: il rendimento in percentuale è irrPct.
  const irr = res && isFinite(res.irrPct) ? res.irrPct : null;
  if (irr === null || rischio.media === null) return null;
  const rf = tassoPrivoDiRischio();
  return { irr, rischioMedio: rischio.media, tassoPrivoRischio: rf,
    extra: irr - rf, perUnita: (irr - rf) / rischio.media };
}

const RISCHIO_MIN = 1, RISCHIO_MAX = 7;
const RISCHIO_ETICHETTE = { 1:"molto basso", 2:"basso", 3:"medio-basso", 4:"medio", 5:"medio-alto", 6:"alto", 7:"molto alto" };
const RISCHIO_COLORI = { 1:"#3F6E5E", 2:"#4F7E5E", 3:"#7E8E4E", 4:"#C9A227", 5:"#C08432", 6:"#A65A30", 7:"#8B3A2F" };

// Valore proposto per tipo di strumento. Per le obbligazioni cresce con la durata:
// un titolo a 20 anni è molto più sensibile ai tassi di uno a 2, ed è la duration
// (che già calcoliamo) a misurare esattamente questa differenza.
function rischioPredefinito(dati) {
  const tipo = String(dati && dati.type || "").toLowerCase();
  const macro = String(dati && dati.macro || "").toLowerCase();
  if (data.paymentTypes && data.paymentTypes.includes(dati && dati.type)) return 1;
  if (tipo.includes("deposito")) return 1;
  if (tipo.includes("obbligazione")) {
    const anni = Number(dati.bondYears) || 0;
    const societaria = /societ/i.test(tipo);
    let base = anni <= 1 ? 1 : anni <= 3 ? 2 : anni <= 7 ? 3 : anni <= 15 ? 4 : 5;
    if (societaria) base = Math.min(RISCHIO_MAX, base + 1);
    return base;
  }
  if (isCryptoType(dati.type, dati.macro)) return 7;
  if (isCommodityType(dati.type, dati.macro)) return 6;
  if (isStockType(dati.type, dati.macro) || isETFType(dati.type, dati.macro)) return 5;
  if (isRealEstateType(dati.type, dati.macro)) return 4;
  if (tipo.includes("fond") || macro.includes("fond")) return 4;
  return 4;
}

function normalizzaRischio(v, dati) {
  const n = Math.round(Number(v));
  if (isFinite(n) && n >= RISCHIO_MIN && n <= RISCHIO_MAX) return n;
  return rischioPredefinito(dati || {});
}

// Come per il codice titolo: se lo strumento è già in portafoglio si riprende il
// fattore assegnato la prima volta, invece di riproporre il predefinito.
function rischioPerNuovaPosizione(dati, valoreScritto) {
  const chiave = chiaveIdentitaStrumento(dati);
  if (chiave) {
    const gia = data.portfolio.find(p => p.riskFactor && chiaveIdentitaStrumento(p) === chiave);
    if (gia) return normalizzaRischio(gia.riskFactor, dati);
  }
  return normalizzaRischio(valoreScritto, dati);
}

// Le posizioni che entrano nel calcolo del rischio: valore positivo, niente debiti.
function posizioniRischiose(includiLiquidita) {
  return data.portfolio.filter(p => {
    if (!p.amount || p.amount <= 0) return false;
    if (isDebtType(p.type, p.macro) || isCreditCardType(p.type)) return false;
    if (!includiLiquidita && data.paymentTypes.includes(p.type)) return false;
    return true;
  });
}

function valoreDiRischio(p) {
  const v = (p.marketValue !== undefined && p.marketValue !== null && p.marketValue !== "")
    ? Number(p.marketValue) : Number(p.amount);
  return toALL(isFinite(v) ? v : 0, p.currency);
}

// Media ponderata sul valore, più la ripartizione per fascia: la sola media
// nasconde la differenza fra "tutto a 4" e "metà a 1 e metà a 7".
function computeRischioPortafoglio(opts) {
  opts = opts || {};
  const posizioni = (opts.posizioni || posizioniRischiose(!!opts.includiLiquidita));
  let totale = 0, somma = 0;
  const perFascia = {};
  for (let i = RISCHIO_MIN; i <= RISCHIO_MAX; i++) perFascia[i] = 0;
  posizioni.forEach(p => {
    const v = valoreDiRischio(p);
    if (v <= 0) return;
    const r = normalizzaRischio(p.riskFactor, p);
    totale += v; somma += v * r;
    perFascia[r] += v;
  });
  const media = totale > 0 ? somma / totale : null;
  const distribuzione = Object.keys(perFascia).map(k => ({
    livello: Number(k), valore: perFascia[k],
    quota: totale > 0 ? perFascia[k] / totale * 100 : 0
  }));
  return { media, totale, conteggio: posizioni.length, distribuzione, perFascia };
}

// Strumenti dove il rischio è alto ma il rendimento non lo giustifica.
function strumentiRischioNonRipagato(sogliaRischio, sogliaRendimento) {
  const sr = sogliaRischio || 5, sred = sogliaRendimento == null ? 3 : sogliaRendimento;
  return posizioniRischiose(false).map(p => {
    const investito = Number(p.amount) || 0;
    const attuale = valoreDiRischio(p);
    const rendPct = investito > 0 ? (toALL(attuale, "ALL") / toALL(investito, p.currency) - 1) * 100 : null;
    return { pos: p, rischio: normalizzaRischio(p.riskFactor, p), rendPct, valore: attuale };
  }).filter(x => x.rischio >= sr && x.rendPct !== null && x.rendPct < sred)
    .sort((a,b) => b.valore - a.valore);
}

// Il rischio del reddito misura la stabilità della fonte, non il rischio di mercato:
// mediarlo con quello degli investimenti darebbe un numero senza significato.
function computeRischioReddito(anno) {
  const voci = (data.income||[]).filter(i => i.date && i.date.slice(0,4) === String(anno || thisYear) && Number(i.amount) > 0);
  let tot = 0, somma = 0;
  const perFascia = {};
  for (let i = RISCHIO_MIN; i <= RISCHIO_MAX; i++) perFascia[i] = 0;
  voci.forEach(i => {
    const v = toALL(Number(i.amount), i.currency || "ALL");
    const r = normalizzaRischio(i.riskFactor, { type: "reddito" });
    tot += v; somma += v * r; perFascia[r] += v;
  });
  return { media: tot > 0 ? somma / tot : null, totale: tot, perFascia };
}

function recordPositionSnapshots() {
  data.portfolio.forEach(p => {
    if (!p.amount || p.amount <= 0) return;
    if (isDebtType(p.type, p.macro) || isCreditCardType(p.type)) return;
    if (data.paymentTypes.includes(p.type)) return;
    if (isFundEntry(p) && p.priceHistory && p.priceHistory.length) return;
    const value = (p.marketValue!==undefined && p.marketValue!==null && p.marketValue!=="")
      ? Number(p.marketValue) : Number(p.amount);
    if (!isFinite(value)) return;
    if (!p.valueHistory) p.valueHistory = [];
    if (p.valueHistory.some(h => h.date && h.date.slice(0,7) === thisMonth)) return;
    p.valueHistory.push({ date: todayISO, value, auto: true });
    p.valueHistory.sort((a,b) => a.date.localeCompare(b.date));
  });
}

async function hashPin(pin) {
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
// Cancella tutto e riparte da zero. Riusa il PIN d'accesso già impostato come
// riconferma (non un secondo PIN separato) — se non c'è nessun PIN impostato,
// serve digitare la parola "CANCELLA" per intero, così è comunque impossibile
// farlo per sbaglio con un tap. Il PIN stesso (se c'era) resta impostato dopo il
// reset, così l'app continua a essere protetta.
async function eseguiResetCompleto(confermaInserita) {
  if (data.settings.pinHash) {
    const hash = await hashPin(confermaInserita);
    if (hash !== data.settings.pinHash) return false;
  } else {
    if (confermaInserita !== "CANCELLA") return false;
  }
  const pinAttuale = data.settings.pinHash;
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  data.settings.pinHash = pinAttuale;
  saveData();
  return true;
}

// ---------- Recurring ----------
function generateRecurring() {
  let changed = false;
  ["income","expenses"].forEach(group => {
    (data.recurring[group]||[]).forEach(rule => {
      if (!shouldGenerateThisMonth(rule)) return;
      if (group === "income" && rule.linkedBondId) {
        const bond = data.portfolio.find(p => p.id === rule.linkedBondId);
        if (!bond) return;
        if (bond.maturityDate && new Date(bond.maturityDate) < now) return;
      }
      // Una voce cancellata deliberatamente non va rigenerata: senza questo controllo
      // eliminare la spesa del mese corrente era inutile, ricompariva alla riapertura.
      const already = data[group].some(e => e.recurringId === rule.id && e.date.slice(0,7) === thisMonth)
        || eraStataCancellata("rec:" + rule.id, thisMonth);
      if (!already) {
        const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
        const day = Math.min(rule.dayOfMonth || 1, daysInMonth);
        const dateStr = `${thisMonth}-${String(day).padStart(2,"0")}`;
        if (canGenerateOnDate(dateStr)) {
          const mappedMacro = (data.categoryMacroMap[group] && data.categoryMacroMap[group][rule.category]) || null;
          const genId = uid();
          const paymentType = rule.paymentType !== undefined ? rule.paymentType : "Banca";
          // La regola porta con sé macro, codice ed ente: le voci generate devono
          // riportarli, altrimenti il collegamento con la fonte del flusso si perde.
          data[group].push({ id: genId, date: dateStr, amount: rule.amount, category: rule.category,
            macro: rule.macro || mappedMacro, paymentType: paymentType||null, note: rule.note||"",
            recurringId: rule.id, linkedBondId: rule.linkedBondId||null,
            securityCode: rule.securityCode || null, issuerName: rule.issuerName || "" });
          if (paymentType) {
            const sign = group === "income" ? 1 : -1;
            createLiquidityAdjustment(paymentType, sign*rule.amount, dateStr, `${group==='income'?'Reddito':'Spesa'} ricorrente: ${rule.category}`, genId);
          }
          changed = true;
        }
      }
    });
  });
  (data.recurring.portfolio||[]).forEach(rule => {
    if (!shouldGenerateThisMonth(rule)) return;
    const already = data.portfolio.some(p => p.recurringId === rule.id && p.date && p.date.slice(0,7) === thisMonth)
      || eraStataCancellata("rec:" + rule.id, thisMonth);
    if (!already) {
      const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      const day = Math.min(rule.dayOfMonth || 1, daysInMonth);
      const dateStr = `${thisMonth}-${String(day).padStart(2,"0")}`;
      if (canGenerateOnDate(dateStr)) {
        const mappedMacro = rule.macro || (data.categoryMacroMap.portfolio && data.categoryMacroMap.portfolio[rule.type]) || null;
        const entry = { id: uid(), type: rule.type, macro: mappedMacro, amount: rule.amount, currency: rule.currency||"ALL", marketValue: null, date: dateStr, maturityDate: null, note: rule.note||"", recurringId: rule.id,
          securityCode: rule.securityCode || null, issuerName: rule.issuerName || "",
          riskFactor: normalizzaRischio(rule.riskFactor, { type: rule.type, macro: mappedMacro }) };
        if (rule.fundName) {
          entry.fundName = rule.fundName;
          if (rule.fundRefPrice) {
            entry.fundPurchaseQuotaPrice = rule.fundRefPrice;
            entry.fundCurrentQuotaPrice = rule.fundRefPrice;
            entry.fundQuotaCount = rule.amount / rule.fundRefPrice;
            entry.marketValue = rule.amount;
            const existingFundLot = data.portfolio.find(p => p.fundName === rule.fundName && p.securityCode);
            entry.securityCode = existingFundLot ? existingFundLot.securityCode : consumeNextSecurityCode();
          }
        }
        const typeLower = (rule.type||"").toLowerCase();
        if (typeLower.includes("obbligazione") && rule.couponRate) {
          entry.bondMode = rule.bondMode || "cedola";
          entry.couponRate = rule.couponRate;
          entry.couponFrequency = "annual";
          entry.bondTaxRate = rule.bondTaxRate || 15;
          entry.bondYears = rule.bondYears || null;
          entry.issueDate = dateStr;
          entry.purchasedAtIssue = true;
          if (rule.bondYears) { const md = new Date(dateStr); md.setFullYear(md.getFullYear()+Number(rule.bondYears)); entry.maturityDate = localDateStr(md); }
          entry.securityCode = consumeNextSecurityCode();
        }
        if (typeLower.includes("deposito") && rule.depositRate) {
          entry.depositMode = rule.depositMode || "cedola";
          entry.depositRate = rule.depositRate;
          entry.depositTaxRate = rule.depositTaxRate || 15;
          entry.depositYears = rule.depositYears || null;
          if (rule.depositYears) { const md = new Date(dateStr); md.setFullYear(md.getFullYear()+Number(rule.depositYears)); entry.maturityDate = localDateStr(md); }
        }
        if (rule.stockTicker && (isStockType(rule.type, mappedMacro) || isETFType(rule.type, mappedMacro))) {
          entry.stockTicker = rule.stockTicker;
          if (rule.stockRefPrice) {
            entry.stockPurchasePrice = rule.stockRefPrice;
            entry.stockCurrentPrice = rule.stockRefPrice;
            entry.stockQuantity = rule.amount / rule.stockRefPrice;
            entry.marketValue = rule.amount;
          }
        }
        if (isRealEstateType(rule.type, mappedMacro) && (rule.propertyType || rule.propertyTaxPct)) {
          entry.propertyType = rule.propertyType || "";
          entry.propertyTaxPct = rule.propertyTaxPct || 0;
          entry.propertyTaxPaymentMethod = rule.paymentType || "Banca";
          entry.marketValue = rule.amount;
          entry.securityCode = consumeNextSecurityCode();
        }
        if (rule.commodityName && isCommodityType(rule.type, mappedMacro)) {
          entry.commodityName = rule.commodityName;
          entry.commodityUnit = rule.commodityUnit || "";
          if (rule.commodityRefPrice) {
            entry.commodityPurchasePrice = rule.commodityRefPrice;
            entry.commodityCurrentPrice = rule.commodityRefPrice;
            entry.commodityQuantity = rule.amount / rule.commodityRefPrice;
            entry.marketValue = rule.amount;
          }
        }
        if (rule.cryptoId && isCryptoType(rule.type, mappedMacro)) {
          entry.cryptoId = rule.cryptoId;
          entry.cryptoSymbol = rule.cryptoSymbol || "";
          if (rule.cryptoRefPrice) {
            entry.cryptoPurchasePrice = rule.cryptoRefPrice;
            entry.cryptoCurrentPrice = rule.cryptoRefPrice;
            entry.cryptoQuantity = rule.amount / rule.cryptoRefPrice;
            entry.marketValue = rule.amount;
          }
        }
        data.portfolio.push(entry);
        if (rule.paymentType) createLiquidityAdjustment(rule.paymentType, -rule.amount, dateStr, `${rule.type}${rule.fundName?' ('+rule.fundName+')':''} ricorrente`, entry.id);
        changed = true;
      }
    }
  });
  if (changed) saveData();
}

// ---------- FI projection ----------
function project(wealth0, income0, savingsRate, expense0, expenseGrowth, incomeGrowth2y, ret, horizon, withdrawalRate) {
  const multiplier = 100 / (withdrawalRate || 4);
  const rows = []; let wealth = wealth0; let income = income0; let hitYear = null; let hitYearFrac = null;
  for (let y=1; y<=horizon; y++) {
    if (y>1 && (y-1)%2===0) income += incomeGrowth2y;
    const expense = expense0 + expenseGrowth*(y-1);
    const contribution = income * savingsRate;
    const wealthStart = wealth;
    wealth = wealth*(1+ret) + contribution;
    const target = expense*multiplier;
    if (!hitYear && wealth >= target) {
      hitYear = y;
      const range = wealth - wealthStart;
      const frac = range > 0 ? Math.max(0, Math.min(1, (target - wealthStart) / range)) : 0;
      hitYearFrac = (y - 1) + frac;
    }
    rows.push({year:y, wealth, expense, target});
  }
  return {rows, hitYear, hitYearFrac};
}

// ===== Punto 15: simulatore what-if (sandbox) =====
// Stessa identica logica di project(), con in più gli eventi una tantum — una
// vendita, un'eredità, una spesa grossa in un anno preciso — che project() non sa
// gestire. Non tocco project() (è testata e usata ovunque): questa è una
// funzione a parte, per non rischiare di romperla.
function projectWithEvents(wealth0, income0, savingsRate, expense0, expenseGrowth, incomeGrowth2y, ret, horizon, withdrawalRate, eventi) {
  const multiplier = 100 / (withdrawalRate || 4);
  const rows = []; let wealth = wealth0; let income = income0; let hitYear = null; let hitYearFrac = null;
  const eventiPerAnno = {};
  (eventi||[]).forEach(e => { eventiPerAnno[e.anno] = (eventiPerAnno[e.anno]||0) + Number(e.importo||0); });
  for (let y=1; y<=horizon; y++) {
    if (y>1 && (y-1)%2===0) income += incomeGrowth2y;
    const expense = expense0 + expenseGrowth*(y-1);
    const contribution = income * savingsRate;
    const wealthStart = wealth;
    wealth = wealth*(1+ret) + contribution + (eventiPerAnno[y]||0);
    const target = expense*multiplier;
    if (!hitYear && wealth >= target) {
      hitYear = y;
      const range = wealth - wealthStart;
      const frac = range > 0 ? Math.max(0, Math.min(1, (target - wealthStart) / range)) : 0;
      hitYearFrac = (y - 1) + frac;
    }
    rows.push({year:y, wealth, expense, target, evento: eventiPerAnno[y]||0});
  }
  return {rows, hitYear, hitYearFrac};
}
let scenarioWhatIfEventi = [];
let scenarioWhatIfChartInstance = null;

// ===== Proiezione dei flussi di cassa mese per mese =====
// Prima computeFutureCashflows copriva solo cedole/rimborsi di bond e depositi —
// non un vero cash flow. Qui si mette insieme tutto quello che già esiste altrove
// (stipendio, affitti, voci ricorrenti, rate di mutuo) in un unico calendario,
// invece di lasciarlo sparso in card diverse. Nessuna logica di calcolo nuova:
// solo la stessa logica già usata da ciascun motore, applicata a mesi futuri.
function computeCashFlowProjection(monthsAhead) {
  const months = monthsAhead || 12;
  const startY = now.getFullYear(), startM = now.getMonth()+1;
  const mesi = [];
  for (let i=0;i<months;i++) {
    let y=startY, m=startM+i;
    while (m>12) { m-=12; y++; }
    mesi.push({ y, m, key: `${y}-${String(m).padStart(2,"0")}` });
  }
  const perMese = {};
  mesi.forEach(mo => { perMese[mo.key] = { entrate:0, uscite:0, dettaglioEntrate:[], dettaglioUscite:[] }; });
  function aggiungi(key, tipo, importo, label) {
    if (!perMese[key] || !(importo > 0)) return;
    if (tipo === "entrata") { perMese[key].entrate += importo; perMese[key].dettaglioEntrate.push({label, importo}); }
    else { perMese[key].uscite += importo; perMese[key].dettaglioUscite.push({label, importo}); }
  }

  // 1) Cedole, interessi, rimborsi capitale di bond/depositi — già pronto.
  computeFutureCashflows(months).rows.forEach(r => {
    aggiungi(r.date.slice(0,7), "entrata", r.net, `${r.kind} ${r.label}`);
  });

  // 2) Stipendio netto atteso, per ogni rapporto di lavoro attivo — stessa logica
  // di stipendioAttesoResiduoAnno() (punto 11), qui estesa a N mesi qualunque,
  // non solo fino a fine anno.
  const attivi = stipendiAttivi();
  if (attivi.length) {
    const calc = calcolaBustePagaCumulate(attivi);
    attivi.forEach(s => {
      const r = calc.righe.find(x => x.stipendio.id === s.id);
      if (!r || !(r.netto > 0)) return;
      const giorno = Math.min(Math.max(Number(s.giornoPaga)||10, 1), 28);
      mesi.forEach(mo => {
        const dataPaga = `${mo.key}-${String(giorno).padStart(2,"0")}`;
        if (dataPaga > todayISO) aggiungi(mo.key, "entrata", r.netto, `Stipendio ${s.issuerName||""}`.trim());
      });
    });
  }

  // 3) Affitti attesi, per ogni immobile affittato — stessa regola di
  // autoGenerateRentalIncome, proiettata invece che generata.
  data.portfolio.forEach(p => {
    if (!isRealEstateType(p.type, p.macro) || !p.isRented || !p.rentalAmount || !p.rentalStartDate) return;
    const giorno = Math.min(new Date(p.rentalStartDate).getDate(), 28);
    mesi.forEach(mo => {
      if (p.rentalEndDate && mo.key > p.rentalEndDate.slice(0,7)) return;
      const dataAffitto = `${mo.key}-${String(giorno).padStart(2,"0")}`;
      if (dataAffitto < p.rentalStartDate) return;
      const netto = toALL(p.rentalAmount * (1 - (p.rentalTaxPct||0)/100), p.rentalCurrency);
      aggiungi(mo.key, "entrata", netto, `Affitto ${p.propertyType||p.type}`);
    });
  });

  // 4) Voci ricorrenti (reddito e spese) — shouldGenerateForMonth() già esiste e
  // accetta anno/mese qualunque: qui si riusa per proiettare avanti, non solo il
  // mese corrente come fa generateRecurring().
  ["income","expenses"].forEach(group => {
    (data.recurring[group]||[]).forEach(rule => {
      mesi.forEach(mo => {
        if (!shouldGenerateForMonth(rule, mo.y, mo.m)) return;
        const importo = toALL(Number(rule.amount)||0, rule.currency||"ALL");
        aggiungi(mo.key, group==="income" ? "entrata" : "uscita", importo, rule.category);
      });
    });
  });

  // 5) Rate di mutuo/prestito non ancora pagate.
  data.portfolio.forEach(p => {
    if (!isDebtType(p.type, p.macro) || isCreditCardType(p.type) || !Array.isArray(p.schedule)) return;
    p.schedule.filter(r => !r.processed && r.dueDate).forEach(r => {
      aggiungi(r.dueDate.slice(0,7), "uscita", (Number(r.capital)||0) + (Number(r.interest)||0), `Rata ${p.type}`);
    });
  });

  const liquiditaOggi = data.portfolio
    .filter(p => data.paymentTypes.includes(p.type))
    .reduce((s,p) => s + toALL(Number(p.amount)||0, p.currency), 0);
  let saldoCumulato = liquiditaOggi;
  return mesi.map(mo => {
    const d = perMese[mo.key];
    const netto = d.entrate - d.uscite;
    saldoCumulato += netto;
    return { mese: mo.key, entrate: d.entrate, uscite: d.uscite, netto, saldoCumulato,
      dettaglioEntrate: d.dettaglioEntrate, dettaglioUscite: d.dettaglioUscite };
  });
}

// ===== Simulazione Monte Carlo (punto 12) =====
// A differenza delle 3 linee bear/central/bull (rendimento fisso ogni anno), qui
// ogni anno il rendimento è casuale — cattura il rischio di sequenza: due
// percorsi con la STESSA media possono finire molto diversamente a seconda di
// QUANDO arrivano gli anni negativi, specialmente nella fase di prelievo. Il
// risultato è una probabilità di successo, non un singolo numero "raggiunto sì/no".
// Box-Muller: due numeri uniformi -> uno normale, senza librerie esterne.
function randNormale(media, devStd) {
  let u1 = 0, u2 = 0;
  while (u1 === 0) u1 = Math.random();
  u2 = Math.random();
  const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  return media + z * devStd;
}
// Tre strategie di prelievo, non solo quella fissa:
// - "fissa": importo che cresce con l'inflazione, sempre lo stesso indipendentemente
//   da come va il mercato — quella che c'era finora.
// - "guardrails" (Guyton-Klinger semplificato): se il tasso di prelievo attuale
//   (spesa/patrimonio) sale sopra il 120% di quello iniziale, si taglia la spesa
//   del 10% quell'anno; se scende sotto l'80%, si aumenta del 10%. Riduce il
//   rischio di rovina, al costo di una spesa meno prevedibile.
// - "percentualeDinamica": si preleva sempre la stessa % del patrimonio CORRENTE,
//   non un importo fisso — il patrimonio da solo non si esaurisce mai per il
//   prelievo (può comunque crollare per un rendimento molto negativo), ma la
//   spesa erogata oscilla di anno in anno insieme al mercato.
function simulazioneMonteCarlo(opts) {
  const { wealth0, income0, savingsRate, expense0, expenseGrowth, incomeGrowth2y,
    meanRet, devStd, horizonAccumulo, annidiPrelievo, withdrawalRate, nSimulazioni, strategiaPrelievo } = opts;
  const strategia = strategiaPrelievo || "fissa";
  const n = nSimulazioni || 1000;
  const multiplier = 100 / (withdrawalRate || 4);
  let successi = 0, mancatoTraguardo = 0;
  const patrimoniFinali = [];
  const volatilitaPerSim = [];
  // Percorso di accumulo di ogni simulazione, anno per anno — serve solo per
  // calcolare i percentili per anno (il "cono di incertezza" da sovrapporre al
  // grafico Proiezione FI), non incide sul resto del calcolo.
  const percorsiAccumulo = Array.from({length: horizonAccumulo}, () => []);
  for (let sim = 0; sim < n; sim++) {
    let wealth = wealth0, income = income0, traguardoAnno = null, speseAlTraguardo = 0;
    for (let y = 1; y <= horizonAccumulo; y++) {
      if (y > 1 && (y-1) % 2 === 0) income += incomeGrowth2y;
      const expense = expense0 + expenseGrowth * (y-1);
      const contribution = income * savingsRate;
      const ret = randNormale(meanRet, devStd);
      wealth = wealth * (1 + ret) + contribution;
      percorsiAccumulo[y-1].push(wealth);
      const target = expense * multiplier;
      if (!traguardoAnno && wealth >= target) { traguardoAnno = y; speseAlTraguardo = expense; }
    }
    if (!traguardoAnno) { mancatoTraguardo++; patrimoniFinali.push(wealth); continue; }
    // Fase di prelievo: il capitale deve reggere altri `annidiPrelievo` anni,
    // con rendimenti ancora casuali — è qui che il rischio di sequenza pesa
    // davvero, e dove le tre strategie si comportano diversamente.
    let speseAnno = speseAlTraguardo;
    const tassoIniziale = wealth > 0 ? speseAlTraguardo / wealth : 0;
    let fallito = false;
    const speseErogate = [];
    for (let y = 1; y <= annidiPrelievo; y++) {
      const ret = randNormale(meanRet, devStd);
      let prelievo;
      if (strategia === "percentualeDinamica") {
        prelievo = wealth * tassoIniziale;
      } else if (strategia === "guardrails") {
        const tassoAttuale = wealth > 0 ? speseAnno / wealth : Infinity;
        if (tassoAttuale > tassoIniziale * 1.20) speseAnno *= 0.90;
        else if (tassoAttuale < tassoIniziale * 0.80) speseAnno *= 1.10;
        else speseAnno += expenseGrowth;
        prelievo = speseAnno;
      } else {
        prelievo = speseAnno;
        speseAnno += expenseGrowth;
      }
      wealth = wealth * (1 + ret) - prelievo;
      speseErogate.push(prelievo);
      if (wealth < 0) { fallito = true; break; }
    }
    if (!fallito) {
      successi++;
      const media = speseErogate.reduce((s,v)=>s+v,0) / speseErogate.length;
      if (media > 0) {
        const varianza = speseErogate.reduce((s,v)=>s+(v-media)*(v-media),0) / speseErogate.length;
        volatilitaPerSim.push(Math.sqrt(varianza) / media * 100);
      }
    }
    patrimoniFinali.push(Math.max(0, wealth));
  }
  patrimoniFinali.sort((a,b) => a-b);
  const percentile = p => patrimoniFinali[Math.floor(p * (patrimoniFinali.length-1))];
  const percentiliPerAnno = percorsiAccumulo.map(anno => {
    const ordinato = anno.slice().sort((a,b) => a-b);
    const pct = p => ordinato[Math.floor(p * (ordinato.length-1))];
    return { p10: pct(0.10), p50: pct(0.50), p90: pct(0.90) };
  });
  return {
    percentualeSuccesso: successi / n * 100,
    percentualeMancatoTraguardo: mancatoTraguardo / n * 100,
    p10: percentile(0.10), p50: percentile(0.50), p90: percentile(0.90),
    volatilitaSpesa: volatilitaPerSim.length ? volatilitaPerSim.reduce((s,v)=>s+v,0)/volatilitaPerSim.length : null,
    percentiliPerAnno,
    strategia, n
  };
}
function renderRisultatoMonteCarlo(r) {
  const cls = r.percentualeSuccesso >= 85 ? "up" : r.percentualeSuccesso >= 60 ? "" : "down";
  return `
    <div class="stat-row"><span class="label">Probabilità di successo</span><span class="val ${cls}" style="font-size:18px;">${r.percentualeSuccesso.toFixed(1)}%</span></div>
    <div class="subtle" style="margin-bottom:6px;">su ${r.n} scenari indipendenti, quanti non finiscono i soldi</div>
    ${r.percentualeMancatoTraguardo>0 ? `<div class="stat-row"><span class="label">· non raggiunge nemmeno il traguardo</span><span class="val down">${r.percentualeMancatoTraguardo.toFixed(1)}%</span></div>` : ''}
    ${r.volatilitaSpesa!=null ? `<div class="stat-row"><span class="label">Variabilità della spesa erogata</span><span class="val">±${r.volatilitaSpesa.toFixed(1)}%</span></div>` : ''}
    <div class="stat-row"><span class="label">Patrimonio finale · scenario sfortunato (10°)</span><span class="val">${fmtDisplay(r.p10)}</span></div>
    <div class="stat-row"><span class="label">Patrimonio finale · scenario mediano</span><span class="val">${fmtDisplay(r.p50)}</span></div>
    <div class="stat-row"><span class="label">Patrimonio finale · scenario fortunato (90°)</span><span class="val">${fmtDisplay(r.p90)}</span></div>`;
}
function renderRisultatoWhatIf(attuale, scenario) {
  const diffAnni = (scenario.hitYearFrac ?? null) !== null && (attuale.hitYearFrac ?? null) !== null
    ? scenario.hitYearFrac - attuale.hitYearFrac : null;

    <div class="stat-row"><span class="label">Scenario</span><span class="val ${diffAnni!=null && diffAnni<=0 ? 'up':'down'}">${scenario.hitYear ? scenario.hitYear+' anni' : nonRaggiunto}</span></div>
    ${diffAnni!=null ? `<div class="stat-row"><span class="label">Differenza</span><span class="val ${diffAnni<=0?'up':'down'}">${diffAnni<=0?'':'+'}${diffAnni.toFixed(1)} anni</span></div>` : ''}`;
}

// ===== Compare Mode: fino a 3 scenari salvati, a differenza del what-if sopra
// (che si perde chiudendo la scheda), questi restano — persistiti in
// data.settings come tutto il resto, per tornarci sopra in un altro momento.
const SCENARI_COMPARATIVI_MAX = 3;
const SCENARI_COMPARATIVI_COLORI = ['#C9A227', '#3F6E5E', '#8B5FBF'];
function scenariComparativiCard() {
  const scenari = data.settings.scenariComparativi || [];

function toCsvValue(v) {
  if (v == null) return "";
  const s = String(v);
  return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;

function esportaCSV(nomeFile, csvContent) {

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomeFile;
  a.click(); URL.revokeObjectURL(url);
  return true;
}

function computeYearlyPeaks() {

  const avgRecurring = recurringRules.reduce((sum,r)=> sum + Number(r.amount) / (FREQUENCIES.find(f=>f.key===(r.frequency||"monthly"))||FREQUENCIES[0]).months, 0);
  const baseMonthly = Math.max(0, monthlyBudget - avgRecurring);

    months.push({ m, label: MONTH_LABELS[m-1], base: baseMonthly, recurring: hit, projected: baseMonthly+hit, actual });

  return months;
}

      // Se l'utente ha scritto un codice suo, non glielo si tocca.
      if (campoCodice.dataset.modificatoAMano === "1") return;
      const f = new FormData(form);

      const nuovo = esistente || peekNextSecurityCode();
      if (campoCodice.value !== nuovo) campoCodice.value = nuovo;
      campoCodice.title = esistente
        ? "Strumento già in portafoglio: si riusa il codice del primo acquisto."
        : "Nuovo strumento: codice assegnato automaticamente.";
    };
    campoCodice.addEventListener("input", () => {
      campoCodice.dataset.modificatoAMano =
        (campoCodice.value.trim() && campoCodice.value.trim() !== peekNextSecurityCode()) ? "1" : "0";

    const aggiornaRischio = () => {
      if (!campoRischio || campoRischio.dataset.modificatoAMano === "1") return;
      const f2 = new FormData(form);
      const cs = form.querySelector(".cat-select"), ms = form.querySelector(".macro-select");
      const dati = Object.assign(datiIdentitaDaForm(f2, cs ? cs.value : "", ms ? ms.value : null),
        { bondYears: f2.get("bondYears"), depositYears: f2.get("depositYears") });
      const proposto = rischioPerNuovaPosizione(dati, null);
      if (String(campoRischio.value) !== String(proposto)) campoRischio.value = String(proposto);
    };
    if (campoRischio) {
      campoRischio.addEventListener("change", () => { campoRischio.dataset.modificatoAMano = "1"; });
      ["bondYears","depositYears"].forEach(nome => {
        const el = form.querySelector(`[name="${nome}"]`);
        if (el) { el.addEventListener("input", aggiornaRischio); el.addEventListener("change", aggiornaRischio); }
      });
      const cs2 = form.querySelector(".cat-select");
      if (cs2) cs2.addEventListener("change", aggiornaRischio);
      aggiornaRischio();

// ---------- Streak ----------
function budgetStreak() {
  let streak = 0;
  let cursor = new Date(now.getFullYear(), now.getMonth()-1, 1); // start from last full month
  while (true) {
    const mStr = localMonthStr(cursor);
    const actual = monthTotal(data.expenses, mStr);
    if (actual === 0) break; // no data that far back, stop counting
    const y = cursor.getFullYear();
    const budget = annualBudgetForYear(y) / 12;
    if (actual <= budget) { streak++; cursor.setMonth(cursor.getMonth()-1); }
    else break;
  }
  return streak;
}

    {key:"bull", ret:(s.centralRet+1)/100, color:"#3F6E5E", label:"Bull"},
  ];
  const results = scenarios.map(sc => ({...sc, ...project(wealth0, projIncome, savingsRateForProjection, fireExpenseBase, s.expenseGrowth, s.incomeGrowth2y, sc.ret, s.horizon, s.withdrawalRate||4)}));
  const central = results[1];

  // Rendimento reale secondo Fisher: (1+nominale)/(1+inflazione) − 1.
  // Serve a distinguere "il numero cresce" da "puoi comprare di più".
  const inflPct = s.inflationPct != null ? Number(s.inflationPct) : 3;
  const realRet = (1 + s.centralRet/100) / (1 + inflPct/100) - 1;
  const centralReal = project(wealth0, projIncome, savingsRateForProjection, fireExpenseBase,
    s.expenseGrowth, s.incomeGrowth2y, realRet, s.horizon, s.withdrawalRate||4);
  const wealthNominalEnd = central.rows.length ? central.rows[central.rows.length-1].wealth : wealth0;
  // Potere d'acquisto: quanto varrebbe oggi il patrimonio nominale finale.
  const purchasingPower = wealthNominalEnd / Math.pow(1 + inflPct/100, s.horizon);

  const fireRates = (s.fireRatesText || "4,3,2").split(",").map(x=>parseFloat(x.trim())).filter(n=>!isNaN(n) && n>0);
  const fireHorizonExt = Math.max(s.horizon, 100);
  const fireNumbers = fireRates.map(rate => {
    const target = fireExpenseBase * 100/rate;
    const proj = project(wealth0, projIncome, savingsRateForProjection, fireExpenseBase, s.expenseGrowth, s.incomeGrowth2y, s.centralRet/100, fireHorizonExt, rate);
    return { rate, target, years: proj.hitYearFrac };
  });

  const currentAbsoluteTargetYear = thisYear + (central.hitYear || s.horizon);
  if (!s.planBaselineYear) {
    s.planBaselineYear = currentAbsoluteTargetYear;
    s.planBaselineSetDate = todayISO;
    saveData();
  }
  const diffYears = s.planBaselineYear - currentAbsoluteTargetYear;

  const lastEntry = lastEntryDate();
  const daysSinceLastEntry = lastEntry ? Math.round((now - new Date(lastEntry)) / 86400000) : null;
  const showInactivityBanner = daysSinceLastEntry !== null && daysSinceLastEntry > 14;

  const annualBudget = annualBudgetForYear(thisYear);
  const monthlyBudget = annualBudget/12;
  const dailyBudget = annualBudget/365;
  const spentToday = dayTotal(spesePersonali(data.expenses), todayISO);
  const spentMonth = personalExpenseThisMonth;
  const spentYear = personalExpenseThisYear;

  // Recurring commitments (monthly)
  const recurringExpMonthly = (data.recurring.expenses||[]).reduce((sum,r)=>sum+Number(r.amount)/((FREQUENCIES.find(f=>f.key===(r.frequency||"monthly"))||FREQUENCIES[0]).months),0);
  const recurringInvMonthly = (data.recurring.portfolio||[]).reduce((sum,r)=>sum+toALL(Number(r.amount), r.currency)/((FREQUENCIES.find(f=>f.key===(r.frequency||"monthly"))||FREQUENCIES[0]).months),0);
  const recurringTotalMonthly = recurringExpMonthly + recurringInvMonthly;
  const incomeMonthlyAvg = incomeThisYear>0 ? incomeThisYear/12 : (data.settings.savingsRateTarget!==undefined ? null : null);
  const incomeMonthlyRef = incomeThisMonth>0 ? incomeThisMonth : incomeMonthlyAvg;
  const freeFromIncome = incomeMonthlyRef!==null ? incomeMonthlyRef - recurringTotalMonthly : null;
  const freeFromTarget = monthlyBudget - recurringExpMonthly;

  const fiTarget = fireExpenseBase * (100/(s.withdrawalRate||4));
  const fiProgressPct = fiTarget>0 ? Math.min(100, wealth0/fiTarget*100) : 0;

  const streak = budgetStreak();

  const dayOfMonth = now.getDate();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const pace = dayOfMonth/daysInMonth;
  const monthlyPace = monthlyBudget>0 ? spentMonth/monthlyBudget : 0;
  const annualPace = annualBudget>0 ? spentYear/annualBudget : 0;
  const projectedMonthEnd = pace>0 ? spentMonth/pace : spentMonth;
  const projectedPct = monthlyBudget>0 ? (projectedMonthEnd/monthlyBudget*100) : 0;
  let banners = [];
  if (monthlyBudget>0 && monthlyPace > 1) {
    banners.push(`<div class="alert-banner" style="background:#2A1313;border-color:#8B3A2F;color:#E8A08A;">✕ Budget mensile già superato: ${(monthlyPace*100).toFixed(0)}% (${fmt(spentMonth)} su ${fmt(monthlyBudget)} ALL).</div>`);
  } else if (monthlyBudget>0 && monthlyPace > 0.75) {
    banners.push(`<div class="alert-banner">⚠ Hai superato il 75% del budget mensile: ${(monthlyPace*100).toFixed(0)}% (${fmt(spentMonth)} su ${fmt(monthlyBudget)} ALL), con il ${(pace*100).toFixed(0)}% del mese trascorso.</div>`);
  } else if (monthlyBudget>0 && spentMonth>0 && projectedPct > 110) {
    banners.push(`<div class="alert-banner">⚠ Al ritmo attuale (${fmt(spentMonth)} ALL in ${dayOfMonth} giorni), a fine mese saresti a circa ${projectedPct.toFixed(0)}% del budget mensile. Rallenta il ritmo di spesa.</div>`);
  } else if (spentMonth>0 && monthlyBudget>0) {
    banners.push(`<div class="alert-banner ok">✓ Ritmo di spesa sotto controllo (proiezione fine mese: ${projectedPct.toFixed(0)}% del budget, al ritmo attuale).</div>`);
  }
  if (annualBudget>0 && annualPace >= 0.9 && annualPace <= 1) {
    banners.push(`<div class="alert-banner">⚠ Stai arrivando al budget annuale: ${(annualPace*100).toFixed(0)}% (${fmt(spentYear)} su ${fmt(annualBudget)} ALL).</div>`);
  } else if (annualBudget>0 && annualPace > 1) {
    banners.push(`<div class="alert-banner" style="background:#2A1313;border-color:#8B3A2F;color:#E8A08A;">✕ Budget annuale superato: ${(annualPace*100).toFixed(0)}% (${fmt(spentYear)} su ${fmt(annualBudget)} ALL).</div>`);
  }
  const alertHtml = banners.join('');

  function trendVal(cur, prev, suffix) {
    if (prev===null || prev===undefined) return `<span class="val">${cur!==null?cur.toFixed(1)+suffix:"—"}</span>`;
    if (cur===null) return `<span class="val">—</span>`;
    const diff = cur - prev;
    const cls = diff >= 0 ? "up" : "down";
    const arrow = diff >= 0 ? "▲" : "▼";
    return `<span class="val ${cls}">${cur.toFixed(1)}${suffix} ${arrow}${Math.abs(diff).toFixed(1)}</span>`;
  }

  document.getElementById("headerTitle").textContent = "Panoramica";
  const hasData = data.income.length>0 || data.expenses.length>0 || data.portfolio.length>0;
  const taxSummary = computeAnnualTaxSummary(thisYearNum);

  document.getElementById("main").innerHTML = `
    <div class="seal">
      <div class="n">${central.hitYearFrac!=null ? central.hitYearFrac.toFixed(1) : s.horizon+"+"}</div>
      <div class="l">Anni · FI centrale</div>
    </div>
    <div class="progress-wrap">
      <div class="bar-bg" style="height:10px;"><div class="bar-fg" style="width:${fiProgressPct}%; background:#C9A227;"></div></div>

    </div>
    ${!hasData ? '<div class="empty">Aggiungi reddito, spese e patrimonio nelle altre schede per attivare la proiezione.</div>' : ''}
    ${showInactivityBanner ? `<div class="alert-banner">⚠ Non aggiorni i dati da ${daysSinceLastEntry} giorni. Il modello invecchia — inserisci le ultime voci per tenerlo affidabile.</div>` : ''}
    ${backupReminderCard()}

      <div class="stat-row"><span class="label">Target FI oggi (con i dati attuali)</span><span class="val">${currentAbsoluteTargetYear}</span></div>
      <div class="stat-row"><span class="label">Scostamento</span><span class="val ${diffYears>0?'up':diffYears<0?'down':''}">${diffYears===0?'in linea col piano':diffYears>0?`in anticipo di ${diffYears} anni`:`in ritardo di ${Math.abs(diffYears)} anni`}</span></div>
    </div>
    <div class="card">
      <h3>Numero FIRE</h3>
      <div class="subtle">Capitale necessario in base al tasso di prelievo scelto. Base spesa attuale: <b>${fmt(fireExpenseBase)} ALL/anno</b> (${fireBaseMode==='projected'?'proiezione dal ritmo di spesa attuale':'dal budget annuale impostato'}).</div>
      <div class="row2" style="margin-bottom:10px;">
        <button class="secondary" type="button" id="fireModeBudget" style="${fireBaseMode==='budget'?'border-color:#C9A227;color:#C9A227;':''}">Budget (${fmt(annualBudgetVal)} ALL)</button>
        <button class="secondary" type="button" id="fireModeProjected" style="${fireBaseMode==='projected'?'border-color:#C9A227;color:#C9A227;':''}">Proiezione spesa attuale (${fmt(projectedAnnualExpense)} ALL)</button>
      </div>
      <div class="chart-wrap"><canvas id="fireChart" height="200"></canvas></div>
      <div style="margin-top:10px;">
        ${fireNumbers.map(f=>`<div class="stat-row"><span class="label">${f.rate}% — ${fmtDisplay(f.target)}</span><span class="val">${f.years!=null ? f.years.toFixed(1)+' anni' : 'mai (con ritmo attuale)'}</span></div>`).join('')}
      </div>
      <div class="row2" style="margin-top:10px;">
        <div><label>Percentuali (separate da virgola)</label><input type="text" id="fireRatesInput" value="${s.fireRatesText || '4,3,2'}"></div>
        <button class="secondary" type="button" id="fireRatesSave" style="align-self:flex-end;">Salva percentuali</button>
      </div>
    </div>
    ${alertHtml}
    <div class="card">
      <h3>Budget · ${thisYear}</h3>
      <div class="subtle">Base ${fmt(s.expenseBase)} ALL/anno dal ${s.startYear}, +${fmt(s.expenseGrowth)} ALL/anno</div>
      ${budgetBlock("Oggi", spentToday, dailyBudget)}
      ${budgetBlock("Questo mese", spentMonth, monthlyBudget)}
      ${budgetBlock("Quest'anno", spentYear, annualBudget)}
      <div class="stat-row" style="margin-top:6px;"><span class="label">Mesi consecutivi nel budget</span><span class="val">${streak} ${streak===1?'mese':'mesi'}</span></div>
    </div>
    <div class="card">
      <h3>Budget libero (al netto delle ricorrenze)</h3>
      <div class="subtle">Impegni fissi mensili: spese ricorrenti ${fmtDisplay(recurringExpMonthly)} + versamenti ricorrenti ${fmtDisplay(recurringInvMonthly)}</div>
      <div class="stat-row"><span class="label">Impegni ricorrenti mensili totali</span><span class="val">${fmtDisplay(recurringTotalMonthly)}</span></div>
      <div class="stat-row"><span class="label">Libero rispetto al reddito mensile ${incomeThisMonth>0?'(registrato)':'(media anno)'}</span><span class="val ${freeFromIncome!==null && freeFromIncome<0?'down':''}">${freeFromIncome!==null ? fmtDisplay(freeFromIncome) : "— (nessun reddito registrato)"}</span></div>
      <div class="stat-row"><span class="label">Libero rispetto al budget obiettivo mensile</span><span class="val ${freeFromTarget<0?'down':''}">${fmtDisplay(freeFromTarget)}</span></div>
    </div>
    <div class="card">
      <h3>Picchi di spesa durante l'anno</h3>
      <div class="subtle">Spesa base mensile + impatto delle ricorrenze non mensili (trimestrali, semestrali, annuali, biennali) nel mese in cui cadono. La linea mostra la spesa effettiva già registrata.</div>
      <div class="chart-wrap"><canvas id="peaksChart" height="220"></canvas></div>
    </div>
    <div class="card">
      <h3>Confronto tasso di risparmio</h3>
      <div class="stat-row"><span class="label">Questo mese vs mese scorso</span>${trendVal(rateThisMonth, rateLastMonth, "%")}</div>
      <div class="stat-row"><span class="label">Quest'anno vs anno scorso</span>${trendVal(actualSavingsRate, rateLastYear, "%")}</div>
    </div>
    <div class="card">
      <h3>Anno corrente (${thisYear})</h3>
      <div class="stat-row"><span class="label">Reddito registrato</span><span class="val">${fmt(incomeThisYear)} ALL</span></div>
      <div class="stat-row"><span class="label">Spese registrate</span><span class="val">${fmt(expenseThisYear)} ALL</span></div>
      <div class="stat-row"><span class="label">Tasso di risparmio effettivo</span><span class="val">${actualSavingsRate!==null ? actualSavingsRate.toFixed(1)+"%" : "— (target: "+s.savingsRateTarget+"%)"}</span></div>
    </div>
    <div class="card">
      <h3>Patrimonio attuale</h3>
      <div class="stat-row"><span class="label">Totale (ALL)</span><span class="val">${fmt(wealth0)} ALL</span></div>
      <div class="stat-row"><span class="label">Totale (€)</span><span class="val">${fmt(wealth0/s.fx)} €</span></div>
      <div class="stat-row"><span class="label">Totale ($)</span><span class="val">${fmt(wealth0/s.fxUsd)} $</span></div>
    </div>
    ${(() => {
      const snap = [...data.snapshots].sort((a,b)=>a.date.localeCompare(b.date));
      if (snap.length < 2) return '';
      const primo = snap[0], ultimo = snap[snap.length-1];
      const variazione = primo.wealth>0 ? ((ultimo.wealth/primo.wealth - 1) * 100) : null;
      const twr = computeTWR();
      return `<div class="card">
        <h3>Patrimonio nel tempo</h3>
        <div class="subtle">Un punto per mese, da quando l'app ha iniziato a registrarli.</div>
        <div class="chart-wrap"><canvas id="wealthHistoryChart" height="180"></canvas></div>
        ${variazione!=null ? `<div class="stat-row"><span class="label">Variazione nominale (da ${primo.date} a ${ultimo.date})</span><span class="val ${variazione>=0?'up':'down'}">${variazione>=0?'+':''}${variazione.toFixed(1)}%</span></div>` : ''}
        ${twr ? `
        <div class="stat-row"><span class="label">· di cui rendimento (TWR)</span><span class="val ${twr.twrTotale>=0?'up':'down'}">${twr.twrTotale>=0?'+':''}${twr.twrTotale.toFixed(1)}%</span></div>
        ${twr.twrAnnualizzato!=null ? `<div class="stat-row"><span class="label">· annualizzato</span><span class="val ${twr.twrAnnualizzato>=0?'up':'down'}">${twr.twrAnnualizzato.toFixed(2)}%/anno</span></div>` : ''}
        <div class="subtle" style="font-size:10px; margin-top:4px;">La variazione nominale include anche quanto hai versato/prelevato; il TWR lo scorpora, pesando ogni versamento/spesa in base al giorno esatto in cui è avvenuto — non un'approssimazione mensile.</div>` : ''}
      </div>`;
    })()}
    ${(() => {
      const centrale = results[1]; // bear, central, bull -> central è indice 1
      const mc = ultimoRisultatoMonteCarlo;
      let verdetto = null, coloreVerdetto = null;
      if (mc) {
        if (mc.percentualeSuccesso >= 85) { verdetto = "Solido"; coloreVerdetto = "#3F6E5E"; }
        else if (mc.percentualeSuccesso >= 60) { verdetto = "Da monitorare"; coloreVerdetto = "#C9A227"; }
        else { verdetto = "A rischio"; coloreVerdetto = "#8B3A2F"; }
      }
      return `
    <div class="card"${mc ? ` style="border-color:${coloreVerdetto};"` : ''}>
      <h3>Solidità del piano — riepilogo</h3>
      <div class="subtle">Le card qui sotto rispondono a due domande diverse: QUANDO arriveresti (proiezione deterministica) e QUANTO è probabile che il piano regga davvero (Monte Carlo, rendimenti casuali). Qui insieme, in un colpo d'occhio.</div>
      <div class="row2" style="margin-top:10px;">
        <div style="text-align:center; padding:10px; background:#0F1B2E; border-radius:6px;">
          <div class="subtle" style="font-size:10px; text-transform:uppercase;">Quando (scenario central)</div>
          <div style="font-size:22px; font-family:'IBM Plex Mono',monospace; color:#C9A227;">${centrale.hitYear ? (thisYear+centrale.hitYear) : '> '+(thisYear+s.horizon)}</div>
          <div class="subtle" style="font-size:9px;">${centrale.hitYear ? centrale.hitYear+' anni da oggi' : "non raggiunto nell'orizzonte"}</div>
        </div>
        <div style="text-align:center; padding:10px; background:#0F1B2E; border-radius:6px;">
          <div class="subtle" style="font-size:10px; text-transform:uppercase;">Quanto è probabile (Monte Carlo)</div>
          ${mc ? `<div style="font-size:22px; font-family:'IBM Plex Mono',monospace; color:${coloreVerdetto};">${mc.percentualeSuccesso.toFixed(0)}%</div>
            <div class="subtle" style="font-size:9px; color:${coloreVerdetto};">${verdetto}</div>`
          : `<div style="font-size:14px; color:#5C7089; margin-top:8px;">Non ancora girato</div>
            <div class="subtle" style="font-size:9px;">gira la simulazione qui sotto</div>`}
        </div>
      </div>
      ${mc ? `<div style="margin-top:10px; background:#0F1B2E; border-radius:4px; height:8px; overflow:hidden;">
        <div style="width:${Math.max(2,mc.percentualeSuccesso)}%; height:100%; background:${coloreVerdetto};"></div>
      </div>` : ''}
    </div>`;
    })()}
    <div class="card">
      <h3>Proiezione FI</h3>
      <div class="subtle">Target = 25× spesa annua. Reddito/spesa base presi dai dati registrati (o dal budget se ancora vuoti). Tasso di risparmio usato: <b>${(savingsRateForProjection*100).toFixed(1)}%</b> (${savingsRateMode==='reale'?(actualSavingsRate!==null?'reale, dai tuoi dati':'obiettivo, dati reali non ancora sufficienti'):'obiettivo impostato in Assunzioni'}).</div>
      <div class="row2" style="margin-bottom:10px;">
        <button class="secondary" type="button" id="savingsRateModeReale" style="${savingsRateMode==='reale'?'border-color:#C9A227;color:#C9A227;':''}">Reale${actualSavingsRate!==null?' ('+actualSavingsRate.toFixed(1)+'%)':''}</button>
        <button class="secondary" type="button" id="savingsRateModeObiettivo" style="${savingsRateMode==='obiettivo'?'border-color:#C9A227;color:#C9A227;':''}">Obiettivo (${s.savingsRateTarget}%)</button>
      </div>
      <div class="chart-wrap"><canvas id="fiChart" height="200"></canvas></div>
      <div class="grid3" style="margin-top:12px;">
        ${results.map(r=>`<div style="text-align:center;"><div style="font-size:10px;color:#8FA3BF;text-transform:uppercase;">${r.label}</div><div style="font-family:'IBM Plex Mono',monospace;color:${r.color};font-size:15px;">${r.hitYear ?? '>'+s.horizon}</div></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3>Simulazione Monte Carlo</h3>
      <div class="subtle">Le 3 linee sopra usano un rendimento fisso ogni anno — non catturano il rischio di sequenza (due percorsi con la stessa media possono finire molto diversamente a seconda di QUANDO arrivano gli anni negativi, specialmente nei primi anni di prelievo). Qui ${data.settings.montecarloAnniPrelievo||30} scenari casuali indipendenti simulano l'intero percorso, accumulo più ${data.settings.montecarloAnniPrelievo||30} anni di prelievo, e si conta in quale percentuale il capitale regge fino in fondo.</div>
      <div class="row2" style="margin:8px 0;">
        <div><label>Deviazione standard rendimento (%/anno)</label><input type="number" id="montecarloDevStdInput" min="1" max="40" step="0.5" value="${data.settings.montecarloDevStd||10}"></div>
        <div><label>Anni di prelievo da simulare</label><input type="number" id="montecarloAnniInput" min="5" max="60" step="1" value="${data.settings.montecarloAnniPrelievo||30}"></div>
      </div>
      <div style="margin-bottom:8px;">
        <label>Strategia di prelievo</label>
        <select id="montecarloStrategiaSelect">
          <option value="fissa" ${(data.settings.montecarloStrategiaPrelievo||'fissa')==='fissa'?'selected':''}>Fissa — spesa che cresce con l'inflazione, sempre uguale</option>
          <option value="guardrails" ${data.settings.montecarloStrategiaPrelievo==='guardrails'?'selected':''}>Guardrails — taglia/aumenta la spesa se il tasso di prelievo esce da una banda ±20%</option>
          <option value="percentualeDinamica" ${data.settings.montecarloStrategiaPrelievo==='percentualeDinamica'?'selected':''}>Percentuale dinamica — preleva sempre la stessa % del patrimonio corrente</option>

        <div class="subtle" style="font-size:10px; margin-top:3px;">Fissa è la più prevedibile ma la più a rischio di rovina; le altre due riducono quel rischio al costo di una spesa che varia di anno in anno.</div>

      <div id="monteCarloResultBox" style="margin-top:10px;">${ultimoRisultatoMonteCarlo ? renderRisultatoMonteCarlo(ultimoRisultatoMonteCarlo) : ''}</div>
