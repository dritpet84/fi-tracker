        <div class="stat-row"><span class="label">Copertura</span><span class="val">${dates[0]} → ${dates[dates.length-1]}</span></div>`;
      })() : ''}
    </div>
    <div class="card">
      <h3>Metodi di pagamento</h3>
      ${paymentTypesManageBlock()}
    </div>
    <div class="card">
      <h3>Gestisci categorie</h3>
      <div class="subtle">Modifica nome e budget annuo di ciascuna voce, elimina quelle che non ti servono più, o aggiungine di nuove — indipendentemente per Reddito, Spese e Patrimonio. Ricorda di premere "Salva modifiche" dopo aver cambiato un nome.</div>
      ${categoryManageBlock("income", "Reddito")}
      ${categoryManageBlock("expenses", "Spese")}
      ${categoryManageBlock("portfolio", "Patrimonio / Investimenti")}
    </div>
    <div class="card">
      <h3>Voci ricorrenti</h3>
      <div class="subtle">Si generano automaticamente ogni mese, così non devi reinserirle ogni volta.</div>
      ${recurringBlock("expenses", "Spese ricorrenti")}
      ${recurringBlock("income", "Reddito ricorrente")}
      ${recurringBlockPortfolio("Investimenti ricorrenti (es. fondo pensione)")}
    </div>
    <div class="card">
      <h3>Scansione scontrini con AI (sperimentale, gratis)</h3>
      <div class="subtle">Usa un modello open source su Hugging Face per leggere lo scontrino e provare a indovinare anche la categoria, non solo importo e data. Crea un token gratuito su <span style="color:#C9A227;">huggingface.co/settings/tokens</span> (Read access) e incollalo qui — resta salvato solo su questo dispositivo.</div>
      <div class="subtle">${s.hfToken ? "Token già salvato (nascosto per sicurezza). Lascia il campo vuoto per mantenerlo invariato, oppure incollane uno nuovo per sostituirlo." : "Nessun token salvato ancora."}</div>
      <form class="entry" id="hfForm">
        <div><label>Token Hugging Face ${s.hfToken ? '(vuoto = non modificare)' : ''}</label><input type="password" name="hfToken" value="" placeholder="${s.hfToken ? '••••••••' : 'hf_...'}"></div>
        <div><label>Modello (avanzato, lascialo com'è se non sai cosa cambiare)</label><input type="text" name="hfModel" value="${s.hfModel||'Qwen/Qwen3.5-9B'}"></div>
        <button class="primary" type="submit">Salva</button>
      </form>
      ${s.hfToken ? '<button class="secondary" id="removeHfTokenBtn" style="margin-top:8px;">Rimuovi token</button>' : ''}
    </div>
    <div class="card">
      <h3>Sicurezza</h3>
      <div class="subtle">${s.pinHash ? "Blocco PIN attivo. Richiesto per aprire l'app." : "Nessun blocco impostato. I dati sono comunque solo sul tuo telefono."}</div>
      <form class="entry" id="pinForm">
        <div><label>${s.pinHash ? "Nuovo PIN (4-6 cifre)" : "Imposta PIN (4-6 cifre)"}</label><input type="password" inputmode="numeric" pattern="[0-9]*" name="pin" minlength="4" maxlength="6" placeholder="••••"></div>
        <button class="primary" type="submit">${s.pinHash ? "Aggiorna PIN" : "Imposta PIN"}</button>
      </form>
      ${s.pinHash ? '<button class="secondary" id="removePinBtn" style="margin-top:8px;">Rimuovi PIN</button>' : ''}
    </div>
    
  `;

  bindCategorySelects();

  document.getElementById("hfForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const newToken = (f.get("hfToken")||"").trim();
    if (newToken) data.settings.hfToken = newToken;
    data.settings.hfModel = (f.get("hfModel")||"Qwen/Qwen3.5-9B").trim();
    saveData();
    alert("Salvato.");
    renderSettings();
  });
  const removeHfBtn = document.getElementById("removeHfTokenBtn");
  if (removeHfBtn) removeHfBtn.addEventListener("click", ()=>{
    if (confirm("Rimuovere il token Hugging Face? La scansione con AI smetterà di funzionare finché non ne inserisci uno nuovo.")) {
      data.settings.hfToken = "";
      saveData();
      renderSettings();
    }
  });

  document.getElementById("pinForm").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const pin = f.get("pin");
    if (!pin || pin.length < 4) { alert("Il PIN deve avere almeno 4 cifre."); return; }
    data.settings.pinHash = await hashPin(pin);
    saveData();
    alert("PIN salvato.");
    renderSettings();
  });
  const removeBtn = document.getElementById("removePinBtn");
  if (removeBtn) removeBtn.addEventListener("click", ()=>{
    if (confirm("Rimuovere il blocco PIN?")) { data.settings.pinHash = null; saveData(); renderSettings(); }
  });

  document.getElementById("budgetForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    data.settings.expenseBase = Number(f.get("expenseBase"));
    data.settings.startYear = Number(f.get("startYear"));
    data.settings.expenseGrowth = Number(f.get("expenseGrowth"));
    saveData(); alert("Budget salvato.");
  });

  const fxHistoryFileInput = document.getElementById("fxHistoryFileInput");
  if (fxHistoryFileInput) fxHistoryFileInput.addEventListener("change", async ev=>{
    const file = ev.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById("fxHistoryImportStatus");
    statusEl.textContent = "Lettura del file in corso…";
    try {
      const count = await importFxHistoryXLSX(file);
      statusEl.textContent = `Importate ${count} date. Database aggiornato (giorni mancanti riempiti automaticamente).`;
      renderSettings();
    } catch (err) {
      statusEl.textContent = "Errore nella lettura del file: " + String(err.message||err).slice(0,150);
    }
  });

  const paytypeAddBtn = document.getElementById("paytypeAdd");
  if (paytypeAddBtn) paytypeAddBtn.addEventListener("click", ()=>{
    const input = document.getElementById("paytypeInput");
    const val = input.value.trim();
    if (val && !data.paymentTypes.includes(val)) { data.paymentTypes.push(val); saveData(); renderSettings(); }
  });
  document.querySelectorAll("[data-paytypedel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const name = btn.dataset.paytypedel;
      if (!confirm(`Eliminare il metodo "${name}"? Le voci già registrate manterranno il nome come testo libero.`)) return;
      data.paymentTypes = data.paymentTypes.filter(t=>t!==name);
      saveData(); renderSettings();
    });
  });
  const paytypeSaveBtn = document.getElementById("paytypeSave");
  if (paytypeSaveBtn) paytypeSaveBtn.addEventListener("click", ()=>{
    const rows = document.querySelectorAll(".paytype-name-input");
    const renames = [];
    rows.forEach(input => {
      const row = input.closest(".cat-row");
      const oldName = row.dataset.origname;
      const newName = input.value.trim();
      if (newName && newName !== oldName) renames.push({oldName, newName});
    });
    renames.forEach(({oldName, newName}) => {
      const idx = data.paymentTypes.indexOf(oldName);
      if (idx>=0) data.paymentTypes[idx] = newName;
      data.income.forEach(e=>{ if (e.paymentType===oldName) e.paymentType = newName; });
      data.expenses.forEach(e=>{ if (e.paymentType===oldName) e.paymentType = newName; });
      data.portfolio.forEach(p=>{ if (p.type===oldName) p.type = newName; if (p.linkedTxnId) return; });
      (data.recurring.income||[]).forEach(r=>{ if (r.paymentType===oldName) r.paymentType = newName; });
      (data.recurring.expenses||[]).forEach(r=>{ if (r.paymentType===oldName) r.paymentType = newName; });
      if (data.categories.portfolio.includes(oldName)) data.categories.portfolio = data.categories.portfolio.map(c=>c===oldName?newName:c);
      if (data.creditCardSettings[oldName]) { data.creditCardSettings[newName] = data.creditCardSettings[oldName]; delete data.creditCardSettings[oldName]; }
    });
    saveData();
    alert("Metodi di pagamento aggiornati.");
    renderSettings();
  });

  document.getElementById("fetchBoaBtn").addEventListener("click", async ()=>{
    const statusEl = document.getElementById("boaFetchStatus");
    statusEl.textContent = "Recupero cambio dalla Banca d'Albania…";
    try {
      const { eur, usd } = await fetchBoaRate();
      if (eur) document.querySelector('#settingsForm [name="fx"]').value = eur;
      if (usd) document.querySelector('#settingsForm [name="fxUsd"]').value = usd;
      fxDbSetRate(todayISO, eur||null, usd||null);
      fxDbForwardFill();
      saveData();
      statusEl.textContent = `Trovato: EUR ${eur ?? "?"} · USD ${usd ?? "?"} — controlla e premi "Salva assunzioni" per confermare. Salvato anche nello storico del ${todayISO}.`;
    } catch (err) {
      statusEl.textContent = "Non sono riuscito a recuperare il cambio automaticamente (" + String(err.message||err).slice(0,100) + "). Inseriscilo manualmente.";
    }
  });

  document.getElementById("settingsForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const newFx = Number(f.get("fx"));
    const lastFx = data.fxHistory.length ? data.fxHistory[data.fxHistory.length-1].rate : null;
    if (lastFx !== newFx) data.fxHistory.push({ date: todayISO, rate: newFx });
    data.settings.fx = newFx;
    data.settings.fxUsd = Number(f.get("fxUsd")) || data.settings.fxUsd || 82;
    data.settings.savingsRateTarget = Number(f.get("savingsRateTarget"));
    data.settings.incomeGrowth2y = Number(f.get("incomeGrowth2y"));
    data.settings.centralRet = Number(f.get("centralRet"));
    data.settings.withdrawalRate = Number(f.get("withdrawalRate")) || 4;
    data.settings.horizon = Number(f.get("horizon"));
    saveData();
    alert("Assunzioni salvate.");
    renderSettings();
  });

  bindCategoryManagement("income", renderSettings);
  bindCategoryManagement("expenses", renderSettings);
  bindCategoryManagement("portfolio", renderSettings);

  document.querySelectorAll("[data-recform]").forEach(form=>{
    form.addEventListener("submit", ev=>{
      ev.preventDefault();
      const group = form.dataset.recform;
      const f = new FormData(ev.target);
      const catValue = form.querySelector(".cat-select").value;
      let rule;
      if (group === "portfolio") {
        rule = { id: uid(), type: catValue, amount: Number(f.get("amount")), currency: f.get("currency")||"ALL", frequency: f.get("frequency")||"monthly", startMonth: f.get("startMonth")||thisMonth, dayOfMonth: Number(f.get("dayOfMonth"))||1, note: f.get("note")||"",
          fundName: f.get("fundName")||"", fundRefPrice: f.get("fundRefPrice")?Number(f.get("fundRefPrice")):null,
          bondMode: f.get("bondMode")||"cedola", couponRate: f.get("couponRate")?Number(f.get("couponRate")):null, bondTaxRate: f.get("bondTaxRate")?Number(f.get("bondTaxRate")):15, bondYears: f.get("bondYears")||null,
          depositMode: f.get("depositMode")||"cedola", depositRate: f.get("depositRate")?Number(f.get("depositRate")):null, depositTaxRate: f.get("depositTaxRate")?Number(f.get("depositTaxRate")):15, depositYears: f.get("depositYears")||null,
          paymentType: f.get("paymentType")||"" };
      } else {
        rule = { id: uid(), category: catValue, amount: Number(f.get("amount")), frequency: f.get("frequency")||"monthly", startMonth: f.get("startMonth")||thisMonth, dayOfMonth: Number(f.get("dayOfMonth"))||1, paymentType: f.get("paymentType")||"", linkedBondId: f.get("linkedBondId")||null, note: f.get("note")||"" };
      }
      data.recurring[group].push(rule);
      saveData(); renderSettings();
    });
  });
  document.querySelectorAll("[data-recdel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [group, id] = btn.dataset.recdel.split("|");
      data.recurring[group] = data.recurring[group].filter(r=>r.id!==id);
      saveData(); renderSettings();
    });
  });

  document.querySelectorAll("[data-recedit-open]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [group, id] = btn.dataset.receditOpen.split("|");
      editingRecurring = { group, id };
      renderSettings();
    });
  });
  document.querySelectorAll("[data-recedit-cancel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingRecurring = null; renderSettings(); });
  });
  document.querySelectorAll("[data-recedit]").forEach(form=>{
    form.addEventListener("submit", ev=>{
      ev.preventDefault();
      const [group, id] = form.getAttribute("data-recedit").split("|");
      const f = new FormData(ev.target);
      const catValue = form.querySelector(".cat-select").value;
      const rule = data.recurring[group].find(r=>r.id===id);
      if (rule) {
        rule.amount = Number(f.get("amount"));
        rule.frequency = f.get("frequency")||"monthly";
        rule.dayOfMonth = Number(f.get("dayOfMonth"))||1;
        rule.startMonth = f.get("startMonth")||thisMonth;
        rule.note = f.get("note")||"";
        if (group === "portfolio") {
          rule.type = catValue; rule.currency = f.get("currency")||"ALL";
          rule.fundName = f.get("fundName")||""; rule.fundRefPrice = f.get("fundRefPrice")?Number(f.get("fundRefPrice")):null;
          rule.bondMode = f.get("bondMode")||"cedola"; rule.couponRate = f.get("couponRate")?Number(f.get("couponRate")):null; rule.bondTaxRate = f.get("bondTaxRate")?Number(f.get("bondTaxRate")):15; rule.bondYears = f.get("bondYears")||null;
          rule.depositMode = f.get("depositMode")||"cedola"; rule.depositRate = f.get("depositRate")?Number(f.get("depositRate")):null; rule.depositTaxRate = f.get("depositTaxRate")?Number(f.get("depositTaxRate")):15; rule.depositYears = f.get("depositYears")||null;
          rule.paymentType = f.get("paymentType")||"";
        }
        else { rule.category = catValue; rule.paymentType = f.get("paymentType")||""; rule.linkedBondId = f.get("linkedBondId")||null; }
      }
      editingRecurring = null;
      saveData(); renderSettings();
    });
  });
}

const RENDERERS = { dashboard: renderDashboard, income: renderIncome, expenses: renderExpenses, portfolio: renderPortfolio, debts: renderDebts, budget: renderBudget, drive: renderDrive, settings: renderSettings };
function switchTab(tab) {
  document.querySelectorAll("nav.tabs button").forEach(b=> b.classList.toggle("active", b.dataset.tab===tab));
  RENDERERS[tab]();
}
document.querySelectorAll("nav.tabs button").forEach(btn=>{ btn.addEventListener("click", ()=> switchTab(btn.dataset.tab)); });

const displayCurrencySelectEl = document.getElementById("displayCurrencySelect");
displayCurrencySelectEl.value = data.settings.displayCurrency || "ALL";
displayCurrencySelectEl.addEventListener("change", ()=>{
  data.settings.displayCurrency = displayCurrencySelectEl.value;
  saveData();
  const activeBtn = document.querySelector("nav.tabs button.active");
  if (activeBtn) RENDERERS[activeBtn.dataset.tab]();
});

async function tryUnlock() {
  const input = document.getElementById("lockPinInput");
  const val = input.value;
  const hash = await hashPin(val);
  if (hash === data.settings.pinHash) {
    document.getElementById("lockScreen").classList.remove("active");
    document.getElementById("app").style.display = "";
    switchTab("dashboard");
  } else {
    document.getElementById("lockError").textContent = "PIN errato, riprova.";
    input.value = "";
    input.focus();
  }
}

async function tryAutoResumeDrive() {
  const token = loadTokenFromSession();
  if (token) {
    gDriveToken = token;
    updateSyncBadge();
    await downloadFromDrive(true);
  }
}

window.addEventListener("load", ()=> setTimeout(initGoogleClient, 800));

if (data.settings.pinHash) {
  document.getElementById("app").style.display = "none";
  document.getElementById("lockScreen").classList.add("active");
  document.getElementById("lockSubmitBtn").addEventListener("click", async ()=>{ await tryUnlock(); tryAutoResumeDrive(); });
  document.getElementById("lockPinInput").addEventListener("keydown", e=>{ if (e.key==="Enter") document.getElementById("lockSubmitBtn").click(); });
} else {
  switchTab("dashboard");
  tryAutoResumeDrive();
}
</script>
</body>
</html>
